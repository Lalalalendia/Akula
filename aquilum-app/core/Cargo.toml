[package]
name = "aquilum-core"
version = "0.3.13"
description = "Aquilum core: documents, files, search, history and settings without any UI"
authors = ["Dmitriy Chaplinskiy"]
license = "AGPL-3.0-only"
edition = "2021"
workspace = ".."

[features]
default = []
# Metadata-only negotiation lab: no transport, staging, or File Gate.
p2p-offer-lab = []
# Opt-in verified receiver staged-file create-new, no Vault apply.
p2p-inbox-lab = ["p2p-offer-lab"]
# Independent opt-in Linux read-only Node catalog contract. No server socket.
node-catalog-lab = ["dep:akula-node-catalog"]
node-lab = ["node-catalog-lab"]
# Inert, portable preview contract; NO SSH client, credentials, sudo or remote mutations.
server-bootstrap-b0-lab = ["dep:akula-server-bootstrap-b0"]
# Developer-only actual pinned OpenSSH KEX probe; no remote installation.
server-bootstrap-b0-openssh-lab = ["server-bootstrap-b0-lab"]
# Pure offline release-signature gate; never executes or installs a package.
server-bootstrap-b1a-release-lab = ["dep:akula-server-release-b1a"]
# Linux-only inert staging laboratory; requires B1a verifier, no executable install.
server-bootstrap-b1b-custody-lab = ["server-bootstrap-b1a-release-lab"]
# Linux-only inert release-floor chain lab, requiring verified staged bytes.
server-bootstrap-b1b1-floor-lab = ["server-bootstrap-b1b-custody-lab"]
# Detached operator signature and inert witness CAS request, never installs.
server-bootstrap-b1b1b-approval-lab = ["server-bootstrap-b1b1-floor-lab"]
# Linux-only inert local cooperating-writer CAS witness laboratory.
server-bootstrap-b1b1c-witness-lab = ["server-bootstrap-b1b1b-approval-lab"]
# Real Linux AF_UNIX peer creds and signed, strictly fixed PREVIEW wire protocol; no install.
server-bootstrap-b1b3a-helper-ipc-lab = []
# OS UID-0 Linux service test. Real kernel SO_PEERCRED, root-owned policy,
# fixed Preview only; no install action in the protocol or executable.
server-bootstrap-b1b3b-root-helper-lab = ["server-bootstrap-b1b3a-helper-ipc-lab"]
# Root-owned helper additionally verifies a real B1a signed ELF by pinned FD.
server-bootstrap-b1b3c-pinned-fd-lab = ["server-bootstrap-b1b3b-root-helper-lab", "server-bootstrap-b1a-release-lab"]
# Inert signed owner + external witness CAS correspondence. No installation.
server-bootstrap-b1b4a-cas-fence-lab = ["server-bootstrap-b1b3c-pinned-fd-lab", "server-bootstrap-b1b1c-witness-lab"]
# Linux UID0 OS-owned sealed test signer and signed CAS journal readback; NO install.
server-bootstrap-b1b4b-os-witness-lab = ["server-bootstrap-b1b4a-cas-fence-lab"]
# Root-owned read-only witness Unix IPC lab, no signer or install opcode.
server-bootstrap-b1b4b1-witness-ipc-lab = ["server-bootstrap-b1b4b-os-witness-lab"]
# Test-only signed FD -> fixed root-owned Node file transaction after owner/CAS.
# Does not launch Node or expose install IPC to Akula application.
server-bootstrap-b1c0-fixed-node-lab = ["server-bootstrap-b1b4b-os-witness-lab"]
# Fixed /opt first-install file commit with a root-owned durable receipt and
# conservative HOLD on startup or crash. No public installer RPC or auto-start.
server-bootstrap-b1d0-durable-node = ["server-bootstrap-b1c0-fixed-node-lab"]
# Opt-in diagnostic timing only. No new writer or change to security policy.
# Never enabled by Akula native or installed builds.
save-stage-probe = []
# Only protocol contracts compile in PR 00; no runtime/network/UI is started.
sync-engine = []
# Installer-wide local File Gate enrollment epoch; no network or AWS SDK.
host-custody = []
# OS-protected transport key, no peer grants.
p2p-device-identity = ["dep:windows"]
# Owner-signed read-only roster lab; not pairing, identity or Vault grants.
device-roster-lab = []
# Pure, bounded and explicitly opt-in text delta representation. Not a sync sender.
sync-text-delta = ["dep:zstd"]
# Separately selected packaged build: force every default Core::open through
# the compiler-pinned local host registry. No AWS SDK or S3 engine implied.
sync-installed-host = ["host-custody"]
# A separate opt-in hardening flavor: compiler-pinned independent install
# witness, not a released OS-owned installer or hostile-writer isolation.
sync-installed-host-witness = ["sync-installed-host"]
# Extra, non-shipping Unix OS-owner preflight. Refuses all protected host
# admission on Windows until a real installer/Broker DACL verifier exists.
sync-installed-host-unix-root-witness = ["sync-installed-host-witness"]
# Offline S3 invitation V1 parsing only: no AWS SDK, network or host custody.
sync-s3-invite = ["dep:url"]
# Real S3 transport remains opt-in, including the portable invite V1 contract.
sync-s3 = ["sync-s3-invite", "sync-engine", "host-custody", "dep:aws-config", "dep:aws-sdk-s3", "dep:aws-sdk-sts", "dep:tokio"]

[[example]]
name = "akula_b1b3c_fixture"
path = "examples/akula_b1b3c_fixture.rs"
required-features = ["server-bootstrap-b1b3c-pinned-fd-lab"]

[[example]]
name = "akula_b1b3b_fixture"
path = "examples/akula_b1b3b_fixture.rs"
required-features = ["server-bootstrap-b1b3b-root-helper-lab"]

[[bin]]
name = "akula-witness-b1b4b1-lab"
path = "src/bin/akula_witness_b1b4b1_lab.rs"
required-features = ["server-bootstrap-b1b4b1-witness-ipc-lab"]

[[example]]
name = "akula_b1b4b1_witness_fixture"
path = "examples/akula_b1b4b1_witness_fixture.rs"
required-features = ["server-bootstrap-b1b4b1-witness-ipc-lab"]

[[bin]]
name = "akula-helper-b1b3b-lab"
path = "src/bin/akula_helper_b1b3b_lab.rs"
required-features = ["server-bootstrap-b1b3b-root-helper-lab"]

[[example]]
name = "akula_b1b2b_release_fixture"
path = "examples/akula_b1b2b_release_fixture.rs"
required-features = ["server-bootstrap-b1a-release-lab"]

[[bin]]
name = "akula-node-lab"
path = "src/bin/akula_node_lab.rs"
required-features = ["node-lab"]

[dependencies]
akula-node-catalog = { path = "../../modules/node-catalog", optional = true }
akula-server-release-b1a = { path = "../../modules/bootstrap-b1a", optional = true }
akula-server-bootstrap-b0 = { path = "../../modules/bootstrap-b0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atomic-write-file = "0.3.0"
blake3 = "1.8.5"
# M1d-f1: inert OS-key-provided AEAD archive envelope; no SQLite activation.
ring = "0.17.14"
zeroize = "1.9.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.23.5", features = ["v4", "serde"] }
tantivy = { version = "0.26.1", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
rust-stemmers = "1.2.0"
walkdir = "2.5.0"
notify = "8.2.0"
unicode-normalization = "0.1.25"
pulldown-cmark = "0.13.4"
ureq = "2.12"
httparse = "1"
yrs = "0.28"
memchr = "2"
# Local in-memory compression only; no S3, host File Gate or UI activation.
zstd = { version = "=0.13.3", optional = true }

# Official AWS Rust SDK used only for opt-in S3 provider capability tests.
# RUSTSEC-2026-0387: block optional SigV4a until the SDK migrates away from
# vulnerable crypto-bigint 0.5.x. Region-scoped SigV4 stays enabled.
# AWS legacy "rustls" features compile hyper 0.14 + rustls 0.21 as
# well as the modern stack. Preserve SSO and process credential providers;
# disable only legacy HTTPS defaults. Requires exact Cargo.lock and TLS tests.
aws-config = { version = "1.12.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.152.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio", "http-1x"] }
# Already locked by aws-config: use the same official STS provider for AWS-only identity proof.
aws-sdk-sts = { version = "=1.119.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
url = { version = "2", optional = true }

[[bin]]
name = "akula-p2p-identity"
path = "src/bin/akula_p2p_identity.rs"
required-features = ["p2p-device-identity"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=0.38.44", features = ["fs", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Threading"] }
