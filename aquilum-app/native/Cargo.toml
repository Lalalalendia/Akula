[package]
name = "aquilum-native"
version = "0.3.17"
description = "Aquilum native UI (Masonry on winit + vello_cpu), no WebView"
authors = ["Dmitriy Chaplinskiy"]
license = "AGPL-3.0-only"
edition = "2024"
workspace = ".."

[package.metadata.packager]
productName = "Aquilum"
identifier = "com.dmitriy.aquilum-app"
description = "Fast local-first Markdown knowledge base"
homepage = "https://github.com/Freaction/Aquilum"
binaries = [{ path = "aquilum-app", main = true }]
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]

[package.metadata.packager.nsis]
installerIcon = "icons/icon.ico"

[package.metadata.packager.macos]
minimumSystemVersion = "12.0"
signingIdentity = "-"

[package.metadata.packager.appimage]
linuxdeployPlugins = { gstreamer = "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gstreamer/432af639725bc8b99df12351e86bb2e8a6b3585f/linuxdeploy-plugin-gstreamer.sh" }

[features]
# Public install includes read-only Dropbox authorization; cloud writes remain disabled.
installed = ["dropbox-readonly-preview", "server-readonly-preflight"]
messaging-w4-pilot = []
memory-probe = []
# Opt-in experimental local DICOM viewing. Not included in the installed build.
dicom-preview = ["dep:dicom-core", "dep:dicom-object", "dep:dicom-pixeldata", "dep:zip"]
# User-visible Windows read-only SSH verification. No install grant.
server-readonly-preflight = ["aquilum-core/server-bootstrap-b0-openssh-lab"]
# Non-shipping read-only OS-backed Iroh contacts; no send actions.
p2p-device-contacts-preview = ["aquilum-core/p2p-device-identity"]
# Opt-in local Iroh public identity UI; uses the same protected peer contacts.
p2p-device-ui = ["p2p-device-contacts-preview"]
# User-triggered one-file LAN / opt-in Internet transfer; no background listener.
p2p-inbox-preview = ["dep:akula-inbox-ledger-lab", "aquilum-core/p2p-inbox-lab"]
p2p-native-send-beta = ["p2p-inbox-preview", "p2p-device-ui", "dep:akula-staya-integration", "dep:tokio"]
p2p-native-receive-beta = ["p2p-native-send-beta"]
# S3-E2E-01: optional read-only dashboard of registered S3 receive claims.
# Does not expose S3 writes, apply, file mutation or baseline actions.
s3-e2e01-review-preview = ["aquilum-core/sync-s3"]
# Dropbox remains read-only; full sync is a separate guarded release feature.
dropbox-readonly-preview = ["dep:akula-dropbox-connect-lab", "dep:akula-dropbox-secret-store", "dep:akula-dropbox-t0"]
# Manual QA preview; no user write/sync capability yet.
yandex-s3-connection-preview = ["aquilum-core/sync-s3", "dep:tokio"]
# User-enabled S3 pairing BETA: no activation in default installer.
s3-pair-beta = ["aquilum-core/sync-s3", "dep:tokio"]
# Installer-enforced local custody flavor; does not pull in AWS/S3.
sync-installed-host = ["aquilum-core/sync-installed-host"]
# Separate non-published installer-witness integration acceptance.
sync-installed-host-witness = ["sync-installed-host", "aquilum-core/sync-installed-host-witness"]
# Installer trust experiment only, not enabled by signed local release.
sync-installed-host-unix-root-witness = ["sync-installed-host-witness", "aquilum-core/sync-installed-host-unix-root-witness"]

[dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }
aquilum-core = { path = "../core", features = ["host-custody"] }
akula-inbox-ledger-lab = { path = "../../modules/drop-inbox-ledger", optional = true }
akula-staya-integration = { path = "../../interop/akula-staya", features = ["p2p-one-file-lan-beta"], optional = true }
akula-dropbox-connect-lab = { path = "../../modules/dropbox-connect-lab", optional = true }
akula-dropbox-secret-store = { path = "../../modules/dropbox-secret-store", features = ["system-store"], optional = true }
akula-dropbox-t0 = { path = "../../modules/dropbox-t0", optional = true }
# Основная ветка xilem: Masonry без релиза больше года, бэкенды под vello_cpu только там.
# Ревизия зафиксирована, обновлять пачками.
masonry = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88", default-features = false }
# 0.31 — бета, версия зафиксирована точно: API между бетами ломается.
winit = "=0.31.0-beta.3"
vello_cpu = { path = "vendor/vello_cpu", features = ["multithreading"] }
rayon = "1.12"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Pinned after upstream #844: crates.io 0.10.0 incorrectly decodes 8-bit monochrome RLE.
# All three packages share the same exact source revision.
dicom-core = { git = "https://github.com/Enet4/dicom-rs", rev = "bcc6907c62a99a0a53523b5e80a22002ad12a63d", optional = true }
dicom-object = { git = "https://github.com/Enet4/dicom-rs", rev = "bcc6907c62a99a0a53523b5e80a22002ad12a63d", optional = true }
dicom-pixeldata = { git = "https://github.com/Enet4/dicom-rs", rev = "bcc6907c62a99a0a53523b5e80a22002ad12a63d", features = ["image"], optional = true }
# ZIP is read directly by a bounded ZIP reader; nothing is unpacked to the vault.
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
uuid = { version = "1.23.5", features = ["v4"] }
rfd = "0.16"
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
bytemuck = "1"
flate2 = "1"
roxmltree = "0.21"
base64 = "0.22"
minisign-verify = "0.2"
foldhash = "0.2"
unicode-segmentation = "1"
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
skrifa = "0.44"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-font = "0.1.14"
ratex-katex-fonts = "0.1.14"
aq_trace = { path = "vendor/aq_trace" }
crop = { version = "0.4", features = ["utf16-metric", "graphemes"] }
blake3 = { version = "1.8.5", features = ["rayon"] }

# Keep the software output available in the SAME executable for Win7 fallback.
[target.'cfg(any(not(target_os = "windows"), target_os = "windows"))'.dependencies]
softbuffer = "0.4.8"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "=0.26.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "objc2-core-graphics"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
accesskit_unix = "=0.22.1"

[target.'cfg(target_os = "windows")'.dependencies]
zeroize = "1.9.0"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectManipulation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# Под accesskit 0.24 из Masonry: та же версия, что у accesskit_winit 0.32.
accesskit_windows = "=0.32.1"

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"

[build-dependencies]
# Шрифты фронтенда лежат в WOFF2, а fontique читает только TTF/OTF: распаковка при сборке.
wuff = "0.2.9"
# Переименование семейства кириллической половины Inter (см. build.rs).
write-fonts = { version = "0.50", features = ["read"] }

[dev-dependencies]
tempfile = "3"
