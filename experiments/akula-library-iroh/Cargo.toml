[package]
name = "akula-library-iroh-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
# Fork chain: Akula -> calex794/roha -> calex794/noq (all pinned to tested SHAs).
iroh = { git = "https://github.com/calex794/roha", rev = "a42ad5aef1626df80d39398e05dac6e362bf6e49", version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }

# A [patch] in the Roha workspace is not inherited by a downstream workspace.
# Pin all three QUIC crates here, where cargo resolves Akula Library dependencies.
[patch.crates-io]
noq = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
noq-proto = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
noq-udp = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
