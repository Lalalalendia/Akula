[package]
name = "akula-library-iroh-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
