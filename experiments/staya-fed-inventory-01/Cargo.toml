[package]
name = "staya-fed-inventory-lab"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

# Isolated research crate. Not a workspace member or production Akula dependency.
[workspace]
resolver = "2"

[features]
default = []
# Optional real upstream AuthorHeads reproducer; never used by product.
upstream-heads = ["dep:iroh-docs"]

[dependencies]
blake3 = "=1.8.5"
iroh-docs = { version = "=0.101.0", default-features = false, optional = true }

# If the opt-in upstream test is enabled, transitive iroh/noq still resolve to
# our pinned forks. The default experiment does not establish QUIC connections.
[patch.crates-io]
iroh = { git = "https://github.com/calex794/roha", rev = "a42ad5aef1626df80d39398e05dac6e362bf6e49" }
noq = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
noq-proto = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
noq-udp = { git = "https://github.com/calex794/noq", rev = "2eabf9895d40c263aa3369afd66efcf4a5d95056" }
