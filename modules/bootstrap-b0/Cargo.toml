[package]
name = "akula-server-bootstrap-b0"
version = "0.1.0"
edition = "2021"
publish = false
description = "Inert bootstrap B0 preflight preview, without SSH or install authority"
license = "AGPL-3.0-only"

# Transitional isolated crate. Core stays untouched until parity passes.
[workspace]

[dependencies]
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.5"
uuid = { version = "1.23.5", features = ["v4", "serde"] }
