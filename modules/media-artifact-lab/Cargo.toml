[package]
name = "akula-media-artifact-lab"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# Standalone lab; no aquilum-app workspace modification or automatic CI.
[dependencies]
blake3 = "1.8.5"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
