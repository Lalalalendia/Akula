[package]
name = "akula-node-catalog"
version = "0.1.0"
edition = "2021"
publish = false
description = "Linux pinned-FD read-only Node D1.5 catalog parity laboratory"
license = "AGPL-3.0-only"

# Intentionally standalone: adding it to the main workspace/Cargo.lock
# is a separate, CI-gated migration step after parity.
[workspace]

[dependencies]
blake3 = "1.8.5"
rustix = { version = "=0.38.44", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.23.5", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
