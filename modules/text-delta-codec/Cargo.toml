[package]
name = "akula-text-delta-parity"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Standalone compilation parity lab for the existing bounded text delta codec; not production sync"

# This module is intentionally outside the primary Cargo workspace.
# It compiles the original Core source without changing production linkage.
[workspace]

[dependencies]
blake3 = "1.8.5"
uuid = { version = "1.23.5", features = ["v4"] }
zstd = "=0.13.3"
