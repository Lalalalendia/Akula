[package]
name = "akula-video-lite-lab"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
mp4 = "=0.14.0"
# Bounded fMP4 reader with tfhd/trex default-size handling (VIDEO-06 only).
mp4-track = "=0.1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
