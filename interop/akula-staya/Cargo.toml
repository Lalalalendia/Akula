[package]
name = "akula-staya-integration"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

# This package deliberately lives outside the shipping Akula workspace.
# Its independent lockfile is generated by the integration CI and is not
# the shipping aquilum-app/Cargo.lock.
[workspace]
resolver = "3"

[features]
default = []
# Isolated, default-off live Iroh Connection -> fresh Windows peer-pin check.
p2p-live-identity = ["aquilum-core/p2p-device-identity", "aquilum-core/device-roster-lab"]
# Optional lab-only verified Node replica transfer via Staya.
node-replica-transport-lab = ["aquilum-core/node-replica-auth-lab"]
# Identity/grant join, never an OS authority or public listener.
node-live-read-lab = ["node-replica-transport-lab", "aquilum-core/device-roster-lab"]
node-v1-e2e-tests = ["node-v1-runtime", "aquilum-core/node-v1-transport-tests"]
# Current protected Node witness and SQLite replay fence, not a public listener.
node-v1-runtime = ["node-live-read-lab", "aquilum-core/node-v1", "dep:tokio", "dep:ring", "dep:serde", "dep:serde_json", "dep:rustix"]
# Non-shipping bridge: reuse independently pinned Akula Node V1 transport
# policy and the exact audited WOW W3/W4 mailbox. Not installed or exposed.
node-wow-mailbox-lab = ["node-v1-e2e-tests", "dep:akula-wire-lab", "dep:ed25519-dalek", "dep:rusqlite"]

# Non-shipping one-shot Akula consent to Staya local test-operator handoff.
sender-arm-lab = []
# Explicit Windows two-PC OS-backed QUIC HELLO/OK. Never sends user bytes.
os-pinned-lan-probe = ["p2p-live-identity", "dep:tokio"]

[[bin]]
name = "akula-p2p-lan"
path = "src/bin/lan_probe.rs"
required-features = ["os-pinned-lan-probe"]

[[bin]]
name = "akula-node-v1-service"
path = "src/bin/akula_node_v1_service.rs"
required-features = ["node-v1-runtime"]

[dependencies]
# Exact green WOW baseline; avoid git HEAD, transitive updates or duplicates.
akula-wire-lab = { git = "https://github.com/calex794/wow", rev = "29bd044cf11c60687716560c15abef69f5581ebc", optional = true }
ed25519-dalek = { version = "2.2", optional = true }
# Same native SQLite link ABI as Akula Core and WOW; never downgrade either.
rusqlite = { version = "=0.40.1", features = ["bundled"], optional = true }
aquilum-core = { path = "../../aquilum-app/core", features = ["p2p-inbox-lab"] }
staya-transfer = { git = "https://github.com/Lalalalendia/staya-transfer", rev = "ccfe82dc6125e2810e95043a6a4ac55954b710e0", default-features = false }
blake3 = "=1.8.5"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ring = { version = "=0.17.14", optional = true }
rustix = { version = "=0.38.44", features = ["fs", "process"], optional = true }
iroh = "=1.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"], optional = true }
postcard = { version = "=1.1.3", features = ["use-std"] }
uuid = { version = "=1.23.5", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
ring = "0.17.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
