[package]
name = "akula-staya-integration"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

# This package deliberately lives outside the shipping Akula workspace.
# Its independent lockfile is generated by the integration CI and is not
# the shipping aquilum-app/Cargo.lock.
[workspace]
resolver = "3"

[dependencies]
aquilum-core = { path = "../../aquilum-app/core", features = ["p2p-offer-lab"] }
staya-transfer = { git = "https://github.com/Lalalalendia/staya-transfer", rev = "fadb38a792126f6098df086fc56ce0dcae3ca3f1", default-features = false }
blake3 = "=1.8.5"
iroh = "=1.3.0"
postcard = { version = "=1.1.3", features = ["use-std"] }
uuid = { version = "=1.23.5", features = ["v4"] }
