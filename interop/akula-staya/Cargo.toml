[package]
name = "akula-staya-integration"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

# This package deliberately lives outside the shipping Akula workspace.
# Its independent lockfile is generated by the integration CI and is not
# the shipping aquilum-app/Cargo.lock.
[workspace]
resolver = "3"

[features]
default = []
# Isolated, default-off live Iroh Connection -> fresh Windows peer-pin check.
p2p-live-identity = ["aquilum-core/p2p-device-identity"]
# Isolated one-file Windows LAN beta; explicit opt-in, no installed startup.
p2p-one-file-lan-beta = ["p2p-live-identity", "dep:tokio", "dep:akula-inbox-ledger-lab"]
# Off by default; inert Core + real Staya manifest, no file read/grant.
p2p-attachment-contract = ["aquilum-core/p2p-attachment-contract"]
# Explicit non-shipping signed-and-encrypted WOW W3 attachment notice.
p2p-wow-w3-lab = ["p2p-attachment-contract", "dep:akula-wire-lab", "dep:ed25519-dalek"]

[[bin]]
name = "akula-p2p-one-file-beta"
path = "src/bin/p2p_one_file_beta.rs"
required-features = ["p2p-one-file-lan-beta"]

[dependencies]
aquilum-core = { path = "../../aquilum-app/core", features = ["p2p-inbox-lab"] }
akula-inbox-ledger-lab = { path = "../../modules/drop-inbox-ledger", optional = true }
staya-transfer = { git = "https://github.com/Lalalalendia/staya-transfer", rev = "ccfe82dc6125e2810e95043a6a4ac55954b710e0", default-features = false }
blake3 = "=1.8.5"
akula-wire-lab = { git = "https://github.com/calex794/wow", rev = "206f2e6cbbac36fa0821d679de6c66766ddc5bbd", optional = true, default-features = false }
ed25519-dalek = { version = "2.2", optional = true }
iroh = "=1.3.0"
postcard = { version = "=1.1.3", features = ["use-std"] }
uuid = { version = "=1.23.5", features = ["v4"] }
tokio = { version = "1", features = ["rt", "macros", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
