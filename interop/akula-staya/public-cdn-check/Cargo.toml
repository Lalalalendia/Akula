[package]
name = "akula-public-cdn-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Isolated, non-shipping public CDN reader checks using existing Akula/Staya source"

# Isolated to avoid building all Akula's unrelated application dependencies.
# This crate reuses the exact SOURCE files of interop/akula-staya and NEVER
# replaces the pinned core, Iroh identity, File Gate or release build.
[workspace]
resolver = "3"

[features]
default = []
s3 = ["dep:reqwest"]
bao = ["staya-transfer/bao", "dep:iroh-blobs", "dep:postcard", "dep:tokio"]
public-cdn-local-minio-test = ["s3"]

[dependencies]
iroh = "=1.3.0"
staya-transfer = { git = "https://github.com/Lalalalendia/staya-transfer", rev = "ccfe82dc6125e2810e95043a6a4ac55954b710e0", default-features = false }
blake3 = "=1.8.5"
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"], optional = true }
postcard = { version = "=1.1.3", features = ["use-std"], optional = true }
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"], optional = true }

[[test]]
name = "minio_real"
path = "tests/minio_real.rs"
required-features = ["public-cdn-local-minio-test"]

[[test]]
name = "bao_iroh_real"
path = "tests/bao_iroh_real.rs"
required-features = ["bao"]

[[test]]
name = "minio_to_iroh_64m"
path = "tests/minio_to_iroh_64m.rs"
required-features = ["public-cdn-local-minio-test", "bao"]
