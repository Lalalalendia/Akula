name: Security QA - bundled SQLite candidate (branch only)
on:
  push:
    branches: [security/qa-sqlite-rustsec-20261109]
    paths:
      - aquilum-app/core/Cargo.toml
      - aquilum-app/Cargo.lock
      - .github/workflows/qa-sqlite-rustsec-20261109.yml

permissions:
  contents: read

jobs:
  sqlite-regenerate-and-audit:
    name: QA SQLite lock generation and RustSec audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile with Cargo, not manual checksums
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo update -p rusqlite --precise 0.41.1
          cargo update -p libsqlite3-sys --precise 0.39.1
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          echo '=== BEGIN CARGO LOCK DIFF ==='
          git diff -- Cargo.lock
          echo '=== END CARGO LOCK DIFF ==='
          git diff --exit-code -- Cargo.lock # the committed lock must equal Cargo's resolution
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit resolved dependencies (blocking)
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --no-yanked --file aquilum-app/Cargo.lock
          cargo audit --no-yanked --no-fetch --file aquilum-app/host-broker-lab/Cargo.lock
      - name: Check Core SQLite integration (blocking)
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --lib ui_state
