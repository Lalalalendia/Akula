name: Akula B1-E2E-07 integrated branch gate

on:
  push:
    branches: [feature/akula-b1-e2e07-owner-install]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b1-e2e07-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-review-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app
      - name: Verify B0 v2 public UDP scope and v1 compatibility
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path modules/bootstrap-b0/Cargo.toml --lib \
            node_plan_v2_tests -- --nocapture
          # B0 v3 now binds the exact future root-helper installation path
          # and explicit privileged action into the owner-review digest.
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-root-b0v3-gate-lab --lib \
            server_root_v3_guard::tests -- --nocapture
      - name: Verify B1a package, B0 review and portable owner wire
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-install-review --lib \
            server_release_lab::review::tests -- --nocapture
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-install-review --lib \
            server_owner_approval_wire:: -- --nocapture
      - name: Verify independently pinned root helper presence gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-install-review --lib \
            server_install_root_gate::tests -- --nocapture
      - name: Verify signed first-root stage data and OS-owned crypto verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/server-bootstrap -p 'test_root_stage_v1.py' -v
          sudo -n /usr/bin/python3 -I -m unittest discover -s scripts/server-bootstrap -p 'test_root_stage_v1.py' -v
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-install-review --lib \
            server_first_root_stage::tests -- --nocapture
      - name: Verify legacy Linux B1b1b owner signatures and CAS scope
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-bootstrap-b1b1b-approval-lab \
            --test server_bootstrap_b1b1b -- --nocapture
      - name: Verify root-side canonical B0 v3 and independently pinned owner claim
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-root-b0v3-gate-lab --lib \
            server_root_v3_guard::tests -- --nocapture
      - name: Prove old provisioned B1d0 writer is unreachable without root B0 v3 gate
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-bootstrap-b1d0-durable-node
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-root-b0v3-gate-lab --lib \
            server_installer_durable_node::provisioned_gate::root_production_gate_tests -- --nocapture
      - name: Verify independently enrolled root V3 trust reader with user and UID0 isolation
        shell: bash
        run: |
          set -euo pipefail
          # Compile once as the unprivileged CI user. Root executes only
          # this exact already-built test binary, not Cargo or rustup.
          test_bin="$(cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-root-b0v3-gate-lab --lib \
            --no-run --message-format=json | jq -r \
            'select(.reason == "compiler-artifact" and .target.name == "aquilum_core") | .executable // empty' | tail -n 1)"
          test -n "$test_bin" && test -x "$test_bin"
          "$test_bin" server_root_v3_trust::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::tests --nocapture
          # Independent root-owned owner key, bounded signed-frame decode,
          # and exact Linux B1b1b claim conversion. Pure read-only HOLD.
          "$test_bin" server_root_v3_trust::owner_frame::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::owner_frame::tests --nocapture
          # One inert AF_UNIX owner-frame PREVIEW. A real setuid-nobody
          # child is checked using kernel SO_PEERCRED against an
          # independently root-owned allowed UID file; no /opt changes.
          "$test_bin" server_root_v3_trust::owner_ipc::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::owner_ipc::tests --nocapture
          # One-use root-owned peer UID registration; read-only OS-account
          # parser rejects UID reuse, login shells and account aliasing.
          "$test_bin" server_root_v3_trust::owner_ipc::enrollment::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::owner_ipc::enrollment::tests --nocapture
          # /etc/passwd x is NOT a password lock. The exact root-owned
          # /etc/shadow contract must reject active and empty passwords.
          "$test_bin" server_root_v3_trust::owner_ipc::enrollment::shadow::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::owner_ipc::enrollment::shadow::tests --nocapture
          # The published bootstrap-v1 HELPER ELF is checked against
          # root-enrolled B0v3 helper SHA, signature, inode and HOLD marker.
          "$test_bin" server_root_v3_trust::bootstrap_helper::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::bootstrap_helper::tests --nocapture
          # An independently staged signed helper must ALSO be the current
          # root-owned running executable at the hard-coded install path.
          "$test_bin" server_root_v3_trust::bootstrap_helper::running::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::bootstrap_helper::running::tests --nocapture
          # One-time admin enrollment uses root-owned disposable directories.
          "$test_bin" server_root_v3_trust::enrollment::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::enrollment::tests --nocapture
          # First host-root witness seed and empty ledger; NEVER run the
          # production fixed-path binary on a CI runner or user's server.
          "$test_bin" server_root_v3_trust::witness_init::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::witness_init::tests --nocapture
          # Fixed empty /opt destination. Positive tests use only an isolated
          # root-owned temporary directory, never /opt/akula-node.
          "$test_bin" server_root_v3_trust::destination_init::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::destination_init::tests --nocapture
          # Real production-marker witness re-open, B0 v3 root-policy
          # publication and /opt identity in ONE disposable UID0 fixture.
          # No actual VPS /var/lib or /opt directories are modified.
          sudo -n -- "$test_bin" server_root_v3_trust::bootstrap_sequence_tests --nocapture
          # First B1a release: same independently enrolled publisher key,
          # approved fingerprint and SHA256, and root-pinned stage directory.
          "$test_bin" server_root_v3_trust::release_pins::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::release_pins::tests --nocapture
          "$test_bin" server_root_v3_trust::release_pins::enrollment::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::release_pins::enrollment::tests --nocapture
          # Data staging precedes independent first-release approval; signed
          # bytes alone cannot grant B1d0 install permission.
          "$test_bin" server_root_v3_trust::release_pins::stage_init::tests --nocapture
          sudo -n -- "$test_bin" server_root_v3_trust::release_pins::stage_init::tests --nocapture
      - name: Compile fixed administrator-only B0 v3 enrollment binary (do not run)
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-root-b0v3-gate-lab \
            --bin akula-root-b0v3-enroll-lab
          cargo check --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-root-b0v3-gate-lab \
            --bin akula-root-witness-init-lab
          cargo check --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-root-b0v3-gate-lab \
            --bin akula-root-opt-enroll-lab
          cargo check --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-root-b0v3-gate-lab \
            --bin akula-root-b1a-enroll-lab
          cargo check --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-root-b0v3-gate-lab \
            --bin akula-root-b1a-stage-lab
          cargo check --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-root-b0v3-gate-lab \
            --bin akula-root-b1d0-peer-enroll-lab
      - name: Confirm default Core compiles without installer authority
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --no-default-features
      - name: Enforce file-scoped rustfmt, print exact applicable patch
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            aquilum-app/core/src/server_owner_approval_wire.rs
            aquilum-app/core/src/server_owner_approval_wire/decode.rs
            aquilum-app/core/src/server_owner_approval_wire/decode/tests.rs
            aquilum-app/core/src/server_install_root_gate.rs
            aquilum-app/core/src/server_install_root_gate/tests.rs
            aquilum-app/core/src/server_root_v3_guard.rs
            aquilum-app/core/src/server_root_v3_guard/tests.rs
            aquilum-app/core/src/server_root_v3_trust.rs
            aquilum-app/core/src/server_root_v3_trust/tests.rs
            aquilum-app/core/src/server_root_v3_trust/owner_frame.rs
            aquilum-app/core/src/server_root_v3_trust/owner_frame/tests.rs
            aquilum-app/core/src/server_root_v3_trust/owner_ipc.rs
            aquilum-app/core/src/server_root_v3_trust/owner_ipc/tests.rs
            aquilum-app/core/src/server_root_v3_trust/owner_ipc/enrollment.rs
            aquilum-app/core/src/server_root_v3_trust/owner_ipc/enrollment/tests.rs
            aquilum-app/core/src/server_root_v3_trust/owner_ipc/enrollment/shadow.rs
            aquilum-app/core/src/server_root_v3_trust/owner_ipc/enrollment/shadow/tests.rs
            aquilum-app/core/src/server_root_v3_trust/bootstrap_helper.rs
            aquilum-app/core/src/server_root_v3_trust/bootstrap_helper/tests.rs
            aquilum-app/core/src/server_root_v3_trust/bootstrap_helper/running.rs
            aquilum-app/core/src/server_root_v3_trust/bootstrap_helper/running/tests.rs
            aquilum-app/core/src/bin/akula_root_b1d0_peer_enroll_lab.rs
            aquilum-app/core/src/server_installer_durable_node/provisioned_gate.rs
            aquilum-app/core/src/server_root_v3_trust/enrollment.rs
            aquilum-app/core/src/server_root_v3_trust/enrollment/tests.rs
            aquilum-app/core/src/server_root_v3_trust/witness_init.rs
            aquilum-app/core/src/server_root_v3_trust/witness_init/tests.rs
            aquilum-app/core/src/server_root_v3_trust/destination_init.rs
            aquilum-app/core/src/server_root_v3_trust/destination_init/tests.rs
            aquilum-app/core/src/server_root_v3_trust/bootstrap_sequence_tests.rs
            aquilum-app/core/src/server_root_v3_trust/release_pins.rs
            aquilum-app/core/src/server_root_v3_trust/release_pins/tests.rs
            aquilum-app/core/src/server_root_v3_trust/release_pins/enrollment.rs
            aquilum-app/core/src/server_root_v3_trust/release_pins/enrollment/tests.rs
            aquilum-app/core/src/server_root_v3_trust/release_pins/stage_init.rs
            aquilum-app/core/src/server_root_v3_trust/release_pins/stage_init/tests.rs
            aquilum-app/core/src/bin/akula_root_b1a_stage_lab.rs
            aquilum-app/core/src/bin/akula_root_b1a_enroll_lab.rs
            aquilum-app/core/src/bin/akula_root_opt_enroll_lab.rs
            aquilum-app/core/src/bin/akula_root_witness_init_lab.rs
            aquilum-app/core/src/bin/akula_root_b0v3_enroll_lab.rs
            aquilum-app/core/src/server_first_root_stage.rs
            aquilum-app/core/src/server_first_root_stage/tests.rs
            aquilum-app/core/src/server_bootstrap_ssh_windows_lab/root_stage.rs
            aquilum-app/core/src/server_bootstrap_ssh_windows_lab/root_stage/reinspection.rs
            aquilum-app/core/src/server_owner_windows.rs
            aquilum-app/core/src/server_release_lab/review.rs
            aquilum-app/core/src/server_release_lab/review/tests.rs
          )
          rustfmt --edition 2021 --config skip_children=true "${paths[@]}"
          git diff --check
          git diff -- "${paths[@]}"
          if ! git diff --quiet -- "${paths[@]}"; then
            echo 'Formatting needed for exactly these source files.'
            exit 1
          fi
      - name: Prove real Node V1 ELF B0 v3 owner signature and B1d0 root CAS
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the existing isolated /opt signed ELF proof, not a new CAS.
          # The two exact test functions use synthetic CI keys only.
          # The isolated interop workspace has no committed Cargo.lock.
          # Do not claim this CI fixture is a reproducible production release.
          cargo build --manifest-path interop/akula-staya/Cargo.toml \
            --features node-v1-runtime --bin akula-node-v1-service
          bash -n scripts/ci/akula-node-v1-signed-opt-proof.sh
          bash scripts/ci/akula-node-v1-signed-opt-proof.sh

  windows-pinned-review-build:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app
      - name: Compile signed-KEX plus B0/B1a immutable Node review
        shell: pwsh
        run: |
          cargo check --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features server-owner-windows-signer,server-bootstrap-b0-openssh-lab
      - name: Verify native Windows administrator HOLD without granting install
        shell: pwsh
        run: |
          cargo test --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-native --features server-readonly-preflight --bin aquilum-native -- app::settings::server::facts::tests --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'native server capability classification failed' }
          cargo test --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-native --features server-readonly-preflight --bin aquilum-native -- ui::settings::schema::tests::server::b1_e2e_01_native_verify_button_never_grants_install --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'native SSH HOLD user interface failed' }
      - name: Compile opt-in one-shot signed SSH root staging and quote tests
        shell: pwsh
        run: |
          cargo check --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features server-root-stage-ssh-lab
          if ($LASTEXITCODE -ne 0) { throw 'staging transport compilation failed' }
          cargo test --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features server-root-stage-ssh-lab --lib server_bootstrap_ssh_windows_lab::root_stage:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'staging transport quote tests failed' }
      - name: Verify Windows protected owner identity test (no real enrollment)
        shell: pwsh
        run: |
          cargo test --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features server-owner-windows-signer,server-bootstrap-b0-openssh-lab --lib server_owner_approval_wire::decode::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'portable owner frame parser regression' }
          cargo test --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features server-owner-windows-signer,server-bootstrap-b0-openssh-lab --lib server_owner_windows::tests -- --nocapture
          cargo test --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features server-owner-windows-signer,server-bootstrap-b0-openssh-lab --lib server_release_lab::review::tests::windows_owner_key_signs_only_the_reviewed_claim -- --nocapture
