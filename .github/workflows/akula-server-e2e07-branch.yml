name: Akula B1-E2E-07 integrated branch gate

on:
  push:
    branches: [feature/akula-b1-e2e07-owner-install]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b1-e2e07-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-review-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app
      - name: Verify B1a package, B0 review and portable owner wire
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-install-review --lib \
            server_release_lab::review::tests -- --nocapture
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-install-review --lib \
            server_owner_approval_wire::tests -- --nocapture
      - name: Verify legacy Linux B1b1b owner signatures and CAS scope
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features server-bootstrap-b1b1b-approval-lab \
            --test server_bootstrap_b1b1b -- --nocapture
      - name: Confirm default Core compiles without installer authority
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --no-default-features
      - name: Format check ONLY modified standalone Core modules
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true --check \
            aquilum-app/core/src/server_owner_approval_wire.rs \
            aquilum-app/core/src/server_release_lab/review.rs \
            aquilum-app/core/src/server_release_lab/review/tests.rs
