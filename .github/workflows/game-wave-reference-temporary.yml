name: Temporary game wave reference trace tests
on:
  pull_request:
    paths:
      - 'modules/game-wave-model/**'
      - '.github/workflows/game-wave-reference-temporary.yml'
permissions:
  contents: read
jobs:
  reference-traces:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run isolated Rust model and reference tests
        run: cargo test --manifest-path modules/game-wave-model/Cargo.toml -- --nocapture
