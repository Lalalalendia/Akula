name: Diagnose Cargo lock (temporary)
on:
  push:
    branches: [fix/linux-wayland-clipboard-20261017]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve lockfile and print minimal diff
        working-directory: aquilum-app
        shell: bash
        run: |
          set -uo pipefail
          cargo metadata --format-version=1 --no-deps > /dev/null
          echo '=== cargo lock diff ==='
          git diff -- Cargo.lock
          echo '=== cargo lock status ==='
          git status --short
