name: YC-S3 E2b guarded policy receipt

on:
  pull_request:
    branches:
      - main
      - lab/yc-s3-t01d-e2a-policy-rotation-20261020
    paths:
      - 'aquilum-app/core/Cargo.toml'
      - 'aquilum-app/core/src/sync/mod.rs'
      - 'aquilum-app/core/src/sync/s3_v2_trust_anchor.rs'
      - 'aquilum-app/core/src/sync/s3_v2_trust_anchor_policy_receipt_lab.rs'
      - 'aquilum-app/core/src/sync/s3_v2_trust_anchor_policy_receipt_lab_tests.rs'
      - 'aquilum-app/core/src/sync/s3_remote_anchor.rs'
      - 'aquilum-app/core/src/sync/s3_publisher_policy_lab.rs'
      - '.github/workflows/yc-s3-policy-receipt-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-e2b:
    name: Guarded SQLite V2 policy / no cloud or writer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          save-if: false
      - name: E2b durable policy / rollback / restart / fork
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --no-default-features --features signed-vault-policy-receipt-lab s3_v2_trust_anchor::policy_receipt_lab::tests -- --test-threads=1
      - name: E2a owner rotation and E1 signature regression
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --no-default-features --features signed-vault-policy-receipt-lab s3_publisher_policy_lab::tests -- --test-threads=1
          cargo test --locked -p aquilum-core --no-default-features --features signed-vault-policy-receipt-lab s3_signed_root_paev1::tests -- --test-threads=1
      - name: Ordinary installed Core remains feature-free
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo check --locked -p aquilum-core --no-default-features
          if grep -Eq 'signed-vault-policy-receipt-lab' native/Cargo.toml; then
            echo 'E2b journal extension is forbidden in installed Akula'
            exit 1
          fi
