name: Yandex Disk OS secret-store offline checks

on:
  pull_request:
    paths:
      - 'modules/yandex-disk-secret-store/Cargo.toml'
      - 'modules/yandex-disk-secret-store/src/lib.rs'
      - 'modules/secret-store-common/src/native_backend.rs'
      - 'modules/yandex-disk-secret-store/src/lifecycle.rs'
      - 'modules/yandex-disk-secret-store/src/tests.rs'
      - 'modules/yandex-disk-secret-store/src/tests/lifecycle.rs'
      - '.github/workflows/yandex-disk-secret-store.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  isolated-readonly:
    name: Yandex Keyring contract / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux D-Bus development headers for OS keyring build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: yandex-keyring-${{ matrix.os }}
          save-if: false
      - name: Verify fake OS store, error policy, account partition and token redaction
        working-directory: .
        run: cargo test --manifest-path modules/yandex-disk-secret-store/Cargo.toml --no-default-features
      - name: Verify real Windows/Linux OS keyring backend compiles
        working-directory: .
        run: cargo check --manifest-path modules/yandex-disk-secret-store/Cargo.toml --features system-store
