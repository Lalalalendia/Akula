# Temporary PR #941 QA. Remove after exact-head acceptance.
name: QA 941 nested-workspace note rename (temporary)
on:
  push:
    branches:
      - fix/rename-overlapping-workspace-owner-20261115
    paths:
      - aquilum-app/core/src/files/gate/**
      - aquilum-app/core/src/history/service.rs
      - .github/workflows/qa-941-rename-overlap.yml
  pull_request:
    branches:
      - main
    paths:
      - aquilum-app/core/src/files/gate/**
      - aquilum-app/core/src/history/service.rs
      - .github/workflows/qa-941-rename-overlap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-rename:
    name: Russian note / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test exact Russian rename, overlap, history and alias defenses
        working-directory: aquilum-app
        run: cargo test -p aquilum-core --lib --locked files::gate::moves::admission::tests -- --nocapture
