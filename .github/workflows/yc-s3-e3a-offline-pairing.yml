name: YC-S3 E3a offline out-of-band join review

on:
  pull_request:
    branches:
      - main
      - lab/yc-s3-t01d-e2b-durable-policy-receipt-20261020
    paths:
      - 'aquilum-app/core/Cargo.toml'
      - 'aquilum-app/core/src/sync/mod.rs'
      - 'aquilum-app/core/src/sync/s3_join_genesis_lab.rs'
      - 'aquilum-app/core/src/sync/s3_publisher_policy_lab.rs'
      - '.github/workflows/yc-s3-e3a-offline-pairing.yml'
      - 'docs/sync/YC-S3-T01d-E3a-join-genesis-lab.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  join-review:
    name: Owner-signed join review / no network or writer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          save-if: false
      - name: E3a signed out-of-band genesis / pin / quorum negative matrix
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --no-default-features --features signed-vault-pairing-lab s3_join_genesis_lab::tests -- --test-threads=1
      - name: E2a signed owner transitions and E1 root verification regression
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --no-default-features --features signed-vault-pairing-lab s3_publisher_policy_lab::tests -- --test-threads=1
          cargo test --locked -p aquilum-core --no-default-features --features signed-vault-pairing-lab s3_signed_root_paev1::tests -- --test-threads=1
      - name: Normal Core has no E3a authority or new dependency
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo check --locked -p aquilum-core --no-default-features
          if grep -Eq 'signed-vault-(root|policy|pairing)-lab' native/Cargo.toml; then
            echo 'Opt-in trust labs may not be enabled by installed native Akula'
            exit 1
          fi
