name: Staya FED-GOSSIP-02 actual protocol laboratory
on:
  pull_request:
    paths:
      - "experiments/staya-fed-gossip-02/**"
      - ".github/workflows/staya-fed-gossip-02.yml"
  workflow_dispatch:
permissions:
  contents: read
# Replace obsolete PR experiment runs after new commits; keep manual runs.
concurrency:
  group: akula-fed-gossip-02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gossip:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.91.0"
      - name: Resolve standalone dependencies
        run: cargo generate-lockfile --manifest-path experiments/staya-fed-gossip-02/Cargo.toml
      - name: Run actual gossip state-machine regression tests
        run: |
          set -o pipefail
          cargo test --locked --manifest-path experiments/staya-fed-gossip-02/Cargo.toml --all-targets -- --nocapture 2>&1 | tee fed-gossip-tests.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fed-gossip-02
          path: |
            fed-gossip-tests.log
            experiments/staya-fed-gossip-02/Cargo.lock
          retention-days: 14
