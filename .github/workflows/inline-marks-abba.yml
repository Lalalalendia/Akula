name: Inline marks ABBA benchmark

on:
  pull_request:
    paths:
      - "aquilum-app/native/src/ui/editor/markdown/inline/marks/**"
      - "scripts/benchmarks/inline_marks_abba.rs"
      - "scripts/benchmarks/run-inline-marks-abba.sh"
      - ".github/workflows/inline-marks-abba.yml"
  workflow_dispatch:

permissions:
  contents: read

# New commits on one PR supersede its older experimental/diagnostic checks.
# Explicit workflow_dispatch runs are never preempted automatically.
concurrency:
  group: akula-inline-marks-abba-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  same-runner-abba:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare actual baseline and candidate Markdown mark kernels
        shell: bash
        run: bash scripts/benchmarks/run-inline-marks-abba.sh
