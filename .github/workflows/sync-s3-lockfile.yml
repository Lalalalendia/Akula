name: Sync S3 SDK lockfile
# One-branch Cargo.lock resolver. Only the first opt-in AWS SDK
# introduction uses this; it never builds or executes PR code.
on:
  pull_request:
    paths:
      - 'aquilum-app/core/Cargo.toml'
      - 'aquilum-app/Cargo.lock'
      - '.github/workflows/sync-s3-lockfile.yml'

permissions:
  contents: write

concurrency:
  group: sync-s3-lockfile-05b
  cancel-in-progress: false

jobs:
  lock:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sync/05b-s3-minio-capability-probe-20261017' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve only newly declared optional SDK dependencies
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch
          git diff --check
      - name: Commit reproducible Cargo.lock on this exact branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- aquilum-app/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- aquilum-app/Cargo.lock
            git commit -m "build(sync 05b): lock optional AWS SDK S3 dependencies"
            git push origin "HEAD:$HEAD_BRANCH"
          fi
          git status --short
