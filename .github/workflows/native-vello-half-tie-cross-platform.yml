name: Vello half-tie candidate cross-platform safety (diagnostic)

on:
  pull_request:
    paths:
      - '.github/scripts/ci_vello_half_tie_overlay.py'
      - '.github/workflows/native-vello-half-tie-cross-platform.yml'
      - 'aquilum-app/native/vendor/vello_cpu/src/render.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vello-half-tie-platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pixels:
    name: NonZero quantizer regression / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-half-tie-platforms-v1
          cache-workspace-crates: true
      - name: Install Linux GUI build libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Record CPU, OS and source
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            rustc --version
            cargo --version
            python --version
            uname -a || true
          } | tee half-tie-platform-env.txt
      - name: Run untouched Vello 0.3.0 control first
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/half-tie-original-vello.log"
          if cargo test --release --locked -p vello_cpu --lib guard96_real_glyph_495_slot_and_crop_coverage -- --nocapture > "$log" 2>&1; then
            echo "Vello original was invariant on this OS" | tee -a "$GITHUB_STEP_SUMMARY"
          elif grep -Fq 'different_alpha_pixels=1' "$log" && grep -Fq 'guard96_real_glyph_495_slot_and_crop_coverage ... FAILED' "$log"; then
            echo "Vello original reproduced D4/D5 in a real-glyph fixture" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Unexpected baseline failure (not the known 1-byte defect)'
            tail -n 90 "$log"
            exit 1
          fi
      - name: Copy original registry crate and patch only the CI worktree
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/ci_vello_half_tie_overlay.py --bias 0.5001 | tee half-tie-overlay.txt
      - name: Repeat exact glyph and earlier atlas outline regression tests
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p vello_cpu --lib guard96_real_glyph_495_slot_and_crop_coverage -- --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/half-tie-glyph-test.log"
          cargo test --release -p vello_cpu --lib guard96_real_glyph_495_half_tie_perturbation -- --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/half-tie-bias-test.log"
          cargo test --release -p vello_cpu --lib atlas_like_outline_coverage_is_ -- --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/half-tie-atlas-regression.log"
          cargo test --release -p glifo --lib hinted_vertical_snap -- --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/half-tie-hint-regression.log"
      - name: Real editor fractional-scroll and mixed-frame full-reference parity
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release -p aquilum-native --bin aquilum-native hinted_fractional_scroll_remains_pixel_stable -- --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/half-tie-fractional-ui.log"
          cargo test --release -p aquilum-native --bin aquilum-native benchmark_vello_dual_dispatch_route -- --ignored --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/half-tie-mixed-ui.log"
      - name: Verify all 32 guard96 frames in five separate editor processes
        working-directory: aquilum-app
        shell: bash
        env:
          AQ_CROSSOVER_ONLY_CASE: cover_1x
          AQ_CROSSOVER_WORKLOAD: guard96
          AQ_CROSSOVER_EVERY_FRAME: '1'
          AQ_TEST_SCROLL_EDGE_GUARD: '96'
        run: |
          set -euo pipefail
          success=0
          for trial in $(seq 1 5); do
            log="$GITHUB_WORKSPACE/half-tie-guard96-$trial.log"
            if cargo test --release -p aquilum-native --bin aquilum-native benchmark_vello_worker_crossover -- --ignored --nocapture --test-threads=1 > "$log" 2>&1; then
              echo "GUARD96_PLATFORM_PASS trial=$trial"
              success=$((success + 1))
            else
              echo "GUARD96_PLATFORM_FAIL trial=$trial"
              tail -n 65 "$log"
            fi
          done
          echo "Strict guard96 $success/5 full-frame checked processes" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$success" -eq 5
      - name: Archive logs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vello-half-tie-${{ github.sha }}-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            half-tie-*.log
            half-tie-*.txt
