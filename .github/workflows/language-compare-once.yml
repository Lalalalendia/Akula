name: Language comparison - one-shot research

on:
  push:
    branches:
      - research/language-compare-20261025
    paths:
      - 'scripts/benchmarks/language-compare/**'
      - '.github/workflows/language-compare-once.yml'

permissions:
  contents: read

concurrency:
  group: language-compare-one-shot
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Install Linux compilers
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends time curl ca-certificates xz-utils clang
          for pkg in gfortran gdc fp-compiler nim; do
            sudo apt-get install -y --no-install-recommends "$pkg" || echo "Optional apt compiler missing: $pkg"
          done
      - name: Install optional pinned compilers
        shell: bash
        run: bash scripts/benchmarks/language-compare/install-extras.sh
      - name: Check output and measure five interleaved runs
        shell: bash
        run: python3 scripts/benchmarks/language-compare/run.py --output language-compare-results --repetitions 5
      - name: Store exact results, provenance and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-compare-20261025
          path: language-compare-results/**
          if-no-files-found: warn
          retention-days: 30
