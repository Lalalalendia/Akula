name: Akula Bootstrap B1c1 exact B1a ELF owner-CAS QEMU DynamicUser bridge

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-signed-elf-root-cas-and-dynamicuser-in-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-bootstrap-b1c1-real-elf-vm-v1
          cache-workspace-crates: true
      - name: Validate Rust and all CI scripts before booting VM
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 aquilum-app/core/tests/server_bootstrap_b1c0.rs
          bash -n scripts/ci/akula-b1b2b-ubuntu-vm.sh
          bash -n scripts/ci/akula-b1b2b-guest-lab.sh
          bash -n scripts/ci/akula-b1c1-vm-hook.sh
          bash -n scripts/ci/akula-b1c1-guest-lab.sh
      - name: Build real Node ELF, original B1a signer and root-CAS test bridge
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo build --locked -p aquilum-core --features node-lab --bin akula-node-lab
          cargo build --locked -p aquilum-core --features server-bootstrap-b1a-release-lab \
            --example akula_b1b2b_release_fixture
          cargo test --locked -p aquilum-core --features server-bootstrap-b1c0-fixed-node-lab \
            --test server_bootstrap_b1c0 --no-run
          cargo check --locked -p aquilum-core --no-default-features
      - name: Actual GPG-pinned Ubuntu guest original B1a signed Node owner-CAS commit and DynamicUser launch
        shell: bash
        env:
          AKULA_B1C1_VM_BRIDGE: SIGNED_ELF_TO_ROOT_CAS
        run: |
          set -euo pipefail
          bash scripts/ci/akula-b1b2b-ubuntu-vm.sh
