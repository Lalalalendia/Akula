name: Vello CPU high-downscale image quality falsifier

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/native/src/render/image_downsample_tests.rs'
      - 'aquilum-app/native/src/render/mod.rs'
      - '.github/workflows/native-vello-image-downscale.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downscale:
    name: Measure actual Vello CPU sampling vs area reference / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Reproduce or falsify quality loss without weakening reference
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-native --bin aquilum-native \
            vello_downscale_area_reference_falsifier -- --ignored --nocapture --test-threads=1
