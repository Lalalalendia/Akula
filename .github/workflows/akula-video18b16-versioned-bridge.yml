name: Akula VIDEO-18b-16 protected five-EXE generation-layout bridge (non-release)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/video18b16-protected-versioned-bridge.nsi'
      - 'scripts/windows-video18b16-protected-versioned-bridge.ps1'
      - 'scripts/windows-video18c02b02b02a-distinct-native.ps1'
      - 'scripts/windows-video18c02b02b02b-distinct-signed-generations.ps1'
      - 'aquilum-app/native/Cargo.toml'
      - 'aquilum-app/core/Cargo.toml'
      - 'aquilum-app/Cargo.lock'
      - 'labs/video-lite/video18c02b04-native-pe-version.rs'
      - '.github/scripts/video18c02b06-real-versioned-rar2.test.cjs'
      - 'docs/release/video18c02b06-real-versioned-rar2.md'
      - 'labs/video-lite/video18c02b03-rar2-gui/Cargo.toml'
      - 'labs/video-lite/video18c02b03-rar2-gui/src/main.rs'
      - '.github/scripts/video18c02b03-rar2-commit.test.cjs'
      - 'docs/release/video18c02b03-positive-rar2-ack-confirm.md'
      - '.github/scripts/video18c02b02b02b-distinct-signed-generations.test.cjs'
      - 'docs/release/video18c02b02b02b-distinct-installed-signed-generations.md'
      - '.github/scripts/video18c02b02b02a-distinct-native.test.cjs'
      - 'docs/release/video18c02b02b02a-distinct-source-built-pe.md'
      - 'labs/video-lite/video18c02b_real_gui_ack.rs'
      - 'labs/video-lite/video18c02b02b-signed-gui/Cargo.toml'
      - 'labs/video-lite/video18c02b02b-signed-gui/src/main.rs'
      - '.github/scripts/video18c02b02b-signed-gui.test.cjs'
      - 'docs/release/video18c02b02b-signed-current-gui.md'
      - '.github/scripts/video18c02b-real-gui-ack.test.cjs'
      - 'docs/release/video18c02b-real-current-gui-ack.md'
      - '.github/scripts/video18b16-versioned-bridge.test.cjs'
      - '.github/workflows/akula-video18b16-versioned-bridge.yml'
      - 'docs/release/video18b16-protected-generation-layout.md'
      - 'scripts/video18b-protected-five-real.nsi'
      - 'scripts/windows-video18b04-real-five-custody.ps1'
      - 'docs/release/video18b04-five-exe-allowlist.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Versioned NSIS cleanup, source custody and fail-closed negative tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate source and five EXE custody release boundary
        run: node --test .github/scripts/video18c02b02b-signed-gui.test.cjs .github/scripts/video18c02b-real-gui-ack.test.cjs .github/scripts/video18b16-versioned-bridge.test.cjs .github/scripts/video18b11-protected-real-nsis.test.cjs .github/scripts/video18b04-real-five-custody.test.cjs .github/scripts/video18c02b02b02a-distinct-native.test.cjs .github/scripts/video18c02b02b02b-distinct-signed-generations.test.cjs .github/scripts/video18c02b03-rar2-commit.test.cjs .github/scripts/video18c02b06-real-versioned-rar2.test.cjs

  preflight:
    name: Compile actual Windows GUI ACK supervisor (no installer)
    needs: contract
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 32a803e67244836d2794f9bbbdf9b24deab63d7e
          path: _rar2-pinned
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile isolated Windows rustc lab before expensive five-PE build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:GITHUB_EVENT_NAME -cne 'pull_request' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
              (git rev-parse HEAD).Trim() -cne '${{ github.event.pull_request.head.sha }}'){
            throw 'VIDEO18C02B_HOLD: exact-head hosted Windows PR only'
          }
          $bin=Join-Path $env:RUNNER_TEMP 'video18c02b-preflight.exe'
          & rustc --edition=2024 -C opt-level=1 labs/video-lite/video18c02b_real_gui_ack.rs -o $bin
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $bin -PathType Leaf)){
            throw 'VIDEO18C02B_HOLD: Windows GUI ACK controller failed rustc preflight'
          }
          Remove-Item -LiteralPath $bin -Force -ErrorAction Stop
          Write-Host 'VIDEO18C02B_WINDOWS_RUSTC_PREFLIGHT_PASS nonrelease=1'
          $positiveManifest='labs/video-lite/video18c02b03-rar2-gui/Cargo.toml'
          $positiveLock='labs/video-lite/video18c02b03-rar2-gui/Cargo.lock'
          if(Test-Path -LiteralPath $positiveLock){throw 'VIDEO18C02B03_HOLD: unreviewed test Cargo.lock reused'}
          $manifest='labs/video-lite/video18c02b02b-signed-gui/Cargo.toml'
          $lock='labs/video-lite/video18c02b02b-signed-gui/Cargo.lock'
          if(Test-Path -LiteralPath $lock){throw 'VIDEO18C02B02B_HOLD: committed unreviewed Cargo.lock forbidden'}
          try {
            cargo generate-lockfile --manifest-path $manifest
            if($LASTEXITCODE -ne 0){throw 'VIDEO18C02B02B_HOLD: standalone test graph resolution failed'}
            cargo build --locked --manifest-path $manifest
            if($LASTEXITCODE -ne 0){throw 'VIDEO18C02B02B_HOLD: signed GUI witness fails Windows compile'}
            Write-Host 'VIDEO18C02B02B_WINDOWS_SIGNED_GUI_COMPILE_PASS nonrelease=1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-video18c02b02b02a-distinct-native.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0){throw 'VIDEO18C02B02B02A_HOLD: historical GUI script parser errors'}
          Write-Host 'VIDEO18C02B02B02A_POWERSHELL_PREFLIGHT_PASS nonrelease=1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-video18c02b02b02b-distinct-signed-generations.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0){throw "VIDEO18C02B02B02B_HOLD: distinct generations PowerShell parser errors: $($errors | Out-String)"}
          Write-Host 'VIDEO18C02B02B02B_POWERSHELL_PREFLIGHT_PASS nonrelease=1'
          if((git -C _rar2-pinned rev-parse HEAD).Trim() -cne '32a803e67244836d2794f9bbbdf9b24deab63d7e'){
            throw 'VIDEO18C02B03_HOLD: pinned rar2 source drift'
          }
          cargo generate-lockfile --manifest-path $positiveManifest
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $positiveLock -PathType Leaf)){
            throw 'VIDEO18C02B03_HOLD: disposable pinned Rust graph not resolved'
          }
          cargo check --locked --manifest-path $positiveManifest
          if($LASTEXITCODE -ne 0){throw 'VIDEO18C02B03_HOLD: signed rar2 GUI controller does not compile'}
          Write-Host 'VIDEO18C02B03_WINDOWS_CONTROLLER_PREFLIGHT_PASS nonrelease=1'
          } finally {
            Remove-Item -LiteralPath $lock -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $positiveLock -Force -ErrorAction SilentlyContinue
          }

  real-five:
    name: Compile five real EXEs and prove protected flat-to-current lab bridge
    needs: [contract, preflight]
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/Akula
          ref: ec6d6d48a78e60fca7a6f810b825418500bad64b
          path: _akula-historical
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/shiva
          ref: cb542d30d2c18a18b1ee457f5158d5b0f551757e
          path: _shiva-preview
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/rar2
          ref: 32a803e67244836d2794f9bbbdf9b24deab63d7e
          path: _rar2-pinned
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            aquilum-app -> ../.artifacts/cargo-native
            labs/video-lite
          shared-key: akula-video16-real-gui-windows-v1
          save-if: false
      - name: Parse real custody PowerShell script before expensive builds
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-video18b04-real-five-custody.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0){ throw "VIDEO18B04 invalid PowerShell: $($errors | Out-String)" }
          Write-Host 'VIDEO18B04_POWERSHELL_PARSE_PASS'
      - name: Build source-pinned Shiva CLI with tracked immutable dependency lock
        shell: pwsh
        env:
          VIDEO18B04_SHIVA_COMMIT: cb542d30d2c18a18b1ee457f5158d5b0f551757e
        run: |
          $ErrorActionPreference='Stop'
          $commit=(git -C _shiva-preview rev-parse HEAD).Trim()
          if($commit -cne $env:VIDEO18B04_SHIVA_COMMIT){throw 'Shiva commit changed'}
          $tracked=(git -C _shiva-preview ls-files --error-unmatch -- Cargo.lock 2>$null | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $tracked -cne 'Cargo.lock'){throw 'Shiva source must track its workspace Cargo.lock'}
          $expected='62b83af03e4079f6603eef7f7170edc4138a8233ad57829adf13baacd3f2b1d4'
          $crlf='80a05fc499cdc6961256d4b1569db828d6a5e56506aa37af60ac25c0d196c9f1'
          $blob='e9d6d1feee9ef3c76df19ce24033e6f34f0181d6'
          $sourceBlob=(git -C _shiva-preview rev-parse HEAD:Cargo.lock).Trim()
          $actual=(Get-FileHash -LiteralPath _shiva-preview/Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sourceBlob -cne $blob -or ($actual -cne $expected -and $actual -cne $crlf)){
            throw 'Shiva source blob or exact LF/CRLF lock checkout SHA256 mismatched'
          }
          Write-Host 'VIDEO18B05_SHIVA_LOCK_PIN_PASS tracked=1 source_blob=1 exact_checkout=1'
          $env:CARGO_TARGET_DIR=Join-Path $env:RUNNER_TEMP 'video18b04-shiva'
          cargo build --release --locked --manifest-path _shiva-preview/Cargo.toml -p cli
          if($LASTEXITCODE -ne 0){throw 'Pinned Shiva build failed'}
          $file=Join-Path $env:CARGO_TARGET_DIR 'release/shiva.exe'
          if(!(Test-Path -LiteralPath $file -PathType Leaf)){throw 'Built Shiva CLI missing'}
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18B04_SHIVA=$file"
      - name: Build Rust mux with immutable reviewed Cargo.lock
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo test --release --locked --manifest-path labs/video-lite/Cargo.toml --bin dash
          if($LASTEXITCODE -ne 0){throw 'Rust mux tests failed'}
          cargo build --release --locked --manifest-path labs/video-lite/Cargo.toml --bin dash
          if($LASTEXITCODE -ne 0){throw 'Rust mux build failed'}
          $mux=(Resolve-Path labs/video-lite/target/release/dash.exe).Path
          $pin=(Get-FileHash -LiteralPath $mux -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -Path $env:GITHUB_ENV -Value "AKULA_BUNDLED_MUX_SHA256=$pin"
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18B04_MUX=$mux"
      - name: Download and verify exact upstream yt-dlp and QuickJS bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'video18b04-upstream'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $yt=Join-Path $dir 'yt-dlp.exe'
          $js=Join-Path $dir 'qjs.exe'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe' -OutFile $yt -UseBasicParsing
          Invoke-WebRequest 'https://github.com/quickjs-ng/quickjs/releases/download/v0.18.0/qjs-windows-x86_64.exe' -OutFile $js -UseBasicParsing
          $allow=Get-Content -LiteralPath docs/release/video18b04-five-exe-allowlist.json -Raw | ConvertFrom-Json
          foreach($pair in @(@('akula-yt-dlp.exe',$yt),@('akula-quickjs.exe',$js))){
            $entry=@($allow.components | Where-Object {$_.name -ceq $pair[0]})
            if($entry.Count -ne 1 -or
              (Get-FileHash -LiteralPath $pair[1] -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry[0].sha256 -or
              (Get-Item -LiteralPath $pair[1]).Length -ne $entry[0].size_bytes){
              throw "VIDEO18B04 upstream pin failure: $($pair[0])"
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18B04_YT=$yt"
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18B04_JS=$js"
          Write-Host 'VIDEO18B04_UPSTREAM_PINS_PASS downloaded=2 exact_sha256_and_size=1'
      - name: Build actual Akula with experimental Rust video feature (no package)
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference='Stop'
          cargo build --release --locked -p aquilum-native --features installed,video-rust-bundle,video-ui-e2e
          if($LASTEXITCODE -ne 0){throw 'Akula video-enabled lab build failed'}
          $app=Join-Path $env:GITHUB_WORKSPACE '.artifacts/cargo-native/release/aquilum-native.exe'
          if(!(Test-Path -LiteralPath $app -PathType Leaf)){throw 'Video Akula binary missing'}
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18B04_APP=$app"
      - name: Bind real 0.3.21 PE identity to strict 0.3.20 version floor before signing
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_EVENT_NAME -cne 'pull_request' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             (git rev-parse HEAD).Trim() -cne $env:EXPECTED_HEAD_SHA) {
            throw 'VIDEO18C02B06_HOLD: exact-head hosted Windows PR only'
          }
          node scripts/akula-version.cjs check
          if($LASTEXITCODE -ne 0){throw 'VIDEO18C02B06_HOLD: source version mirror mismatch'}
          $metadata=@(cargo metadata --locked --no-deps --format-version 1 --manifest-path aquilum-app/Cargo.toml 2>&1)
          if($LASTEXITCODE -ne 0){throw 'VIDEO18C02B06_HOLD: source metadata unavailable'}
          $packages=@(($metadata -join [Environment]::NewLine | ConvertFrom-Json).packages |
            Where-Object { $_.name -ceq 'aquilum-native' })
          if($packages.Count -ne 1 -or [string]$packages[0].version -cne '0.3.21'){
            throw 'VIDEO18C02B06_HOLD: current native source is not genuine 0.3.21'
          }
          $witness=Join-Path $env:RUNNER_TEMP 'video18c02b06-native-pe-verifier.exe'
          rustc --edition=2024 labs/video-lite/video18c02b04-native-pe-version.rs -o $witness
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $witness -PathType Leaf)){
            throw 'VIDEO18C02B06_HOLD: independent native version reader unavailable'
          }
          $pass=@(& $witness --admit $env:VIDEO18B04_APP '0.3.21' '0.3.20' '0.3.21' 2>&1)
          $code=$LASTEXITCODE
          $pass | Out-Host
          if($code -ne 0 -or !(($pass | Out-String).Contains('VIDEO18C02B04_STRICT_VERSION_FLOOR_PASS'))){
            throw 'VIDEO18C02B06_HOLD: real native PE does not attest a raised version'
          }
          foreach($forged in @(@('0.3.20','0.3.20'),@('0.3.20','0.3.22'),@('0.3.21','0.3.21'))){
            $no=@(& $witness --admit $env:VIDEO18B04_APP '0.3.21' $forged[0] $forged[1] 2>&1)
            $code=$LASTEXITCODE
            if($code -eq 0 -or !(($no | Out-String).Contains('VIDEO18C02B04_HOLD: signed label is not a genuine newer native PE version'))){
              throw 'VIDEO18C02B06_HOLD: forged/nonincreasing version admitted'
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18C02B06_VERSION_WITNESS=$witness"
          Write-Host 'VIDEO18C02B06_REAL_NATIVE_FLOOR_PASS old_source=0.3.20 new_source=0.3.21 pe_verified=1 negatives=3 nonrelease=1'
          # GitHub's pwsh wrapper returns the last native exit code on successful scripts.
          # All three negative cases MUST fail, and leave a stale nonzero $LASTEXITCODE.
          # Reset only AFTER every explicit refusal was verified and the success marker emitted.
          $global:LASTEXITCODE=0
      - name: Compile historical pinned Akula GUI independently from real source
        shell: pwsh
        working-directory: _akula-historical/aquilum-app
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $old='ec6d6d48a78e60fca7a6f810b825418500bad64b'
          if($env:GITHUB_EVENT_NAME -cne 'pull_request' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              (git rev-parse HEAD).Trim() -cne $old -or
              (git -C ../.. rev-parse HEAD).Trim() -cne $env:EXPECTED_HEAD_SHA){
            throw 'VIDEO18C02B02B02A_HOLD: wrong old/new source commit'
          }
          # Real source versions differ: verify each pinned checkout independently.
          $oldLock=(git rev-parse HEAD:aquilum-app/Cargo.lock).Trim()
          $newLock=(git -C ../.. rev-parse HEAD:aquilum-app/Cargo.lock).Trim()
          $oldCheckoutLock=(git hash-object Cargo.lock).Trim()
          $newCheckoutLock=(git -C ../.. hash-object aquilum-app/Cargo.lock).Trim()
          if($oldLock -cne $oldCheckoutLock -or $newLock -cne $newCheckoutLock -or
             $oldLock -ceq $newLock){
            throw 'VIDEO18C02B06_HOLD: historical/current dependency locks not separately pinned'
          }
          $target=Join-Path $env:RUNNER_TEMP 'video18c02b02b02a-old-native'
          if(Test-Path -LiteralPath $target){throw 'VIDEO18C02B02B02A_HOLD: historical build target reused'}
          $env:CARGO_TARGET_DIR=$target
          cargo build --release --locked -p aquilum-native --features installed,video-rust-bundle,video-ui-e2e
          if($LASTEXITCODE -ne 0){throw 'VIDEO18C02B02B02A_HOLD: pinned old native GUI failed compilation'}
          $oldApp=Join-Path $target 'release/aquilum-native.exe'
          if(!(Test-Path -LiteralPath $oldApp -PathType Leaf)){
            throw 'VIDEO18C02B02B02A_HOLD: old GUI PE not produced'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VIDEO18C02B02B02A_OLD_APP=$oldApp"
          Write-Host 'VIDEO18C02B02B02A_SOURCE_COMMIT_PIN_PASS old_commit=1 tracked_lock=1 cargo_locked=1 no_mutated_pe=1 nonrelease=1'
      - name: Attest two distinct source-built PE and launch genuine historical GUI
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          # A PowerShell script is not a native executable: a previous native exit code can be stale.
          # ErrorActionPreference=Stop propagates a terminating script error.
          $proof=@(./scripts/windows-video18c02b02b02a-distinct-native.ps1 -OldAppPath $env:VIDEO18C02B02B02A_OLD_APP -NewAppPath $env:VIDEO18B04_APP 2>&1)
          $proof | Out-Host
          if(!(($proof | Out-String).Contains('VIDEO18C02B02B02A_OLD_GUI_VISIBLE_PASS'))){
            throw 'VIDEO18C02B02B02A_HOLD: distinct real source-built old GUI witness failed'
          }
      - name: Attest exact real five EXEs, reject mutation and preserve license HOLD
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./scripts/windows-video18b04-real-five-custody.ps1 -AppPath $env:VIDEO18B04_APP -ShivaPath $env:VIDEO18B04_SHIVA -MuxPath $env:VIDEO18B04_MUX -YtDlpPath $env:VIDEO18B04_YT -QuickJsPath $env:VIDEO18B04_JS -ReportPath (Join-Path $env:RUNNER_TEMP 'video18b04-custody.json')
          if($LASTEXITCODE -ne 0){throw 'VIDEO18B04 real provenance proof failed'}
      - name: Install pinned NSIS 3.11.0 on disposable Windows runner
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 --yes --no-progress
          if($LASTEXITCODE -ne 0){ throw 'VIDEO18B16_HOLD: pinned NSIS compiler unavailable' }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-video18b16-protected-versioned-bridge.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0){ throw "VIDEO18B16_HOLD: PowerShell parser rejected bridge: $($errors | Out-String)" }
          Write-Host 'VIDEO18B16_POWERSHELL_PARSE_PASS'
      - name: Install SHA-pinned Minisign 0.12 for ephemeral five-PE GUI witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip'
          $sha='37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479'
          $archive=Join-Path $env:RUNNER_TEMP 'video18c02b02b-minisign-0.12.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'video18c02b02b-minisign-0.12'
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sha){
            throw 'VIDEO18C02B02B_HOLD: Minisign 0.12 archive SHA mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $dir -ErrorAction Stop
          $binaryDir=Join-Path $dir 'minisign-win64/x86_64'
          $mini=Join-Path $binaryDir 'minisign.exe'
          if(!(Test-Path -LiteralPath $mini -PathType Leaf)){
            throw 'VIDEO18C02B02B_HOLD: pinned Minisign missing'
          }
          & $mini -v
          if($LASTEXITCODE -ne 0){throw 'VIDEO18C02B02B_HOLD: Minisign does not start'}
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $binaryDir
          Write-Host 'VIDEO18C02B02B_MINISIGN_PINNED_PASS ephemeral=1 release=0'

      - name: Two real protected NSIS installers, legacy/current five-file bridge, ten ACL denials, complete uninstall
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
