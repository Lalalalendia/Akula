name: LAB Win7 public v0.3.14 import audit (diagnostic only)
on:
  push:
    branches: ['lab/win7-release-pe-imports-20261023']
    paths:
      - '.github/scripts/akula-win7-import-audit.py'
      - '.github/workflows/akula-win7-import-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PE inspection utilities
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends p7zip-full binutils-mingw-w64-x86-64
      - name: Fetch and verify release
        env:
          AKULA_RELEASE_TAG: v0.3.14
          AKULA_RELEASE_SHA256: e91f97eff69717b442fa6288036a1a9ea8b129ebfdd056b5290fbb2eb9b85c11
        run: |
          mkdir -p "$RUNNER_TEMP/akula-win7/extracted" "$RUNNER_TEMP/akula-win7/report"
          curl --proto '=https' --tlsv1.2 -fL --retry 2 --max-time 90 'https://github.com/Lalalalendia/Akula/releases/download/v0.3.14/Akula_0.3.14_x64-setup.exe' -o "$RUNNER_TEMP/akula-win7/installer.exe"
          printf '%s  %s\n' "$AKULA_RELEASE_SHA256" "$RUNNER_TEMP/akula-win7/installer.exe" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/akula-win7/extracted" "$RUNNER_TEMP/akula-win7/installer.exe" > /dev/null
      - name: Analyze static PE imports
        env:
          AKULA_RELEASE_TAG: v0.3.14
          AKULA_RELEASE_SHA256: e91f97eff69717b442fa6288036a1a9ea8b129ebfdd056b5290fbb2eb9b85c11
        run: |
          python3 .github/scripts/akula-win7-import-audit.py "$RUNNER_TEMP/akula-win7/extracted" "$RUNNER_TEMP/akula-win7/report" | tee "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akula-win7-import-audit
          path: ${{ runner.temp }}/akula-win7/report/
          if-no-files-found: warn
          retention-days: 14
