name: Akula Bootstrap B1a offline signed release proof

on:
  pull_request:
    branches: [main]
    paths:
      - "aquilum-app/core/Cargo.toml"
      - "aquilum-app/core/src/lib.rs"
      - "aquilum-app/core/src/server_release_lab.rs"
      - "aquilum-app/core/tests/server_bootstrap_b1a.rs"
      - "docs/platforms/AKULA-SERVER-BOOTSTRAP-B1A.md"
      - ".github/workflows/core-server-bootstrap-b1a-release.yml"
      - '.github/scripts/ci-lab-scope.cjs'
      - '.github/scripts/ci-lab-scope.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-bootstrap-b1a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-isolated-feature:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check isolated additive Rust feature (fail closed)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node --test .github/scripts/ci-lab-scope.test.cjs
          node .github/scripts/ci-lab-scope.cjs --base="$BASE_SHA" --head=HEAD >> "$GITHUB_OUTPUT"
  offline-signature-gate:
    needs: classify-isolated-feature
    if: ${{ always() && (github.event_name != 'pull_request' || needs.classify-isolated-feature.result != 'success' || needs.classify-isolated-feature.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-b1a-release-proof-v1
          cache-workspace-crates: true
      - name: Verify Ed25519 release trust, rollback and exact signed bytes
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features server-bootstrap-b1a-release-lab --test server_bootstrap_b1a -- --nocapture
      - name: Prove default Core remains unchanged without B1a
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p aquilum-core --no-default-features
