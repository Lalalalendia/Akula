name: EXP Unified Ingest M5 offline chain
on:
  pull_request:
    paths:
      - 'experiments/unified-ingest-m5/**'
      - '.github/workflows/exp-unified-ingest-m5.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline-ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated M5 dependencies
        run: python -m pip install -e './experiments/unified-ingest-m5[test]'
      - name: Test full M5 offline S3-compatible path
        working-directory: experiments/unified-ingest-m5
        run: python -m unittest discover -s tests -p test_m5_pipeline.py -v
      - name: Verify M5 and M6 offline bridge
        working-directory: experiments/unified-ingest-m5
        run: python -m unittest discover -s tests -p 'test_m[56]*.py' -v
      - name: Export Erida HTML with immutable handoff
        working-directory: experiments/unified-ingest-m5
        run: |
          python -m discovery_lab.unified_cli demo --state ./m6-state --erida-out ./m6-import > ./m6-results.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("m6-results.json").read_text())
          assert p["erida_export"]["status"]=="PREPARED_NOT_STAGED"
          assert p["erida_export"]["expected_chapters"]==2
          assert p["erida_export"]["requires_actor_confirmation"]
          assert not p["erida_export"]["stage_automatically"]
          PY
      - name: Check output against pinned real Erida importer
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/Lalalalendia/ararra.git /tmp/erida-m6
          git -C /tmp/erida-m6 checkout --quiet 0b793ed1e8314abd0d286cb1cd9d7b1c11d3931e -- src/chaptera_server/book_import.py
          python -m pip install beautifulsoup4
          PYTHONPATH=/tmp/erida-m6/src python experiments/unified-ingest-m5/tests/verify_real_erida_import.py \
            experiments/unified-ingest-m5/m6-import/*-import.json
      - name: Run all-stages discovery / parse / publish / handoff
        working-directory: experiments/unified-ingest-m5
        run: |
          python -m discovery_lab.unified_cli demo --state ./m5-state > ./first.json
          python -m discovery_lab.unified_cli demo --state ./m5-state > ./second.json
          python - <<'PY'
          import json
          a=json.load(open("first.json"));b=json.load(open("second.json"))
          assert a["discovery"]["status"]=="STABLE_OBSERVED"
          assert a["pipeline"]["status"]=="PUBLISHED"
          assert a["pipeline"]["pages_verified"]==3
          assert b["pipeline"]["status"]=="UNCHANGED"
          assert a["pipeline"]["revision_id"]==b["pipeline"]["revision_id"]
          PY
      - name: Upload smoke receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-ingest-m5-evidence
          path: |
            experiments/unified-ingest-m5/first.json
            experiments/unified-ingest-m5/second.json
          if-no-files-found: ignore
          retention-days: 14
