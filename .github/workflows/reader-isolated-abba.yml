name: Reader isolated ABBA
on:
  pull_request:
    paths:
      - 'scripts/reader-isolated-abba.py'
      - '.github/workflows/reader-isolated-abba.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Runner identity
        run: lscpu
      - name: Measure exact production functions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reader-isolated-abba.py | tee reader-isolated-abba.log
          {
            echo 'Isolated synthetic workloads; not end-to-end book opening.'
            grep '^RESULT ' reader-isolated-abba.log
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-isolated-abba
          path: reader-isolated-abba.log
