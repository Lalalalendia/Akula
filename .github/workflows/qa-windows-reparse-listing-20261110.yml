name: QA Windows workspace reparse listing (branch only)
on:
  push:
    branches: [security/windows-reparse-directory-listing-20261110]
    paths:
      - aquilum-app/core/src/files/workspace.rs
      - aquilum-app/core/src/files/workspace/**
      - .github/workflows/qa-windows-reparse-listing-20261110.yml

permissions:
  contents: read

jobs:
  windows-junction:
    name: Real non-admin Windows junction exclusion
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run actual NTFS mklink /J negative regression
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          $result = cargo test --locked -p aquilum-core --lib excludes_ntfs_junction_even_when_it_looks_like_a_directory -- --nocapture 2>&1 | Out-String
          Write-Host $result
          if ($LASTEXITCODE -ne 0) { throw "Windows reparse regression exited $LASTEXITCODE" }
          if ($result -notmatch '1 passed; 0 failed') {
            throw 'Windows reparse regression did not actually execute one passing test'
          }
