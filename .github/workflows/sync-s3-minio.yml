name: Sync S3/MinIO capability probe

on:
  workflow_call:
  pull_request:
    # Main PR runs via the required Application checks route; non-main stays direct.
    branches-ignore: [main]
    paths:
      - 'aquilum-app/core/src/sync/s3_transport.rs'
      - 'aquilum-app/core/tests/aws_credentials_regression.rs'
      - 'aquilum-app/core/src/sync/yandex_readonly_probe.rs'
      - 'aquilum-app/core/src/sync/profile_binding.rs'
      - 'aquilum-app/core/src/sync/host_admission.rs'
      - 'aquilum-app/core/src/sync/s3_preimage_capture.rs'
      - 'aquilum-app/core/src/sync/host_custody_registry.rs'
      - 'aquilum-app/core/src/sync/journal.rs'
      - 'aquilum-app/core/src/sync/journal/publication_recovery.rs'
      - 'aquilum-app/core/src/sync/local_create_tests.rs'
      - 'aquilum-app/core/src/sync/local_create.rs'
      - 'aquilum-app/core/src/sync/s3_transport/**'
      - 'aquilum-app/core/src/sync/s3.rs'
      - 'aquilum-app/core/src/sync/s3_manifest.rs'
      - 'aquilum-app/core/src/sync/s3_manifest_delta.rs'
      - 'aquilum-app/core/src/sync/s3_coord_v2.rs'
      - 'aquilum-app/core/src/sync/s3_head_probe.rs'
      - 'aquilum-app/core/src/sync/s3_delta_walker.rs'
      - 'aquilum-app/core/src/sync/s3_remote_anchor.rs'
      - 'aquilum-app/core/src/sync/s3_transport/selective_snapshot.rs'
      - 'aquilum-app/core/src/sync/s3_transport/offline_retention.rs'
      - 'aquilum-app/core/src/sync/s3_anchored_delta.rs'
      - 'aquilum-app/core/src/sync/mod.rs'

      - '.github/workflows/sync-s3-minio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-s3-minio-${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sdk-and-minio:
    name: Official AWS Rust SDK / localhost MinIO
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: akula_minio_ci
      AWS_SECRET_ACCESS_KEY: isolated_akula_minio_ci_only_20261017
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_MAX_ATTEMPTS: '1'
      AQ_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore core cache (no PR cache writes)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Start disposable localhost MinIO
        shell: bash
        run: |
          set -euo pipefail
          # The former upstream Quay image has required authentication since
          # September 2026; use a maintained, public Chainguard build instead.
          # It runs as non-root uid 65532: give only /data a writable tmpfs.
          docker run -d --rm --name akula-s3-minio \
            -p 127.0.0.1:9000:9000 \
            --tmpfs /data:rw,uid=65532,gid=65532,mode=0700 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs akula-s3-minio
          exit 1
      - name: Run SDK profile and input safety tests
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 s3_transport::tests -- --skip live_minio_
          # Exact opt-in AWS provider test: compiled SSO + isolated credential_process.
          cargo test --locked -p aquilum-core --features sync-s3 --test aws_credentials_regression -- --test-threads=1
      - name: Validate Yandex read-only probe admission and error taxonomy
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 yandex_readonly_probe::tests
      - name: Prove bounded Yandex-style signed read-only LIST on MinIO
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 live_minio_yandex_probe_request_is_read_only -- --ignored --test-threads=1
      - name: Prove real MinIO server-side conditions and bounded streaming
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 live_minio_ -- --ignored --test-threads=1 --nocapture
      - name: Test local multipart journal and source guards
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 multipart::tests -- --skip minio_multipart_
      - name: Verify >64 MiB immutable multipart and journal recovery
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 multipart::tests -- --ignored --test-threads=1 --nocapture
      - name: Verify strict sharded 10k manifest index and root journal
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 s3_manifest::tests
          cargo test --locked -p aquilum-core --features sync-s3 s3_coord_v2::tests
          cargo test --locked -p aquilum-core --features sync-s3 s3_transport::manifest::tests -- --skip minio_
      - name: Verify durable profile-bound remote anchors and delta lineage
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 s3_remote_anchor::tests
          cargo test --locked -p aquilum-core --features sync-s3 s3_anchored_delta::tests
          cargo test --locked -p aquilum-core --features sync-s3 selective_snapshot::tests -- --skip live_minio_
          cargo test --locked -p aquilum-core --features sync-s3 verified_cache_disk::tests
          cargo test --locked -p aquilum-core --features sync-s3 offline_retention::tests
          cargo test --locked -p aquilum-core --features sync-s3 coord_probe::tests
          cargo test --locked -p aquilum-core --features sync-s3 s3_delta_walker::tests -- --skip live_minio_

      - name: Prove explicit V2 genesis trust, SQLite restart and rollback HOLD
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 s3_v2_trust_anchor::tests
      - name: Validate read-only V2 frame, tombstone and corruption guards
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 s3_transport::v2_readonly::tests
          cargo test --locked -p aquilum-core --features sync-s3 coord_chain::tests -- --skip live_minio_
          cargo test --locked -p aquilum-core --features sync-s3 coord_selective_packs::tests
      - name: Prove V2 pack index CAS-binding and fail-closed ancestry contracts
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 s3_pack_index::tests
      - name: Falsify experimental immutable pack and member tampering
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 s3_transport::pack_probe::tests
      - name: Verify production-compiled bounded V2 sender pack serialization
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 coord_pack_encode::tests
      - name: Prove deterministic V1-bound V2 locator encoding rejects foreign roots
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 coord_locator::tests
      - name: Prove missing installer ledger fails closed on default Core.open
        shell: bash
        working-directory: aquilum-app
        env:
          AKULA_INSTALLED_HOST_CUSTODY_DB: ''
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-installed-host installed_host_tests -- --nocapture
      - name: Verify real build-time host ledger across two default Core processes
        shell: bash
        working-directory: aquilum-app
        env:
          AKULA_INSTALLED_HOST_CUSTODY_DB: ${{ runner.temp }}/akula-ci-installed-host.sqlite3
          AKULA_INSTALLED_HOST_TEST_ALLOW_PROVISION: '1'
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-installed-host mandatory_installed_host_core_open_uses_real_compiled_shared_ledger -- --nocapture
      - name: Verify host-installed shared custody ledger rejects cross-appdata reset
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 host_custody_registry::tests
          cargo test --locked -p aquilum-core --features sync-s3 host_core_epoch_tests
          # P0-B4c: activation itself, not a manual fixture, must insert into
          # host-wide enrollment before a different appdata can mutate.
          cargo test --locked -p aquilum-core --features sync-s3 verified_editor_activation_enrolls_shared_host_before_other_appdata_can_write -- --nocapture
      - name: Reject forged AWS identity, cross-account scope and custom endpoints
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 s3_transport::principal::tests
      - name: Validate bounded read-only RemoteStore snapshot projection
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 snapshot_store::tests
      - name: Validate held CAS replan and both immutable DAG branches
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 replan::identity_tests
          cargo test --locked -p aquilum-core --features sync-s3 cas_replay_plans_both_offline_siblings_without_rewriting_either_head
      - name: Validate Core-to-S3 identity guards (offline)
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 additive_gate_rejects_cross_vault_and_wrong_revision_or_path
          # live_minio_two_core_verified_stage_and_no_replace already runs in
          # the earlier live_minio_ filter. Running it again without resetting
          # the same bucket incorrectly produces BucketAlreadyOwnedByYou.
      - name: Verify separate local workspace and shared cloud vault profile binding
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 profile_binding::tests
          cargo test --locked -p aquilum-core --features sync-s3 s3_transport::guarded_update_plan::tests
          cargo test --locked -p aquilum-core --features sync-s3 s3_transport::existing_content_stage::tests
      - name: Verify S3-bound protected original capture and denial cases
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 s3_preimage_capture::tests -- --nocapture
      - name: Two independent S3 clients CAS, conflicts and lost ACK
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 minio_two_clients_manifest_cas_and_lost_ack -- --ignored --test-threads=1 --nocapture
      - name: Prove isolated V2 CAS, complete pack readback and lost-ACK SQLite recovery
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 minio_v2_pack_root_cas_two_clients_and_lost_ack -- --ignored --test-threads=1 --nocapture
      - name: Prove bounded parallel DAG verification and reject corrupted S3 blobs
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 bounded_parallel_verifier_keeps_out_of_order_parent_closure_and_blob_lengths
          cargo test --locked -p aquilum-core --features sync-s3 minio_verified_384_revision_dag_parallel_and_corruption -- --ignored --test-threads=1 --nocapture
      - name: Stress 10k actual S3 objects and 1000-key pagination
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 minio_10k_cloud_objects_pagination -- --ignored --test-threads=1 --nocapture
      - name: Shutdown MinIO and print sanitized diagnostics
        if: always()
        shell: bash
        run: |
          docker ps --filter name=akula-s3-minio --format 'table {{.Names}}\t{{.Status}}'
          docker stop akula-s3-minio >/dev/null 2>&1 || true
