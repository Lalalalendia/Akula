name: Sync S3/MinIO capability probe

on:
  pull_request:
    paths:
      - 'aquilum-app/core/src/sync/s3_transport.rs'
      - 'aquilum-app/core/src/sync/s3.rs'
      - 'aquilum-app/core/src/sync/mod.rs'
      - 'aquilum-app/core/Cargo.toml'
      - 'aquilum-app/Cargo.lock'
      - '.github/workflows/sync-s3-minio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-s3-minio-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sdk-and-minio:
    name: Official AWS Rust SDK / localhost MinIO
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: akula_minio_ci
      AWS_SECRET_ACCESS_KEY: isolated_akula_minio_ci_only_20261017
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_MAX_ATTEMPTS: '1'
      AQ_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore core cache (no PR cache writes)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Start disposable localhost MinIO
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name akula-s3-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs akula-s3-minio
          exit 1
      - name: Run SDK profile and input safety tests
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 s3_transport::tests -- --skip live_minio_
      - name: Prove real MinIO server-side conditions and bounded streaming
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 live_minio_ -- --ignored --test-threads=1 --nocapture
      - name: Shutdown MinIO and print sanitized diagnostics
        if: always()
        shell: bash
        run: |
          docker ps --filter name=akula-s3-minio --format 'table {{.Names}}\t{{.Status}}'
          docker stop akula-s3-minio >/dev/null 2>&1 || true
