name: Akula Bootstrap B1b4a root FD owner and external CAS fence

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - experiment/akula-server-bootstrap-b1b3c-root-pinned-package-lab
    paths:

      - "aquilum-app/core/src/server_installer_cas_fence_lab.rs"
      - "aquilum-app/core/tests/server_bootstrap_b1b4a.rs"
      - ".github/workflows/core-server-bootstrap-b1b4a-cas-fence.yml"
      - "docs/platforms/AKULA-SERVER-BOOTSTRAP-B1B4A.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only PR revisions supersede earlier PR revisions; manual labs stay independent.
  group: b1b4a-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  inert-root-owner-external-cas-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-bootstrap-b1b4a-inert-cas-v1
          cache-workspace-crates: true
      - name: Parse Rust and Bash
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 aquilum-app/core/src/server_installer_cas_fence_lab.rs aquilum-app/core/tests/server_bootstrap_b1b4a.rs
      - name: Compile opt-in B1b4a and unmodified default Core
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features server-bootstrap-b1b4a-cas-fence-lab --test server_bootstrap_b1b4a --no-run
          cargo check --locked -p aquilum-core --no-default-features
      - name: Run actual UID0 file handle and synthetic witness cases
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for candidate in .artifacts/cargo-native/debug/deps/server_bootstrap_b1b4a-*; do
            if [[ -f "$candidate" && -x "$candidate" && "$candidate" != *.d ]]; then
              sudo -n "$PWD/$candidate" --nocapture
              count=$((count + 1))
            fi
          done
          test "$count" -eq 1
