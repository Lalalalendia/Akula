name: Akula native received Inbox LAN beta

on:
  push:
    branches:
      - feature/ak-p2p-native-receive-onefile-20261024
      - feature/ak-p2p-installed-main-integration-20261024
    paths:
      - 'interop/akula-staya/**'
      - 'aquilum-app/native/src/app/transfer/**'
      - 'aquilum-app/native/src/app/transfer.rs'
      - 'aquilum-app/native/src/app/transfer/dialog.rs'
      - 'aquilum-app/core/src/p2p_inbox_lab.rs'
      - 'aquilum-app/core/src/p2p_inbox_lab/**'
      - 'aquilum-app/core/src/sync/mod.rs'
      - 'aquilum-app/core/src/sync/p2p_stage.rs'
      - 'aquilum-app/core/src/sync/disabled_tests.rs'
      - 'modules/drop-inbox-ledger/**'
      - 'aquilum-app/native/src/ui/transfer/**'
      - 'aquilum-app/native/src/ui/transfer.rs'
      - 'aquilum-app/native/src/ui/transfer/dialog_view.rs'
      - 'aquilum-app/native/Cargo.toml'
      - 'aquilum-app/native/assets/locales/**'
      - 'aquilum-app/Cargo.lock'
      - '.github/workflows/p2p-native-receive-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-receive-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-receive-windows:
    name: Win Native receive beta (exact-head, no installer)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check only modified receiver modules
        shell: bash
        run: |
          rustfmt --check --edition 2024 aquilum-app/native/src/app/transfer/native_receive.rs aquilum-app/native/src/ui/transfer/native_receive_view.rs
          rustfmt --check --edition 2024 aquilum-app/native/src/app/transfer/peer_pair.rs aquilum-app/native/src/ui/transfer/peer_pair.rs
          rustfmt --check --config skip_children=true --edition 2024 aquilum-app/native/src/app/transfer.rs aquilum-app/native/src/app/transfer/dialog.rs aquilum-app/native/src/ui/transfer.rs aquilum-app/native/src/ui/transfer/dialog_view.rs
          # Check the new leaf modules without reformatting unrelated legacy W4 code.
          rustfmt --check --config skip_children=true --edition 2024 aquilum-app/native/src/app/transfer/actions.rs aquilum-app/native/src/app/transfer/dialog/context.rs aquilum-app/native/src/ui/transfer/types.rs aquilum-app/native/src/ui/transfer/dialog_view/panels.rs
          rustfmt --check --config skip_children=true --edition 2021 aquilum-app/core/src/sync/p2p_stage.rs aquilum-app/core/src/sync/disabled_tests.rs aquilum-app/core/src/p2p_inbox_lab/tests.rs
          cargo fmt --manifest-path modules/drop-inbox-ledger/Cargo.toml -- --check
          cargo fmt --manifest-path interop/akula-staya/Cargo.toml -- --check
      - name: Verify shipping lockfile remains resolved
        shell: bash
        run: |
          cargo metadata --manifest-path aquilum-app/Cargo.toml --locked --format-version 1 > /dev/null
          git diff --exit-code -- aquilum-app/Cargo.lock
      - name: Prove Windows installed feature graph excludes vulnerable optional S3 signer
        shell: bash
        run: |
          # Security diagnostic only; does not waive the full RustSec release gate.
          set -euo pipefail
          cargo tree --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-native --features installed --target x86_64-pc-windows-msvc --edges normal,build --format '{p}' > "$RUNNER_TEMP/akula-installed-tree.txt"
          for required in 'akula-staya-integration v' 'akula-inbox-ledger-lab v' 'akula-dropbox-connect-lab v'; do
            if ! grep -Fq "$required" "$RUNNER_TEMP/akula-installed-tree.txt"; then
              echo "::error::Expected installed dependency missing: $required"
              exit 1
            fi
          done
          if grep -Eq 'crypto-bigint v0[.][0-6][.]' "$RUNNER_TEMP/akula-installed-tree.txt"; then
            echo '::error::Vulnerable crypto-bigint is reachable in normal installed Windows feature graph'
            exit 1
          fi
          echo 'Windows installed feature graph: P2P+Inbox+Dropbox present; vulnerable crypto-bigint 0.x absent. Full lockfile RustSec audit remains blocking.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check shared real QUIC receiver and Inbox tests
        shell: bash
        run: |
          cargo check --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta native_address_accepts_private_lan -- --nocapture
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta native_internet_entrypoints_reject_bad_peer_before_n0_network -- --nocapture
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta internet_routing_is_never_selected_by_legacy_lan_modes -- --nocapture
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta real_quic_sender_ignores_unselected_peer_and_admits_expected_peer -- --nocapture
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta native_recipient_persists_only_inbox -- --nocapture
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta native_receiver_rejects_corrupted -- --nocapture
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta windows_receiver_refuses_junction_ancestor -- --nocapture
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta windows_receiver_requires_existing_regular_directory_chain -- --nocapture
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta windows_receiver_rejects_inbox_with_everyone_full_control -- --nocapture
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta actual_iroh_native_received_inbox_only_roundtrip_without_user_credentials -- --nocapture
      - name: Verify explicit synthetic n0 Internet file to reopened Inbox
        shell: bash
        run: |
          # Only disposable keys/synthetic payload; no user data or peer pins.
          # This is an external-discovery smoke, not proof of two real networks.
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-one-file-lan-beta --bin akula-p2p-one-file-beta actual_n0_identity_only_quic_one_file_to_cold_inbox -- --ignored --nocapture
      - name: Compile actual Native receiving feature
        shell: bash
        run: |
          # Exact feature graph of ordinary Windows installers and auto-updates.
          # Standard signed Windows installer/auto-update feature graph.
          cargo check --manifest-path aquilum-app/Cargo.toml --locked -p aquilum-native --features installed
          cargo test --manifest-path aquilum-app/Cargo.toml --locked -p aquilum-native --features installed app::transfer::native_receive::tests -- --nocapture
          cargo test --manifest-path aquilum-app/Cargo.toml --locked -p aquilum-native --features p2p-native-receive-beta app::transfer::native_receive::tests -- --nocapture
          cargo test --manifest-path aquilum-app/Cargo.toml --locked -p aquilum-native --features p2p-native-receive-beta ui::transfer::native_receive_view::tests -- --nocapture
          cargo test --manifest-path aquilum-app/Cargo.toml --locked -p aquilum-native --features p2p-native-receive-beta ui::transfer::native_send_view::tests -- --nocapture
          cargo test --manifest-path aquilum-app/Cargo.toml --locked -p aquilum-native --features p2p-native-receive-beta app::transfer::peer_pair::tests -- --nocapture
          cargo test --manifest-path aquilum-app/Cargo.toml --locked -p aquilum-native --features p2p-native-receive-beta ui::transfer::peer_pair::tests -- --nocapture
          cargo test --manifest-path aquilum-app/Cargo.toml --locked -p aquilum-native --features p2p-native-receive-beta app::transfer::local_identity::tests -- --nocapture
