name: Native Vello fragmented route falsifier

on:
  pull_request:
    paths:
      - '.github/workflows/native-vello-fragmented-route.yml'
      - '.github/scripts/summarize-vello-fragmented-route.py'
      - 'aquilum-app/native/src/render/paint/mod.rs'
      - 'aquilum-app/native/src/render/renderer/**'
      - 'aquilum-app/native/src/app/tests/perf/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vello-fragmented-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fragmented:
    name: Eight-strip 0/2/per-rect/frame-budget parity and timings
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-fragmented-route-v1
          cache-workspace-crates: true
      - name: Install native Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Record runner CPU and toolchain
        shell: bash
        run: |
          {
            git rev-parse HEAD
            grep -m1 'model name' /proc/cpuinfo || true
            grep -m1 'flags' /proc/cpuinfo || true
            rustc --version
          } | tee vello-fragmented-env.txt
      - name: Repeat full-reference parity and fragmentation A/B in three fresh processes
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          for trial in 1 2 3; do
            cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_fragmented_route -- --ignored --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/vello-fragmented-trial-$trial.log"
          done
      - name: Require 576 rows across four fragmentation levels and three trials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/summarize-vello-fragmented-route.py
          python3 .github/scripts/summarize-vello-fragmented-route.py vello-fragmented-trial-1.log vello-fragmented-trial-2.log vello-fragmented-trial-3.log --output vello-fragmented-route-summary.md
          cat vello-fragmented-route-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vello-fragmented-route-${{ github.sha }}
          path: |
            vello-fragmented-env.txt
            vello-fragmented-trial-*.log
            vello-fragmented-route-summary.md
          if-no-files-found: warn
          retention-days: 14
