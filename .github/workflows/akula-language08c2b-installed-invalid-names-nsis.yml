          with sqlite3.connect(sys.argv[1]) as db:
              db.execute("CREATE TABLE text_annotation_state(id INTEGER PRIMARY KEY,revision INTEGER NOT NULL,payload BLOB NOT NULL)")
              db.execute("INSERT INTO text_annotation_state VALUES(1,0,?)",(b'{"records":[]}',))
          '@
          $change=@'
          import json
          import sqlite3
          import sys
          record={"anchor":{"annotation_id":"fixture-id","selected_digest":[171]*32},
                  "status":sys.argv[2],"color":"yellow"}
          with sqlite3.connect(sys.argv[1]) as db:
              db.execute("UPDATE text_annotation_state SET revision=?,payload=? WHERE id=1",
                         (int(sys.argv[3]),json.dumps({"records":[record]}).encode()))
          '@
          try {
            $null=($setup | & python - $fixture)
            if($LASTEXITCODE -ne 0){throw 'LANG-08b cold SQLite fixture failed'}
            $empty=Get-AnnotationSnapshot -Path $fixture
            if($empty.record_count -ne 0 -or $empty.revision -ne 0){
              throw 'LANG-08b incorrect cold SQLite snapshot'
            }
            $null=($change | & python - $fixture 'needs_rebind' 1)
            if($LASTEXITCODE -ne 0){throw 'LANG-08b HOLD fixture failed'}
            $held=Get-AnnotationSnapshot -Path $fixture
            if($held.record_count -ne 1 -or $held.status -cne 'needs_rebind' -or $held.revision -ne 1){
              throw 'LANG-08b incorrect HOLD SQLite status'
            }
            $null=($change | & python - $fixture 'current' 2)
            if($LASTEXITCODE -ne 0){throw 'LANG-08b Current fixture failed'}
            $current=Get-AnnotationSnapshot -Path $fixture
            if($current.status -cne 'current' -or $current.revision -ne 2 -or
               $current.annotation_id -cne $held.annotation_id -or
               $current.selected_digest -cne $held.selected_digest){
              throw 'LANG-08b cannot read verified HOLD-to-Current transition'
            }
          } finally {
            Remove-Item -LiteralPath $fixture -Force -ErrorAction SilentlyContinue
