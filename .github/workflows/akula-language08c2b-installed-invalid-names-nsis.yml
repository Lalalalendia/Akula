            $namedFromWitness=Require-StudySnapshot -Path $db -Count 1 -Name 'LANG08C-Biology'
            $b=Read-StudyStateHash -Path $db
            if($named.count -ne 1 -or $namedFromWitness.id -cne 'c1' -or $named.revision -ne 1 -or
               $named.name -cne 'LANG08C-Biology' -or $named.id -cne 'c1' -or
               $named.members -ne 1 -or $named.table_count -ne 1 -or
               $named.anchor_count -ne 1 -or $b -notmatch '^1:[a-f0-9]{64}$' -or $a -ceq $b){
              throw 'LANG-08c SQLite named-collection parser contract failed'
            }
            # Exercise the actual Python/SQLite IMMEDIATE CAS helper before
            # expensive NSIS compilation, on isolated CI fixture bytes.
            $winner=Synthetic-AdvanceStudyName -Path $db -ExpectedRevision 1 -ExpectedName 'LANG08C-Biology' -NextName 'LANG08C-Concurrent'
            $current=Require-StudySnapshot -Path $db -Count 1 -Name 'LANG08C-Concurrent'
            if($current.revision -ne 2 -or $current.id -cne $named.id -or
               $current.members -ne $named.members -or
               $current.table_count -ne $named.table_count -or
               $current.anchor_count -ne $named.anchor_count -or
               (Read-StudyStateHash -Path $db) -cne $winner){
              throw 'LANG-08c2b6 competing SQLite CAS helper contract failed'
            }
            Write-Host 'AKULA_LANG08C2B6_SQLITE_WRITER_CONTRACT_PASS revision_cas=1 mappings_unchanged=1'
          } finally {
            Remove-Item -LiteralPath $fixtureDir -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'AKULA_LANG08C_SQLITE_CONTRACT_PASS empty=1 named=1 revision=1 preserved_anchors=1'


