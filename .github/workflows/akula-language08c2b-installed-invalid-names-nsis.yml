# Consolidated LANG-08 installed QA: one same-run unsigned candidate, independent original witnesses.
# Preserve all five contracts, trigger paths and GUI journeys; no release or user-vault access.
name: Akula LANG-08 installed Windows NSIS UIA (non-release)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/windows-lang08-installed-annotations.ps1'
      - '.github/workflows/akula-language08-installed-annotations-nsis.yml'
      - 'scripts/windows-lang08b-installed-backup.ps1'
      - '.github/workflows/akula-language08b-installed-backup-nsis.yml'
      - 'scripts/windows-lang08c-installed-collections.ps1'
      - '.github/workflows/akula-language08c-installed-collections-nsis.yml'
      - 'scripts/windows-lang08c2-installed-negative-names.ps1'
      - '.github/workflows/akula-language08c2-installed-negative-names-nsis.yml'
      - 'scripts/windows-lang08c2b-installed-invalid-names.ps1'
      - '.github/workflows/akula-language08c2b-installed-invalid-names-nsis.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: Select exact LANG-08 changed scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      a: ${{ steps.route.outputs.a }}
      b: ${{ steps.route.outputs.b }}
      c: ${{ steps.route.outputs.c }}
      c2: ${{ steps.route.outputs.c2 }}
      c2b: ${{ steps.route.outputs.c2b }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify routing and select by exact PR diff
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const scripts = {"a":"scripts/windows-lang08-installed-annotations.ps1","b":"scripts/windows-lang08b-installed-backup.ps1","c":"scripts/windows-lang08c-installed-collections.ps1","c2":"scripts/windows-lang08c2-installed-negative-names.ps1","c2b":"scripts/windows-lang08c2b-installed-invalid-names.ps1"};
          const workflows = [".github/workflows/akula-language08-installed-annotations-nsis.yml",".github/workflows/akula-language08b-installed-backup-nsis.yml",".github/workflows/akula-language08c-installed-collections-nsis.yml",".github/workflows/akula-language08c2-installed-negative-names-nsis.yml",".github/workflows/akula-language08c2b-installed-invalid-names-nsis.yml"];
          function select(paths) {
            const all = paths.some(p => workflows.includes(p));
            return Object.fromEntries(Object.entries(scripts).map(([id, path]) => [id, all || paths.includes(path)]));
          }
          for (const [id, path] of Object.entries(scripts)) {
            const selected = select([path]);
            assert.equal(selected[id], true);
            assert.equal(Object.values(selected).filter(Boolean).length, 1);
          }
          for (const path of workflows) assert.ok(Object.values(select([path])).every(Boolean));
          assert.ok(Object.values(select(Object.values(scripts))).every(Boolean));
          assert.ok(Object.values(select(['README.md'])).every(v => !v));
          const { BASE_SHA, HEAD_SHA, GITHUB_OUTPUT } = process.env;
          assert.match(BASE_SHA, /^[a-f0-9]{40}$/);
          assert.match(HEAD_SHA, /^[a-f0-9]{40}$/);
          assert.equal(cp.execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim(), HEAD_SHA);
          const paths = cp.execFileSync('git',['diff','--no-renames','--name-only','-z',BASE_SHA+'...'+HEAD_SHA],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean);
          const selected = select(paths);
          assert.ok(Object.values(selected).some(Boolean), 'LANG-08 workflow triggered without a recognized scenario');
          for (const [id, run] of Object.entries(selected)) fs.appendFileSync(GITHUB_OUTPUT, id+'='+run+'\n');
          console.log('LANG-08 exact diff scenario selection:', JSON.stringify(selected));
          NODE


  contract-a:
    name: LANG-08a fail closed before NSIS build - inspect installed witness script
    needs: route
    if: ${{ needs.route.outputs.a == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify script syntax and non-release boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path=Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-lang08-installed-annotations.ps1'
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){throw ('LANG-08 PowerShell parse errors: '+($errors|Out-String))}
          $source=[IO.File]::ReadAllText($path)
          foreach($needle in @('RUNNER_ENVIRONMENT','github-hosted','GetForegroundWindow','GetWindowThreadProcessId',
             'SendInput','compiled_executable_sha256','SQLite format 3','backupExport','backupImport',
             'rebind','AKULA_LANG08_INSTALLED_UNINSTALL_PASS')){
            if(!$source.Contains($needle)){throw "Missing LANG-08 acceptance invariant $needle"}
          }
          $cfg=[IO.File]::ReadAllText('aquilum-app/native/packaging/akula-windows.json')|ConvertFrom-Json
          if($cfg.productName -cne 'Akula' -or @($cfg.binaries).Count -ne 2){
            throw 'LANG-08 must reuse current two-binary release configuration without modifying it'
          }
          # Run the real SQLite revision reader on an ephemeral SQLite fixture
          # under Windows PowerShell 5.1 before the expensive NSIS build.
          $reader=@($ast.FindAll({
            param($node)
            ($node -is [System.Management.Automation.Language.FunctionDefinitionAst]) -and
            ($node.Name -eq 'Read-AnnotationState')
          },$true))
          if($reader.Count -ne 1){throw 'LANG-08 expected exactly one SQLite reader'}
          Invoke-Expression $reader[0].Extent.Text
          $tempDb=Join-Path $env:RUNNER_TEMP ('lang08-sqlite-fixture-'+[Guid]::NewGuid().ToString('N')+'.sqlite')
          $create=@'
          import sqlite3
          import sys
          db=sqlite3.connect(sys.argv[1])
          db.execute("CREATE TABLE text_annotation_state (id INTEGER PRIMARY KEY,revision INTEGER NOT NULL,payload BLOB NOT NULL)")
          db.execute("INSERT INTO text_annotation_state (id,revision,payload) VALUES(1,7,?)",(b"fixture",))
          db.commit()
          db.close()
          '@
          $update=@'
          import sqlite3
          import sys
          db=sqlite3.connect(sys.argv[1])
          db.execute("UPDATE text_annotation_state SET revision=8,payload=? WHERE id=1",(b"updated",))
          db.commit()
          db.close()
          '@
          try {
            $null=($create | & python - $tempDb)
            if($LASTEXITCODE -ne 0){throw 'LANG-08 SQLite fixture creation failed'}
            $before=Read-AnnotationState -Path $tempDb
            if($before -notmatch '^7:[a-f0-9]{64}$'){
              throw 'LANG-08 SQLite reader failed on revision 7'
            }
            $null=($update | & python - $tempDb)
            if($LASTEXITCODE -ne 0){throw 'LANG-08 SQLite fixture update failed'}
            $after=Read-AnnotationState -Path $tempDb
            if($after -notmatch '^8:[a-f0-9]{64}$' -or $after -ceq $before){
              throw 'LANG-08 SQLite reader cannot detect a revision change'
            }
          } finally {
            Remove-Item -LiteralPath $tempDb -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'AKULA_LANG08_SQLITE_HELPER_CONTRACT_PASS python_stdin=1 revision_change=1'
          Write-Host 'AKULA_LANG08_NONRELEASE_CONTRACT_PASS syntax=1 installer_unmodified=1 real_os_ui=1'


