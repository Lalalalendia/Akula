name: Akula VIDEO-20 optional yt-dlp Settings Windows release path (NONRELEASE)
on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/native/src/video/optional_ytdlp.rs'
      - 'aquilum-app/native/src/video/optional_quickjs.rs'
      - 'aquilum-app/native/src/video/optional_tool_verify.rs'
      - 'aquilum-app/native/src/video/optional_ytdlp_tests.rs'
      - 'aquilum-app/native/src/video/optional_quickjs_tests.rs'
      - 'aquilum-app/native/src/video/download_video21_tests.rs'
      - 'scripts/windows-video20-settings-uia.ps1'
      - '.github/workflows/akula-video20-user-optin-windows.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-boundary:
    name: Akula-only NSIS and exact pinned official yt-dlp (HOLD)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enforce opt-in only, no third-party EXEs in stock installer
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("aquilum-app/native/packaging/akula-windows.json")
          a=json.loads(p.read_text(encoding="utf-8"))
          assert [x["path"] for x in a["binaries"]] == ["akula-app","shiva-pdf-preview"]
          assert "yt-dlp" not in p.read_text() and "quickjs" not in p.read_text()
          source=Path("aquilum-app/native/src/video/optional_ytdlp.rs").read_text()
          assert 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe' in source
          assert 'f5389d3698ecde4ef06f4e6b1ce0294fe9ac1396228c8990b8d3416d6d177a7d' in source
          assert "23_575_744" in source and ".create_new(true)" in source
          assert "fs::hard_link" in source and "SHA256" in source
          settings=Path("aquilum-app/native/src/app/settings/press.rs").read_text()
          assert "Action::InstallYtDlp" in settings and "MessageButtons::YesNo" in settings
          assert "Action::RemoveYtDlp" in settings
          queue=Path("aquilum-app/native/src/video/queue.rs").read_text()
          assert "optional_ytdlp::verified_executable" in queue
          assert "queue_dispatch::download_one" in queue
          dispatcher=Path("aquilum-app/native/src/video/queue_dispatch.rs").read_text()
          assert 'super::download::download_one_with_js(library, executable, runtime, url, on_progress)' in dispatcher
          assert 'quickjs.ok_or(' in dispatcher
          quickjs=Path("aquilum-app/native/src/video/optional_quickjs.rs").read_text()
          assert 'https://github.com/quickjs-ng/quickjs/releases/download/v0.18.0/qjs-windows-x86_64.exe' in quickjs
          assert 'ff03398d74ea6e6bd3a8e58058f7003225abcac229d7d57775b7aaae812a49c7' in quickjs
          assert '1_873_152' in quickjs and 'fs::hard_link' in quickjs
          assert '.create_new(true)' in quickjs and 'check_ancestors' in quickjs
          assert 'quickjs::verified_executable' in queue
          assert queue.index('quickjs::verified_executable') < queue.index('Library::new(')
          installed=Path("aquilum-app/native/src/video/download.rs").read_text()
          assert '--no-js-runtimes' in installed and '--js-runtimes' in installed
          assert 'command_args_with_js' in installed and '--no-remote-components' in installed
          assert 'download_one_with_js' in installed
          assert 'super::light::download_one_or_legacy(library, executable, url, on_progress)' in dispatcher
          assert 'not(feature = "video-ui-e2e")' in dispatcher
          assert 'VIDEO_TOOLS_01K_HOLD' in Path("aquilum-app/native/src/video/light.rs").read_text()
          assert queue.index("optional_ytdlp::verified_executable") < queue.index("std::env::var_os")
          assert 'cfg(all(windows, feature = "installed", not(feature = "video-ui-e2e")))' in queue
          ru=json.loads(Path("aquilum-app/native/assets/locales/ru.json").read_text())
          en=json.loads(Path("aquilum-app/native/assets/locales/en.json").read_text())
          for locale in [ru,en]:
              for key in ["ytdlpTitle","ytdlpDownload","ytdlpRemove","ytdlpConfirmText","ytdlpInvalid","quickjsDownload","quickjsRemove","quickjsConfirmText","quickjsInvalid"]:
                  assert locale["settings"]["system"].get(key)
          gui=Path("scripts/windows-video20-settings-uia.ps1").read_text()
          assert gui.isascii(), "Windows PowerShell 5.1 parses BOM-less .ps1 as ANSI"
          for evidence in ("VIDEO20_SETTINGS_CANCEL_UIA_PASS",
                           "VIDEO20_SETTINGS_INSTALL_UIA_PASS",
                           "VIDEO20_SETTINGS_REMOVE_UIA_PASS",
                           "AkulaVideo20Mouse", "SendInput(1, down", "Wait-Dialog"):
              assert evidence in gui, evidence
          assert "EXPECTED_HEAD_SHA" in gui
          assert "GITHUB_EVENT_NAME -cne 'pull_request'" in gui
          print("VIDEO20_STOCK_NSIS_TWO_BINARIES_PASS bundled_yt_dlp=0 explicit_optin=1")
          print("VIDEO20_REAL_WINDOWS_GUI_SOURCE_PASS separate_workflow=0")
          PY
  windows-installed:
    name: Compile installed Windows + validate user opt-in downloader (HOLD)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: video20-user-optin-installed
          cache-on-failure: true
      - name: Build installed Windows and run offline opt-in tests
        working-directory: aquilum-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked -p aquilum-native --features installed --bin aquilum-native video::optional_ytdlp::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows optional yt-dlp tests failed' }
          cargo test --locked -p aquilum-native --features installed --bin aquilum-native video::optional_ytdlp::quickjs::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Installed QuickJS tests failed' }
          cargo test --locked -p aquilum-native --features installed --bin aquilum-native video::download::video21_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Installed yt-dlp QuickJS command tests failed' }
          cargo test --locked -p aquilum-native --features installed --bin aquilum-native video::queue::installed_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows queue fail-closed test failed' }
          cargo test --locked -p aquilum-native --features installed --bin aquilum-native ui::settings::schema::tests -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows Settings schema tests failed' }
      - name: User-opt-in-only real official executable download, verify, remove
        working-directory: aquilum-app
        env:
          AKULA_VIDEO20_RUN_LAB: '1'
          RUNNER_ENVIRONMENT: github-hosted
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked -p aquilum-native --features installed --bin aquilum-native video::optional_ytdlp::tests::user_optin_real_download_remove_ci_only -- --exact --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Real signed-pin user-initiated download/remove laboratory test failed' }
          Write-Host 'VIDEO20_OPTIN_OFFICIAL_DOWNLOAD_REMOVE_PASS release=0'
      - name: User-consented real official QuickJS-NG download, verify, remove (NONRELEASE)
        working-directory: aquilum-app
        env:
          AKULA_VIDEO21_RUN_LAB: '1'
          RUNNER_ENVIRONMENT: github-hosted
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked -p aquilum-native --features installed --bin aquilum-native video::optional_ytdlp::quickjs::tests::user_optin_real_quickjs_download_remove_ci_only -- --exact --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Real QuickJS user-opt-in upstream fetch verification failed' }
          Write-Host 'VIDEO21_OPTIN_PINNED_QUICKJS_DOWNLOAD_REMOVE_PASS release=0'
      - name: Build stock installed GUI from same exact HEAD, no bundle
        working-directory: aquilum-app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked -p aquilum-native --features installed
          if ($LASTEXITCODE -ne 0) { throw 'VIDEO20 installed GUI binary compilation failed' }
          $compiled=Join-Path $env:GITHUB_WORKSPACE '.artifacts/cargo-native/debug/aquilum-native.exe'
          if (!(Test-Path -LiteralPath $compiled -PathType Leaf)) { throw 'VIDEO20 compiled GUI missing' }
          $targetDir=Join-Path $env:LOCALAPPDATA 'Akula'
          if (Test-Path -LiteralPath $targetDir) { throw 'VIDEO20 requires clean installed-style GUI runner' }
          New-Item -ItemType Directory -Path $targetDir | Out-Null
          $target=Join-Path $targetDir 'akula-app.exe'
          Copy-Item -LiteralPath $compiled -Destination $target
          if ((Get-FileHash -LiteralPath $target).Hash -cne (Get-FileHash -LiteralPath $compiled).Hash) {
            throw 'VIDEO20 staged Akula does not match built installed executable'
          }
          Write-Host 'VIDEO20_INSTALLED_GUI_STAGE_PASS binaries=1 bundled_yt_dlp=0'
      - name: Real Windows Settings consent, official fetch and removal via UIA
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: github-hosted
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-video20-settings-uia.ps1'
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ('VIDEO20 GUI syntax error: ' + ($errors | Out-String)) }
          $powershell=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $exe=Join-Path $env:LOCALAPPDATA 'Akula/akula-app.exe'
          $vault=Join-Path $env:RUNNER_TEMP 'video20-real-ui-vault'
          $data=Join-Path $env:RUNNER_TEMP 'video20-real-ui-data'
          & $powershell -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File $script -ExePath $exe -VaultPath $vault -DataDir $data
          if ($LASTEXITCODE -ne 0) { throw 'VIDEO20 real Windows Settings GUI acceptance failed' }
          Write-Host 'VIDEO20_REAL_SETTINGS_UIA_PASS no_youtube=1 release=0'
