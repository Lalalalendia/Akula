name: Hint-stable glyph scroll regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/native/vendor/glifo/src/glyph.rs'
      - 'aquilum-app/native/vendor/glifo/src/util.rs'
      - 'aquilum-app/native/vendor/glifo/src/renderer.rs'
      - 'aquilum-app/native/vendor/glifo/src/atlas/key.rs'
      - '.github/workflows/glifo-hinted-scroll-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glifo-hint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Hinted baseline translation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: glifo-hinted-scroll-regression
          cache-workspace-crates: true
      - name: Install Linux desktop test build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Check stable hinted glyph baselines at integer viewport origins
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p glifo --lib hinted_vertical_snap -- --nocapture
      - name: Check atlas X coordinate split invariant under integer crop
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p glifo --lib glyph_pixel_split -- --nocapture
      - name: Check subpixel cache key never wraps at f32 1.0
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p glifo --lib test_quantize_subpixel -- --nocapture
      - name: Compare real fractional-scroll pixels to a fresh full-frame reference
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-native --bin aquilum-native hinted_fractional_scroll_remains_pixel_stable -- --nocapture --test-threads=1
