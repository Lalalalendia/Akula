name: DICOM isolated Rust comparative lab
on:
  push:
    branches:
      - 'lab/dicom-rust-compare-20261026'
    paths:
      - 'scripts/dicom-lab/**'
      - '.github/workflows/dicom-isolated-lab.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: dicom-rust-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture generator requirement
        run: python -m pip install 'Pillow==11.3.0' 'pydicom==3.0.1' 'numpy==2.2.6'
      - name: Generate synthetic DICOM and verify file hashes
        run: |
          set -euo pipefail
          python scripts/dicom-lab/generate.py
          python scripts/dicom-lab/verify.py
      - name: Independently verify raw lossless pixels using pydicom
        continue-on-error: true
        run: python scripts/dicom-lab/reference_check.py
      - name: Fetch pinned DCMfx Rust workspace (separate from Akula)
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v0.52.1 https://github.com/dcmfx/dcmfx.git scripts/dicom-lab/_upstream/dcmfx
          sha=$(git -C scripts/dicom-lab/_upstream/dcmfx rev-parse HEAD)
          test "$sha" = '74246499134f85003ec6e50286377ddc55565d0c'
          echo "DCMFX_PIN_OK $sha"
      - name: Fetch pinned DICOM-rs RLE fix (source code, not a released crate)
        shell: bash
        run: |
          set -euo pipefail
          git init -q scripts/dicom-lab/_upstream/dicom-rs
          git -C scripts/dicom-lab/_upstream/dicom-rs remote add origin https://github.com/Enet4/dicom-rs.git
          git -C scripts/dicom-lab/_upstream/dicom-rs fetch -q --depth 1 origin bcc6907c62a99a0a53523b5e80a22002ad12a63d
          git -C scripts/dicom-lab/_upstream/dicom-rs checkout -q --detach FETCH_HEAD
          sha=$(git -C scripts/dicom-lab/_upstream/dicom-rs rev-parse HEAD)
          test "$sha" = 'bcc6907c62a99a0a53523b5e80a22002ad12a63d'
          echo "DICOM_RS_RLE_FIX_PIN_OK $sha"
      - name: Compile all three probes and retain each error
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p scripts/dicom-lab/results
          : > scripts/dicom-lab/results/build-exits.txt
          for name in dicom-rs dcmfx toolkit; do
            if (cd "scripts/dicom-lab/$name" && cargo build --release) > "scripts/dicom-lab/results/build-$name.log" 2>&1; then
              code=0
            else
              code=$?
            fi
            echo "$name:$code" | tee -a scripts/dicom-lab/results/build-exits.txt
            tail -n 24 "scripts/dicom-lab/results/build-$name.log"
          done
      - name: Attempt decoding identical cases with every compiled probe
        run: python scripts/dicom-lab/compare.py
      - name: Summarize results and limitations
        if: always()
        shell: bash
        run: |
          echo '## DICOM research-only comparison (not clinical qualification)' >> "$GITHUB_STEP_SUMMARY"
          echo 'The fixtures are synthetic. DECODED does NOT prove pixel accuracy.' >> "$GITHUB_STEP_SUMMARY"
          cat scripts/dicom-lab/results/build-exits.txt >> "$GITHUB_STEP_SUMMARY" || true
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, pathlib, collections
          p=pathlib.Path('scripts/dicom-lab/results/results.csv')
          if p.exists():
              rows=list(csv.DictReader(p.open()))
              for name in ['dicom-rs','dcmfx','toolkit']:
                  print(name, dict(collections.Counter(x['status'] for x in rows if x['library']==name)))
          else:
              print('NO_PROBE_RESULTS')
          PY
      - name: Archive reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dicom-rust-compare-${{ github.run_id }}
          path: |
            scripts/dicom-lab/results/*.csv
            scripts/dicom-lab/results/*.txt
            scripts/dicom-lab/results/*.log
            scripts/dicom-lab/manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce independent compilation evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/dicom-lab/results/build-exits.txt')
          pairs=dict(x.split(':',1) for x in p.read_text().splitlines())
          expected={'dicom-rs','dcmfx','toolkit'}
          assert set(pairs)==expected, f'missing adapters: {expected-set(pairs)}'
          assert all(pairs[x]=='0' for x in expected), f'compilation failed: {pairs}'
          assert Path('scripts/dicom-lab/results/results.csv').exists(), 'results missing'
          from collections import Counter
          import csv
          pixel_rows=list(csv.DictReader(Path('scripts/dicom-lab/results/results.csv').open()))
          assert len(pixel_rows)==30, f'expected 30 Rust decode results, got {len(pixel_rows)}'
          for name in ('dicom-rs','dcmfx','toolkit'):
              counts=Counter(row['status'] for row in pixel_rows if row['library']==name)
              assert counts=={'PIXEL_MATCH': 8,'LOSSY_DECODE_ONLY': 1,'EXPECTED_REJECTION': 1}, f'{name}: {counts}'
          import csv
          ref=Path('scripts/dicom-lab/results/reference.csv')
          assert ref.exists(), 'pydicom reference results missing'
          statuses=[row['status'] for row in csv.DictReader(ref.open())]
          assert len(statuses)==10, f'expected 10 reference rows, got {len(statuses)}'
          assert all(x in ('RAW_HASH_MATCH','LOSSY_DECODE_ONLY','EXPECTED_REJECTION') for x in statuses), f'pydicom reference failed: {statuses}'
          PY
