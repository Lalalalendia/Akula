name: Notion API read-only lab
on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/core/src/notion_api_probe.rs'
      - 'aquilum-app/core/src/notion_api_probe/**'
      - 'aquilum-app/core/src/lib.rs'
      - 'aquilum-app/core/Cargo.toml'
      - '.github/workflows/notion-api-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test API protocol
        working-directory: aquilum-app
        run: cargo test -p aquilum-core --locked --features notion-api-probe notion_api_probe -- --nocapture
