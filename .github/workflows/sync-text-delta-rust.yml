name: SYNC-TEXT-DELTA-03 bounded Rust codec (opt-in, no S3)

on:
  workflow_call:
    inputs:
      codec_already_tested:
        required: false
        type: boolean
        default: false
  # PR path owners are enforced in required central route.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # New PR revisions supersede old ones; explicit manual runs remain independent.
  group: delta-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  isolated-codec:
    name: Pure Rust Zstd/full/splice/dictionary and hostile inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: SwatinEm/rust-cache@v2
        with:
          workspaces: aquilum-app
          key: sync-text-delta03
      - name: Verify plain default Core has no codec dependency at runtime
        working-directory: aquilum-app
        run: cargo check --locked -p aquilum-core --no-default-features
      - name: Verify 3 codec modes, independent siblings and adversarial bounds
        # Required Rust tests has already run the entire standalone suite on
        # module changes. Keep S3 legacy refusal and default-Core checks here.
        if: ${{ !inputs.codec_already_tested }}
        working-directory: aquilum-app
        run: cargo test --manifest-path ../modules/text-delta-codec/Cargo.toml codec::tests -- --nocapture
      - name: Measure Rust modes on genuine successive Git revisions
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: cargo test --manifest-path modules/text-delta-codec/Cargo.toml real_git_markdown_pairs_numeric_ab -- --ignored --nocapture
      - name: Verify legacy S3 V2 parser explicitly rejects new delta envelope
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-s3,sync-text-delta new_text_delta_is_not_a_legacy_pack -- --nocapture

      - name: Test A/B accountancy without a Rust build
        run: python3 scripts/benchmarks/sync-text-delta-rust-profile.py --self-test-only
      - name: Measure Rust Full, Splice, Raw Dictionary, and selected policy
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python3 scripts/benchmarks/sync-text-delta-rust-profile.py \
            --repo . --output results/text-delta-04 --repetitions 7
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p = Path('results/text-delta-04')
          rows = list(csv.DictReader((p/'real-git-pairs.csv').open()))
          summary = list(csv.DictReader((p/'mode-summary.csv').open()))
          assert 9 <= len(rows) <= 20, len(rows)
          assert len({r['public_path'] for r in rows}) >= 3
          assert {r['mode'] for r in summary} == {
              'full', 'splice', 'dictionary', 'selected'}
          assert all(r['claim'] == 'isolated-real-git-versions-not-production-sync'
                     for r in rows + summary)
          assert all(int(r['selected_wire_bytes']) <= int(r['full_wire_bytes'])
                     for r in rows)
          assert all(int(r['mandatory_v1_plus_selected_sidecar_bytes']) ==
                     int(r['target_raw_bytes']) + int(r['selected_wire_bytes'])
                     for r in rows)
          assert all(int(r['rust_test_process_peak_rss_kib']) > 0
                     and float(r['process_cpu_s_including_git_io_dispatch_not_git_children']) > 0
                     for r in summary)
          PY
      - name: Retain only numeric and public-Git benchmark evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: akula-text-delta-04-rust-real-git-profile
          path: results/text-delta-04/
          retention-days: 14
          if-no-files-found: error
