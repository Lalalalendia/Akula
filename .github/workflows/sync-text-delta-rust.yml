name: SYNC-TEXT-DELTA-03 bounded Rust codec (opt-in, no S3)

on:
  pull_request:
    paths:
      - 'aquilum-app/core/Cargo.toml'
      - 'aquilum-app/Cargo.lock'
      - 'aquilum-app/core/src/sync/text_delta_codec.rs'
      - 'aquilum-app/core/src/sync/mod.rs'
      - 'aquilum-app/core/src/sync/s3_transport/pack_probe.rs'
      - '.github/workflows/sync-text-delta-rust.yml'
      - 'docs/sync/text-delta-03-rust-codec.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # New PR revisions supersede old ones; explicit manual runs remain independent.
  group: akula-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  isolated-codec:
    name: Pure Rust Zstd/full/splice/dictionary and hostile inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: SwatinEm/rust-cache@v2
        with:
          workspaces: aquilum-app
          key: sync-text-delta03
      - name: Verify plain default Core has no codec dependency at runtime
        working-directory: aquilum-app
        run: cargo check --locked -p aquilum-core --no-default-features
      - name: Verify 3 codec modes, independent siblings and adversarial bounds
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --no-default-features --features sync-text-delta text_delta_codec::tests -- --nocapture
      - name: Measure Rust modes on genuine successive Git revisions
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --no-default-features --features sync-text-delta real_git_markdown_pairs_numeric_ab -- --ignored --nocapture
      - name: Verify legacy S3 V2 parser explicitly rejects new delta envelope
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-s3,sync-text-delta new_text_delta_is_not_a_legacy_pack -- --nocapture
