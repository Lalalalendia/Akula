name: Native note latency matrix

on:
  pull_request:
    paths:
      - 'aquilum-app/native/src/app/tests/perf/note_latency.rs'
      - 'aquilum-app/native/src/app/tests/perf/mod.rs'
      - 'aquilum-app/native/src/ui/note/page.rs'
      - 'aquilum-app/native/src/ui/editor/document/mod.rs'
      - 'aquilum-app/native/src/ui/editor/mod.rs'
      - 'aquilum-app/native/src/app/note_page/mod.rs'
      - 'aquilum-app/native/src/ui/widgets/layout/slot.rs'
      - '.github/workflows/native-note-latency.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-note-latency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Note UI latency (diagnostic, non-gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore shared main Rust cache (read-only)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Install native Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Run opt-in note-size and tab-churn matrix
        working-directory: aquilum-app
        shell: bash
        env:
          AQ_LATENCY_SWITCHES: '16'
        run: |
          set -euo pipefail
          cargo test -p aquilum-native --bin aquilum-native --locked native_note_latency_matrix \
            -- --ignored --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/note-latency.log"
          if [ "$(grep -c '^.*NOTE_LATENCY kib=' "$GITHUB_WORKSPACE/note-latency.log")" -ne 3 ] || \
             [ "$(grep -c '^.*TAB_STAGE kib=' "$GITHUB_WORKSPACE/note-latency.log")" -ne 3 ] || \
             [ "$(grep -c '^.*EDITOR_PAGE kib=' "$GITHUB_WORKSPACE/note-latency.log")" -ne 3 ] || \
             [ "$(grep -c '^.*EDITOR_MOUNT kib=' "$GITHUB_WORKSPACE/note-latency.log")" -ne 3 ]; then
            echo "::error::Expected three complete tab and editor-page profiles"
            exit 1
          fi
      - name: Compare old and bounded highlight paragraph scans (opt-in diagnostic)
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p aquilum-native --bin aquilum-native --locked benchmark_editor_highlight_range_abba \
            -- --ignored --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/range-paint-ab.log"
          test "$(grep -c 'EDITOR_RANGE_AB lines=' "$GITHUB_WORKSPACE/range-paint-ab.log")" -eq 4
          {
            echo "### Editor highlight candidate scan (debug/test profile)"
            echo "Same-process A/B; no rendering or event-to-present claim."
            grep 'EDITOR_RANGE_AB lines=' "$GITHUB_WORKSPACE/range-paint-ab.log"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize comparable measurements
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          rows = []
          stages = {}
          editor = {}
          mount = {}
          for line in Path("note-latency.log").read_text().splitlines():
              if "NOTE_LATENCY kib=" in line:
                  pairs = line.split("NOTE_LATENCY ", 1)[1].split()
                  rows.append(dict(part.split("=", 1) for part in pairs if "=" in part))
              elif "TAB_STAGE kib=" in line:
                  pairs = line.split("TAB_STAGE ", 1)[1].split()
                  row = dict(part.split("=", 1) for part in pairs if "=" in part)
                  stages[row["kib"]] = row
              elif "EDITOR_PAGE kib=" in line:
                  pairs = line.split("EDITOR_PAGE ", 1)[1].split()
                  row = dict(part.split("=", 1) for part in pairs if "=" in part)
                  editor[row["kib"]] = row
              elif "EDITOR_MOUNT kib=" in line:
                  pairs = line.split("EDITOR_MOUNT ", 1)[1].split()
                  row = dict(part.split("=", 1) for part in pairs if "=" in part)
                  mount[row["kib"]] = row
          assert len(rows) == len(stages) == len(editor) == len(mount) == 3, (rows, stages, editor, mount)
          text = [
              "## Native note UI latency",
              "",
              "Ubuntu 24.04 GitHub runner, **debug/test profile**. Measurements are",
              "diagnostic: runner contention, caching and host differences affect absolute",
              "latency. No speedup claim or timing-based CI gate is made.",
              "",
              "| Note size | Cold open (ms) | Switch p50 / p95 (ms) | First scene (ms) | Scene p95 (ms) | Event dispatch p95 (ms) | External edit visible (ms) |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for r in rows:
              text.append(
                  f"| {r['kib']} KiB | {r['cold_open_ms']} | "
                  f"{r['switch_p50_ms']} / {r['switch_p95_ms']} | "
                  f"{r['first_scene_ms']} | {r['scene_p95_ms']} | "
                  f"{r['dispatch_p95_ms']} | {r['external_visible_ms']} |"
              )
          text.extend([
              "",
              "### UI-thread tab-switch stage p95 (ms)",
              "",
              "| Size | Leave/flush | File read + Rope | Page build | Tree | Tab total | Tab strip | Panel |",
              "|---|---:|---:|---:|---:|---:|---:|---:|",
          ])
          for r in rows:
              s = stages[r["kib"]]
              text.append(
                  f"| {r['kib']} KiB | {s['leave_p95_ms']} | "
                  f"{s['read_p95_ms']} | {s['page_p95_ms']} | {s['tree_p95_ms']} | "
                  f"{s['tab_p95_ms']} | {s['strip_p95_ms']} | {s['panel_p95_ms']} |"
              )
          text.extend([
              "",
              "### Editor page construction stage p95 (ms)",
              "",
              "| Size | Document rescan | Initial window | Constructor total | Markdown/setup | Page assembly total | Widget install |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ])
          for r in rows:
              e = editor[r["kib"]]
              text.append(
                  f"| {r['kib']} KiB | {e['rescan_p95_ms']} | {e['initial_window_p95_ms']} | "
                  f"{e['constructor_p95_ms']} | {e['markdown_p95_ms']} | "
                  f"{e['page_total_p95_ms']} | {e['install_p95_ms']} |"
              )
          text.extend([
              "",
              "### Widget replacement and framework overhead p95 (ms)",
              "",
              "| Size | New pod | Remove previous | Notify children change | RenderRoot/edit remainder | Save-error refresh and surrounding work |",
              "|---|---:|---:|---:|---:|---:|",
          ])
          for r in rows:
              m = mount[r["kib"]]
              text.append(
                  f"| {r['kib']} KiB | {m['slot_pod_p95_ms']} | "
                  f"{m['slot_remove_p95_ms']} | {m['slot_notify_p95_ms']} | "
                  f"{m['framework_p95_ms']} | {m['save_error_refresh_p95_ms']} |"
              )
          text.extend([
              "",
              "Stage p95 values are computed separately and must not be added to",
              "reconstruct one particular p95 switch. Version/history is in raw logs.",
              "",
              "Every case exercises 16 tab switches, 12 no-op watcher signals,",
              "one externally changed file and a stale-worker/tab-switch assertion.",
              "The cold-open and tab-switch timings include synchronous UI work;",
              "the external-change latency additionally includes background IO.",
              "",
          ])
          report = "\n".join(text)
          Path("note-latency-summary.md").write_text(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(report)
          print(report)
          PY
      - name: Upload raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-note-latency-${{ github.sha }}
          path: |
            note-latency.log
            range-paint-ab.log
            note-latency-summary.md
          if-no-files-found: warn
          retention-days: 21

  windows-code-search-smoke:
    name: Windows native editor code search and screenshots (diagnostic)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 604)
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-windows-memory-pilot-v1
          cache-workspace-crates: true
          save-if: false
      - name: Build normal installed-feature Windows Release
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked -p aquilum-native --features installed
          if ($LASTEXITCODE -ne 0) { throw 'Windows Release build failed' }
          if (!(Test-Path ../.artifacts/cargo-native/release/aquilum-native.exe)) { throw 'Native exe missing' }
      - name: Real Win32 foreground, horizontal wheel, search and screenshots
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Refuse OS input outside disposable GitHub-hosted Windows'
          }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class AkulaWin32 {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hwnd);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint x, uint y, int data, UIntPtr extra);
          }
          "@
          $vault = Join-Path $env:RUNNER_TEMP 'akula-perf604-synthetic-vault'
          $profile = Join-Path $env:RUNNER_TEMP 'akula-perf604-synthetic-profile'
          $out = Join-Path $env:GITHUB_WORKSPACE 'perf604-win32-smoke'
          New-Item -ItemType Directory -Force -Path $vault,$profile,$out | Out-Null
          $note = Join-Path $vault 'Highlight-Code-Synthetic.md'
          if (Test-Path -LiteralPath $note) { throw 'Refuse existing synthetic fixture' }
          $doc = [System.Text.StringBuilder]::new()
          [void]$doc.AppendLine('# Windows code search diagnostic')
          [void]$doc.AppendLine('~~~rust')
          [void]$doc.AppendLine(('let needle_marker = "hello"; ' * 90))
          [void]$doc.AppendLine('~~~')
          for ($i=0; $i -lt 30000; $i++) {
            [void]$doc.AppendLine("Paragraph $i : UTF-8 Привет 中文 and regular Markdown.")
          }
          [System.IO.File]::WriteAllText($note, $doc.ToString(), [System.Text.UTF8Encoding]::new($false))
          $beforeHash = (Get-FileHash -LiteralPath $note -Algorithm SHA256).Hash
          $bin = (Resolve-Path .artifacts/cargo-native/release/aquilum-native.exe).Path
          $binaryHash = (Get-FileHash -LiteralPath $bin -Algorithm SHA256).Hash
          $args = @("--vault", "`"$vault`"", "--data-dir", "`"$profile`"", "--open", "`"$note`"", "--focus", "--size", "1000x650")
          $app = Start-Process -FilePath $bin -ArgumentList $args -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(55)
            $hwnd = [IntPtr]::Zero
            do {
              Start-Sleep -Milliseconds 350
              $app.Refresh()
              if ($app.HasExited) { throw "Akula exited before native HWND ($($app.ExitCode))" }
              $hwnd = $app.MainWindowHandle
            } while ($hwnd -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline)
            if ($hwnd -eq [IntPtr]::Zero) { throw 'No PID-owned native HWND' }
            $rect = [AkulaWin32+RECT]::new()
            if (![AkulaWin32]::GetWindowRect($hwnd, [ref]$rect)) { throw 'No native window bounds' }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ($width -lt 400 -or $height -lt 300) { throw 'Invalid native window size' }
            if (![AkulaWin32]::SetForegroundWindow($hwnd)) { throw 'Cannot focus native test window' }
            Start-Sleep -Milliseconds 600
            if ([AkulaWin32]::GetForegroundWindow() -ne $hwnd) { throw 'Wrong foreground process, refusing OS events' }
            function Capture([string]$name) {
              $img = [System.Drawing.Bitmap]::new($width,$height)
              $gfx = [System.Drawing.Graphics]::FromImage($img)
              try {
                $gfx.CopyFromScreen(
                  [System.Drawing.Point]::new($rect.Left,$rect.Top),
                  [System.Drawing.Point]::Empty,
                  [System.Drawing.Size]::new($width,$height))
                $img.Save((Join-Path $out $name), [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                $gfx.Dispose()
                $img.Dispose()
              }
            }
            Capture 'opened.png'
            $targetX = $rect.Left + [Math]::Min(310,[int]($width / 2))
            $targetY = $rect.Top + [Math]::Min(155,[int]($height / 3))
            if (![AkulaWin32]::SetCursorPos($targetX,$targetY)) { throw 'Cannot target code panel' }
            [AkulaWin32]::mouse_event(0x1000,0,0,-240,[UIntPtr]::Zero)
            Start-Sleep -Milliseconds 800
            Capture 'after-horizontal-wheel.png'
            if ([AkulaWin32]::GetForegroundWindow() -ne $hwnd) { throw 'Native window lost focus' }
            [System.Windows.Forms.SendKeys]::SendWait('^f')
            Start-Sleep -Milliseconds 350
            [System.Windows.Forms.SendKeys]::SendWait('needle')
            Start-Sleep -Milliseconds 850
            Capture 'after-search.png'
            $app.Refresh()
            if ($app.HasExited) { throw 'Akula exited during native search' }
            $afterHash = (Get-FileHash -LiteralPath $note -Algorithm SHA256).Hash
            if ($afterHash -ne $beforeHash) { throw 'Synthetic Markdown was modified' }
            $screens = @('opened.png','after-horizontal-wheel.png','after-search.png')
            $hashes = @($screens | ForEach-Object { (Get-FileHash -LiteralPath (Join-Path $out $_) -Algorithm SHA256).Hash })
            if ($hashes[0] -eq $hashes[2]) { throw 'No pixel change after native OS search interaction' }
            [ordered]@{
              repo_head = (git rev-parse HEAD).Trim()
              binary_sha256 = $binaryHash
              fixture_sha256 = $beforeHash
              pid = $app.Id
              hwnd = $hwnd.ToInt64()
              hwnd_width = $width
              hwnd_height = $height
              foreground_verified = $true
              os_horizontal_wheel_injected = $true
              os_find_keys_injected = $true
              screenshot_sha256 = $hashes
              pixel_change_does_not_prove_highlight_correctness = $true
              unpackaged_release_not_signed_installer = $true
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $out 'witness.json') -Encoding utf8
          } finally {
            $app.Refresh()
            if (!$app.HasExited) {
              [void]$app.CloseMainWindow()
              if (!$app.WaitForExit(20000)) { Stop-Process -Id $app.Id -Force }
            }
          }
          'Windows real-window code-scroll/search witness captured. Not installed NSIS, not J2 p95.' |
            Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
      - name: Save Win32 GUI screenshots and source witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf604-win32-code-search
          path: perf604-win32-smoke/
          if-no-files-found: warn
          retention-days: 14
