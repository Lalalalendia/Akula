name: DICOM ZIP lock resolution
on:
  push:
    branches:
      - 'feat/dicom-readonly-preview-20261026'
    paths:
      - '.github/workflows/dicom-zip-lock.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve new ZIP dependencies without compiling app
        run: |
          cargo metadata --manifest-path aquilum-app/Cargo.toml --format-version 1 > /dev/null
          git diff --stat -- aquilum-app/Cargo.lock
          test -s aquilum-app/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: dicom-zip-lock-${{ github.run_id }}
          path: aquilum-app/Cargo.lock
          if-no-files-found: error
          retention-days: 7
