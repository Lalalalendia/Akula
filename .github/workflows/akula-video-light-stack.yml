name: Akula VIDEO-08 Rust local-only mux adapter stacked QA (non-release)
on:
  pull_request:
    branches: [main, feat/video03-one-click-offline-20261116]
    paths:
      - 'aquilum-app/native/src/video/light.rs'
      - 'aquilum-app/native/src/video/light_tests.rs'
      - 'aquilum-app/native/src/video/download.rs'
      - 'aquilum-app/native/src/video/mod.rs'
      - 'aquilum-app/native/src/video/queue.rs'
      - '.github/workflows/akula-video-light-stack.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  win-native:
    name: Windows explicit-click local library, Rust mock mux and installed build
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-video08-light-windows-v1
          cache-workspace-crates: true
          save-if: false
      - name: Fetch and verify exact official QuickJS-NG and yt-dlp binaries for test only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP 'akula-video09-runtime'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          $qjs = Join-Path $scratch 'qjs.exe'
          $yt = Join-Path $scratch 'yt-dlp.exe'
          Invoke-WebRequest 'https://github.com/quickjs-ng/quickjs/releases/download/v0.18.0/qjs-windows-x86_64.exe' -OutFile $qjs -UseBasicParsing
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe' -OutFile $yt -UseBasicParsing
          $qhash = (Get-FileHash -LiteralPath $qjs -Algorithm SHA256).Hash.ToLowerInvariant()
          $yhash = (Get-FileHash -LiteralPath $yt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($qhash -cne 'ff03398d74ea6e6bd3a8e58058f7003225abcac229d7d57775b7aaae812a49c7') { throw "QuickJS hash changed: $qhash" }
          if ($yhash -cne 'f5389d3698ecde4ef06f4e6b1ce0294fe9ac1396228c8990b8d3416d6d177a7d') { throw "yt-dlp hash changed: $yhash" }
          if ((Get-Item -LiteralPath $qjs).Length -ne 1873152) { throw 'QuickJS exact size mismatch' }
          if ((Get-Item -LiteralPath $yt).Length -ne 23575744) { throw 'yt-dlp exact size mismatch' }
          $jsResult = (& $qjs -e 'print("VIDEO09_QUICKJS_EXEC_PASS")' 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or !$jsResult.Contains('VIDEO09_QUICKJS_EXEC_PASS')) { throw 'Verified QuickJS cannot execute' }
          $cliResult = (& $yt --ignore-config --no-plugin-dirs --no-remote-components --no-js-runtimes --js-runtimes "quickjs:$qjs" --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $cliResult -cne '2026.10.26') { throw "yt-dlp rejects QuickJS runtime selector: $cliResult" }
          Add-Content -Path $env:GITHUB_ENV -Value "AKULA_TEST_QUICKJS_BIN=$qjs"
          Add-Content -Path $env:GITHUB_ENV -Value "AKULA_TEST_YTDLP_BIN=$yt"
          Write-Host 'VIDEO09_PINNED_RUNTIME_CLI_PASS no_youtube_request=1 no_remote_component_download=1'
      - name: Validate Rust staged-download tests (no real YouTube requests)
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked -p aquilum-native --bin aquilum-native video::light:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'VIDEO-08 Windows Rust staged-media tests failed' }
          Write-Host 'VIDEO08_WINDOWS_STAGING_PASS local_only=1 fake_ytdlp=1 fake_mux=1 no_youtube_request=1'
          cargo test --locked -p aquilum-native --bin aquilum-native video::light::tests::official_pins_accept_only_the_checked_windows_quickjs_and_ytdlp -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime signature verification failed' }
          Write-Host 'VIDEO09_NATIVE_RUNTIME_INTEGRITY_PASS'
      - name: Run prior VIDEO-03 media tests unchanged
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked -p aquilum-native --bin aquilum-native video:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'VIDEO-03 video tests regressed' }
          Write-Host 'VIDEO08_WINDOWS_VIDEO_REGRESSION_PASS'
      - name: Confirm installed-feature executable still builds
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked -p aquilum-native --features installed
          if ($LASTEXITCODE -ne 0) { throw 'VIDEO-08 installed Akula build failed' }
          Write-Host 'VIDEO08_INSTALLED_BUILD_PASS bundling_rust_mux=0 public_release=0'
  static-invariants:
    name: Fail closed on implicit download or synced media bytes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject accidental downloader runtime activation or vault writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          light=Path('aquilum-app/native/src/video/light.rs').read_text()
          queue=Path('aquilum-app/native/src/video/queue.rs').read_text()
          for required in ('AKULA_RUST_MUX_BIN','AKULA_QUICKJS_BIN','download_one_or_legacy',
                           'Library','Stage::new(library)','mux-pair','--no-playlist',
                           '--no-exec','--no-plugin-dirs','--no-remote-components',
                           '--no-js-runtimes','--js-runtimes',
                           'QUICKJS_WINDOWS_SHA256','YTDLP_WINDOWS_SHA256',
                           'verify_pinned_runtime','fs::hard_link'):
              assert required in light,required
          assert 'super::light::download_one_or_legacy' in queue
          assert 'std::thread::spawn(move ||' in queue
          assert 'std::env::var_os("AKULA_RUST_MUX_BIN")' in light
          assert 'std::env::var_os("AKULA_QUICKJS_BIN")' in light
          assert '"quickjs:{}", quickjs.display()' in light
          assert 'None => download::download_one' in light
          assert 'Err("VIDEO-09 opt-in is Windows-only' in light
          for forbidden in ('--merge-output-format','--postprocessor-args','https://www.youtube.com/watch?v='):
              assert forbidden not in light,forbidden
          print('VIDEO08_NO_IMPLICIT_SYNC_OR_INSTALL_PASS')
