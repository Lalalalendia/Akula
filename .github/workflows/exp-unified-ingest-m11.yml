name: EXP M11 real TCP failure and MinIO restart
on:
  pull_request:
    paths:
      - 'experiments/unified-ingest-m5/tests/live_m11_minio_chaos.py'
      - 'experiments/unified-ingest-m5/discovery_lab/objects.py'
      - 'experiments/unified-ingest-m5/discovery_lab/multipart.py'
      - 'experiments/unified-ingest-m5/tests/m11_fault_proxy.py'
      - 'experiments/unified-ingest-m5/tests/test_m11_fault_proxy.py'
      - 'experiments/unified-ingest-m5/M11-NETWORK-ACCEPTANCE.md'
      - '.github/workflows/exp-unified-ingest-m11.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  minio-network-chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      S3_ENDPOINT: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: ci-only-access
      AWS_SECRET_ACCESS_KEY: ci-only-secret-2026
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      M11_ALLOW_CHAOS: local-disposable-minio
      M11_MINIO_CONTAINER: ingest-m11-minio
      MINIO_IMAGE: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated dependencies
        run: python -m pip install -e './experiments/unified-ingest-m5[test]'
      - name: Verify TCP fault injector without Docker
        working-directory: experiments/unified-ingest-m5
        run: python -m unittest discover -s tests -p 'test_m11_fault_proxy.py' -v
      - name: Start isolated disposable MinIO (versioning enabled in test)
        run: |
          docker run -d --name "$M11_MINIO_CONTAINER" -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            "$MINIO_IMAGE" server /data
      - name: Execute actual TCP resets, MinIO stop/restart and multipart recovery
        working-directory: experiments/unified-ingest-m5
        run: PYTHONUNBUFFERED=1 python tests/live_m11_minio_chaos.py
      - name: Upload M11 network evidence even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11-real-network-failure-evidence
          path: experiments/unified-ingest-m5/m11-network-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: MinIO diagnostic on failure
        if: failure()
        run: docker logs "$M11_MINIO_CONTAINER" --tail 75 || true
      - name: Remove isolated container
        if: always()
        run: docker rm -f "$M11_MINIO_CONTAINER" || true

