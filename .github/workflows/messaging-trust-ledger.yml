name: Akula messaging pinned device-key contract

on:
  pull_request:
    paths:
      - 'aquilum-app/core/src/messaging/w4/key_ledger.rs'
      - 'aquilum-app/core/src/messaging/w4/key_ledger/**'
      - 'docs/messaging/AK-MSG-CORE-01B-TRUST.md'
      - '.github/workflows/messaging-trust-ledger.yml'

permissions:
  contents: read

concurrency:
  group: akula-msg-trust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trust-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          cache-workspace-crates: true
          save-if: false
      - name: Device key epoch, revocation and receipt regression
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features messaging-key-ledger-lab 'messaging::' -- --nocapture
      - name: Standard feature-off core remains intact
        working-directory: aquilum-app
        run: cargo check --locked -p aquilum-core --no-default-features
      - name: Rust style
        run: rustfmt --edition 2021 --check aquilum-app/core/src/messaging/mod.rs
