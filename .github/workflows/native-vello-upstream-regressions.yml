name: Vello upstream CPU glyph/filter regressions (cross-platform)

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/native/vendor/glifo/src/**'
      - 'aquilum-app/native/vendor/vello_cpu/src/coarse/**'
      - 'aquilum-app/native/vendor/vello_cpu/src/dispatch/**'
      - 'aquilum-app/native/vendor/vello_cpu/src/fine/**'
      - 'aquilum-app/native/src/render/colr_bounds_tests.rs'
      - 'aquilum-app/native/src/render/paint/mask.rs'
      - '.github/workflows/native-vello-upstream-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vello-upstream-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native COLR and filter-coordinate regression / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest] # MAC-HOLD-01: macOS frozen
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-upstream-issues-v1
          cache-workspace-crates: true
          save-if: false
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Exact COLRv1 ClipBox, fractional pen atlas, and color glyph scale checks
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'fn colr_without_clipbox_matches_identical_outline' native/src/render/colr_bounds_tests.rs 2>/dev/null; then
            # Run all COLR visual regressions, including the fractional-pen
            # production atlas first-draw/cache-hit path on every OS.
            cargo test --release --locked -p aquilum-native --bin aquilum-native colr_ -- --nocapture --test-threads=1
          else
            echo "COLR synthetic fixture is not yet present on this isolated branch" >> "$GITHUB_STEP_SUMMARY"
          fi
          cargo test --release --locked -p aquilum-native --bin aquilum-native color_glyphs_follow_window_scale -- --nocapture --test-threads=1
      - name: COLRv1 PAD radial negative-radius tip regression
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p glifo --lib colr_radial_ -- --nocapture

      - name: COLRv1 synthetic-font pixel parity for negative radial tips
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p vello_cpu --lib colr_radial_negative_radius_raster_matches_spec -- --nocapture --test-threads=1

      - name: Measure COLR fractional fallback cost (diagnostic only)
        if: runner.os == 'Linux'
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_colr_fractional_fallback_cpu -- --ignored --nocapture --test-threads=1

      - name: Vello one-worker flush under single-CPU Linux affinity (Windows parity)
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
            echo "Running Vello flush test with CPU affinity: $cpu"
            taskset -c "$cpu" timeout 900s cargo test --release --locked -p vello_cpu --features multithreading flush_completes_with_one_cpu_worker -- --nocapture --test-threads=1
          else
            cargo test --release --locked -p vello_cpu --features multithreading flush_completes_with_one_cpu_worker -- --nocapture --test-threads=1
          fi

          # Run the regression itself, not just a filtered unrelated Vello test.
          cargo test --release --locked -p vello_cpu --features multithreading --lib neutral_grays_remain_finite_under_color_and_luminosity_blends -- --nocapture

      - name: Filtered scenes route to serial Vello before scene encoding
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-native --bin aquilum-native filter_route_is_serial_even_when_adaptive_is_disabled -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native filter_layer_survives_serial_fallback_without_panic -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native multi_filter_chain_ -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native mask_filter_preflight_ -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native filter_geometry_budget_ -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native extreme_path_geometry_ -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native viewport_tile_guard_ -- --nocapture --test-threads=1

      - name: Supported sequential offset-filter root-mask checks (where present)
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'fn nested_mask_layer_in_offset_filter_uses_root_coordinates' native/src/render/paint/mask.rs; then
            cargo test --release --locked -p aquilum-native --bin aquilum-native filter_mask_origin_tests -- --nocapture --test-threads=1
          else
            echo "Filter-coordinate tests are not yet present on this isolated branch" >> "$GITHUB_STEP_SUMMARY"
          fi
