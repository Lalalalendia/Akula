name: Native Vello natural-scroll stage attribution

on:
  pull_request:
    paths:
      - '.github/scripts/summarize-vello-natural-stages.py'
      - 'aquilum-app/native/src/app/tests/perf/vello_natural_stages.rs'
      - '.github/workflows/native-vello-natural-stages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vello-natural-stages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  natural-stages:
    name: Real editor scroll 0/2/4-worker frame stages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-natural-stages-v1
          cache-workspace-crates: true
      - name: Install native Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Save exact source and CPU
        shell: bash
        run: |
          {
            git rev-parse HEAD
            grep -m1 'model name' /proc/cpuinfo || true
            grep -m1 'flags' /proc/cpuinfo || true
            rustc --version
          } | tee vello-natural-environment.log
      - name: Repeat unsplit, unguarded Akula scroll 3 times in new processes
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          for trial in 1 2 3; do
            cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_natural_scroll_stages -- --ignored --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/vello-natural-trial-$trial.log"
          done
      - name: Validate stage attribution, parity and true damage geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/summarize-vello-natural-stages.py
          python3 .github/scripts/summarize-vello-natural-stages.py vello-natural-trial-1.log vello-natural-trial-2.log vello-natural-trial-3.log --output vello-natural-summary.md
          cat vello-natural-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve raw stage traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vello-natural-scroll-${{ github.sha }}
          path: |
            vello-natural-environment.log
            vello-natural-trial-*.log
            vello-natural-summary.md
          if-no-files-found: warn
          retention-days: 14
