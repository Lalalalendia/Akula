name: Argon 8.7 workspace scan paired Release A/B

on:
  pull_request:
    paths:
      - '.github/workflows/arg08-workspace-scan-abba.yml'

permissions:
  contents: read

concurrency:
  group: arg08-workspace-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  abba:
    name: Real read_directory_impl Release A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.artifacts/cargo-native
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Record base/head and copy identical benchmark-only test source
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$base"
          git worktree add --detach "$RUNNER_TEMP/akula-scan-base" "$base"
          cp aquilum-app/core/src/files/tests.rs "$RUNNER_TEMP/akula-scan-base/aquilum-app/core/src/files/tests.rs"
          {
            echo "PR_BASE=$base"
            echo "PR_HEAD=$(git rev-parse HEAD)"
            rustc --version
            cargo --version
            grep -m1 "model name" /proc/cpuinfo || true
          } > workspace-scan-env.txt
      - name: Compile both revisions with the exact same diagnostic test source
        shell: bash
        run: |
          set -euo pipefail
          for mode in base candidate; do
            if [ "$mode" = base ]; then tree="$RUNNER_TEMP/akula-scan-base"; else tree="$GITHUB_WORKSPACE"; fi
            (
              cd "$tree/aquilum-app"
              cargo test --release --locked -p aquilum-core --lib \
                benchmark_workspace_scan_abba --no-run --message-format=json
            ) > "$RUNNER_TEMP/$mode-build.json"
            python3 - "$RUNNER_TEMP/$mode-build.json" "$RUNNER_TEMP/workspace-$mode-test" <<'PY'
          import json
          from pathlib import Path
          import shutil
          import sys
          manifest, output = map(Path, sys.argv[1:])
          matches = []
          for line in manifest.read_text().splitlines():
              try:
                  obj = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = obj.get("target") or {}
              if (obj.get("reason") == "compiler-artifact"
                      and target.get("name") == "aquilum_core"
                      and obj.get("executable")):
                  matches.append(Path(obj["executable"]))
          if not matches or not matches[-1].is_file():
              raise SystemExit("Missing aquilum_core test executable in cargo JSON")
          shutil.copy2(matches[-1], output)
          PY
          done
      - name: Measure real directory reading across three acceptance mixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/benchmarks/workspace-scan-abba.py \
            --baseline "$RUNNER_TEMP/workspace-base-test" \
            --candidate "$RUNNER_TEMP/workspace-candidate-test" \
            --out workspace-scan-abba
          cat workspace-scan-abba/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive raw runs and exact revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arg08-workspace-scan-${{ github.event.pull_request.head.sha }}
          path: |
            workspace-scan-env.txt
            workspace-scan-abba/
          if-no-files-found: warn
          retention-days: 21
