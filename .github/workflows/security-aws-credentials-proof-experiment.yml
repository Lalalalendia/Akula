name: AWS provider compatibility experiment (non-release)

# Only this disposable research branch runs this job. No PR subscription.
on:
  push:
    branches:
      - security/akula-aws-provider-proof-20261022
    paths:
      - 'aquilum-app/core/tests/aws_credentials_regression.rs'
      - '.github/workflows/security-aws-credentials-proof-experiment.yml'

permissions:
  contents: read

concurrency:
  group: akula-aws-credentials-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline AWS process profile and SSO type
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: SwatinEm/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Validate provider regression source
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check aquilum-app/core/tests/aws_credentials_regression.rs
      - name: Run isolated AWS provider test using exact lockfile
        working-directory: aquilum-app
        shell: bash
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features sync-s3 \
            --test aws_credentials_regression -- --nocapture --test-threads=1
