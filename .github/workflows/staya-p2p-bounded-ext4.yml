name: Staya P2P bounded ext4 capacity (disposable Linux lab)

on:
  pull_request:
    paths:
      - "staya/roha-transport/**"
      - ".github/workflows/staya-p2p-bounded-ext4.yml"
      - "docs/sync/p2p-blob-08-bounded-staging.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-p2p-bounded-ext4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-ext4:
    name: Isolated loopback ext4 ENOSPC and real FsStore recovery
    if: github.repository == 'Lalalalendia/Akula'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.91.0"
      - uses: SwatinEm/rust-cache@v2
        with:
          workspaces: staya/roha-transport
          key: p2p-blob-08-bounded-ext4
      - name: Verify shell syntax and pinned Rust dependency graph
        run: |
          set -euo pipefail
          bash -n staya/roha-transport/lab/isolated-ext4-capacity.sh
          cargo metadata --locked --manifest-path staya/roha-transport/Cargo.toml --format-version 1 > dependency-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          pkgs = json.loads(Path("dependency-metadata.json").read_text())["packages"]
          expected = {
              "iroh": ("calex794/roha", "a42ad5aef1626df80d39398e05dac6e362bf6e49"),
              "noq": ("calex794/noq", "2eabf9895d40c263aa3369afd66efcf4a5d95056"),
              "noq-proto": ("calex794/noq", "2eabf9895d40c263aa3369afd66efcf4a5d95056"),
              "noq-udp": ("calex794/noq", "2eabf9895d40c263aa3369afd66efcf4a5d95056"),
          }
          for name, (repo, rev) in expected.items():
              hits = [p for p in pkgs if p["name"] == name]
              assert len(hits) == 1 and repo in str(hits[0]["source"]) and rev in str(hits[0]["source"]), name
          blobs = [p for p in pkgs if p["name"] == "iroh-blobs"]
          assert len(blobs) == 1 and blobs[0]["version"] == "0.103.1"
          print("P2P_BLOB_EXT4_PINS locked=true no_dependency_update=true")
          PY
      - name: Physical 64MiB ext4 ENOSPC, remount, real FsStore and missing mount
        run: |
          set -euo pipefail
          bash staya/roha-transport/lab/isolated-ext4-capacity.sh
