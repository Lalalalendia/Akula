name: Akula B1d0 Windows server setup public-only draft safety

on:
  pull_request:
    branches: [main]
    paths:
      - "aquilum-app/core/src/settings/models.rs"
      - "aquilum-app/native/src/ui/settings/schema/section.rs"
      - "aquilum-app/native/src/ui/settings/schema/mod.rs"
      - "aquilum-app/native/src/ui/settings/schema/server.rs"
      - "aquilum-app/native/src/ui/settings/schema/tests.rs"
      - "aquilum-app/native/assets/locales/en.json"
      - "aquilum-app/native/assets/locales/ru.json"
      - ".github/workflows/core-server-bootstrap-b1d0-windows-setup.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated PR revisions to avoid repeating expensive Windows cargo tests.
# Manual probes are isolated by github.run_id and remain independent.
concurrency:
  group: akula-b1d0-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  windows-public-host-pin-and-disabled-install-ui:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-b1d0-windows-draft-v1
          cache-workspace-crates: true
      - name: Parse Rust and localized JSON
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustfmt --edition 2021 aquilum-app/core/src/settings/models.rs
          rustfmt --edition 2024 aquilum-app/native/src/ui/settings/schema/server.rs aquilum-app/native/src/ui/settings/schema/section.rs aquilum-app/native/src/ui/settings/schema/tests.rs
          Get-Content aquilum-app/native/assets/locales/ru.json -Raw | ConvertFrom-Json -ErrorAction Stop | Out-Null
          Get-Content aquilum-app/native/assets/locales/en.json -Raw | ConvertFrom-Json -ErrorAction Stop | Out-Null
      - name: Public host-key draft validation in portable Core
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference='Stop'
          cargo test --locked -p aquilum-core --features server-bootstrap-b0-lab server_setup_tests
      - name: Compile and test native Windows setup safety
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference='Stop'
          $test = 'ui::settings::schema::tests::server::b1d0_native_server_settings_have_three_fields_and_never_grant_install'
          $list = @(cargo test --locked -p aquilum-native --bin aquilum-native -- --list)
          if ($LASTEXITCODE -ne 0) { throw 'Native B1d0 test discovery failed' }
          if ($list -notcontains "${test}: test") { throw "Missing exact B1d0 safety test: $test" }
          cargo test --locked -p aquilum-native --bin aquilum-native -- $test --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native B1d0 safety test failed' }
