name: QA bilateral transition reservation across Core processes
on:
  push:
    branches: [integration/qa-workspace-transition-lease-20261110]
permissions:
  contents: read
jobs:
  linux:
    name: Linux durable two-path reservation and competing process
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Independent process and crash reservation checks
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --lib sync::workspace_transition_lease_qa -- --nocapture
  windows:
    name: Windows durable two-path reservation and competing process
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Independent process and crash reservation checks
        shell: pwsh
        working-directory: aquilum-app
        run: |
          cargo test --locked -p aquilum-core --lib sync::workspace_transition_lease_qa -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  macos:
    name: macOS durable two-path reservation and competing process
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Independent process and crash reservation checks
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --lib sync::workspace_transition_lease_qa -- --nocapture
