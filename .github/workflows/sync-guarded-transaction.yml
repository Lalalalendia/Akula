name: Sync single-custody transaction

on:
  workflow_call:
  pull_request:
    paths:
      - 'aquilum-app/core/src/sync/guarded_note_write.rs'
      - 'aquilum-app/core/src/sync/guarded_note_write/tests/**'
      - 'aquilum-app/core/src/sync/filegate_custody_identity.rs'
      - 'aquilum-app/core/src/files/gate/write.rs'
      - 'aquilum-app/core/src/sync/journal/existing_replace_attempt.rs'
      - 'aquilum-app/core/src/history/service.rs'

      - '.github/workflows/sync-guarded-transaction.yml'
      - 'docs/sync/p0g-single-custody-transaction.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: single-custody-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  guarded-transaction:
    name: Single custody / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest] # MAC-HOLD-01: macOS frozen
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.artifacts/cargo-native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: single-custody-${{ matrix.os }}
      - name: Existing writer regressions plus joined V7 preparation/history/postflight
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine guarded_note_write::tests -- --nocapture --test-threads=1
