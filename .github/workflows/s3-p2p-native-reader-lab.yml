name: Isolated native public S3 P2P reader lab
on:
  push:
    branches: [lab/s3-p2p-native-reader-20261024]
    paths:
      - 'interop/akula-staya/**'
      - '.github/workflows/s3-p2p-native-reader-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reader-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - name: Check feature-gated native public reader
        run: |
          cargo test --manifest-path interop/akula-staya/public-cdn-check/Cargo.toml --lib public_cdn_lab
      - name: Compile isolated real S3 and Bao adapters
        run: |
          cargo check --manifest-path interop/akula-staya/public-cdn-check/Cargo.toml --features s3,bao --lib
      - name: Real direct Iroh Bao integration test
        run: cargo test --manifest-path interop/akula-staya/public-cdn-check/Cargo.toml --features bao --test bao_iroh_real
      - name: Reject suspicious S3 test-only support in ordinary feature build
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'public-cdn-bao-lab = ["public-cdn-reader-lab"' aquilum-app/core/Cargo.toml
      - name: Check repository stays non-shipping
        shell: bash
        run: |
          set -euo pipefail
          test -e interop/akula-staya/src/public_cdn_lab.rs
          test -e interop/akula-staya/PUBLIC_CDN_NATIVE_LAB.md
          ! grep -Fq 'interop/akula-staya' aquilum-app/Cargo.toml

  minio-range-native:
    name: Real MinIO 64MiB native Range
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - name: Start isolated MinIO
        shell: bash
        run: |
          docker run -d --rm --name akula-native-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=akula_ci -e MINIO_ROOT_PASSWORD=akula_ci_test_only \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs akula-native-minio
          exit 1
      - name: Upload immutable fixture and generate pinned SHA256 manifest
        working-directory: interop/akula-staya/public-cdn-check
        run: |
          python -m pip install boto3
          python prepare_minio.py
      - name: Real bounded Rust GET on MinIO
        working-directory: interop/akula-staya/public-cdn-check
        run: cargo test --features public-cdn-local-minio-test --test minio_real -- --nocapture
      - name: Real 64 MiB MinIO to authenticated Iroh Bao peer
        working-directory: interop/akula-staya/public-cdn-check
        run: cargo test --features public-cdn-local-minio-test,bao --test minio_to_iroh_64m -- --nocapture
      - name: Stop ephemeral MinIO
        if: always()
        run: docker stop akula-native-minio >/dev/null 2>&1 || true
