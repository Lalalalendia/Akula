name: Akula Bootstrap B1b4b1 real root-owned read-only witness IPC

on:
  workflow_call:
  pull_request:
    # main PRs run the mandatory Main PR gate; retain the legacy experiment lane.
    branches:
      - experiment/akula-server-bootstrap-b1b4b-os-witness-cas
    paths:

      - "aquilum-app/core/src/server_installer_ipc_lab.rs"
      - "aquilum-app/core/src/server_installer_os_witness_lab.rs"
      - "aquilum-app/core/tests/server_bootstrap_b1b4b.rs"
      - "aquilum-app/core/src/bin/akula_witness_b1b4b1_lab.rs"
      - "aquilum-app/core/examples/akula_b1b4b1_witness_fixture.rs"
      - "scripts/ci/akula-b1b4b1-witness-ipc-lab.sh"
      - ".github/workflows/core-server-bootstrap-b1b4b1-witness-ipc.yml"
      - "docs/platforms/AKULA-SERVER-BOOTSTRAP-B1B4B1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # New PR revisions supersede old ones; explicit manual runs remain independent.
  group: akula-b1b4b1-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  actual-root-witness-read-only-ipc:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-bootstrap-b1b4b1-witness-ipc-v1
          cache-workspace-crates: true
      - name: Parse Rust and Bash before running privileges
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 aquilum-app/core/src/bin/akula_witness_b1b4b1_lab.rs aquilum-app/core/examples/akula_b1b4b1_witness_fixture.rs aquilum-app/core/src/server_installer_ipc_lab.rs
          bash -n scripts/ci/akula-b1b4b1-witness-ipc-lab.sh
      - name: Build actual root-owned witness and nonshipping synthetic fixture
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo build --locked -p aquilum-core --features server-bootstrap-b1b4b1-witness-ipc-lab --bin akula-witness-b1b4b1-lab --example akula_b1b4b1_witness_fixture
          cargo test --locked -p aquilum-core --features server-bootstrap-b1b4b1-witness-ipc-lab --test server_bootstrap_b1b4b --no-run --message-format=json > "$RUNNER_TEMP/b1b4b-test-artifacts.jsonl"
          cargo check --locked -p aquilum-core --no-default-features
      - name: Repeat B1b4b0 real root-signed CAS proofs
        shell: bash
        run: |
          set -euo pipefail
          # Cargo does not guarantee that test binaries live under debug/deps.
          # Read its compiler-artifact JSON and allow exactly one generated,
          # executable integration-test target under the repo's locked Cargo dir.
          binary="$(python3 - "$RUNNER_TEMP/b1b4b-test-artifacts.jsonl" "$GITHUB_WORKSPACE/aquilum-app" "$GITHUB_WORKSPACE/.artifacts/cargo-native" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          log, workspace, allowed = sys.argv[1:]
          project = Path(workspace).resolve(strict=True)
          build_root = Path(allowed).resolve(strict=True)
          found = []
          with open(log, encoding="utf-8") as stream:
              for line in stream:
                  try:
                      item = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  target = item.get("target") or {}
                  if (item.get("reason") != "compiler-artifact"
                      or target.get("name") != "server_bootstrap_b1b4b"
                      or "test" not in target.get("kind", [])
                      or not item.get("executable")):
                      continue
                  raw = Path(item["executable"])
                  path = (raw if raw.is_absolute() else project / raw).resolve(strict=True)
                  if (not path.is_relative_to(build_root)
                      or not path.name.startswith("server_bootstrap_b1b4b-")
                      or not path.is_file()
                      or not os.access(path, os.X_OK)):
                      raise SystemExit("HOLD: Cargo test artifact escaped locked build root")
                  found.append(str(path))
          if len(found) != 1:
              raise SystemExit(f"HOLD: expected exactly one root witness test binary, got {len(found)}")
          print(found[0])
          PY
          )"
          test -n "$binary"
          sudo -n "$binary" --nocapture
          # Next systemd IPC acceptance must use this same exact Cargo artifact,
          # not an assumed target/debug/deps path.
          printf 'AKULA_B1B4B1_TEST_BIN=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Real root-owned systemd witness with strict kernel peer UID
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/akula-b1b4b1-witness-ipc-lab.sh
