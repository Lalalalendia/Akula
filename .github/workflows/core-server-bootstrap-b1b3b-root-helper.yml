name: Akula Bootstrap B1b3b real root-owned helper IPC lab

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:

      - "aquilum-app/core/src/bin/akula_helper_b1b3b_lab.rs"
      - "aquilum-app/core/examples/akula_b1b3b_fixture.rs"
      - "scripts/ci/akula-b1b3b-root-helper-lab.sh"
      - ".github/workflows/core-server-bootstrap-b1b3b-root-helper.yml"
      - "docs/platforms/AKULA-SERVER-BOOTSTRAP-B1B3B.md"
      - "aquilum-app/core/src/server_installer_ipc_lab.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-bootstrap-b1b3b-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  root-owned-test-only-linux-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-bootstrap-b1b3b-uid0-ipc-v1
          cache-workspace-crates: true
      - name: Rust formatter on test-only source checkout
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 aquilum-app/core/src/bin/akula_helper_b1b3b_lab.rs aquilum-app/core/examples/akula_b1b3b_fixture.rs
          bash -n scripts/ci/akula-b1b3b-root-helper-lab.sh
      - name: Build Linux helper and independent synthetic signer
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo build --locked -p aquilum-core --features server-bootstrap-b1b3b-root-helper-lab --bin akula-helper-b1b3b-lab
          cargo build --locked -p aquilum-core --features server-bootstrap-b1b3b-root-helper-lab --example akula_b1b3b_fixture
          cargo test --locked -p aquilum-core --features server-bootstrap-b1b3a-helper-ipc-lab --test server_bootstrap_b1b3a
          cargo check --locked -p aquilum-core --no-default-features
      - name: Real systemd UID 0 OS-owned policy and nonroot kernel peer
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/akula-b1b3b-root-helper-lab.sh
