name: Sync reserved S3 preparation

on:
  pull_request:
    paths:
      - 'aquilum-app/core/src/sync/s3_reserved_replace*.rs'
      - 'aquilum-app/core/src/sync/guarded_note_write.rs'
      - 'aquilum-app/core/src/sync/guarded_note_write/tests/**'
      - 'aquilum-app/core/src/sync/profile_binding.rs'
      - 'aquilum-app/core/src/sync/s3_preimage_capture.rs'
      - 'aquilum-app/core/src/sync/pinned_read.rs'
      - 'aquilum-app/core/src/sync/journal/**'
      - 'aquilum-app/core/src/sync/mod.rs'
      - 'aquilum-app/core/src/documents/hub.rs'
      - 'aquilum-app/core/src/files/gate/write.rs'
      - 'aquilum-app/core/Cargo.toml'
      - 'aquilum-app/Cargo.lock'
      - '.github/workflows/sync-reserved-s3-transaction.yml'
      - 'docs/sync/p0g2-held-s3-editor-reservation.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reserved-s3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reserved-preparation:
    name: Reserved S3 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.artifacts/cargo-native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: reserved-s3-${{ matrix.os }}
      - name: Retained closed editor with S3 intent, actual File Gate and history faults
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-s3 s3_reserved_replace::tests -- --nocapture --test-threads=1
      - name: Existing single-custody writer and independent-process regressions
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-s3 guarded_note_write::tests -- --nocapture --test-threads=1
