name: Akula Bootstrap B0b real pinned SSH signed KEX lab

on:
  pull_request:
    branches: [main]
    paths:
      - "aquilum-app/core/Cargo.toml"
      - "aquilum-app/core/src/lib.rs"
      - "aquilum-app/core/src/server_bootstrap_lab.rs"
      - "aquilum-app/core/src/server_bootstrap_ssh_lab.rs"
      - "aquilum-app/core/tests/server_bootstrap_b0b.rs"
      - "scripts/ci/akula-b0b-local-sshd.sh"
      - "docs/platforms/AKULA-SERVER-BOOTSTRAP-B0B.md"
      - ".github/workflows/core-server-bootstrap-b0b.yml"
      - '.github/scripts/ci-lab-scope.cjs'
      - '.github/scripts/ci-lab-scope.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-b0b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-isolated-feature:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check isolated additive Rust feature (fail closed)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node --test .github/scripts/ci-lab-scope.test.cjs
          node .github/scripts/ci-lab-scope.cjs --base="$BASE_SHA" --head=HEAD >> "$GITHUB_OUTPUT"
  actual-openssh-kex:
    needs: classify-isolated-feature
    if: ${{ always() && (github.event_name != 'pull_request' || needs.classify-isolated-feature.result != 'success' || needs.classify-isolated-feature.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-server-bootstrap-b0b-v1
          cache-workspace-crates: true
      - name: Real signed KEX and forged-host rejection on disposable localhost SSH
        shell: bash
        run: bash scripts/ci/akula-b0b-local-sshd.sh
      - name: B0a compatibility fake key ordering and dry-run checks
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features server-bootstrap-b0-lab --test server_bootstrap_b0 -- --nocapture
      - name: Default Akula Core without bootstrap feature remains unchanged
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p aquilum-core --no-default-features
