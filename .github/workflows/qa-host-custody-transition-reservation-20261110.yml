name: QA installed-host two-path transition fence (opt-in lab)
on:
  push:
    branches: [integration/host-custody-transition-reservation-20261110]
permissions:
  contents: read
jobs:
  linux:
    name: Linux host registry v2, File Gate and two-process lock
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Opt-in host transition reservation tests
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features host-custody-transition-lab --lib sync::host_custody_registry -- --nocapture
          cargo test --locked -p aquilum-core --features host-custody-transition-lab --lib sync::host_core_epoch_tests -- --nocapture
      - name: Legacy schema one remains unchanged in default host build
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features host-custody --lib sync::host_custody_registry -- --nocapture
  windows:
    name: Windows host registry v2 and independently opened Core
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Opt-in host transition reservation tests
        working-directory: aquilum-app
        shell: pwsh
        run: |
          cargo test --locked -p aquilum-core --features host-custody-transition-lab --lib sync::host_custody_registry -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p aquilum-core --features host-custody-transition-lab --lib sync::host_core_epoch_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  macos:
    name: macOS host registry v2 and independently opened Core
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Opt-in host transition reservation tests
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features host-custody-transition-lab --lib sync::host_custody_registry -- --nocapture
          cargo test --locked -p aquilum-core --features host-custody-transition-lab --lib sync::host_core_epoch_tests
