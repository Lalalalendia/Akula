# One-shot maintainer operation. Remove this workflow after lockfile is committed.
# Only the owner's exact Akula 3.13 branch may receive a lockfile update.
name: Akula 3.13 lockfile one-shot

on:
  pull_request:
    paths:
      - '.github/workflows/akula-313-lock-once.yml'
  push:
    branches:
      - 'feature/akula-3-13-dropbox-preview-20261023'
    paths:
      - '.github/workflows/akula-313-lock-once.yml'

permissions:
  contents: write

jobs:
  write-lockfile:
    if: github.repository == 'Lalalalendia/Akula' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'Lalalalendia/Akula' && github.event.pull_request.head.ref == 'feature/akula-3-13-dropbox-preview-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/akula-3-13-dropbox-preview-20261023
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve only the current pinned workspace dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path aquilum-app/Cargo.toml --format-version 1 >/dev/null
          test -s aquilum-app/Cargo.lock
          git diff --check -- aquilum-app/Cargo.lock
      - name: Commit resolved lockfile to this single branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- aquilum-app/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore(3.13): resolve native Dropbox Cargo.lock'
            git push origin HEAD:refs/heads/feature/akula-3-13-dropbox-preview-20261023
          fi
