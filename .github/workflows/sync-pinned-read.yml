name: Sync pinned-read OS checks

on:
  pull_request:
    paths:
      - "aquilum-app/core/src/plugins/vault_reader.rs"
      - "aquilum-app/core/src/plugins/read_tests.rs"
      - "aquilum-app/core/src/plugins/permission_broker.rs"
      - "aquilum-app/core/src/sync/pinned_read.rs"
      - "aquilum-app/core/src/sync/local_create.rs"
      - "aquilum-app/core/src/sync/local_create_tests.rs"
      - "aquilum-app/core/src/sync/host_admission.rs"
      - "aquilum-app/core/src/app_core.rs"
      - "aquilum-app/core/src/files/gate/write.rs"
      - "aquilum-app/core/src/files/gate/moves.rs"
      - "aquilum-app/core/src/files/gate/trash.rs"
      - "aquilum-app/core/src/files/gate/mod.rs"
      - "aquilum-app/core/src/files/trash.rs"
      - "aquilum-app/core/src/history/store.rs"
      - "aquilum-app/core/src/history/service.rs"
      - "aquilum-app/native/src/app/settings/apply.rs"
      - "aquilum-app/native/src/app/settings/mod.rs"
      - "aquilum-app/native/src/app/templates/starters.rs"
      - "aquilum-app/core/src/files/gate/tests.rs"
      - "aquilum-app/core/src/documents/hub.rs"
      - "aquilum-app/core/src/documents/hub_tests.rs"
      - "aquilum-app/core/src/sync/pinned_windows.rs"
      - "aquilum-app/core/src/sync/mod.rs"
      - "aquilum-app/core/Cargo.toml"
      - "aquilum-app/Cargo.lock"
      - ".github/workflows/sync-pinned-read.yml"

permissions:
  contents: read

concurrency:
  group: pinned-read-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pinned-read-platform:
    name: Pinned read / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: pinned-read-${{ matrix.os }}
      - name: Read-only descriptor regression tests
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine pinned_read -- --nocapture
      - name: Registered Core root and editor admission
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine host_admission -- --nocapture
      - name: Host-scoped plugin read deny/allow and OS path threats
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine plugins::read_tests -- --nocapture
      - name: Canonical aliases cannot bypass DocumentHub reservations
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine sync_reservation_blocks -- --nocapture
      - name: Core File Gate mutation interlock
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine core_file_gate_serializes -- --nocapture
      - name: Trash symlink and NTFS junction fail-closed checks
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine unsafe_trash_root -- --nocapture
      - name: History retention and migration alias checks
        working-directory: aquilum-app
        run: |
          cargo test --locked -p aquilum-core --features sync-engine history::store::tests:: -- --nocapture
      - name: Cross-Core history files and maintenance interlock
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine history_service_serializes -- --nocapture
      - name: Normal history reads, writes and moves reject symlink/junction aliases
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine history_service_rejects -- --nocapture
