name: Sync pinned-read OS checks

on:
  workflow_call:
  pull_request:
    paths:
      - "aquilum-app/core/src/plugins/vault_reader.rs"
      - "aquilum-app/core/src/plugins/read_tests.rs"
      - "aquilum-app/core/src/plugins/permission_broker.rs"
      - "aquilum-app/core/src/sync/pinned_read.rs"
      - "aquilum-app/core/src/sync/local_create.rs"
      - "aquilum-app/core/src/sync/native_existing_replace_probe.rs"
      - "aquilum-app/core/src/sync/native_windows_replace_probe.rs"
      - "aquilum-app/core/src/sync/local_recovery.rs"
      - "aquilum-app/core/src/sync/recovery_dashboard.rs"
      - "aquilum-app/core/src/sync/recovery_existing_replace_tests.rs"
      - "aquilum-app/core/src/sync/journal/existing_replace_attempt.rs"
      - "aquilum-app/core/src/sync/recovery_review.rs"
      - "aquilum-app/core/src/sync/sealed_archive.rs"
      - "aquilum-app/core/src/sync/local_create_tests.rs"
      - "aquilum-app/core/src/sync/journal.rs"
      - "aquilum-app/core/src/sync/core_scan.rs"
      - "aquilum-app/core/src/sync/path.rs"
      - "aquilum-app/core/src/search/paths.rs"
      - "aquilum-app/core/src/sync/host_admission.rs"
      - "aquilum-app/core/src/sync/guarded_note_write.rs"
      - "aquilum-app/core/src/app_core.rs"
      - "aquilum-app/core/src/files/gate/write.rs"
      - "aquilum-app/core/src/files/gate/moves.rs"
      - "aquilum-app/core/src/files/gate/trash.rs"
      - "aquilum-app/core/src/files/gate/mod.rs"
      - "aquilum-app/core/src/files/trash.rs"
      - "aquilum-app/core/src/history/store.rs"
      - "aquilum-app/core/src/history/service.rs"
      - "aquilum-app/core/src/history/recovery.rs"
      - "aquilum-app/core/src/history/mod.rs"
      - "aquilum-app/native/src/app/settings/apply.rs"
      - "aquilum-app/native/src/app/settings/mod.rs"
      - "aquilum-app/native/src/app/templates/starters.rs"
      - "aquilum-app/core/src/files/gate/tests.rs"
      - "aquilum-app/core/src/files/gate/interprocess_probe.rs"
      - "aquilum-app/core/src/sync/filegate_lock_probe.rs"
      - "aquilum-app/core/src/documents/hub.rs"
      - "aquilum-app/core/src/documents/hub_tests.rs"
      - "aquilum-app/core/src/documents/session.rs"
      - "aquilum-app/core/src/documents/session_tests.rs"
      - "aquilum-app/core/src/documents/store.rs"
      - "aquilum-app/core/src/documents/store_tests.rs"
      - "aquilum-app/core/src/documents/io.rs"
      - "aquilum-app/core/src/sync/pinned_windows.rs"
      - "aquilum-app/core/src/sync/mod.rs"

      - ".github/workflows/sync-pinned-read.yml"

permissions:
  contents: read

concurrency:
  group: pinned-read-${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pinned-read-platform:
    name: Pinned read / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest] # MAC-HOLD-01: macOS frozen
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: pinned-read-${{ matrix.os }}
      - name: Read-only descriptor regression tests
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine pinned_read -- --nocapture
      - name: Registered Core root and editor admission
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine host_admission -- --nocapture
      - name: Read-only M1c recovery race and provenance gates
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine m1c_ -- --nocapture
      - name: M1d recovery evidence and native-baseline interlock tests
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine m1d_ -- --nocapture
      - name: M1d-b copy-out recovery and SQLite migration gates
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine m1db_ -- --nocapture
      - name: M1d-c operator review and retention safety gates
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine m1dc_ -- --nocapture
      - name: M1d-d read-only recovery status and non-mutating SQLite gates
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine m1dd_ -- --nocapture
      - name: Existing replacement claims cannot hide behind additive-only recovery UI
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine recovery_dashboard::tests -- --nocapture
      - name: M1d-e explicit native review and no-mutation gates
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine m1de_ -- --nocapture
      - name: Native Unix post-rename audit and v6 crash-retention gates
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine m1e4_ -- --nocapture
      - name: M1d-f1 sealed archive AEAD integrity and no-plaintext gates
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine m1df1_ -- --nocapture
      - name: Durable local publication recovery and stage exclusion
        working-directory: aquilum-app
        run: |
          cargo test --locked -p aquilum-core --features sync-engine journal::tests::local_publication -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine journal::tests::legacy_schema_one -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine journal::tests::separate_sqlite_connections -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine core_scan::tests::orphan_create_stage -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine core_scan::tests::stage_name_directory -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine path::tests::refuses_reserved_local_create -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine search::paths::tests::incomplete_sync_stages -- --nocapture
      - name: Host-scoped plugin read deny/allow and OS path threats
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine plugins::read_tests -- --nocapture
      - name: Canonical aliases cannot bypass DocumentHub reservations
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine sync_reservation_blocks -- --nocapture
      - name: Core File Gate mutation interlock
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine core_file_gate_serializes -- --nocapture
      - name: DocumentSession sticky ambiguous native publication HOLD
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine native_lost_ack_sticks_as_hold -- --nocapture
      - name: Crash-durable DocumentStore migration, restart HOLD and guarded confirm/abort
        working-directory: aquilum-app
        run: |
          cargo test --locked -p aquilum-core --features sync-engine migrates_v1_document_store -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine durable_intent_survives_restart -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine armed_document_write_crash_intent -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine cannot_arm_durable_editor_with_active_document_buffers -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine guarded_write_completes_only_after -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine guarded_metadata_failure_preserves_crash_intent -- --nocapture
      - name: Native existing-file name exchange experiment (test only)
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine native_existing_replace_probe::tests -- --nocapture
      - name: Windows ReplaceFileW original-backup and error-state probe (test only)
        if: matrix.os == 'windows-latest'
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine native_windows_replace_probe::tests -- --nocapture
      - name: OS two-process File Gate advisory lock probe (test-only)
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine oslock_ -- --nocapture
      - name: Protected history namespace and post-lock UI callback regressions
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine guarded_note_write_ -- --nocapture
      - name: Trash symlink and NTFS junction fail-closed checks
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine unsafe_trash_root -- --nocapture
      - name: History retention and migration alias checks
        working-directory: aquilum-app
        run: |
          cargo test --locked -p aquilum-core --features sync-engine history::store::tests:: -- --nocapture
      - name: Cross-Core history files and maintenance interlock
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine history_service_serializes -- --nocapture
      - name: Normal history reads, writes and moves reject symlink/junction aliases
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine history_service_rejects -- --nocapture
      - name: Interrupted history relocation and cross-Core quarantine
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine history_move_ -- --nocapture
      - name: Persistent history journal and restart recovery
        working-directory: aquilum-app
        run: |
          cargo test --locked -p aquilum-core --features sync-engine history::recovery::tests:: -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine history_recovery_ -- --nocapture
          cargo test --locked -p aquilum-core --features sync-engine history_corrupt_recovery_marker -- --nocapture
      - name: Cross-vault primary move admission and source-only journal denial
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine history_cross_vault_ -- --nocapture
