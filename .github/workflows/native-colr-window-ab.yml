name: Native COLRv1 emoji window A/B on pinned before/after

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/benchmarks/native_scroll_window_ab.py'
      - 'scripts/benchmarks/native_colr_window_ab.py'
      - '.github/workflows/native-colr-window-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    name: Real emoji-rich window + COLRv1 font / pinned Linux Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Original revision before COLR #305
        uses: actions/checkout@v7
        with:
          ref: 254084ed54745a50a874569af3dbf3cd0045f5af
          path: before
      - name: Corrected COLR revision
        uses: actions/checkout@v7
        with:
          ref: af0da5f590dfb38fafc103815da74dcd91be1c29
          path: after
      - name: Diagnostic driver
        uses: actions/checkout@v7
        with:
          path: driver
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies and virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            xvfb openbox curl fontconfig
      - name: Install SHA-pinned actual COLRv1 emoji font
        shell: bash
        run: |
          set -euo pipefail
          install -d "$HOME/.local/share/fonts/akula-colr"
          font="$HOME/.local/share/fonts/akula-colr/twemoji-smiley-colrv1.ttf"
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/googlefonts/color-fonts/0046ea4c3b69e9fbbe464c2594816894e3aa5e4b/fonts/twemoji_smiley-glyf_colr_1.ttf' \
            --output "$font"
          expected=563b8f3b7ad9e331b8b243755e5ff3e1e9743216
          actual="$(git hash-object "$font")"
          test "$actual" = "$expected"
          mkdir -p "$HOME/.config/fontconfig/conf.d"
          cat > "$HOME/.config/fontconfig/conf.d/90-akula-colr-smiley.conf" <<'FONTCONFIG'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong">
              <family>Noto Color Emoji</family>
              <prefer><family>twemoji_smiley-glyf_colr_1</family></prefer>
            </alias>
          </fontconfig>
          FONTCONFIG
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\n' 'Noto Color Emoji:charset=1f601' | tee font-selection.txt
          grep -F 'twemoji_smiley-glyf_colr_1' font-selection.txt
      - name: Build both release-native executables on the same runner
        shell: bash
        run: |
          set -euo pipefail
          # Two distinct checkouts MUST NOT share Cargo fingerprints/artifacts:
          # the same crate version can otherwise return the baseline binary
          # again for the changed glifo code.
          mkdir -p colr-bin
          export CARGO_TARGET_DIR="$PWD/_colr_before_target"
          (cd before/aquilum-app && cargo build --release --locked -p aquilum-native)
          cp "$CARGO_TARGET_DIR/release/aquilum-native" colr-bin/before
          export CARGO_TARGET_DIR="$PWD/_colr_after_target"
          (cd after/aquilum-app && cargo build --release --locked -p aquilum-native)
          cp "$CARGO_TARGET_DIR/release/aquilum-native" colr-bin/after
          sha256sum colr-bin/before colr-bin/after > colr-binaries.txt
          test "$(sha256sum colr-bin/before | cut -d' ' -f1)" != "$(sha256sum colr-bin/after | cut -d' ' -f1)"
      - name: Validate driver Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile driver/scripts/benchmarks/native_scroll_window_ab.py
          python3 -m py_compile driver/scripts/benchmarks/native_colr_window_ab.py
      - name: ABBA actual Winit/softbuffer emoji replay
        shell: bash
        run: |
          set -euo pipefail
          export BEFORE="$PWD/colr-bin/before"
          export AFTER="$PWD/colr-bin/after"
          export OUT="$PWD/colr-window-results"
          xvfb-run -a -s "-screen 0 1920x1200x24" bash -c '
            set -euo pipefail
            openbox >/dev/null 2>&1 &
            sleep 1
            python3 driver/scripts/benchmarks/native_colr_window_ab.py \
              --before "$BEFORE" --after "$AFTER" --out "$OUT" \
              --before-commit 254084ed54745a50a874569af3dbf3cd0045f5af \
              --after-commit af0da5f590dfb38fafc103815da74dcd91be1c29 \
              --timeout 40
          '
          cat colr-window-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive process measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akula-colr-emoji-window-ab
          path: |
            font-selection.txt
            colr-binaries.txt
            colr-window-results/summary.md
            colr-window-results/matrix.json
            colr-window-results/**/sample.json
            colr-window-results/**/replay.json
            colr-window-results/**/metrics.json
            colr-window-results/**/process.log
          retention-days: 14
          if-no-files-found: warn
