name: Sync durable preimage protection

on:
  workflow_call:
  # PR path owners are enforced in required central route.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-protection-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  protected-originals:
    name: Protected original / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest] # MAC-HOLD-01: macOS frozen
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: protected-original-${{ matrix.os }}

      - name: SQLite FULL-sync protected preimage regressions
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine protection_store -- --nocapture
