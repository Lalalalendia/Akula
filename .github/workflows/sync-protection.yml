name: Sync durable preimage protection

on:
  pull_request:
    paths:
      - "aquilum-app/core/src/sync/protection_store.rs"
      - "aquilum-app/core/src/sync/mod.rs"
      - "aquilum-app/core/Cargo.toml"
      - "aquilum-app/Cargo.lock"
      - ".github/workflows/sync-protection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-originals:
    name: Protected original / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: protected-original-${{ matrix.os }}

      - name: SQLite FULL-sync protected preimage regressions
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-engine protection_store -- --nocapture
