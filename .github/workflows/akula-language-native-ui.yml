name: Akula LANG-02 named study collection native GUI journey

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/native/src/app/tests/learning.rs'
      - 'aquilum-app/native/src/app/tests/mod.rs'
      - 'aquilum-app/native/src/app/editor_requests/study_create.rs'
      - 'aquilum-app/native/src/app/editor_requests/study_add.rs'
      - '.github/workflows/akula-language-native-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-native-dialog:
    name: Windows native RenderRoot dialog, durable SQLite and unchanged source
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: lang02-native-windows-v1
          save-if: false
      - name: Native dialog journey through actual RenderRoot and SQLite
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-native --bin aquilum-native \
            lang02_named_collection_native_gui_persists_without_mutating_markdown \
            -- --nocapture --test-threads=1 2>&1 | tee ../lang02-native-windows.log
          grep -F 'AKULA_LANG02_NATIVE_JOURNEY_PASS=' ../lang02-native-windows.log >> "$GITHUB_STEP_SUMMARY"
      - name: Save synthetic test transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lang02-native-dialog-windows
          path: lang02-native-windows.log
          retention-days: 10
          if-no-files-found: warn
