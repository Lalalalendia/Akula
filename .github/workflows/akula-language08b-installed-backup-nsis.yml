name: Akula LANG-08b genuine installed backup and rebind NSIS UIA (non-release)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/windows-lang08b-installed-backup.ps1'
      - '.github/workflows/akula-language08b-installed-backup-nsis.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Fail closed before NSIS build - inspect installed witness script
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify script syntax and non-release boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path=Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-lang08b-installed-backup.ps1'
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){throw ('LANG-08b PowerShell parse errors: '+($errors|Out-String))}
          $source=[IO.File]::ReadAllText($path)
          foreach($needle in @('AKULA_LANG08B_INSTALLED_EXPORT_PASS','AKULA_LANG08B_INSTALLED_IMPORT_HOLD_PASS',
             'AKULA_LANG08B_INSTALLED_REBIND_PASS','AKULA_LANG08B_INSTALLED_RESTART_PASS',
             'Wait-FileDialog','Choose-FileThroughNativeDialog','Get-AnnotationSnapshot',
             'RUNNER_ENVIRONMENT','github-hosted','GetForegroundWindow','GetWindowThreadProcessId',
             'SendInput','compiled_executable_sha256','SQLite format 3','backupExport','backupImport',
             'rebind','AKULA_LANG08_INSTALLED_UNINSTALL_PASS')){
            if(!$source.Contains($needle)){throw "Missing LANG-08b acceptance invariant $needle"}
          }
          $cfg=[IO.File]::ReadAllText('aquilum-app/native/packaging/akula-windows.json')|ConvertFrom-Json
          if($cfg.productName -cne 'Akula' -or @($cfg.binaries).Count -ne 2){
            throw 'LANG-08b must reuse current two-binary release configuration without modifying it'
          }
          # Run the real SQLite revision reader on an ephemeral SQLite fixture
          # under Windows PowerShell 5.1 before the expensive NSIS build.
          $reader=@($ast.FindAll({
            param($node)
            ($node -is [System.Management.Automation.Language.FunctionDefinitionAst]) -and
            ($node.Name -eq 'Read-AnnotationState')
          },$true))
          if($reader.Count -ne 1){throw 'LANG-08b expected exactly one SQLite reader'}
          Invoke-Expression $reader[0].Extent.Text
          $tempDb=Join-Path $env:RUNNER_TEMP ('lang08-sqlite-fixture-'+[Guid]::NewGuid().ToString('N')+'.sqlite')
          $create=@'
          import sqlite3
          import sys
          db=sqlite3.connect(sys.argv[1])
          db.execute("CREATE TABLE text_annotation_state (id INTEGER PRIMARY KEY,revision INTEGER NOT NULL,payload BLOB NOT NULL)")
          db.execute("INSERT INTO text_annotation_state (id,revision,payload) VALUES(1,7,?)",(b"fixture",))
          db.commit()
          db.close()
          '@
          $update=@'
          import sqlite3
          import sys
          db=sqlite3.connect(sys.argv[1])
          db.execute("UPDATE text_annotation_state SET revision=8,payload=? WHERE id=1",(b"updated",))
          db.commit()
          db.close()
          '@
          try {
            $null=($create | & python - $tempDb)
            if($LASTEXITCODE -ne 0){throw 'LANG-08b SQLite fixture creation failed'}
            $before=Read-AnnotationState -Path $tempDb
            if($before -notmatch '^7:[a-f0-9]{64}$'){
              throw 'LANG-08b SQLite reader failed on revision 7'
            }
            $null=($update | & python - $tempDb)
            if($LASTEXITCODE -ne 0){throw 'LANG-08b SQLite fixture update failed'}
            $after=Read-AnnotationState -Path $tempDb
            if($after -notmatch '^8:[a-f0-9]{64}$' -or $after -ceq $before){
              throw 'LANG-08b SQLite reader cannot detect a revision change'
            }
          } finally {
            Remove-Item -LiteralPath $tempDb -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'AKULA_LANG08_SQLITE_HELPER_CONTRACT_PASS python_stdin=1 revision_change=1'
          Write-Host 'AKULA_LANG08_NONRELEASE_CONTRACT_PASS syntax=1 installer_unmodified=1 real_os_ui=1'


      - name: Exercise real SQLite status reader on disposable revisions before NSIS
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-lang08b-installed-backup.ps1'
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw ('LANG-08b parser contract: '+($errors|Out-String))}
          $reader=@($ast.FindAll({
            param($node)
            ($node -is [System.Management.Automation.Language.FunctionDefinitionAst]) -and
              ($node.Name -eq 'Get-AnnotationSnapshot')
          },$true))
          if($reader.Count -ne 1){throw 'LANG-08b must expose exactly one SQLite status reader'}
          Invoke-Expression $reader[0].Extent.Text
          $fixture=Join-Path $env:RUNNER_TEMP ('lang08b-state-'+[guid]::NewGuid().ToString('N')+'.sqlite')
          $setup=@'
          import sqlite3
          import sys
          with sqlite3.connect(sys.argv[1]) as db:
              db.execute("CREATE TABLE text_annotation_state(id INTEGER PRIMARY KEY,revision INTEGER NOT NULL,payload BLOB NOT NULL)")
              db.execute("INSERT INTO text_annotation_state VALUES(1,0,?)",(b'{"records":[]}',))
          '@
          $change=@'
          import json
          import sqlite3
          import sys
          record={"anchor":{"annotation_id":"fixture-id","selected_digest":[171]*32},
                  "status":sys.argv[2],"color":"yellow"}
          with sqlite3.connect(sys.argv[1]) as db:
              db.execute("UPDATE text_annotation_state SET revision=?,payload=? WHERE id=1",
                         (int(sys.argv[3]),json.dumps({"records":[record]}).encode()))
          '@
          try {
            $null=($setup | & python - $fixture)
            if($LASTEXITCODE -ne 0){throw 'LANG-08b cold SQLite fixture failed'}
            $empty=Get-AnnotationSnapshot -Path $fixture
            if($empty.record_count -ne 0 -or $empty.revision -ne 0){
              throw 'LANG-08b incorrect cold SQLite snapshot'
            }
            $null=($change | & python - $fixture 'needs_rebind' 1)
            if($LASTEXITCODE -ne 0){throw 'LANG-08b HOLD fixture failed'}
            $held=Get-AnnotationSnapshot -Path $fixture
            if($held.record_count -ne 1 -or $held.status -cne 'needs_rebind' -or $held.revision -ne 1){
              throw 'LANG-08b incorrect HOLD SQLite status'
            }
            $null=($change | & python - $fixture 'current' 2)
            if($LASTEXITCODE -ne 0){throw 'LANG-08b Current fixture failed'}
            $current=Get-AnnotationSnapshot -Path $fixture
            if($current.status -cne 'current' -or $current.revision -ne 2 -or
               $current.annotation_id -cne $held.annotation_id -or
               $current.selected_digest -cne $held.selected_digest){
              throw 'LANG-08b cannot read verified HOLD-to-Current transition'
            }
          } finally {
            Remove-Item -LiteralPath $fixture -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'AKULA_LANG08B_SQLITE_STATE_CONTRACT_PASS cold=1 hold=1 current=1'

  candidate:
    name: Build, install-test and stage actual unsigned NSIS without release
    needs: contract
    uses: ./.github/workflows/windows-beta.yml
    permissions:
      contents: read

  installed-backup-rebind:
    name: Installed NSIS picker export, import HOLD, explicit rebind, restart and uninstall
    needs: candidate
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: akula-windows-beta-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: lang08b-candidate
      - name: Verify candidate exactly matches manifest then run installed OS witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'lang08b-candidate'
          $setups=@(Get-ChildItem -LiteralPath $candidate -File -Filter 'Akula_*-setup.exe')
          $manifest=Join-Path $candidate 'candidate-manifest.json'
          if($setups.Count -ne 1 -or !(Test-Path -LiteralPath $manifest -PathType Leaf)){
            throw 'LANG-08b requires exactly one genuine NSIS candidate and its provenance'
          }
          $windowsPowerShell=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-lang08b-installed-backup.ps1') -SetupPath $setups[0].FullName -ManifestPath $manifest
          if($LASTEXITCODE -ne 0){throw "LANG-08b real installed Windows evidence failed: $LASTEXITCODE"}
      - name: Record non-release synthetic evidence
        if: success()
        shell: pwsh
        run: |
          @'
          LANG-08b uses an actual unsigned NSIS from the same CI run, the real
          Windows native save/open picker for one-note annotation JSON backup,
          synthetic sidecar restoration on HOLD, user-selected explicit rebind,
          SQLite revision and Markdown checks across restart and clean uninstall.
          All files are disposable RUNNER_TEMP data, not a release or real vault.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
