name: Akula P2P offer contract laboratory

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/core/src/p2p_offer_lab.rs'
      - 'aquilum-app/core/src/lib.rs'
      - 'aquilum-app/core/Cargo.toml'
      - '.github/workflows/p2p-offer-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2p-offer-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  offer-contract:
    name: Strict offer consent Rust laboratory
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-p2p-offer-v1
      - name: Format only this P2P module
        working-directory: aquilum-app
        run: rustfmt --edition 2021 --check core/src/p2p_offer_lab.rs
      - name: Test optional consent contract
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features p2p-offer-lab p2p_offer_lab::tests -- --nocapture
      - name: Lint optional consent module
        working-directory: aquilum-app
        run: cargo clippy --locked -p aquilum-core --lib --features p2p-offer-lab -- -D warnings
