# Measurement only. Never publishes release artifacts or writes to product data.
name: Akula Windows Release size RAM startup lab
on:
  push:
    branches:
      - lab/akula-win-release-footprint-20261024
    paths:
      - .github/workflows/akula-windows-release-footprint-lab.yml

permissions:
  contents: read

concurrency:
  group: akula-windows-release-footprint-lab-one-shot
  cancel-in-progress: true

jobs:
  windows-release:
    name: Release exe size plus synthetic Win32 M1
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-windows-memory-pilot-v1
          cache-workspace-crates: true
          save-if: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Win32 sampler and clean source checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Expected Windows host' }
          python -m py_compile scripts/benchmarks/native_windows_memory_pilot.py scripts/benchmarks/native_mipmap_window_ab.py
          if ($LASTEXITCODE -ne 0) { throw 'Sampler compilation failed' }
          python -c "import os,sys;sys.path.insert(0,'scripts/benchmarks');from native_windows_memory_pilot import sample; v=sample(os.getpid());assert v['private_bytes']>0 and v['working_set_bytes']>0"
          if ($LASTEXITCODE -ne 0) { throw 'Win32 PSAPI is unavailable' }
          if ((git status --porcelain).Length -gt 0) { throw 'Dirty checkout before measurement' }
      - name: Compile actual Windows release installed feature set
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked -p aquilum-native --features installed
          if ($LASTEXITCODE -ne 0) { throw 'Normal Windows release build failed' }
      - name: Record exact EXE bytes and hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:GITHUB_WORKSPACE '.artifacts\cargo-native\release\aquilum-native.exe'
          if (!(Test-Path -LiteralPath $file)) { throw 'Normal release EXE missing' }
          $exe = Get-Item -LiteralPath $file
          $bytes = [int64]$exe.Length
          $sha = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaSource = (git rev-parse HEAD).Trim()
          $info = [ordered]@{
            source_commit = $shaSource
            rustc_version = (rustc --version)
            cargo_version = (cargo --version)
            features = 'installed'
            compiled_target = 'x86_64-pc-windows-msvc'
            mode = 'unpackaged Windows Release, not NSIS installed'
            exe_name = 'aquilum-native.exe'
            exe_bytes = $bytes
            exe_mib = [math]::Round($bytes / 1048576.0, 3)
            exe_sha256 = $sha
            windows_runner = $env:RUNNER_NAME
          }
          $text = $info | ConvertTo-Json -Depth 3
          Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'akula-release-footprint.json') -Value $text -Encoding utf8
          Write-Host ("AKULA_EXE_FOOTPRINT_JSON=" + ($info | ConvertTo-Json -Compress))
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Akula exact Windows Release EXE"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Source: " + $shaSource)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- EXE bytes: " + $bytes)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- EXE MiB: " + $info.exe_mib)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- EXE SHA-256: " + $sha)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Signed installer size and installed RAM are NOT measured here."
      - name: Measure cold and warm HWND proxy, private bytes, working set
        shell: pwsh
        timeout-minutes: 18
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:GITHUB_WORKSPACE '.artifacts\cargo-native\release\aquilum-native.exe'
          $out = Join-Path $env:GITHUB_WORKSPACE 'windows-memory-pilot'
          $env:AKULA_PROBE_SOURCE_HEAD = (git rev-parse HEAD).Trim()
          python scripts/benchmarks/native_windows_memory_pilot.py --binary $binary --out $out --trials 3 --seconds 32 --interval-ms 200
          if ($LASTEXITCODE -ne 0) { throw 'Windows memory pilot failed; baseline invalid' }
          $report = Join-Path $out 'summary.md'
          if (!(Test-Path -LiteralPath $report)) { throw 'Missing reproducible summary.md' }
          Get-Content -LiteralPath $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Archive source SHA, size and synthetic memory records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akula-release-footprint-${{ github.sha }}
          path: |
            akula-release-footprint.json
            windows-memory-pilot/environment.json
            windows-memory-pilot/results.json
            windows-memory-pilot/summary.md
            windows-memory-pilot/trial-*/**/samples.csv
            windows-memory-pilot/trial-*/**/witness.json
            windows-memory-pilot/trial-*/**/process.log
          if-no-files-found: warn
          retention-days: 14
