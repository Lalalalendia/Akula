name: Staya FED-BRIDGE-03 scoped event to inventory lab
on:
  pull_request:
    paths:
      - "experiments/staya-fed-bridge-03/**"
      - ".github/workflows/staya-fed-bridge-03.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Checkout exact independent inventory revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Lalalalendia/Akula
          ref: 4bc7ad9f61e8ee191af4505ba988e40c77878753
          path: deps
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.91.0"
      - name: Verify exact inventory source
        run: |
          git -C deps rev-parse HEAD
          test -f deps/experiments/staya-fed-inventory-01/Cargo.toml
      - name: Prepare isolated lockfile
        run: cargo generate-lockfile --manifest-path experiments/staya-fed-bridge-03/Cargo.toml
      - name: Test signed gossip event and independent inventory reconciliation
        run: |
          set -o pipefail
          cargo test --locked --manifest-path experiments/staya-fed-bridge-03/Cargo.toml --all-targets -- --nocapture 2>&1 | tee fed-bridge-tests.log
      - name: Keep test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fed-bridge-03
          path: |
            fed-bridge-tests.log
            experiments/staya-fed-bridge-03/Cargo.lock
          retention-days: 14
