name: QA Windows knowledge-base creation (branch only)
on:
  push:
    branches: [integration/upstream-workspace-create-20261109]
    paths:
      - 'aquilum-app/native/src/app/workspaces/create.rs'
      - '.github/workflows/qa-windows-workspace-create-20261110.yml'
permissions:
  contents: read
jobs:
  windows-create:
    name: Windows create-only workspace collisions and invalid parent
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify two Windows workspace creation tests execute and pass
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          $output = cargo test --locked -p aquilum-native app::workspaces::create::tests:: -- --nocapture 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "Windows creation regression failed ($LASTEXITCODE)" }
          if ($output -notmatch '2 passed; 0 failed') {
            throw 'Expected exactly two Windows creation tests; did not verify both'
          }
