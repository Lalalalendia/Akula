name: One-shot Zig Rust RGBA research

on:
  push:
    branches:
      - research/zig-rgba-ab-20261022
    paths:
      - 'scripts/benchmarks/zig-rgba-ab/**'
      - '.github/workflows/zig-rgba-ab-once.yml'

permissions:
  contents: read

concurrency:
  group: zig-rgba-one-shot
  cancel-in-progress: true

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Run pinned Zig and Rust RGBA A/B
        shell: bash
        run: bash scripts/benchmarks/zig-rgba-ab/run.sh
      - name: Save measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zig-rgba-one-shot
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .rgba-comparison/results.json
            .rgba-comparison/environment.txt
            .rgba-comparison/*-build.txt
            .rgba-comparison/library-sizes.txt
            .rgba-comparison/bench.log
            .rgba-comparison/rss.jsonl
