name: One-shot Zig Rust RGBA codegen research

on:
  push:
    branches:
      - research/zig-rgba-ab-20261022
    paths:
      - 'scripts/benchmarks/zig-rgba-ab/**'
      - '.github/workflows/zig-rgba-ab-once.yml'

permissions:
  contents: read

concurrency:
  group: zig-rgba-one-shot
  cancel-in-progress: true

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Compare generic and native compiled RGBA kernels
        shell: bash
        run: bash scripts/benchmarks/zig-rgba-ab/run-v2.sh
      - name: Store byte parity timing and disassembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zig-rgba-codegen-study
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .rgba-comparison-v2/**
