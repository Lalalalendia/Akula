name: Vello single-region adaptive route (experimental acceptance)

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/native/src/render/paint/mod.rs'
      - 'aquilum-app/native/src/render/renderer/mod.rs'
      - 'aquilum-app/native/src/app/tests/perf/worker_router.rs'
      - 'aquilum-app/native/src/app/tests/perf/worker_crossover.rs'
      - '.github/workflows/native-vello-single-region-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vello-single-region-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: One-region guard, mixed-frame parity / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest] # MAC-HOLD-01: macOS frozen
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-single-region-v1
          cache-workspace-crates: true
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Exact runner and source revision
        shell: bash
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Reject fragmented, oversized, empty or disabled serial routing
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-native --bin aquilum-native adaptive_constructor_switches_only_when_enabled -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native adaptive_small_rect_default_has_explicit_rollback -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native adaptive_serial_only_for_single_small_damage -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native zero_worker_renderer_never_allocates_a_companion -- --nocapture --test-threads=1
      - name: Real editor 0/2/routed pixel parity under mixed scroll and full invalidation
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_dual_dispatch_route -- --ignored --nocapture --test-threads=1
      - name: Real fractional-scroll reference-frame parity
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-native --bin aquilum-native hinted_fractional_scroll_remains_pixel_stable -- --nocapture --test-threads=1
      - name: Three real guard96 and natural-scroll adaptive pixel proofs
        working-directory: aquilum-app
        shell: bash
        env:
          AKULA_VELLO_SINGLE_RECT: '1'
          AQ_CROSSOVER_ADAPTIVE: '1'
          AQ_CROSSOVER_EVERY_FRAME: '1'
        run: |
          set -euo pipefail
          for trial in 1 2 3; do
            echo "VELLO_ADAPTIVE_GUARD96_BEGIN trial=$trial"
            # Two guard bands per row move: pixel parity must hold, but these
            # fragmented frames must NOT be forced down the single-rect route.
            AQ_CROSSOVER_ONLY_CASE=cover_1x AQ_CROSSOVER_WORKLOAD=guard96 \
              AQ_TEST_SCROLL_EDGE_GUARD=96 \
              cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_worker_crossover -- --ignored --nocapture --test-threads=1
            echo "VELLO_ADAPTIVE_GUARD96_PASS trial=$trial"
            echo "VELLO_ADAPTIVE_NATURAL_BEGIN trial=$trial"
            # Natural scrolling has actual single-small-rectangle damage.
            # Both 2- and 4-worker production renderers must really switch.
            AQ_CROSSOVER_ONLY_CASE=text_1x AQ_CROSSOVER_WORKLOAD=normal \
              AQ_CROSSOVER_REQUIRE_SWITCH=1 \
              cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_worker_crossover -- --ignored --nocapture --test-threads=1
            echo "VELLO_ADAPTIVE_NATURAL_PASS trial=$trial"
          done
          echo "Three strict all-frame guard96 proofs plus three actual-route natural-scroll proofs" >> "$GITHUB_STEP_SUMMARY"
