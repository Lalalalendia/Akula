name: AK-CALL-02 isolated Windows output probe

on:
  pull_request:
    branches:
      - main
    paths:
      - 'interop/akula-call-audio-windows/**'
      - '.github/workflows/akula-call-audio-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-audio-probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        shell: bash
        run: cargo fmt --manifest-path interop/akula-call-audio-windows/Cargo.toml -- --check
      - name: Compile Windows-only diagnostic without opening OS devices
        shell: bash
        run: cargo check --manifest-path interop/akula-call-audio-windows/Cargo.toml --all-targets
      - name: Run pure approval and sound-boundary tests
        shell: bash
        run: cargo test --manifest-path interop/akula-call-audio-windows/Cargo.toml -- --nocapture
      - name: Lint isolated diagnostic
        shell: bash
        run: cargo clippy --manifest-path interop/akula-call-audio-windows/Cargo.toml --all-targets -- -D warnings
