name: Docs and installer checks

on:
  # Validate feature branches via PR only; preserve post-merge push checks.
  push:
    branches: [main]
    paths:
      - "*.md"
      - "**/*.md"
      - "screenshots/**"
      - "scripts/install.sh"
      - "scripts/uninstall.sh"
      - "scripts/test-install-scripts.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - "screenshots/**"
      - "scripts/install.sh"
      - "scripts/uninstall.sh"
      - "scripts/test-install-scripts.sh"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# Replaced PR heads cancel obsolete docs jobs; manual dispatch is absent.
concurrency:
  group: docs-installer-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          fi

      - name: Check macOS installer scripts
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-scripts.sh
          bash scripts/test-install-scripts.sh
