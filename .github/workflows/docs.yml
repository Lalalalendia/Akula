name: Docs and installer checks

on:
  # The required Application checks already enforce patch whitespace and
  # exercise installer shell scripts on EVERY PR. Run separate Linux/macOS
  # installer acceptance only when installer code or this workflow changes.
  # This avoids spending macOS runners on Markdown/screenshots-only PRs.
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/uninstall.sh"
      - "scripts/test-install-scripts.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/uninstall.sh"
      - "scripts/test-install-scripts.sh"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# Native and docs checks on a force-updated PR must represent the exact
# newest head. Cancel obsolete pushes/rebases so earlier queued macOS jobs
# cannot consume the same runner or be mistaken for acceptance.
concurrency:
  group: docs-installer-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # A PR merge SHA is synthetic; check its entire branch delta.
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [[ -n "$BEFORE_SHA" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # A forced main update is exceptional; still check new commit.
            git diff --check "${GITHUB_SHA}^" "$GITHUB_SHA"
          else
            # A rebased/force-pushed feature branch can leave BEFORE_SHA
            # unreachable on a clean CI checkout. Never skip whitespace:
            # validate the full branch diff against its real merge base.
            git fetch --no-tags origin main
            branch_base=$(git merge-base "$GITHUB_SHA" refs/remotes/origin/main)
            git diff --check "$branch_base" "$GITHUB_SHA"
          fi

      - name: Check macOS installer scripts
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-scripts.sh
          bash scripts/test-install-scripts.sh

  macos-installer:
    name: macOS installer BSD-lock and crash recovery
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise real macOS lockf, cross-process restore and HOLD
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/lockf
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-scripts.sh
          bash scripts/test-install-scripts.sh
