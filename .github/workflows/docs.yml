name: Docs and installer checks

on:
  # The required Application checks already enforce patch whitespace and
  # exercise installer shell scripts on EVERY PR. Run separate Linux/macOS
  # installer acceptance only when installer code or this workflow changes.
  # This avoids spending macOS runners on Markdown/screenshots-only PRs.
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/uninstall.sh"
      - "scripts/test-install-scripts.sh"
      - "scripts/verify-macos-release.sh"
      - "scripts/test-macos-release-verifier.sh"
      - "scripts/verify_mac_tar_parity.py"
      - "scripts/test_mac_tar_parity.py"
      - "aquilum-app/native/src/updater/tar.rs"
      - "aquilum-app/native/src/updater/apply.rs"
      - "aquilum-app/native/src/updater/macos_transaction.rs"
      - "aquilum-app/native/src/updater/startup_ack.rs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/uninstall.sh"
      - "scripts/test-install-scripts.sh"
      - "scripts/verify-macos-release.sh"
      - "scripts/test-macos-release-verifier.sh"
      - "scripts/verify_mac_tar_parity.py"
      - "scripts/test_mac_tar_parity.py"
      - "aquilum-app/native/src/updater/tar.rs"
      - "aquilum-app/native/src/updater/apply.rs"
      - "aquilum-app/native/src/updater/macos_transaction.rs"
      - "aquilum-app/native/src/updater/startup_ack.rs"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# Native and docs checks on a force-updated PR must represent the exact
# newest head. Cancel obsolete pushes/rebases so earlier queued macOS jobs
# cannot consume the same runner or be mistaken for acceptance.
concurrency:
  group: docs-installer-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # A PR merge SHA is synthetic; check its entire branch delta.
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [[ -n "$BEFORE_SHA" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # A forced main update is exceptional; still check new commit.
            git diff --check "${GITHUB_SHA}^" "$GITHUB_SHA"
          else
            # A rebased/force-pushed feature branch can leave BEFORE_SHA
            # unreachable on a clean CI checkout. Never skip whitespace:
            # validate the full branch diff against its real merge base.
            git fetch --no-tags origin main
            branch_base=$(git merge-base "$GITHUB_SHA" refs/remotes/origin/main)
            git diff --check "$branch_base" "$GITHUB_SHA"
          fi

      - name: Check macOS installer scripts
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-scripts.sh scripts/verify-macos-release.sh scripts/test-macos-release-verifier.sh
          bash scripts/test-install-scripts.sh
          bash scripts/test-macos-release-verifier.sh
          python3 -m unittest discover -s scripts -p 'test_mac_tar_parity.py' -v

  macos-installer:
    name: macOS installer BSD-lock and crash recovery
    # Stable Intel runner keeps BSD lock/restore evidence on x86_64 macOS.
    # This retains ALL tests; previous macos-latest jobs were cancelled before execution.
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise real macOS lockf, cross-process restore and HOLD
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/lockf
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-scripts.sh scripts/verify-macos-release.sh scripts/test-macos-release-verifier.sh
          bash scripts/test-install-scripts.sh
          bash scripts/test-macos-release-verifier.sh
          python3 -m unittest discover -s scripts -p 'test_mac_tar_parity.py' -v
      - uses: dtolnay/rust-toolchain@stable
      - name: Native macOS TAR extractor security regression tests
        shell: bash
        run: |
          set -euo pipefail
          printf '#[path = "%s"] mod tar;\n' "$GITHUB_WORKSPACE/aquilum-app/native/src/updater/tar.rs" > "$RUNNER_TEMP/akula_tar_test_harness.rs"
          rustc --edition=2024 --test -D warnings "$RUNNER_TEMP/akula_tar_test_harness.rs" -o "$RUNNER_TEMP/akula_tar_security_tests"
          "$RUNNER_TEMP/akula_tar_security_tests" --nocapture
      - name: Native macOS shared BSD-lock and updater crash recovery tests
        shell: bash
        run: |
          set -euo pipefail
          printf '#[path = "%s"] mod txn;\n' "$GITHUB_WORKSPACE/aquilum-app/native/src/updater/macos_transaction.rs" > "$RUNNER_TEMP/akula_updater_txn_harness.rs"
          rustc --edition=2024 --test -D warnings "$RUNNER_TEMP/akula_updater_txn_harness.rs" -o "$RUNNER_TEMP/akula_updater_txn_tests"
          "$RUNNER_TEMP/akula_updater_txn_tests" --nocapture
