name: Akula Bootstrap B1b2b signed Node in independent Ubuntu VM

on:
  pull_request:
    branches: [main]
    paths:
      - "aquilum-app/core/examples/akula_b1b2b_release_fixture.rs"
      - "scripts/ci/akula-b1b2b-ubuntu-vm.sh"
      - "scripts/ci/akula-b1b2b-guest-lab.sh"
      - "scripts/ci/akula-b1b2b-node-wrapper.sh"
      - "docs/platforms/AKULA-SERVER-BOOTSTRAP-B1B2B.md"
      - "docs/platforms/AKULA-SERVER-BOOTSTRAP-B1B2B1.md"
      - "docs/platforms/AKULA-SERVER-BOOTSTRAP-B1B2B2.md"
      - ".github/workflows/core-server-bootstrap-b1b2b-ubuntu.yml"
      - "aquilum-app/core/Cargo.toml"
      - "aquilum-app/core/src/server_release_lab.rs"
      - "aquilum-app/core/src/bin/akula_node_lab.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-bootstrap-b1b2b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-node-real-ubuntu-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-bootstrap-b1b2b-ubuntu-vm-v1
          cache-workspace-crates: true
      - name: Build exact checked-out read-only Node and B1a wire verifier
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 core/examples/akula_b1b2b_release_fixture.rs
          cargo build --locked -p aquilum-core --features node-lab --bin akula-node-lab
          cargo build --locked -p aquilum-core --features server-bootstrap-b1a-release-lab --example akula_b1b2b_release_fixture
          cargo test --locked -p aquilum-core --features server-bootstrap-b1a-release-lab --test server_bootstrap_b1a -- --nocapture
      - name: Check CI-only test scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/akula-b1b2b-ubuntu-vm.sh
          bash -n scripts/ci/akula-b1b2b-guest-lab.sh
          bash -n scripts/ci/akula-b1b2b-node-wrapper.sh
      - name: Real GPG-pinned QEMU guest Ed25519 and systemd crash recovery
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/akula-b1b2b-ubuntu-vm.sh
