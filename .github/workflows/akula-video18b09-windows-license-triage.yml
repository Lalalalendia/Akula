name: Akula VIDEO-18b-09 Windows-target license triage (non-release)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/video18b09-windows-license-triage.cjs'
      - '.github/scripts/video18b09-windows-license-triage.test.cjs'
      - '.github/workflows/akula-video18b09-windows-license-triage.yml'
      - '.github/scripts/video18b08-license-file-evidence.cjs'
      - '.github/scripts/video18b07-license-inventory.cjs'
      - 'docs/release/video18b04-five-exe-allowlist.json'
      - 'docs/release/video18b09-windows-license-triage.md'
      - '.github/scripts/video-tools-01q-executable-license-evidence.cjs'
      - '.github/scripts/video-tools-01q-executable-license-evidence.test.cjs'
      - 'docs/release/video-tools-01q-binary-license-review.md'
      - '.github/scripts/video-tools-01t-source-starter.py'
      - '.github/scripts/video-tools-01t-source-starter.test.py'
      - 'docs/release/video-tools-01t-source-starter.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-contract:
    name: Fail-closed target closure and non-release tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify source, graph mismatch, license and release HOLD negatives
        run: |
          node --test .github/scripts/video18b09-windows-license-triage.test.cjs
          node --test .github/scripts/video-tools-01q-executable-license-evidence.test.cjs
          python3 .github/scripts/video-tools-01t-source-starter.test.py
      - name: Checkout exact tagged yt-dlp source for executable-license evidence
        uses: actions/checkout@v4
        with:
          repository: yt-dlp/yt-dlp
          ref: f264a6cbd1f630894da0f368df00f8aae50140e0
          path: _video-tools-01q-yt
          persist-credentials: false
      - name: Checkout exact tagged QuickJS source for MIT copyright evidence
        uses: actions/checkout@v4
        with:
          repository: quickjs-ng/quickjs
          ref: d7215b0ad3fc2c562e8317fd9bca058fd4863804
          path: _video-tools-01q-qjs
          persist-credentials: false
      - name: Verify immutable source license Git blobs without approving executable distribution
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node .github/scripts/video-tools-01q-executable-license-evidence.cjs \
            docs/release/video18b04-five-exe-allowlist.json \
            _video-tools-01q-yt _video-tools-01q-qjs \
            "$EXPECTED_HEAD_SHA" "$RUNNER_TEMP/video-tools-01q-license-HOLD.json" \
            | tee "$RUNNER_TEMP/video-tools-01q-evidence.log"
          grep -Fx 'VIDEO_TOOLS_01Q_SOURCE_LICENSE_PASS pinned_tags=2 verified_texts=4 binary_gpl3plus=1 legal_approval=0 release=0' \
            "$RUNNER_TEMP/video-tools-01q-evidence.log"
      - name: Retain only one-day non-approval license metadata, never sources or binaries
        uses: actions/upload-artifact@v4
        with:
          name: video-tools-01q-executable-license-evidence-HOLD
          path: ${{ runner.temp }}/video-tools-01q-license-HOLD.json
          if-no-files-found: error
          retention-days: 1

      - name: Checkout immutable yt-dlp custom PyInstaller bootloader recipe (no binary wheel)
        uses: actions/checkout@v4
        with:
          repository: yt-dlp/Pyinstaller-Builds
          ref: 5eb86b862d61adc3df0f44e6e0b815b7d74fa3f
          path: _video-tools-01t-pyi-builder
          persist-credentials: false
      - name: Stage four pinned Git source snapshots, explicitly NOT complete corresponding source
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/video-tools-01t-source-starter.py \
            docs/release/video18b04-five-exe-allowlist.json \
            _video-tools-01q-yt _video-tools-01q-qjs _video-tools-01t-pyi-builder \
            "$EXPECTED_HEAD_SHA" "$RUNNER_TEMP/video-tools-01t-source-starter-HOLD" \
            | tee "$RUNNER_TEMP/video-tools-01t-proof.log"
          grep -Fx 'VIDEO_TOOLS_01T_SOURCE_STARTER_PASS source_trees=4 wheels=0 complete_source=0 rebuilt_exe=0 legal_approval=0 release=0' \
            "$RUNNER_TEMP/video-tools-01t-proof.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'video-tools-01t-source-starter-HOLD'
          m=json.loads((p/'manifest-NOT-COMPLETE.json').read_text('utf8'))
          assert m['release_admitted'] is False and m['legal_approval'] is False
          assert m['complete_corresponding_source_available'] is False
          assert m['corresponding_source_rebuilt_and_verified'] is False
          assert m['windows_executables_included'] is False
          assert len(m['snapshots'])==4
          assert all(m['snapshots'][k]['tracked_file_count']>5 for k in m['snapshots'])
          assert m['windows_x64_pinned_install_requirements']['curl-cffi']['yt-dlp-ejs']['version']=='0.8.0'
          assert sorted(x.name for x in p.iterdir())==sorted(
            ['yt-dlp-2026.10.26-GIT-ONLY.tar.gz',
             'quickjs-v0.18.0-GIT-ONLY.tar.gz',
             'akula-video-mux-GIT-ONLY.tar.gz',
             'pyinstaller-build-recipe-GIT-ONLY.tar.gz',
             'manifest-NOT-COMPLETE.json','README-NOT-COMPLETE.txt'])
          PY
      - name: Retain one-day public Git source STARTER only, no EXE, no release approval
        uses: actions/upload-artifact@v4
        with:
          name: video-tools-01t-source-starter-NOT-COMPLETE
          path: ${{ runner.temp }}/video-tools-01t-source-starter-HOLD/
          if-no-files-found: error
          retention-days: 1

  windows-target-license-triage:
    name: Windows-msvc pinned video feature closure and license review queue
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/shiva
          ref: cb542d30d2c18a18b1ee457f5158d5b0f551757e
          path: _shiva-preview
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve exact pinned all-feature conservative reference graphs
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --all-features --format-version 1 --manifest-path aquilum-app/Cargo.toml > "$RUNNER_TEMP/video18b09-full-akula.json"
          cargo metadata --locked --all-features --format-version 1 --manifest-path labs/video-lite/Cargo.toml > "$RUNNER_TEMP/video18b09-full-mux.json"
          cargo metadata --locked --all-features --format-version 1 --manifest-path _shiva-preview/Cargo.toml > "$RUNNER_TEMP/video18b09-full-shiva.json"
      - name: Resolve Windows video feature graphs for precisely named package roots
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc \
            --features installed,video-rust-bundle \
            --manifest-path aquilum-app/native/Cargo.toml > "$RUNNER_TEMP/video18b09-win-akula.json"
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc \
            --manifest-path labs/video-lite/Cargo.toml > "$RUNNER_TEMP/video18b09-win-mux.json"
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc \
            --manifest-path _shiva-preview/cli/Cargo.toml > "$RUNNER_TEMP/video18b09-win-shiva.json"
      - name: Reproduce immutable evidence and reject mismatched target graphs
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C _shiva-preview rev-parse HEAD)" = cb542d30d2c18a18b1ee457f5158d5b0f551757e
          node .github/scripts/video18b07-license-inventory.cjs \
            "$RUNNER_TEMP/video18b09-full-akula.json" \
            "$RUNNER_TEMP/video18b09-full-mux.json" \
            "$RUNNER_TEMP/video18b09-full-shiva.json" \
            docs/release/video18b04-five-exe-allowlist.json \
            "$EXPECTED_HEAD_SHA" "$RUNNER_TEMP/video18b09-full-inventory.json"
          node .github/scripts/video18b08-license-file-evidence.cjs \
            "$RUNNER_TEMP/video18b09-full-akula.json" \
            "$RUNNER_TEMP/video18b09-full-mux.json" \
            "$RUNNER_TEMP/video18b09-full-shiva.json" \
            "$RUNNER_TEMP/video18b09-full-inventory.json" \
            docs/release/video18b04-five-exe-allowlist.json \
            "$EXPECTED_HEAD_SHA" "$RUNNER_TEMP/video18b09-full-evidence.json"
          node .github/scripts/video18b09-windows-license-triage.cjs \
            "$RUNNER_TEMP/video18b09-win-akula.json" \
            "$RUNNER_TEMP/video18b09-win-mux.json" \
            "$RUNNER_TEMP/video18b09-win-shiva.json" \
            "$RUNNER_TEMP/video18b09-full-inventory.json" \
            "$RUNNER_TEMP/video18b09-full-evidence.json" \
            docs/release/video18b04-five-exe-allowlist.json \
            "$EXPECTED_HEAD_SHA" "$RUNNER_TEMP/video18b09-windows-triage-HOLD.json"
      - name: Retain only non-approval JSON report, no binaries or license texts
        uses: actions/upload-artifact@v4
        with:
          name: video18b09-windows-target-licenses-NOT-APPROVAL
          path: ${{ runner.temp }}/video18b09-windows-triage-HOLD.json
          if-no-files-found: error
          retention-days: 1
