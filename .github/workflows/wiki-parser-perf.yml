name: Wiki parser performance

on:
  # Ignored performance benchmarks are diagnostics, not correctness gates.
  pull_request:
    paths:
      - ".github/workflows/wiki-parser-perf.yml"
  workflow_dispatch:

permissions:
  contents: read

# New commits on one PR supersede its older experimental/diagnostic checks.
# Explicit workflow_dispatch runs are never preempted automatically.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: wiki-parser-perf
      - name: Compare scanner and fast path on identical Markdown
        shell: bash
        working-directory: aquilum-app
        run: |
          set -o pipefail
          cargo test --release --locked -p aquilum-core benchmark_no_wikilinks_fast_path -- --ignored --nocapture --test-threads=1 2>&1 | tee ../wiki-perf.txt
          grep 'WIKI_PERF ' ../wiki-perf.txt
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-perf-${{ github.sha }}
          path: wiki-perf.txt
          retention-days: 30
