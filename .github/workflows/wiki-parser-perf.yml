name: Wiki parser performance

on:
  pull_request:
    paths:
      - "aquilum-app/core/src/search/wiki/parser.rs"
      - ".github/workflows/wiki-parser-perf.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: wiki-parser-perf
      - name: Compare scanner and fast path on identical Markdown
        shell: bash
        working-directory: aquilum-app
        run: |
          set -o pipefail
          cargo test --release --locked -p aquilum-core benchmark_no_wikilinks_fast_path -- --ignored --nocapture --test-threads=1 2>&1 | tee ../wiki-perf.txt
          grep 'WIKI_PERF ' ../wiki-perf.txt
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-perf-${{ github.sha }}
          path: wiki-perf.txt
          retention-days: 30
