name: DICOM ZIP lockfile snapshot (temporary, no write token)
on:
  push:
    branches:
      - feat/dicom-readonly-preview-20261026
    paths:
      - '.github/workflows/dicom-zip-lock-snapshot.yml'
      - 'aquilum-app/native/Cargo.toml'
      - 'scripts/dicom-native-smoke/Cargo.toml'
permissions:
  contents: read
concurrency:
  group: dicom-zip-lock-snapshot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve only required changes in Cargo.lock
        run: |
          cargo fetch --manifest-path aquilum-app/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          s = Path('aquilum-app/Cargo.lock').read_text()
          assert 'name = "zip"\nversion = "9.0.5"' in s, 'ZIP 9.0.5 not resolved'
          assert 'name = "zip"\nversion = "2.6.1"' not in s, 'Vulnerable ZIP still in lockfile'
          print("AKULA_DICOM_ZIP_9_RESOLVED", flush=True)
          PY
      - name: Export resolved lockfile for audited commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from base64 import b64encode
          raw = Path('aquilum-app/Cargo.lock').read_bytes()
          encoded = b64encode(raw).decode('ascii')
          print(f'AKULA_LOCK_BYTES:{len(raw)}', flush=True)
          for i in range(0, len(encoded), 1200):
              print('AKULA_LOCK_B64:' + encoded[i:i+1200], flush=True)
          print('AKULA_LOCK_END', flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: akula-dicom-zip9-resolved-cargo-lock-${{ github.run_id }}
          path: aquilum-app/Cargo.lock
          retention-days: 3
          if-no-files-found: error
