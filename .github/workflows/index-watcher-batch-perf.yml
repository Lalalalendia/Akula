name: Index watcher batch experiment

on:
  # Only self-edits and explicit opt-in run the ignored performance benchmark.
  # Required workspace tests continue to cover watcher_batch_ correctness.
  pull_request:
    paths:
      - ".github/workflows/index-watcher-batch-perf.yml"
  workflow_dispatch:

permissions:
  contents: read

# New commits on one PR supersede its older experimental/diagnostic checks.
# Explicit workflow_dispatch runs are never preempted automatically.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: index-worker-batch
      - name: Run watcher batching correctness tests
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core watcher_batch_ -- --nocapture --test-threads=1
      - name: Measure collect_batch queue and window profiles
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-core benchmark_event_batch_window -- --ignored --nocapture --test-threads=1 2>&1 | tee ../watcher-batch.txt
          grep 'EVENT_BATCH ' ../watcher-batch.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-batch-${{ github.sha }}
          path: watcher-batch.txt
          retention-days: 30
