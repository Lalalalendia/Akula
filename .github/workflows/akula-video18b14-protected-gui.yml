name: Akula VIDEO-18b-14 protected real NSIS GUI video (non-release)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/windows-video18b14-protected-installed-gui.ps1'
      - 'aquilum-app/native/src/updater/frame_ack.rs'
      - 'aquilum-app/native/src/updater/windows_first_gui_ack.rs'
      - '.github/scripts/video18b18c-first-frame.test.cjs'
      - 'docs/release/video18b18c-first-frame-windows.md'
      - 'labs/video-lite/video18c02_windows_child_ipc.rs'
      - '.github/scripts/video18c02-windows-child-ipc.test.cjs'
      - 'docs/release/video18c02-real-child-ipc.md'
      - 'scripts/windows-video18b14-protected-gui.ps1'
      - 'labs/video-lite/video18b14/gui_acceptance.py'
      - '.github/scripts/video18b14-protected-gui.test.cjs'
      - '.github/workflows/akula-video18b14-protected-gui.yml'
      - 'docs/release/video18b14-protected-installed-gui.md'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Fail-closed real Program Files GUI and no-release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate source and five EXE custody release boundary
        run: node --test .github/scripts/video18c02-windows-child-ipc.test.cjs .github/scripts/video18b18c-first-frame.test.cjs .github/scripts/video18b14-protected-gui.test.cjs .github/scripts/video18b11-protected-real-nsis.test.cjs

  fixture:
    name: Generate synthetic localhost DASH for protected NSIS GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Generate only relative URL segments
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          test -s labs/video-lite/fixtures/avc_aac_2s.mp4
          mkdir -p video18b14-fixture
          ffmpeg -hide_banner -loglevel error -nostdin \
            -stream_loop 2 -i labs/video-lite/fixtures/avc_aac_2s.mp4 \
            -t 6 -map 0:v:0 -map 0:a:0 -c copy \
            -f dash -seg_duration 1 -use_template 1 -use_timeline 1 \
            video18b14-fixture/manifest.mpd
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          root=pathlib.Path('video18b14-fixture')
          ns='{urn:mpeg:dash:schema:mpd:2011}'
          mpd=ET.parse(root/'manifest.mpd')
          assert len(mpd.findall('.//'+ns+'Representation'))==2
          assert len(list(root.glob('*.m4s')))>=4
          for item in mpd.findall('.//'+ns+'SegmentTemplate'):
              for key in ('media','initialization'):
                  assert '://' not in item.attrib.get(key,'')
          for item in mpd.findall('.//'+ns+'BaseURL'):
              assert '://' not in (item.text or '')
          print('VIDEO16_LOCAL_DASH_FIXTURE_PASS tracks=2')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: video18b14-only-local-dash
          path: video18b14-fixture/
          retention-days: 2
          if-no-files-found: error

  real-gui:
    name: Five genuine Program Files EXEs, physical GUI Download/restart/play, uninstall
    needs: [contract, fixture]
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/shiva
          ref: cb542d30d2c18a18b1ee457f5158d5b0f551757e
          path: _shiva-preview
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: video18b14-only-local-dash
          path: video18b14-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            aquilum-app -> ../.artifacts/cargo-native
            labs/video-lite
          shared-key: akula-video16-real-gui-windows-v1
          save-if: false
      - name: Parse real custody PowerShell script before expensive builds
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-video18b04-real-five-custody.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0){ throw "VIDEO18B04 invalid PowerShell: $($errors | Out-String)" }
          Write-Host 'VIDEO18B04_POWERSHELL_PARSE_PASS'
      - name: Build source-pinned Shiva CLI with tracked immutable dependency lock
        shell: pwsh
        env:
          VIDEO18B04_SHIVA_COMMIT: cb542d30d2c18a18b1ee457f5158d5b0f551757e
        run: |
          $ErrorActionPreference='Stop'
          $commit=(git -C _shiva-preview rev-parse HEAD).Trim()
          if($commit -cne $env:VIDEO18B04_SHIVA_COMMIT){throw 'Shiva commit changed'}
          $tracked=(git -C _shiva-preview ls-files --error-unmatch -- Cargo.lock 2>$null | Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $tracked -cne 'Cargo.lock'){throw 'Shiva source must track its workspace Cargo.lock'}
          $expected='62b83af03e4079f6603eef7f7170edc4138a8233ad57829adf13baacd3f2b1d4'
          $crlf='80a05fc499cdc6961256d4b1569db828d6a5e56506aa37af60ac25c0d196c9f1'
          $blob='e9d6d1feee9ef3c76df19ce24033e6f34f0181d6'
          $sourceBlob=(git -C _shiva-preview rev-parse HEAD:Cargo.lock).Trim()
          $actual=(Get-FileHash -LiteralPath _shiva-preview/Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sourceBlob -cne $blob -or ($actual -cne $expected -and $actual -cne $crlf)){
            throw 'Shiva source blob or exact LF/CRLF lock checkout SHA256 mismatched'
          }
          Write-Host 'VIDEO18B05_SHIVA_LOCK_PIN_PASS tracked=1 source_blob=1 exact_checkout=1'
          $env:CARGO_TARGET_DIR=Join-Path $env:RUNNER_TEMP 'video18b04-shiva'
          cargo build --release --locked --manifest-path _shiva-preview/Cargo.toml -p cli
          if($LASTEXITCODE -ne 0){throw 'Pinned Shiva build failed'}
          $file=Join-Path $env:CARGO_TARGET_DIR 'release/shiva.exe'
          if(!(Test-Path -LiteralPath $file -PathType Leaf)){throw 'Built Shiva CLI missing'}
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18B04_SHIVA=$file"
      - name: Build Rust mux with immutable reviewed Cargo.lock
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo test --release --locked --manifest-path labs/video-lite/Cargo.toml --bin dash
          if($LASTEXITCODE -ne 0){throw 'Rust mux tests failed'}
          cargo build --release --locked --manifest-path labs/video-lite/Cargo.toml --bin dash
          if($LASTEXITCODE -ne 0){throw 'Rust mux build failed'}
          $mux=(Resolve-Path labs/video-lite/target/release/dash.exe).Path
          $pin=(Get-FileHash -LiteralPath $mux -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -Path $env:GITHUB_ENV -Value "AKULA_BUNDLED_MUX_SHA256=$pin"
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18B04_MUX=$mux"
      - name: Download and verify exact upstream yt-dlp and QuickJS bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'video18b04-upstream'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $yt=Join-Path $dir 'yt-dlp.exe'
          $js=Join-Path $dir 'qjs.exe'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe' -OutFile $yt -UseBasicParsing
          Invoke-WebRequest 'https://github.com/quickjs-ng/quickjs/releases/download/v0.18.0/qjs-windows-x86_64.exe' -OutFile $js -UseBasicParsing
          $allow=Get-Content -LiteralPath docs/release/video18b04-five-exe-allowlist.json -Raw | ConvertFrom-Json
          foreach($pair in @(@('akula-yt-dlp.exe',$yt),@('akula-quickjs.exe',$js))){
            $entry=@($allow.components | Where-Object {$_.name -ceq $pair[0]})
            if($entry.Count -ne 1 -or
              (Get-FileHash -LiteralPath $pair[1] -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry[0].sha256 -or
              (Get-Item -LiteralPath $pair[1]).Length -ne $entry[0].size_bytes){
              throw "VIDEO18B04 upstream pin failure: $($pair[0])"
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18B04_YT=$yt"
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18B04_JS=$js"
          Write-Host 'VIDEO18B04_UPSTREAM_PINS_PASS downloaded=2 exact_sha256_and_size=1'
      - name: Build actual Akula with experimental Rust video feature (no package)
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference='Stop'
          cargo build --release --locked -p aquilum-native --features installed,video-rust-bundle,video-ui-e2e
          if($LASTEXITCODE -ne 0){throw 'Akula video-enabled lab build failed'}
          $app=Join-Path $env:GITHUB_WORKSPACE '.artifacts/cargo-native/release/aquilum-native.exe'
          if(!(Test-Path -LiteralPath $app -PathType Leaf)){throw 'Video Akula binary missing'}
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO18B04_APP=$app"
      - name: Attest exact real five EXEs, reject mutation and preserve license HOLD
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./scripts/windows-video18b04-real-five-custody.ps1 -AppPath $env:VIDEO18B04_APP -ShivaPath $env:VIDEO18B04_SHIVA -MuxPath $env:VIDEO18B04_MUX -YtDlpPath $env:VIDEO18B04_YT -QuickJsPath $env:VIDEO18B04_JS -ReportPath (Join-Path $env:RUNNER_TEMP 'video18b04-custody.json')
          if($LASTEXITCODE -ne 0){throw 'VIDEO18B04 real provenance proof failed'}
      - name: Install pinned NSIS 3.11.0 on disposable Windows runner
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 --yes --no-progress
          if($LASTEXITCODE -ne 0){ throw 'VIDEO18B11 pinned NSIS unavailable' }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-video18b11-protected-real-five.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0){ throw "VIDEO18B11 invalid PowerShell: $($errors | Out-String)" }
          Write-Host 'VIDEO18B11_POWERSHELL_PARSE_PASS'
      - name: Windows inherited pipe ACK transport tests (no update commit)
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference='Stop'
          cargo test --release --locked -p aquilum-native --features installed,video-rust-bundle,video-ui-e2e updater::frame_ack::windows_first_gui_ack::tests -- --nocapture
          if($LASTEXITCODE -ne 0){ throw 'VIDEO18C_HOLD: inherited-ACK Windows unit witness failed' }
          Write-Host 'VIDEO18C_WIN_INHERITED_PIPE_TRANSPORT_PASS release=0 commit=0'
      - name: Windows real child process allowlisted pipe lab (no commit)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_OS -cne 'Windows' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:GITHUB_EVENT_NAME -cne 'pull_request' -or
              (git rev-parse HEAD).Trim() -cne '${{ github.event.pull_request.head.sha }}'){
            throw 'VIDEO18C02_HOLD: only exact HEAD hosted Windows pull_request'
          }
          $bin=Join-Path $env:RUNNER_TEMP 'video18c02-child-ipc.exe'
          try {
            rustc --edition=2024 -C opt-level=1 labs/video-lite/video18c02_windows_child_ipc.rs -o $bin
            if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $bin -PathType Leaf)){
              throw 'VIDEO18C02_HOLD: Windows parent/child IPC lab did not compile'
            }
            $lines = & $bin 2>&1
            $rc = $LASTEXITCODE
            $lines | Out-Host
            if($rc -ne 0 -or !(($lines | Out-String).Contains('VIDEO18C02_REAL_PARENT_CHILD_PIPE_PASS'))){
              throw 'VIDEO18C02_HOLD: OS child process IPC proof failed or missing witness'
            }
            Write-Host 'VIDEO18C02_CHILD_PROCESS_LAB_CI_PASS signed=0 gui=0 confirm=0 release=0'
          } finally {
            Remove-Item -LiteralPath $bin -Force -ErrorAction SilentlyContinue
          }
      - name: Install protected real five PE NSIS, click actual GUI, restart, decode and uninstall
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $tokens=$null; $errors=$null
          foreach($path in @('scripts/windows-video18b14-protected-installed-gui.ps1','scripts/windows-video18b14-protected-gui.ps1')){
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $path),
              [ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -ne 0){ throw "VIDEO18B14 PowerShell parse failed: $path $($errors | Out-String)" }
          }
          python -m py_compile labs/video-lite/video18b14/gui_acceptance.py
          if($LASTEXITCODE -ne 0){ throw 'VIDEO18B14 Python harness parse failed' }
          ./scripts/windows-video18b14-protected-installed-gui.ps1 -AppPath $env:VIDEO18B04_APP -ShivaPath $env:VIDEO18B04_SHIVA -MuxPath $env:VIDEO18B04_MUX -YtDlpPath $env:VIDEO18B04_YT -QuickJsPath $env:VIDEO18B04_JS -FixtureDir (Join-Path $env:GITHUB_WORKSPACE 'video18b14-fixture')
          if($LASTEXITCODE -ne 0){ throw 'VIDEO18B14 protected real installed GUI proof failed' }
      - name: Retain only unsigned custody JSON for one day, no executables
        uses: actions/upload-artifact@v4
        with:
          name: video18b04-five-exe-hashes-NOT-RELEASE
          path: ${{ runner.temp }}/video18b04-custody.json
          if-no-files-found: error
          retention-days: 1

      - name: Retain synthetic protected GUI MP4 for independent decoder only
        uses: actions/upload-artifact@v4
        with:
          name: video18b14-synthetic-protected-gui-mp4
          path: video18b14-output/protected-installed.mp4
          if-no-files-found: error
          retention-days: 1

  independent-decode:
    name: Decode both tracks of protected installed GUI result
    needs: real-gui
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: video18b14-synthetic-protected-gui-mp4
          path: video18b14-output
      - name: Independently decode actual saved MP4 audio and video
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -count_frames -show_entries stream=codec_type,codec_name,nb_read_frames:format=duration -of json video18b14-output/protected-installed.mp4 > video18b14-output/probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('video18b14-output/probe.json').read_text())
          streams=data['streams']
          assert {(s['codec_type'],s['codec_name']) for s in streams}=={('video','h264'),('audio','aac')}
          assert 4 <= float(data['format']['duration']) <= 8
          assert all(int(s['nb_read_frames'])>=30 for s in streams)
          print('VIDEO18B14_PROTECTED_GUI_INDEPENDENT_STREAMS_PASS h264=1 aac=1')
          PY
          ffmpeg -hide_banner -loglevel error -nostdin -i video18b14-output/protected-installed.mp4 -map 0:v:0 -f null -
          ffmpeg -hide_banner -loglevel error -nostdin -i video18b14-output/protected-installed.mp4 -map 0:a:0 -f null -
          echo 'VIDEO18B14_PROTECTED_GUI_INDEPENDENT_DECODE_PASS'
