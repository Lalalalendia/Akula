name: Akula book quote user journey

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/native/src/app/tests/reader/quotes.rs'
      - 'aquilum-app/native/src/app/tests/reader/mod.rs'
      - '.github/workflows/book-quote-user-journey.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-book-quote-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reader-to-search:
    name: Real GUI quote to search / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: book-quote-journey-${{ matrix.os }}
      - name: Native Linux GUI build libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Run reader quote through persisted note and native search
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-native --bin aquilum-native book_quote_survives_restart_is_searchable_and_opens_the_source -- --nocapture --test-threads=1 2>&1 | tee ../book-quote-journey.log
          grep -F 'AKULA_BOOK_QUOTE_JOURNEY_PASS=' ../book-quote-journey.log >> "$GITHUB_STEP_SUMMARY"
      - name: Synthetic test transcript, not personal data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akula-book-quote-journey-${{ matrix.os }}
          path: book-quote-journey.log
          if-no-files-found: warn
          retention-days: 10
