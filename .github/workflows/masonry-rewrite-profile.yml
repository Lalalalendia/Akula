name: Masonry rewrite pass attribution

on:
  pull_request:
    paths:
      - 'scripts/benchmarks/summarize-masonry-rewrite.py'
      - '.github/workflows/masonry-rewrite-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masonry-rewrite-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Note page rewrite phases (diagnostic, opt-in)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore shared main Rust cache (read-only)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Install native Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Capture traced note-page edits and Masonry rewrite passes
        working-directory: aquilum-app
        shell: bash
        env:
          AQ_LATENCY_SWITCHES: '16'
          # Cargo runs test binaries with the package directory as CWD, not
          # the shell working-directory. Use an absolute output path.
          AQ_REWRITE_TRACE: '${{ github.workspace }}/note-rewrite-passes.json'
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-native --bin aquilum-native native_note_latency_matrix \
            -- --ignored --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/note-rewrite-test.log"
          test -s "$GITHUB_WORKSPACE/note-rewrite-passes.json"
      - name: Summarize rewrite pass costs for page install
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/benchmarks/summarize-masonry-rewrite.py note-rewrite-passes.json 16 \
            | tee note-rewrite-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masonry-rewrite-attribution-${{ github.sha }}
          path: |
            note-rewrite-passes.json
            note-rewrite-test.log
            note-rewrite-summary.md
          if-no-files-found: warn
          retention-days: 14
