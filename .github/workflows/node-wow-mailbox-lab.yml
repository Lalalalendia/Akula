name: Node WOW mailbox bridge lab (isolated)
on:
  push:
    branches:
      - lab/node-v1-wow-mailbox-bridge-20261025
      - lab/node-v1-wow-owner-mail-policy-20261025
      - lab/node-v1-wow-root-owned-policy-20261025
      - lab/node-v1-wow-policy-cas-20261025
      - lab/node-v1-wow-root-publisher-20261025
      - lab/node-v1-wow-mail-approval-20261025
    paths:
      - 'interop/akula-staya/Cargo.toml'
      - 'interop/akula-staya/src/lib.rs'
      - 'interop/akula-staya/src/node_wow_mailbox_lab.rs'
      - 'interop/akula-staya/src/node_wow_mailbox_lab/policy.rs'
      - 'interop/akula-staya/src/node_wow_mailbox_lab/root_publish.rs'
      - 'interop/akula-staya/src/node_wow_mailbox_lab/approval.rs'
      - 'interop/akula-staya/src/node_live_read.rs'
      - 'interop/akula-staya/src/node_v1_runtime/server.rs'
      - 'interop/akula-staya/tests/node_live_identity.rs'
      - 'aquilum-app/core/src/node_v1/mod.rs'
      - 'aquilum-app/core/src/node_v1/trust.rs'
      - 'interop/akula-staya/tests/node_wow_mailbox_lab.rs'
      - 'docs/platforms/node-v1/NODE-V1-WOW-MAILBOX-LAB.md'
      - '.github/workflows/node-wow-mailbox-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-wow-mailbox-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Non-shipping Node/WOW mailbox gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check and diagnose isolated Rust formatting before Cargo compilation
        shell: bash
        run: |
          set -euo pipefail
          MODULE=interop/akula-staya/src/node_wow_mailbox_lab.rs
          TEST=interop/akula-staya/tests/node_wow_mailbox_lab.rs
          POLICY=interop/akula-staya/src/node_wow_mailbox_lab/policy.rs
          PUBLISH=interop/akula-staya/src/node_wow_mailbox_lab/root_publish.rs
          APPROVAL=interop/akula-staya/src/node_wow_mailbox_lab/approval.rs
          LIVE=interop/akula-staya/src/node_live_read.rs
          SERVER=interop/akula-staya/src/node_v1_runtime/server.rs
          LIVE_TEST=interop/akula-staya/tests/node_live_identity.rs
          rustfmt --edition 2024 "$MODULE" "$TEST" "$POLICY" "$PUBLISH" "$APPROVAL" "$LIVE" "$SERVER" "$LIVE_TEST"
          if ! git diff --quiet -- "$MODULE" "$TEST" "$POLICY" "$PUBLISH" "$APPROVAL" "$LIVE" "$SERVER" "$LIVE_TEST"; then
            for target in "$MODULE" "$TEST" "$POLICY" "$PUBLISH" "$APPROVAL" "$LIVE" "$SERVER" "$LIVE_TEST"; do
              echo "RUSTFMT_BASE64_START:${target}"
              base64 -w 0 "$target"
              echo
              echo "RUSTFMT_BASE64_END:${target}"
            done
            echo 'Formatting differences detected: fail before expensive build'
            exit 1
          fi
      - name: Build feature-gated library without changing the signed Node ELF
        run: cargo check --manifest-path interop/akula-staya/Cargo.toml --features node-wow-mailbox-lab --lib
      - name: Test separate Node root policy and mail trust / persisted read
        run: cargo test --manifest-path interop/akula-staya/Cargo.toml --features node-wow-mailbox-lab --test node_wow_mailbox_lab -- --nocapture
      - name: Prove real nonroot process can read root-owned mail files but cannot change them
        env:
          AKULA_WOW_ROOT_MAIL_OS_TEST: "1"
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v sudo
          test ! -e /etc/akula-node
          timeout 180s cargo test --manifest-path interop/akula-staya/Cargo.toml --features node-wow-mailbox-lab --test node_wow_mailbox_lab root_owned_mail_policy_is_read_only_and_current -- --exact --nocapture
          test ! -e /etc/akula-node
      - name: Re-test existing live-Iroh roster and grant identity behavior
        run: cargo test --manifest-path interop/akula-staya/Cargo.toml --features node-wow-mailbox-lab --test node_live_identity -- --nocapture
      - name: Enforce strict warnings for the isolated module
        run: cargo clippy --manifest-path interop/akula-staya/Cargo.toml --features node-wow-mailbox-lab --test node_wow_mailbox_lab -- -D warnings
      - name: Check Rust formatting
        run: cargo fmt --manifest-path interop/akula-staya/Cargo.toml -- --check
