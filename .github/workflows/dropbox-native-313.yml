# Verify the ordinary installed Akula v0.3.13 contains the Dropbox read-only UI.
# CI never needs live Dropbox credentials or automatically publishes releases.
name: Akula 3.13 installed Dropbox verification

on:
  push:
    branches: [fix/dropbox-account-relogin-scope-20261024]
    paths:
      - '.github/workflows/dropbox-native-313.yml'
      - 'scripts/windows-dropbox-browser-uia.ps1'
  pull_request:
    paths:
      # Only new Dropbox implementation files; existing source files are
      # already covered by Application checks, without a new CI consumer.
      - 'aquilum-app/native/src/app/dropbox_preview.rs'
      - 'aquilum-app/native/src/app/dropbox_provider.rs'
      - 'aquilum-app/native/src/ui/settings/schema/sync/dropbox.rs'
      - 'aquilum-app/native/Cargo.toml'
      - 'aquilum-app/Cargo.lock'
      - '.github/workflows/dropbox-native-313.yml'
      - 'scripts/windows-dropbox-browser-uia.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-readonly:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> target
          key: 3-13-dropbox-native
      - name: Compile normal installed native Akula with Dropbox read-only code
        run: cargo check --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-native --features installed
      - name: Run native Dropbox connection state regression tests
        run: cargo test --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-native --features installed dropbox_preview
      - name: Run public-scope configuration tests
        run: cargo test --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-core dropbox_readonly_draft_tests --lib
      - name: Run isolated native Dropbox onboarding tests
        run: cargo test --manifest-path modules/dropbox-connect-lab/Cargo.toml --lib
      - name: Build the installed-feature Windows GUI for Dropbox browser acceptance
        run: cargo build --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-native --features installed
      - name: Prove Dropbox account sign-in opens a real default HTTPS browser via Windows UIA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE '.artifacts/cargo-native/debug/aquilum-native.exe'
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File './scripts/windows-dropbox-browser-uia.ps1' -ExePath $exe
          if ($LASTEXITCODE -ne 0) { throw 'Installed-feature Dropbox browser UIA failed' }
      - name: Upload generated dependency lockfile for release review
        uses: actions/upload-artifact@v7
        with:
          name: akula-313-dropbox-lockfile-${{ github.run_id }}
          path: aquilum-app/Cargo.lock
          if-no-files-found: error
          retention-days: 7
