name: P2P Temporal Scheduler Lab

on:
  pull_request:
    paths:
      - 'labs/p2p-temporal-scheduler/**'
      - '.github/workflows/p2p-temporal-scheduler-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-scheduler:
    name: Offline scheduler / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rustfmt
        run: cargo fmt --manifest-path labs/p2p-temporal-scheduler/Cargo.toml --all -- --check
      - name: Tests
        run: cargo test --manifest-path labs/p2p-temporal-scheduler/Cargo.toml --offline
      - name: Demo
        run: cargo run --manifest-path labs/p2p-temporal-scheduler/Cargo.toml --offline --quiet --bin akula-p2p-temporal-scheduler-lab
      - name: Exact-oracle and seeded 120-case benchmark
        run: cargo run --manifest-path labs/p2p-temporal-scheduler/Cargo.toml --offline --quiet --bin benchmark
      - name: Duration/bandwidth/forecast experiment (120 deterministic cases)
        run: cargo run --manifest-path labs/p2p-temporal-scheduler/Cargo.toml --offline --quiet --bin duration_benchmark
      - name: Verified-segment resume and replanning (120 deterministic cases)
        run: cargo run --manifest-path labs/p2p-temporal-scheduler/Cargo.toml --offline --quiet --bin recovery_benchmark
