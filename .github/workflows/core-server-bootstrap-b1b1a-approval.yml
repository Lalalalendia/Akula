name: Akula Bootstrap B1b1a signed owner approval lab

on:
  pull_request:
    branches: [main]
    paths:
      - "aquilum-app/core/Cargo.toml"
      - "aquilum-app/core/src/lib.rs"
      - "aquilum-app/core/src/server_approval_lab.rs"
      - "aquilum-app/core/tests/server_bootstrap_b1b1a.rs"
      - ".github/workflows/core-server-bootstrap-b1b1a-approval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-approval-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Format isolated experimental Rust files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 aquilum-app/core/src/server_approval_lab.rs aquilum-app/core/tests/server_bootstrap_b1b1a.rs
      - name: Test owner-signature scope, stage receipt and rollback refusals
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features server-bootstrap-b1b1-approval-lab --test server_bootstrap_b1b1a -- --nocapture
          cargo check --locked -p aquilum-core --no-default-features
