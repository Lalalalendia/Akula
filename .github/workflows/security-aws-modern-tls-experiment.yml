name: RustSec AWS modern TLS remediation experiment

# Temporary narrow experiment. Does not alter Main PR gate or security watchdog.
on:
  push:
    branches:
      - security/akula-rustsec-modern-http-20261022
    paths:
      - 'aquilum-app/core/Cargo.toml'
      - '.github/workflows/security-aws-modern-tls-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustsec-aws-tls-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Resolve modern TLS and perform actual RustSec scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit@0.22.2
      - name: Refresh compatible TLS crates via Cargo, never edit Cargo.lock by hand
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls@0.23.43
          # Updating rustls also refreshes its webpki dependency and removes
          # the obsolete version; a second --precise old ID would fail.
          cargo update -p webpki-roots@1.0.9
          cargo metadata --format-version 1 --locked --features sync-s3 --no-deps >/dev/null
          cargo tree --locked --features sync-s3 -p aquilum-core -i aws-smithy-http-client
          cargo tree --locked --features sync-s3 -p aquilum-core -i rustls@0.21.12 || true
      - name: Compile all S3 feature paths and check advisory status
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p aquilum-core --features sync-s3
          cargo audit --no-yanked --file Cargo.lock
          cargo audit --no-yanked --no-fetch --file host-broker-lab/Cargo.lock
      - name: Save verified Cargo.lock only to the research branch
        if: github.ref == 'refs/heads/security/akula-rustsec-modern-http-20261022' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'security/akula-rustsec-modern-http-20261022'
          # The cargo check and two unignored audits must succeed above.
          # Do not commit any generated file other than the Cargo.lock.
          git add -- aquilum-app/Cargo.lock
          if git diff --cached --quiet; then
            echo 'No Cargo.lock changes after successful RustSec checks.' >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'security: lock audited modern Rustls and AWS HTTPS dependencies'
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
            echo 'Committed the RustSec-validated Cargo.lock on the experiment branch only.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export Cargo-produced lockfile and dependency report even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -s aquilum-app/Cargo.lock; then
            cp aquilum-app/Cargo.lock "$RUNNER_TEMP/akula-cargo.lock"
            git diff -- aquilum-app/Cargo.lock > "$RUNNER_TEMP/akula-cargo-lock.diff"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustsec-modern-http-lock-${{ github.sha }}
          path: |
            ${{ runner.temp }}/akula-cargo.lock
            ${{ runner.temp }}/akula-cargo-lock.diff
          if-no-files-found: warn
          retention-days: 7
