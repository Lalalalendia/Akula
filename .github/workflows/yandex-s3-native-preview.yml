# YC-S3-T01c-WIN-BRIDGE: experimental opt-in compile and integration gates.
# Never ships an installer, never requests Yandex credentials and never runs
# the actual live endpoint. User-initiated network paths are tested via
# synthetic state machines plus the separate #408 localhost MinIO suite.
name: Yandex S3 native read-only bridge preview
on:
  pull_request:
    paths:
      - '.github/workflows/yandex-s3-native-preview.yml'
      - 'aquilum-app/core/src/sync/yandex_readonly_probe.rs'
      - 'aquilum-app/core/src/sync/mod.rs'
      - 'aquilum-app/native/src/yandex_credentials.rs'
      - 'aquilum-app/native/src/yandex_probe_session.rs'
      - 'aquilum-app/native/src/yandex_probe_worker.rs'
      - 'aquilum-app/native/src/app/**'
      - 'aquilum-app/native/src/ui/settings/**'
      - 'aquilum-app/native/assets/locales/*.json'
      - 'aquilum-app/native/Cargo.toml'
      - 'aquilum-app/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-s3-native-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-readonly-preview:
    name: No-credentials Windows read-only connection preview
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: yandex-readonly-preview
          save-if: false
      - name: Assert default installed build does not enable Yandex network preview
        shell: pwsh
        run: |
          $cargo = Get-Content -Raw aquilum-app/native/Cargo.toml
          if ($cargo -notmatch 'installed\s*=\s*\[\s*\]') {
            throw "installed feature must be empty: S3 UI preview may not ship"
          }
          if ($cargo -notmatch 'yandex-s3-connection-preview\s*=') {
            throw "missing explicit opt-in feature"
          }
          if ($cargo -match '(?m)^default\s*=.*yandex-s3-connection-preview') {
            throw "unsafe opt-in feature default"
          }
      - name: Compile normal installed native build with no AWS SDK feature
        working-directory: aquilum-app
        run: cargo check --locked -p aquilum-native --features installed
      - name: Verify WinCred round-trip and secret status
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-native --bin aquilum-native --features installed yandex_credentials::tests -- --test-threads=1
      - name: Verify no stale UI probe status can survive rotation or close
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-native --bin aquilum-native --features installed yandex_probe_session::tests -- --test-threads=1
      - name: Compile opt-in read-only bridge and prove typed error policy
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-native --bin aquilum-native --features installed,yandex-s3-connection-preview yandex_probe_worker::tests -- --test-threads=1
      - name: Prove localized settings button remains disabled without keys
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-native --bin aquilum-native --features installed,yandex-s3-connection-preview yandex_wizard_is_bounded_and_never_activates_s3_or_persists_a_secret -- --test-threads=1
      - name: Verify read-only Core error taxonomy
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-s3 yandex_readonly_probe::tests -- --test-threads=1
