name: Native Vello dual-dispatch route proof (diagnostic)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/summarize-vello-dual-route.py'
      - 'aquilum-app/native/src/app/tests/perf/worker_router.rs'
      - '.github/workflows/native-vello-dual-route.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vello-dual-route-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dual-route:
    name: Persistent 0/2 worker route parity and cost
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-dual-route-v1
          cache-workspace-crates: true
      - name: Install native Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Record runner CPU
        shell: bash
        run: |
          {
            git rev-parse HEAD
            grep -m1 'model name' /proc/cpuinfo || true
            grep -m1 'flags' /proc/cpuinfo || true
            rustc --version
          } | tee vello-dual-route-env.txt
      - name: Compare persistent serial, multi and routed contexts on mixed real frames
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_dual_dispatch_route -- --ignored --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/vello-dual-route.log"
      - name: Validate all 36 segments and summarize
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/summarize-vello-dual-route.py
          python3 .github/scripts/summarize-vello-dual-route.py vello-dual-route.log --output vello-dual-route-summary.md
          cat vello-dual-route-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive raw proof and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vello-dual-route-${{ github.sha }}
          path: |
            vello-dual-route-env.txt
            vello-dual-route.log
            vello-dual-route-summary.md
          if-no-files-found: warn
          retention-days: 14
