# E2E-01: validate the SSH acceptance coordinator without needing VPS access.
name: Akula W4 two-node SSH acceptance script

on:
  pull_request:
    paths:
      - ".github/workflows/w4-two-node-ssh-acceptance.yml"
      - "scripts/qa/w4-two-node-ssh.sh"
      - "scripts/qa/test-w4-two-node-ssh.sh"
      - "scripts/qa/w4-two-node-docker-fixture.sh"
      - "scripts/qa/w4-two-node-vps.Dockerfile"
      - "docs/qa/AK-W4-TWO-NODE-SSH-01.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-w4-two-node-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ssh-preflight-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Strict Bash syntax for both test scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/qa/w4-two-node-ssh.sh
          bash -n scripts/qa/test-w4-two-node-ssh.sh
      - name: Invalid peers, pinned-host enforcement, machine identity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/qa/test-w4-two-node-ssh.sh
          echo 'AKULA_W4_TWO_NODE_CI_PRECHECK_PASS'
      - name: Real pinned SSH public-key and SFTP preflight in Docker
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          bash -n scripts/qa/w4-two-node-docker-fixture.sh
          app="$(mktemp "$RUNNER_TEMP/akula-w4-fixture-XXXXXXXX")"
          cat > "$app" <<'MOCK'
          #!/usr/bin/env bash
          if [[ "$1" == --w4-pilot && "$2" == status ]]; then
            echo 'AKULA_W4_PILOT_READY helper=verified network=inactive auto_start=no SSH_only=yes'
          else
            exit 3
          fi
          MOCK
          chmod 700 "$app"
          sha="$(sha256sum "$app" | cut -d' ' -f1)"
          bash scripts/qa/w4-two-node-docker-fixture.sh "$app" "$sha" --ssh-only |
            tee "$RUNNER_TEMP/w4-real-ssh-preflight.txt"
          grep -Fxq 'AKULA_W4_REAL_SSH_PRECHECK_PASS ssh=1 sftp=1 pinned_host_key=1 remote_sha256=1' "$RUNNER_TEMP/w4-real-ssh-preflight.txt"
          grep -Fxq 'AKULA_W4_TEST_LIMITATIONS synthetic_executable=1 signed_W4=NOT_TESTED' "$RUNNER_TEMP/w4-real-ssh-preflight.txt"
