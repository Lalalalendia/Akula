name: Akula VIDEO-13 build-pinned Rust mux candidate (non-release)

on:
  pull_request:
    branches: [main, feat/video03-one-click-offline-20261116]
    paths:
      - 'aquilum-app/native/src/video/light.rs'
      - 'aquilum-app/native/src/video/light_tests.rs'
      - 'aquilum-app/native/Cargo.toml'
      - 'labs/video-lite/src/bin/dash.rs'
      - 'labs/video-lite/Cargo.toml'
      - 'labs/video-lite/Cargo.lock'
      - '.github/workflows/akula-video13-trusted-mux-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-boundary:
    name: No arbitrary mux executable or changes to public installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce non-release and compiled-pin boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          main = Path('aquilum-app/native/src/video/light.rs').read_text()
          cfg = tomllib.loads(Path('aquilum-app/native/Cargo.toml').read_text())
          assert Path('labs/video-lite/Cargo.lock').is_file(), 'bundled mux must use reviewed Cargo.lock'
          assert 'video-rust-bundle' in cfg['features']
          assert 'option_env!("AKULA_BUNDLED_MUX_SHA256")' in main
          assert 'bundled_mux_from_exe(&application, expected)' in main
          assert 'akula-video-mux.exe' in main
          assert 'akula-yt-dlp.exe' in main and 'akula-quickjs.exe' in main
          assert 'verify_pinned_runtime(&ytdlp, &quickjs)' in main
          # VIDEO-18b: reject Windows 7/8 before reading or launching any pinned sidecar.
          gate = Path('aquilum-app/native/src/video/light_windows_version.rs').read_text()
          assert 'RtlGetVersion' in gate and 'requires Windows 10 or newer' in gate
          assert 'supports_pinned_windows_video_runtime(version.major)' in gate
          download = main.split('pub(super) fn download_one_or_legacy(', 1)[1]
          assert download.index('windows_version::require_pinned_windows_video_runtime()?') < download.index('let application = std::env::current_exe()')
          tests = Path('aquilum-app/native/src/video/light_tests.rs').read_text()
          assert 'video18b_windows7_and_windows8_never_admit_pinned_toolchain' in tests
          assert 'std::env::var_os("AKULA_QUICKJS_BIN")' not in main
          assert 'video-rust-bundle is Windows-only: refusing unpinned legacy fallback' in main
          assert '#[cfg(not(feature = "video-rust-bundle"))]' in main
          assert 'AKULA_RUST_MUX_BIN is no longer supported' in main
          assert 'PathBuf::from(mux)' not in main
          assert 'fs::hard_link(&output, &target)' in main
          assert 'verify_pinned_runtime' in main
          assert 'download::download_one(library, executable, url, on_progress)' in main
          # Do not silently alter existing shipping packaging during this experiment.
          import json
          package = json.loads(Path('aquilum-app/native/packaging/akula-windows.json').read_text())
          assert not any('video-mux' in x['path'] for x in package['binaries'])
          print('VIDEO13_SOURCE_TRUST_PASS env_path_rejected=1 release_installer_untouched=1')
          PY

  windows:
    name: Build exact Rust helper, pin in Akula and reject tampering
    needs: source-boundary
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            aquilum-app -> ../.artifacts/cargo-native
            labs/video-lite
          shared-key: akula-video13-trusted-helper-windows-v1
          save-if: false
      - name: Build corrected v2 mux from checked-out source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'labs/video-lite/Cargo.lock' -PathType Leaf)) { throw 'locked video-lite dependencies missing' }
          cargo test --release --locked --manifest-path labs/video-lite/Cargo.toml --bin dash
          if ($LASTEXITCODE -ne 0) { throw 'mux timeline regression' }
          cargo build --release --locked --manifest-path labs/video-lite/Cargo.toml --bin dash
          if ($LASTEXITCODE -ne 0) { throw 'helper build failed' }
          $mux = (Resolve-Path 'labs/video-lite/target/release/dash.exe').Path
          $sha = (Get-FileHash -LiteralPath $mux -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -cnotmatch '^[0-9a-f]{64}$') { throw 'invalid compiled helper SHA-256' }
          Add-Content -Path $env:GITHUB_ENV -Value "AKULA_BUNDLED_MUX_SHA256=$sha"
          Add-Content -Path $env:GITHUB_ENV -Value "AKULA_VIDEO13_TEST_MUX_BIN=$mux"
          Write-Host 'VIDEO13_HELPER_FROM_EXACT_SOURCE_PASS runtime_executable=0'
      - name: Fetch and verify exact official runtimes for disposable candidate only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP 'video15-pinned-runtime'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $yt = Join-Path $scratch 'akula-yt-dlp.exe'
          $js = Join-Path $scratch 'akula-quickjs.exe'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe' -OutFile $yt -UseBasicParsing
          Invoke-WebRequest 'https://github.com/quickjs-ng/quickjs/releases/download/v0.18.0/qjs-windows-x86_64.exe' -OutFile $js -UseBasicParsing
          $yh = (Get-FileHash -LiteralPath $yt -Algorithm SHA256).Hash.ToLowerInvariant()
          $jh = (Get-FileHash -LiteralPath $js -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($yh -cne 'f5389d3698ecde4ef06f4e6b1ce0294fe9ac1396228c8990b8d3416d6d177a7d') { throw 'official yt-dlp pin mismatch' }
          if ($jh -cne 'ff03398d74ea6e6bd3a8e58058f7003225abcac229d7d57775b7aaae812a49c7') { throw 'official QuickJS pin mismatch' }
          if ((Get-Item -LiteralPath $yt).Length -ne 23575744) { throw 'official yt-dlp size mismatch' }
          if ((Get-Item -LiteralPath $js).Length -ne 1873152) { throw 'official QuickJS size mismatch' }
          Add-Content -Path $env:GITHUB_ENV -Value "AKULA_TEST_YTDLP_BIN=$yt"
          Add-Content -Path $env:GITHUB_ENV -Value "AKULA_TEST_QUICKJS_BIN=$js"
          Write-Host 'VIDEO15_OFFICIAL_SIDECARS_VERIFIED no_unpinned_runtime=1 no_youtube_request=1'
      - name: Run native tests with a hash embedded at Rust compilation time
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked --manifest-path aquilum-app/Cargo.toml -p aquilum-native --bin aquilum-native --features installed,video-rust-bundle video::light::tests::video1 -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'build-time mux or official runtime trust gate rejected its own helper' }
          Write-Host 'VIDEO13_COMPILED_SHA_NATIVE_PASS modified_helper_denied=1'
          Write-Host 'VIDEO15_BUNDLED_SHA_NATIVE_PASS no_env_runtime_selection=1'
      - name: Stage candidate Akula and mux side by side, no installer
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          # Cargo reads .cargo/config.toml from its process working directory.
          # Running at repo root with --manifest-path silently uses another
          # target directory, while the installer expects .artifacts/cargo-native.
          cargo build --release --locked -p aquilum-native --features installed,video-rust-bundle
          if ($LASTEXITCODE -ne 0) { throw 'installed-feature trusted candidate does not compile' }
          $dir = Join-Path $env:RUNNER_TEMP 'video13-staged-local-only'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $app = Join-Path $env:GITHUB_WORKSPACE '.artifacts/cargo-native/release/aquilum-native.exe'
          if (!(Test-Path -LiteralPath $app)) { throw 'Akula installed executable not built' }
          Copy-Item -LiteralPath $app -Destination (Join-Path $dir 'akula-app.exe')
          Copy-Item -LiteralPath $env:AKULA_VIDEO13_TEST_MUX_BIN -Destination (Join-Path $dir 'akula-video-mux.exe')
          Copy-Item -LiteralPath $env:AKULA_TEST_YTDLP_BIN -Destination (Join-Path $dir 'akula-yt-dlp.exe')
          Copy-Item -LiteralPath $env:AKULA_TEST_QUICKJS_BIN -Destination (Join-Path $dir 'akula-quickjs.exe')
          $actual = (Get-FileHash -LiteralPath (Join-Path $dir 'akula-video-mux.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:AKULA_BUNDLED_MUX_SHA256) { throw 'candidate helper hash does not match compiled pin' }
          $yhash = (Get-FileHash -LiteralPath (Join-Path $dir 'akula-yt-dlp.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $jhash = (Get-FileHash -LiteralPath (Join-Path $dir 'akula-quickjs.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($yhash -cne 'f5389d3698ecde4ef06f4e6b1ce0294fe9ac1396228c8990b8d3416d6d177a7d') { throw 'staged yt-dlp was altered' }
          if ($jhash -cne 'ff03398d74ea6e6bd3a8e58058f7003225abcac229d7d57775b7aaae812a49c7') { throw 'staged QuickJS was altered' }
          if ((Get-Item -LiteralPath (Join-Path $dir 'akula-app.exe')).Length -lt 100000) { throw 'unexpected empty Akula executable' }
          Write-Host 'VIDEO13_STAGED_PAIR_PASS compiled_app=1 same_directory=1 helper_hash_verified=1'
          Write-Host 'VIDEO13_NONRELEASE_PASS signed=0 installer=0 upload=0 release=0'
