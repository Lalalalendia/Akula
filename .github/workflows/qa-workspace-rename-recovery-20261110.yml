name: QA workspace rename crash-window journal classifier (test-only)
on:
  push:
    branches: [integration/qa-workspace-rename-recovery-20261110]
permissions:
  contents: read
jobs:
  linux:
    name: Linux crash-window classifier and UI-state
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Journal and recovery classification tests
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --lib files::workspace_rename_recovery_qa -- --nocapture
          cargo test --locked -p aquilum-core --lib ui_state
  windows:
    name: Windows crash-window classifier and junction rejection
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Journal classifier under Windows
        working-directory: aquilum-app
        shell: pwsh
        run: |
          cargo test --locked -p aquilum-core --lib files::workspace_rename_recovery_qa -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  macos:
    name: macOS crash-window classifier
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Journal classifier under macOS
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --lib files::workspace_rename_recovery_qa -- --nocapture
