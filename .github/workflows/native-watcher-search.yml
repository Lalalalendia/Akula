name: Native watcher to search integration

on:
  pull_request:
    paths:
      - "aquilum-app/core/tests/watcher_to_search.rs"
      - "aquilum-app/core/src/files/watcher/**"
      - "aquilum-app/core/src/search/worker.rs"
      - ".github/workflows/native-watcher-search.yml"
  workflow_dispatch:

permissions:
  contents: read

# New commits on one PR supersede its older experimental/diagnostic checks.
# Explicit workflow_dispatch runs are never preempted automatically.
concurrency:
  group: akula-native-watcher-search-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  watcher:
    name: Real filesystem notification / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: native-watcher-${{ matrix.os }}
      - name: Exercise OS watcher create, overwrite, delete and search updates
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-core native_workspace_watcher_to_search_roundtrip -- --nocapture --test-threads=1 2>&1 | tee ../native-watcher.txt
          grep 'REAL_WATCHER ' ../native-watcher.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve OS-specific test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-watcher-${{ matrix.os }}-${{ github.sha }}
          path: native-watcher.txt
          retention-days: 14
