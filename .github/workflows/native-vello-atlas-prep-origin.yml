name: Vello atlas preparation origin falsifier

on:
  pull_request:
    paths:
      - '.github/workflows/native-vello-atlas-prep-origin.yml'
      - 'aquilum-app/native/vendor/vello_cpu/src/text.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vello-atlas-origin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  atlas-prep-origin:
    name: Compare crop-union origin vs full-atlas origin
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-guard96-repro
          cache-workspace-crates: true
      - name: Install native Linux libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Record environment
        shell: bash
        run: |
          {
            git rev-parse HEAD
            grep -m1 'model name' /proc/cpuinfo || true
            rustc --version
          } | tee atlas-origin-environment.log
      - name: Same-scene strict guard96 parity, 20 fresh processes per atlas origin
        shell: bash
        working-directory: aquilum-app
        env:
          AQ_CROSSOVER_ONLY_CASE: cover_1x
          AQ_CROSSOVER_EVERY_FRAME: '1'
          AQ_CROSSOVER_WORKLOAD: guard96
          AQ_TEST_SCROLL_EDGE_GUARD: '96'
        run: |
          set -uo pipefail
          unexpected=0
          full_failures=0
          for mode in cropped full-page; do
            failures=0
            for attempt in $(seq 1 20); do
              log="$GITHUB_WORKSPACE/atlas-origin-$mode-$attempt.log"
              if [ "$mode" = "full-page" ]; then
                env AQ_TEST_ATLAS_PREP_FULL_PAGE=1 cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_worker_crossover -- --ignored --nocapture --test-threads=1 > "$log" 2>&1
                rc=$?
              else
                cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_worker_crossover -- --ignored --nocapture --test-threads=1 > "$log" 2>&1
                rc=$?
              fi
              if [ "$rc" -eq 0 ]; then
                :
              elif grep -q 'VELLO_GUARD_PARITY_FAILURE case=cover_1x' "$log"; then
                failures=$((failures + 1))
              else
                echo "ATLAS_ORIGIN_UNEXPECTED=$mode/$attempt rc=$rc"
                tail -n 30 "$log"
                unexpected=1
              fi
            done
            echo "ATLAS_ORIGIN mode=$mode red=$failures/20" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$mode" = "full-page" ]; then
              full_failures="$failures"
            fi
          done
          echo 'Strict pixel tolerance remains 1/255. Baseline red outcomes are expected and recorded.' >> "$GITHUB_STEP_SUMMARY"
          test "$unexpected" -eq 0
          test "$full_failures" -eq 0
      - name: Archive full diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vello-atlas-origin-${{ github.sha }}
          path: |
            atlas-origin-environment.log
            atlas-origin-*.log
          retention-days: 14
          if-no-files-found: warn
