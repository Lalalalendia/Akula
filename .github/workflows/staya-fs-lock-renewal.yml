# Temporary, single-use test-dependency Cargo.lock update. DELETE after success.
name: Staya iroh-blobs fs-store Cargo lock one-time renewal

on:
  push:
    branches:
      - "experiment/staya-iroh-blobs-compare-20261018"
    paths:
      - ".github/workflows/staya-fs-lock-renewal.yml"

permissions:
  contents: read

jobs:
  renew:
    if: github.repository == 'Lalalalendia/Akula' && github.ref == 'refs/heads/experiment/staya-iroh-blobs-compare-20261018'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: "experiment/staya-iroh-blobs-compare-20261018"
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.91.0"
      - name: Resolve fs-store in existing private laboratory only
        working-directory: staya/roha-transport
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          old_sha="$(gh api repos/Lalalalendia/Akula/contents/staya/roha-transport/Cargo.lock --jq .sha)"
          test "$old_sha" = "5bff8451c3be8b2c479fd759e6c3c3ecea213ed1"
          cargo metadata --format-version 1 > dep-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          deps = json.loads(Path("dep-metadata.json").read_text())["packages"]
          versions = {name: [x for x in deps if x["name"] == name] for name in ("iroh-blobs", "redb", "tempfile")}
          assert len(versions["iroh-blobs"]) == 1 and versions["iroh-blobs"][0]["version"] == "0.103.1"
          assert len(versions["redb"]) == 1 and versions["redb"][0]["version"].split(".")[0] == "4"
          assert len(versions["tempfile"]) == 1 and versions["tempfile"][0]["version"] == "3.17.1"
          for name, repo, rev in [
              ("iroh", "calex794/roha", "a42ad5aef1626df80d39398e05dac6e362bf6e49"),
              ("noq", "calex794/noq", "2eabf9895d40c263aa3369afd66efcf4a5d95056"),
              ("noq-proto", "calex794/noq", "2eabf9895d40c263aa3369afd66efcf4a5d95056"),
              ("noq-udp", "calex794/noq", "2eabf9895d40c263aa3369afd66efcf4a5d95056")
          ]:
              values = [x for x in deps if x["name"] == name]
              assert len(values) == 1 and repo in str(values[0]["source"]) and rev in str(values[0]["source"]), (name, values)
          print("Exact pinned upstream/fork packages and FsStore dependency: OK")
          PY
          test "$(git diff --name-only)" = "staya/roha-transport/Cargo.lock"
          python3 - "$old_sha" <<'PY'
          import base64
          import json
          from pathlib import Path
          import sys
          payload = {
              "message": "build(staya): lock explicit iroh-blobs fs-store restart experiment",
              "branch": "experiment/staya-iroh-blobs-compare-20261018",
              "sha": sys.argv[1],
              "content": base64.b64encode(Path("Cargo.lock").read_bytes()).decode("ascii")
          }
          Path("request.json").write_text(json.dumps(payload))
          PY
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            --input request.json \
            repos/Lalalalendia/Akula/contents/staya/roha-transport/Cargo.lock \
            --jq .commit.sha
