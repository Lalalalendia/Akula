name: Akula VIDEO-20 real Settings opt-in Windows UIA (NONRELEASE)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/windows-video20-settings-uia.ps1'
      - '.github/workflows/akula-video20-settings-gui.yml'
      - 'aquilum-app/native/src/video/optional_ytdlp.rs'
      - 'aquilum-app/native/src/app/settings/video_tools.rs'
      - 'aquilum-app/native/src/ui/settings/schema/system/video_tools.rs'
      - 'aquilum-app/native/assets/locales/en.json'
      - 'aquilum-app/native/assets/locales/ru.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-boundary:
    name: Guard exact-HEAD non-release GUI test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enforce stock installer boundary and real UIA test
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import json
          script = Path('scripts/windows-video20-settings-uia.ps1').read_text()
          assert 'Wait-Dialog $proc $installDialogNames' in script
          assert 'Wait-Dialog $proc $removeDialogNames' in script
          assert 'SendNavigationKey' in script and 'SetFocus()' in script
          assert 'VIDEO20_SETTINGS_CANCEL_UIA_PASS' in script
          assert 'VIDEO20_SETTINGS_INSTALL_UIA_PASS' in script
          assert 'VIDEO20_SETTINGS_REMOVE_UIA_PASS' in script
          assert "GITHUB_EVENT_NAME -cne 'pull_request'" in script
          assert "RUNNER_ENVIRONMENT -cne 'github-hosted'" in script
          assert 'EXPECTED_HEAD_SHA' in script
          assert 'Test-Path -LiteralPath $tool' in script
          package = Path('aquilum-app/native/packaging/akula-windows.json')
          binaries = [x['path'] for x in json.loads(package.read_text())['binaries']]
          assert binaries == ['akula-app', 'shiva-pdf-preview']
          assert 'yt-dlp' not in package.read_text()
          source = Path('aquilum-app/native/src/video/optional_ytdlp.rs').read_text()
          assert 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe' in source
          print('VIDEO20_GUI_NONRELEASE_SOURCE_PASS installer_yt_dlp=0')
          PY

  installed-gui:
    name: Real Windows Settings click, confirm, install and remove
    needs: source-boundary
    runs-on: windows-2025
    timeout-minutes: 95
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUNNER_ENVIRONMENT: github-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: video20-installed-settings-uia
          cache-on-failure: true
      - name: Build actual installed-feature Akula without Video Tools bundle
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked -p aquilum-native --features installed
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows Akula compilation failed' }
          $compiled = Join-Path $env:GITHUB_WORKSPACE '.artifacts\cargo-native\debug\aquilum-native.exe'
          if (!(Test-Path -LiteralPath $compiled -PathType Leaf)) { throw 'Compiled Akula missing' }
          $destDir = Join-Path $env:LOCALAPPDATA 'Akula'
          if (Test-Path -LiteralPath $destDir) { throw 'Clean hosted runner already has installed Akula' }
          New-Item -ItemType Directory -Path $destDir | Out-Null
          $dest = Join-Path $destDir 'akula-app.exe'
          Copy-Item -LiteralPath $compiled -Destination $dest
          if ((Get-FileHash -LiteralPath $dest).Hash -cne (Get-FileHash -LiteralPath $compiled).Hash) {
            throw 'Staged GUI binary differs from compiled installed candidate'
          }
          Write-Host 'VIDEO20_INSTALLED_WINDOWS_STAGED_PASS binaries=1 bundled_yt_dlp=0 installer=0'
      - name: Actual Windows UIA user opt-in with native confirmations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows-video20-settings-uia.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ('VIDEO20 Windows PowerShell syntax errors: ' + ($errors | Out-String)) }
          $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $exe = Join-Path $env:LOCALAPPDATA 'Akula\akula-app.exe'
          $vault = Join-Path $env:RUNNER_TEMP 'video20-uia-vault'
          $data = Join-Path $env:RUNNER_TEMP 'video20-uia-data'
          & $powershell -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File $script -ExePath $exe -VaultPath $vault -DataDir $data
          if ($LASTEXITCODE -ne 0) { throw 'VIDEO20 physical settings opt-in UIA failed' }
          Write-Host 'VIDEO20_REAL_SETTINGS_GUI_PASS no_youtube=1 no_release=1'
      - name: Confirm no release or signed candidate was created
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'dist\latest.json') { throw 'Unexpected release metadata in UIA-only job' }
          if (Test-Path -LiteralPath 'dist\Akula_0.3.21_x64-setup.exe') { throw 'Unexpected installer in UIA-only job' }
          Write-Host 'VIDEO20_NO_RELEASE_PASS publisher_signing=0 publish=0'
