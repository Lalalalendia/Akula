name: Native Vello outline atlas sampler falsifier

on:
  pull_request:
    paths:
      - '.github/workflows/native-vello-outline-sampler.yml'
      - 'aquilum-app/native/vendor/glifo/src/renderer.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vello-outline-sampler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  outline-sampling:
    name: Strict guard96 nearest vs bilinear vs bicubic
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-guard96-repro
          cache-workspace-crates: true
      - name: Install native Linux libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Capture runner identity
        shell: bash
        run: |
          {
            git rev-parse HEAD
            grep -m1 'model name' /proc/cpuinfo || true
            rustc --version
          } | tee outline-sampler-environment.log
      - name: Same real UI, 20 independent processes per outline sampler
        shell: bash
        working-directory: aquilum-app
        env:
          AQ_CROSSOVER_ONLY_CASE: cover_1x
          AQ_CROSSOVER_EVERY_FRAME: '1'
          AQ_CROSSOVER_WORKLOAD: guard96
          AQ_TEST_SCROLL_EDGE_GUARD: '96'
        run: |
          set -uo pipefail
          unexpected=0
          medium_red=0
          high_red=0
          for mode in low medium high; do
            failures=0
            for attempt in $(seq 1 20); do
              log="$GITHUB_WORKSPACE/outline-sampler-$mode-$attempt.log"
              if [ "$mode" = low ]; then
                if cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_worker_crossover -- --ignored --nocapture --test-threads=1 > "$log" 2>&1; then
                  rc=0
                else
                  rc=$?
                fi
              else
                if env AQ_TEST_OUTLINE_ATLAS_SAMPLER="$mode" cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_worker_crossover -- --ignored --nocapture --test-threads=1 > "$log" 2>&1; then
                  rc=0
                else
                  rc=$?
                fi
              fi
              if [ "$rc" -eq 0 ]; then
                :
              elif grep -q 'VELLO_GUARD_PARITY_FAILURE case=cover_1x' "$log"; then
                failures=$((failures + 1))
              else
                echo "OUTLINE_SAMPLER_UNEXPECTED mode=$mode attempt=$attempt rc=$rc"
                tail -n 30 "$log"
                unexpected=1
              fi
            done
            echo "OUTLINE_SAMPLER mode=$mode red=$failures/20" | tee -a "$GITHUB_STEP_SUMMARY"
            case "$mode" in
              medium) medium_red="$failures" ;;
              high) high_red="$failures" ;;
            esac
          done
          echo 'Strict 1/255 full-reference tolerance unchanged. Green implies only parity, not visual or speed approval.' >> "$GITHUB_STEP_SUMMARY"
          test "$unexpected" -eq 0
          if [ "$medium_red" -ne 0 ] && [ "$high_red" -ne 0 ]; then
            exit 1
          fi
      - name: Archive diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vello-outline-sampler-${{ github.sha }}
          path: |
            outline-sampler-environment.log
            outline-sampler-*.log
          retention-days: 14
          if-no-files-found: warn
