# B6b-2a diagnostic only. Never used to package the public Akula build.
name: Installed host Unix owner preflight (non-release)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only PR revisions supersede earlier PR revisions; manual labs stay independent.
  group: owner-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unix-root-receipt:
    name: OS root receipt preflight / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest] # MAC-HOLD-01: macOS frozen
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.artifacts/cargo-b6b2a
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-b6b2a
          key: b6b2a-${{ matrix.os }}
          cache-workspace-crates: true
      - name: Independent OS-root test receipt (no production issuance)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Disposable CI-owned proof only: the receipt deliberately contains
          # no host IDs or authority, and does not open the user's SQLite DB.
          # No privilege is requested by the release installer or app.
          # Hosted runner images may make /opt group/world writable for
          # tooling. Never waive the owner predicate; use OS-owned config roots.
          base=/etc
          if [[ "$(uname -s)" = Darwin ]]; then base=/private/etc; fi
          parent="$base/akula-b6b2a-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if test -e "$parent" || test -L "$parent"; then
            echo 'A prior OS-owner fixture exists; do not adopt or reset it'
            exit 1
          fi
          sudo mkdir -m 0755 "$parent"
          # Only a directory we just created may be removed on failure.
          echo "AKULA_B6B2_CREATED_FIXTURE_DIR=$parent" >> "$GITHUB_ENV"
          receipt="$parent/receipt.json"
          printf 'CI-only root-owner probe; NOT a valid Akula receipt\n' |
            sudo tee "$receipt" >/dev/null
          sudo chown 0 "$parent" "$receipt"
          sudo chmod 0755 "$parent"
          sudo chmod 0444 "$receipt"
          ls -ld / "$base" "$parent" "$receipt"
          echo "AKULA_B6B2_ROOT_RECEIPT=$receipt" >> "$GITHUB_ENV"
      - name: No AWS dependency in Unix-root witness-only build
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo tree --locked -p aquilum-core --no-default-features \
            --features sync-installed-host-unix-root-witness > owner-deps.txt
          if grep -E 'aws-(config|sdk-s3|sdk-sts) ' owner-deps.txt; then
            echo 'Unexpected AWS dependency in owner-only receipt gate'
            exit 1
          fi
      - name: Real physical paths, user-owned rejection and independent process
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --no-default-features --features sync-installed-host-unix-root-witness host_install_unix_root::tests -- --nocapture
      - name: Confirm ordinary unwitnessed installed-host feature compiles independently
        working-directory: aquilum-app
        run: cargo check --locked -p aquilum-core --no-default-features --features sync-installed-host
      - name: Remove only this disposable elevated test witness
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runner images may make /opt group/world writable for
          # tooling. Never waive the owner predicate; use OS-owned config roots.
          base=/etc
          if [[ "$(uname -s)" = Darwin ]]; then base=/private/etc; fi
          parent="$base/akula-b6b2a-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Never destroy a preexisting installation that issuance refused.
          if [[ "${AKULA_B6B2_CREATED_FIXTURE_DIR:-}" != "$parent" ]]; then
            echo 'No verified new CI-owned fixture to clean'
            exit 0
          fi
          if test -f "$parent/receipt.json" && ! test -L "$parent/receipt.json"; then
            sudo rm -f "$parent/receipt.json"
          fi
          if test -d "$parent" && ! test -L "$parent"; then
            sudo rmdir "$parent"
          fi
