name: Akula VIDEO-TOOLS-01a protected three-PE identity lab (non-release)
# github-hosted Windows PR-only; no artifact uploads, signing or publisher environment.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/video-tools-01a-isolated-lab.nsi'
      - 'scripts/windows-video-tools-01a-isolated-lab.ps1'
      - 'scripts/video-tools-01c-os-known-root.ps1'
      - 'scripts/windows-video-tools-01c-root-lab.ps1'
      - 'scripts/video-tools-01d-acl.ps1'
      - 'scripts/windows-video-tools-01d-acl-negative.ps1'
      - 'scripts/windows-video-tools-01e-native-lab.ps1'
      - 'scripts/windows-video-tools-01f-standard-user.ps1'
      - 'scripts/windows-video-tools-01g-pin-race.ps1'
      - 'scripts/video-tools-01i-unsigned-custody.cjs'
      - '.github/scripts/video-tools-01i-unsigned-custody.test.cjs'
      - 'docs/release/video-tools-01i-unsigned-custody.md'
      - '.github/scripts/video-tools-01g-pin-race.test.cjs'
      - 'aquilum-app/native/src/video/tools_package_pin_windows.rs'
      - 'aquilum-app/native/src/video/tools_package_pin_admission.rs'
      - 'docs/release/video-tools-01g-held-handles.md'
      - '.github/scripts/video-tools-01f-standard-user.test.cjs'
      - 'docs/release/video-tools-01f-standard-user.md'
      - 'aquilum-app/native/src/video/tools_package_windows.rs'
      - 'aquilum-app/native/src/video/tools_package_probe.rs'
      - '.github/scripts/video-tools-01e-native.test.cjs'
      - 'docs/release/video-tools-01e-native.md'
      - '.github/scripts/video-tools-01d-acl.test.cjs'
      - 'docs/release/video-tools-01d-acl.md'
      - '.github/scripts/video-tools-01c-root.test.cjs'
      - '.github/scripts/video-tools-01a-isolated-nsis.test.cjs'
      - '.github/workflows/akula-video-tools-01a-isolated-lab.yml'
      - 'aquilum-app/native/packaging/akula-windows.json'
      - 'docs/release/video18b04-five-exe-allowlist.json'
      - 'labs/video-lite/Cargo.toml'
      - 'labs/video-lite/Cargo.lock'
      - 'labs/video-lite/src/'
      - 'docs/release/video-optin-package-v1.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Real three-PE identity and mutation source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prove stock signed installer remains two EXE and new tools are lab-only
        run: |
          set -euo pipefail
          node --test .github/scripts/video-tools-01a-isolated-nsis.test.cjs
          node --test .github/scripts/video-tools-01c-root.test.cjs
          node --test .github/scripts/video-tools-01d-acl.test.cjs
          node --test .github/scripts/video-tools-01e-native.test.cjs
          node --test .github/scripts/video-tools-01f-standard-user.test.cjs
          node --test .github/scripts/video-tools-01g-pin-race.test.cjs
          node --test .github/scripts/video-tools-01i-unsigned-custody.test.cjs
          echo 'VIDEO_TOOLS_01A_SOURCE_CONTRACT_PASS release=0'

  windows-real:
    name: Genuine protected Program Files three-PE NSIS install and uninstall (non-release)
    needs: contract
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            labs/video-lite
          shared-key: akula-video-tools-01a-mux-v1
          save-if: false
      - name: Parse all eight PowerShell scripts before any executable staging
        shell: pwsh
        run: |
          foreach($path in @('scripts/windows-video-tools-01a-isolated-lab.ps1','scripts/windows-video-tools-01c-root-lab.ps1','scripts/video-tools-01c-os-known-root.ps1','scripts/video-tools-01d-acl.ps1','scripts/windows-video-tools-01d-acl-negative.ps1','scripts/windows-video-tools-01e-native-lab.ps1','scripts/windows-video-tools-01f-standard-user.ps1','scripts/windows-video-tools-01g-pin-race.ps1')){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $path),
              [ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -ne 0){ throw "VIDEO_TOOLS_01C_HOLD: PowerShell parse $path : $($errors | Out-String)" }
          }
      - name: OS-known Program Files root rejects environment spoof and junction (non-release)
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./scripts/windows-video-tools-01c-root-lab.ps1 2>&1)
          $proof | Out-Host
          if(!(($proof | Out-String).Contains('VIDEO_TOOLS_01C_OS_ROOT_PASS'))){
            throw 'VIDEO_TOOLS_01C_HOLD: genuine Windows OS root/spoof/junction proof missing'
          }
      - name: Build and test the pinned Rust H264/AAC mux from source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo test --release --locked --manifest-path labs/video-lite/Cargo.toml --bin dash
          if($LASTEXITCODE -ne 0){ throw 'VIDEO_TOOLS_01A_HOLD: mux test failed' }
          cargo build --release --locked --manifest-path labs/video-lite/Cargo.toml --bin dash
          if($LASTEXITCODE -ne 0){ throw 'VIDEO_TOOLS_01A_HOLD: mux build failed' }
          $mux=(Resolve-Path labs/video-lite/target/release/dash.exe).Path
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO_TOOLS_01A_MUX=$mux"
      - name: Retrieve strictly pinned official yt-dlp and QuickJS PE for ephemeral test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'video-tools-01a-upstream'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $yt=Join-Path $out 'yt-dlp.exe'
          $js=Join-Path $out 'qjs.exe'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe' -OutFile $yt -UseBasicParsing
          Invoke-WebRequest 'https://github.com/quickjs-ng/quickjs/releases/download/v0.18.0/qjs-windows-x86_64.exe' -OutFile $js -UseBasicParsing
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO_TOOLS_01A_YT=$yt"
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO_TOOLS_01A_JS=$js"
      - name: Install pinned NSIS 3.11.0 on disposable Windows runner
        shell: pwsh
        run: |
          choco install nsis --version=3.11.0 --yes --no-progress
          if($LASTEXITCODE -ne 0){ throw 'VIDEO_TOOLS_01A_HOLD: NSIS unavailable' }
      - name: Real protected three-PE NSIS, source/pin and ACL proof; no release
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./scripts/windows-video-tools-01a-isolated-lab.ps1 -MuxPath $env:VIDEO_TOOLS_01A_MUX -YtDlpPath $env:VIDEO_TOOLS_01A_YT -QuickJsPath $env:VIDEO_TOOLS_01A_JS 2>&1)
          $proof | Out-Host
          if(!(($proof | Out-String).Contains('VIDEO_TOOLS_01A_ISOLATED_THREE_PE_PASS'))){
            throw 'VIDEO_TOOLS_01A_HOLD: genuine protected install/uninstall proof missing'
          }
          if(!(($proof | Out-String).Contains('VIDEO_TOOLS_01D_ACL_MUTATION_PASS'))){
            throw 'VIDEO_TOOLS_01D_HOLD: real Windows ACL poison/restore witness missing'
          }
          if(!(($proof | Out-String).Contains('VIDEO_TOOLS_01E_NATIVE_WIN32_PASS'))){
            throw 'VIDEO_TOOLS_01E_HOLD: native Windows OS security witness missing'
          }
          if(!(($proof | Out-String).Contains('VIDEO_TOOLS_01F_NONADMIN_PASS'))){
            throw 'VIDEO_TOOLS_01F_HOLD: real Windows standard-user access refusal missing'
          }
          if(!(($proof | Out-String).Contains('VIDEO_TOOLS_01G_PIN_RACE_PASS'))){
            throw 'VIDEO_TOOLS_01G_HOLD: real Windows held-handle sharing test missing'
          }
          if(!(($proof | Out-String).Contains('VIDEO_TOOLS_01I_UNSIGNED_CUSTODY_PASS'))){
            throw 'VIDEO_TOOLS_01I_HOLD: actual three pinned PE metadata was not built'
          }
