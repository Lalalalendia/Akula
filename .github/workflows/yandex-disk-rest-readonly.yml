name: Yandex Disk REST metadata read-only

on:
  pull_request:
    paths:
      - 'aquilum-app/core/src/sync/yandex_disk_rest.rs'
      - 'aquilum-app/core/src/sync/mod.rs'
      - 'aquilum-app/core/Cargo.toml'
      - '.github/workflows/yandex-disk-rest-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  isolated-readonly:
    name: Yandex REST offline types / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: yandex-rest-${{ matrix.os }}
          save-if: false
      - name: Verify offline bounded parser, status policy and path restrictions
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features sync-yandex-disk-rest yandex_disk_rest::tests
      - name: Verify opt-in module compiles without cloud authorization
        working-directory: aquilum-app
        run: cargo check --locked -p aquilum-core --features sync-yandex-disk-rest
