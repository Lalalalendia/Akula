name: AKAI Host Broker foundation — isolated Windows SCM and deny-only source

on:
  pull_request:
    paths:
      - "aquilum-app/host-broker-lab/**"
      - ".github/scripts/staya-broker-store-positive.ps1"
      - ".github/workflows/akai-hostbroker-foundation.yml"
      - "docs/agents/akai-host-foundation-01.md"
  push:
    branches:
      - "agent/akai-host-foundation01-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-broker:
    name: Standalone Broker Rust and OS semantics — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      - name: Confirm isolated source and no app/installer activation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path("aquilum-app/host-broker-lab/Cargo.toml").read_text()
          assert "\n[workspace]" in manifest
          crate=Path("aquilum-app/host-broker-lab/src/lib.rs").read_text()
          assert "pub enum Denial" in crate and "pub fn deny_frame" in crate
          assert "mod windows_revocation_journal" in crate
          assert "#[cfg(all(test, windows))]" in crate
          assert "mod windows_revocation_witness" in crate
          manifest_app=Path("aquilum-app/Cargo.toml").read_text()
          assert "host-broker-lab" not in manifest_app
          PY
          git diff --check
      - name: Test standalone crate, no product workspace modification
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path aquilum-app/host-broker-lab/Cargo.toml --all-targets
          cargo check --locked --manifest-path aquilum-app/host-broker-lab/Cargo.toml --all-targets
          cargo fmt --manifest-path aquilum-app/host-broker-lab/Cargo.toml --all -- --check
          git diff --exit-code -- aquilum-app/Cargo.lock aquilum-app/host-broker-lab/Cargo.lock

  real-windows-scm:
    name: Real Windows LocalSystem SCM, protected DACL and tamper refusal
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Build disposable standalone Broker service
        run: |
          cargo build --locked --manifest-path aquilum-app/host-broker-lab/Cargo.toml --bin akula-host-broker-lab
          if ($LASTEXITCODE -ne 0) { throw "standalone Broker binary failed to compile" }
      - name: Verify actual LocalSystem identity, protected pinned marker and negative ACL mutation
        run: |
          & ./.github/scripts/staya-broker-store-positive.ps1
      - name: Report explicit HOLD boundary
        run: |
          "OS fixture: unsigned disposable SCM service and installer-LIKE owner/DACL, not an installed issuer." >> $env:GITHUB_STEP_SUMMARY
          "No vault enrollment, trusted external antirollback witness, issued grants, MCP read, QUIC, or File Gate authority." >> $env:GITHUB_STEP_SUMMARY
