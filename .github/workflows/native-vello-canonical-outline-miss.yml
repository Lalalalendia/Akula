name: Vello canonical local-origin outline cache-miss A/B

on:
  pull_request:
    paths:
      - '.github/workflows/native-vello-canonical-outline-miss.yml'
      - 'aquilum-app/native/vendor/vello_cpu/src/text.rs'
      - 'aquilum-app/native/vendor/vello_cpu/src/text/canonical_miss.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vello-canonical-miss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-outline:
    name: Compare 20 normal vs 20 canonical cache-miss renders
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-canonical-outline-v1
          cache-workspace-crates: true
      - name: Install native Linux libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Capture revision and runner identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vello-canonical
          {
            git rev-parse HEAD
            rustc --version
            grep -m1 'model name' /proc/cpuinfo || true
          } | tee vello-canonical/environment.txt
      - name: Compile before strict A/B
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --release --locked --no-run -p aquilum-native --bin aquilum-native
      - name: Twenty ABBA pairs with original strict full-frame reference
        shell: bash
        working-directory: aquilum-app
        env:
          AQ_CROSSOVER_ONLY_CASE: cover_1x
          AQ_CROSSOVER_EVERY_FRAME: '1'
          AQ_CROSSOVER_WORKLOAD: guard96
          AQ_TEST_SCROLL_EDGE_GUARD: '96'
        run: |
          set -uo pipefail
          baseline_n=0
          canonical_n=0
          baseline_red=0
          canonical_red=0
          canonical_applied=0
          fallback=0
          unexpected=0
          for cycle in $(seq 1 10); do
            for mode in baseline canonical canonical baseline; do
              if [ "$mode" = baseline ]; then
                baseline_n=$((baseline_n + 1))
                n="$baseline_n"
              else
                canonical_n=$((canonical_n + 1))
                n="$canonical_n"
              fi
              log="$GITHUB_WORKSPACE/vello-canonical/$mode-$n.log"
              if [ "$mode" = canonical ]; then
                if env AQ_TEST_CANONICAL_OUTLINE_REPLAY=1 cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_worker_crossover -- --ignored --nocapture --test-threads=1 > "$log" 2>&1; then
                  rc=0
                else
                  rc=$?
                fi
                if grep -q 'VELLO_CANONICAL_OUTLINE applied ' "$log"; then
                  canonical_applied=$((canonical_applied + 1))
                fi
                if grep -q 'VELLO_CANONICAL_OUTLINE fallback=' "$log"; then
                  fallback=$((fallback + 1))
                fi
              else
                if cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_worker_crossover -- --ignored --nocapture --test-threads=1 > "$log" 2>&1; then
                  rc=0
                else
                  rc=$?
                fi
              fi
              if [ "$rc" -eq 0 ]; then
                :
              elif grep -q 'VELLO_GUARD_PARITY_FAILURE case=cover_1x' "$log"; then
                if [ "$mode" = baseline ]; then
                  baseline_red=$((baseline_red + 1))
                else
                  canonical_red=$((canonical_red + 1))
                fi
              else
                unexpected=$((unexpected + 1))
                echo "CANONICAL_UNEXPECTED mode=$mode trial=$n rc=$rc"
                tail -n 35 "$log"
              fi
            done
          done
          echo "CANONICAL_A_B baseline_red=$baseline_red/20 canonical_red=$canonical_red/20 applied=$canonical_applied/20 fallback_processes=$fallback/20 unexpected=$unexpected" | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'Independent full-frame strict >1/255 failure is unchanged. This is an experimental cache-miss rasterizer; speed is not approved.' >> "$GITHUB_STEP_SUMMARY"
          test "$baseline_n" -eq 20
          test "$canonical_n" -eq 20
          test "$unexpected" -eq 0
          test "$canonical_applied" -eq 20
          test "$canonical_red" -eq 0
      - name: Archive full per-process renderer observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vello-canonical-${{ github.sha }}
          path: vello-canonical/
          retention-days: 14
          if-no-files-found: warn
