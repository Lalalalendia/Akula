name: Native installed-host positive two-process acceptance

on:
  workflow_call:
  pull_request:
    paths:
      - 'aquilum-app/native/src/workspace.rs'
      - 'aquilum-app/native/src/workspace_host_positive_tests.rs'
      - 'aquilum-app/core/src/app_core.rs'
      - 'aquilum-app/core/src/files/gate/write.rs'
      - 'aquilum-app/core/src/sync/host_custody_registry.rs'
      - 'aquilum-app/core/src/sync/host_ledger_identity.rs'
      - '.github/workflows/sync-native-positive-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-host-native-positive-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  positive-native:
    name: Positive native host cross-appdata / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest] # MAC-HOLD-01: macOS frozen
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.artifacts/cargo-native-positive
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Select run-scoped host ledger (before Cargo compilation)
        shell: bash
        run: |
          set -euo pipefail
          printf 'AKULA_INSTALLED_HOST_CUSTODY_DB=%s/akula-ci-native-positive-host.sqlite3\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native-positive
          key: p0-native-positive-${{ matrix.os }}
          cache-workspace-crates: true
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Provision ONLY a disposable installer-owned ledger fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import sqlite3
          db = Path(os.environ["AKULA_INSTALLED_HOST_CUSTODY_DB"])
          assert db.is_absolute()
          assert db.name == "akula-ci-native-positive-host.sqlite3"
          assert not db.exists(), "do not replace a preexisting host ledger"
          assert db.parent.is_dir()
          # Mirror the test's installer schema. The production installer is
          # separately responsible for trusted ACLs, WAL/SHM and OS identity.
          with sqlite3.connect(db) as conn:
              mode = conn.execute("PRAGMA journal_mode=WAL").fetchone()[0]
              assert mode.lower() == "wal"
              conn.execute("PRAGMA synchronous=FULL")
              conn.execute("""CREATE TABLE shared_custody (
                  root_key TEXT PRIMARY KEY NOT NULL,
                  root_path TEXT NOT NULL UNIQUE,
                  record_json BLOB NOT NULL,
                  record_blake3 TEXT NOT NULL
              )""")
              conn.execute("PRAGMA user_version=1")
              assert conn.execute("SELECT count(*) FROM shared_custody").fetchone()[0] == 0
              assert conn.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          if os.name != "nt":
              db.chmod(0o600)
          print("TEST_LEDGER_PROVISIONED empty schema=1; not a user workspace")
          PY
      - name: Verify installed-host native feature does NOT activate AWS
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo tree --locked -p aquilum-native --no-default-features \
            --features installed,sync-installed-host > native-host-dependencies.txt
          if grep -E 'aws-(config|sdk-s3|sdk-sts) ' native-host-dependencies.txt; then
            echo 'Invalid AWS dependency in native local-host policy'
            exit 1
          fi
      - name: Run real positive second OS process with shared host ledger, history and stale CAS
        working-directory: aquilum-app
        env:
          AKULA_TEST_NATIVE_HOST_POSITIVE: '1'
        run: cargo test --locked -p aquilum-native --bin aquilum-native --no-default-features --features installed,sync-installed-host workspace::installed_host_positive_tests -- --nocapture
      - name: Verify test fixture still valid after both processes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import sqlite3
          db = Path(os.environ["AKULA_INSTALLED_HOST_CUSTODY_DB"])
          assert db.is_file()
          with sqlite3.connect(db) as conn:
              assert conn.execute("PRAGMA user_version").fetchone()[0] == 1
              assert conn.execute("PRAGMA quick_check").fetchone()[0] == "ok"
              assert conn.execute("SELECT count(*) FROM shared_custody").fetchone()[0] == 0
          print("TEST_LEDGER_PRESERVED schema=1; no unexpected enrollment")
          PY
