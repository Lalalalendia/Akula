name: Akula Bootstrap B1b3a pinned Linux helper IPC preflight

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:

      - "aquilum-app/core/src/server_installer_ipc_lab.rs"
      - "aquilum-app/core/tests/server_bootstrap_b1b3a.rs"
      - "docs/platforms/AKULA-SERVER-BOOTSTRAP-B1B3A.md"
      - ".github/workflows/core-server-bootstrap-b1b3a-ipc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-bootstrap-b1b3a-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  real-unix-ipc-signed-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-bootstrap-b1b3a-signed-ipc-v1
          cache-workspace-crates: true
      - name: Format opt-in laboratory sources in ephemeral test checkout
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 aquilum-app/core/src/server_installer_ipc_lab.rs aquilum-app/core/tests/server_bootstrap_b1b3a.rs
      - name: Actual kernel SO_PEERCRED and Ed25519 signed scope refusal tests
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features server-bootstrap-b1b3a-helper-ipc-lab --test server_bootstrap_b1b3a -- --nocapture
          # A real separate UID 0 process sends a valid signed packet and
          # must be rejected by SO_PEERCRED. Run only in disposable Linux CI.
          cargo test --locked -p aquilum-core --features server-bootstrap-b1b3a-helper-ipc-lab --test server_bootstrap_b1b3a actual_separate_root_process_is_rejected_as_wrong_peer_uid -- --ignored --exact --nocapture
          cargo check --locked -p aquilum-core --no-default-features
