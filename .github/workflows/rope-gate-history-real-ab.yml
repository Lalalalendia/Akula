name: Real Rope Gate and History A/B

on:
  pull_request:
    paths:
      - ".github/bench/rope-gate-history-e2e/**"
      - ".github/workflows/rope-gate-history-real-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-real-save-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Real Core File Gate + History ABBA (diagnostic)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ./target/akula-real-save-target
    steps:
      - name: Candidate checkout at the exact proposed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Pinned baseline before PR 266 (exact Core)
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/Akula
          ref: 87d71911c9360692d5866e70d30f46072f4ef8a1
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the SAME probe against both pinned Core revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "87d71911c9360692d5866e70d30f46072f4ef8a1"
          test -f candidate/.github/bench/rope-gate-history-e2e/src/main.rs
          cmp baseline/aquilum-app/Cargo.lock candidate/aquilum-app/Cargo.lock
          mkdir -p baseline/.github/bench
          cp -R candidate/.github/bench/rope-gate-history-e2e baseline/.github/bench/
          # Reuse the exact committed workspace dependency versions, then
          # require the two isolated probe lockfiles to remain identical.
          for name in baseline candidate; do
            cp "$name/aquilum-app/Cargo.lock" \
              "$name/.github/bench/rope-gate-history-e2e/Cargo.lock"
          done
          {
            echo "baseline=$(git -C baseline rev-parse HEAD)"
            echo "candidate=$(git -C candidate rev-parse HEAD)"
            rustc --version
            cargo --version
            grep -m 1 "model name" /proc/cpuinfo || true
          } | tee environment.txt

          cargo build --release \
            --manifest-path baseline/.github/bench/rope-gate-history-e2e/Cargo.toml
          cp "$CARGO_TARGET_DIR/release/akula-rope-gate-history-e2e" "$RUNNER_TEMP/save-before"

          cargo build --release \
            --manifest-path candidate/.github/bench/rope-gate-history-e2e/Cargo.toml
          cp "$CARGO_TARGET_DIR/release/akula-rope-gate-history-e2e" "$RUNNER_TEMP/save-after"
          cmp baseline/.github/bench/rope-gate-history-e2e/Cargo.lock \
              candidate/.github/bench/rope-gate-history-e2e/Cargo.lock
          sha256sum baseline/.github/bench/rope-gate-history-e2e/Cargo.lock | tee -a environment.txt

      - name: ABBA real saves, history verification, stale-CAS refusal
        shell: bash
        run: |
          set -euo pipefail
          : > measurements.txt
          for size in 1 8; do
            for round in 1 2 3; do
              echo "size=$size MiB round=$round" | tee -a measurements.txt
              for variant in before after after before; do
                "$RUNNER_TEMP/save-$variant" "$variant" "$size" | tee -a measurements.txt
              done
            done
          done

      - name: Summarize exact measurements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import math
          import os
          from pathlib import Path
          import re
          import statistics

          pattern = re.compile(
              r"^REAL_GATE_SAVE variant=(before|after) mib=(1|8) bytes=(\d+) "
              r"flatten_ms=([\d.]+) gate_ms=([\d.]+) total_ms=([\d.]+) "
              r"rss_before_kib=(\d+) rss_after_kib=(\d+) peak_extra_kib=(\d+)$"
          )
          rows = collections.defaultdict(list)
          for line in Path("measurements.txt").read_text().splitlines():
              match = pattern.fullmatch(line)
              if not match:
                  continue
              variant, size, total_bytes, flat, gate, total, rss0, rss1, extra = match.groups()
              assert int(total_bytes) == int(size) * 1024 * 1024
              vals = [float(flat), float(gate), float(total)]
              assert all(math.isfinite(n) and n >= 0 for n in vals)
              rows[int(size), variant].append(
                  (vals[0], vals[1], vals[2], int(rss1) - int(rss0), int(extra))
              )

          def p95(values):
              data = sorted(values)
              return data[math.ceil(0.95 * len(data)) - 1]

          report = [
              "## Real Akula Rope → Core File Gate → HistoryService A/B",
              "",
              "Before: 87d71911 (pre borrowed milestones). After: PR HEAD (borrowed milestones).",
              "One Ubuntu 24.04 runner, same Rust toolchain, identical resolved Cargo.lock.",
              "Each sample creates a fresh disposable Core and saved note; timing includes",
              "Rope flatten, actual Core File Gate CAS+atomic write, synchronous history",
              "baseline+version commit and search notification (not UI queue or startup).",
              "",
              "| MiB | Before total p50/p95 ms | After total p50/p95 ms | Total p50 change | Before Gate p50 ms | After Gate p50 ms |",
              "|---:|---:|---:|---:|---:|---:|",
          ]
          for size in (1, 8):
              a = rows[size, "before"]
              b = rows[size, "after"]
              assert len(a) == len(b) == 6, (size, len(a), len(b))
              old_total = statistics.median(x[2] for x in a)
              new_total = statistics.median(x[2] for x in b)
              old_gate = statistics.median(x[1] for x in a)
              new_gate = statistics.median(x[1] for x in b)
              percent = (new_total / old_total - 1) * 100
              report.append(
                  f"| {size} | {old_total:.3f} / {p95(x[2] for x in a):.3f} | "
                  f"{new_total:.3f} / {p95(x[2] for x in b):.3f} | "
                  f"{percent:+.1f}% | {old_gate:.3f} | {new_gate:.3f} |"
              )
          report += [
              "",
              "Correctness is mandatory on every run: exact persisted note bytes/BLAKE3,",
              "both readable history versions (original normalized CRLF plus saved text),",
              "rejected stale CAS with zero overwrite and no extra history version.",
              "6 independent samples per variant/size; order before-after-after-before repeated 3 times.",
              "For n=6, nearest-rank p95 equals the maximum sample and is noisy.",
              "VmRSS and process high-water estimates are available in raw measurements.",
              "Results do NOT test S3 custody, durable intents, host enrollment, installed app,",
              "recovery after crash or OS lock contention; they do not authorize a new writer.",
              "No timing threshold gates CI: only fidelity and lockfile equality are enforced.",
              "",
          ]
          text = "\n".join(report)
          print(text)
          Path("summary.md").write_text(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(text)
          PY

      - name: Upload A/B and dependency evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-rope-filegate-history-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            environment.txt
            measurements.txt
            summary.md
            candidate/.github/bench/rope-gate-history-e2e/Cargo.lock
