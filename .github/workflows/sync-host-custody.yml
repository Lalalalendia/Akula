name: Local host custody without AWS

on:
  workflow_call:
  # PR path owners are enforced in required central route.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-host-light-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  local-host-custody:
    name: Local-only cross-appdata host gate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest] # MAC-HOLD-01: macOS frozen
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: p0-host-custody-light-${{ matrix.os }}
          cache-workspace-crates: true
      - name: Check that the local host feature does not activate AWS SDKs
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo tree --locked -p aquilum-core --no-default-features --features host-custody > host-only-tree.txt
          if grep -E 'aws-(config|sdk-s3|sdk-sts) ' host-only-tree.txt; then
            echo 'Unexpected AWS SDK in local host-only feature'
            exit 1
          fi
      - name: Verify mandatory installed Core is AWS-free
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo tree --locked -p aquilum-core --no-default-features --features sync-installed-host > installed-host-tree.txt
          if grep -E 'aws-(config|sdk-s3|sdk-sts) ' installed-host-tree.txt; then
            echo 'Installed local custody unexpectedly activated an AWS SDK'
            exit 1
          fi
      - name: Verify installed Core.open fails closed with no build-time ledger
        working-directory: aquilum-app
        env:
          AKULA_INSTALLED_HOST_CUSTODY_DB: ''
        run: cargo test --locked -p aquilum-core --no-default-features --features sync-installed-host installed_host_tests -- --nocapture
      - name: Verify two default Core.open processes share REAL installed ledger
        working-directory: aquilum-app
        env:
          AKULA_INSTALLED_HOST_CUSTODY_DB: ${{ runner.temp }}/akula-ci-installed-host.sqlite3
          AKULA_INSTALLED_HOST_TEST_ALLOW_PROVISION: '1'
        run: cargo test --locked -p aquilum-core --no-default-features --features sync-installed-host mandatory_installed_host_core_open_uses_real_compiled_shared_ledger -- --nocapture
      - name: Verify installer host registry and different appdata cases
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --no-default-features --features host-custody host_custody_registry::tests -- --nocapture
      - name: Internal additive create rejects installed host without shared epoch
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --no-default-features --features host-custody mandatory_host_epoch_refuses_unadmitted_internal_staged_create -- --nocapture
      - name: Verify real second OS process and host-held note/history epoch
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --no-default-features --features host-custody host_core_epoch_tests -- --nocapture

  native-installed-host:
    name: Native Workspace::open host gate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest] # MAC-HOLD-01: macOS frozen
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: p0-native-host-${{ matrix.os }}
          cache-workspace-crates: true
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Ensure native installed-host policy does not activate AWS
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo tree --locked -p aquilum-native --no-default-features --features installed,sync-installed-host > native-installed-tree.txt
          if grep -E 'aws-(config|sdk-s3|sdk-sts) ' native-installed-tree.txt; then
            echo 'Native host-only safety mode unexpectedly activated AWS'
            exit 1
          fi
      - name: Test native Workspace open and independent appdata child process
        working-directory: aquilum-app
        env:
          AKULA_INSTALLED_HOST_CUSTODY_DB: ''
        run: cargo test --locked -p aquilum-native --bin aquilum-native --no-default-features --features installed,sync-installed-host workspace::installed_host_native_tests -- --nocapture

  witnessed-installed-host:
    name: Witnessed cold-start Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest] # MAC-HOLD-01: macOS frozen
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      AKULA_B6B_TEST_ALLOW_PROVISION: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.artifacts/cargo-b6b-witness
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Select independent disposable compile-time paths
        shell: bash
        run: |
          set -euo pipefail
          echo "AKULA_INSTALLED_HOST_CUSTODY_DB=$RUNNER_TEMP/akula-b6b-host/akula-ci-b6b-ledger.sqlite3" >> "$GITHUB_ENV"
          echo "AKULA_INSTALLED_HOST_WITNESS_PATH=$RUNNER_TEMP/akula-b6b-witness/akula-ci-b6b-receipt.json" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-b6b-witness
          key: p0-b6b-witness-${{ matrix.os }}
          cache-workspace-crates: true
      - name: Verify witnessed host does not activate AWS
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo tree --locked -p aquilum-core --no-default-features --features sync-installed-host-witness > witnessed-tree.txt
          cargo tree --locked -p aquilum-native --no-default-features --features installed,sync-installed-host-witness > native-tree.txt
          if grep -E 'aws-(config|sdk-s3|sdk-sts) ' witnessed-tree.txt native-tree.txt; then
            echo 'Witnessed host-only profile unexpectedly activated AWS'
            exit 1
          fi
      - name: Real cold Core.open witness, 2 processes, forged valid empty DB and missing receipt
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --no-default-features --features sync-installed-host-witness compiler_pinned_witness_survives_cold_restart_and_refuses_foreign_empty_ledger -- --nocapture
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Real native Workspace.open with external witness and second process
        working-directory: aquilum-app
        env:
          AKULA_B6B_NATIVE_SMOKE: '1'
        run: cargo test --locked -p aquilum-native --bin aquilum-native --no-default-features --features installed,sync-installed-host-witness workspace::installed_host_witness_tests -- --nocapture
