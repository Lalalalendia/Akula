name: Application checks

# Always report one stable check for branch rulesets. Paths are evaluated
# inside the job so documentation-only PRs do not run the Rust suite.
on:
  pull_request:
    branches: [main]
  # Caches saved by a PR are isolated to refs/pull/*/merge.
  # Seed a cache in main so all sibling PRs can restore it.
  push:
    branches: [main]
    paths:
      - 'aquilum-app/**'
      - '.github/workflows/app-checks.yml'

permissions:
  contents: read

# Cancel outdated checks for the same PR after a new commit. Other PRs stay independent.
concurrency:
  group: main-pr-gate-${{ github.event_name == 'push' && 'cache-seed' || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.event_name == 'pull_request'
    name: Classify required CI lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify Rust test scope (fail closed)
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node --test .github/scripts/ci-rust-scope.test.cjs
          node .github/scripts/ci-rust-scope.cjs --base="$BASE_SHA" --head=HEAD >> "$GITHUB_OUTPUT"

  required-tests:
    if: github.event_name == 'pull_request'
    needs: classify
    name: Required Rust tests and policy checks
    runs-on: ubuntu-24.04
    # Fail boundedly if cold compilation or Rust tests hang.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" HEAD

      - name: Architecture budget (advisory, no size-based failure)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node --test .github/scripts/architecture-budget.test.cjs
          node .github/scripts/architecture-budget.cjs --base="$BASE_SHA" --head=HEAD --summary="$GITHUB_STEP_SUMMARY"

      # PLUGIN-00: documentation/source-boundary inventory only; no runtime or new status check.
      - name: Plugin architecture contract
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/scripts/plugin-architecture.test.cjs

      - name: Check installers and branch cleanup safety
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-scripts.sh scripts/verify-macos-release.sh scripts/test-macos-release-verifier.sh
          bash scripts/test-install-scripts.sh
          bash scripts/test-macos-release-verifier.sh
          node --test .github/scripts/branch-hygiene.test.cjs

      - name: Release source and custody flavor contract
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/scripts/release-source-contract.test.cjs
          node .github/scripts/release-source-contract.cjs

      - name: macOS updater TAR and signed-DMG content parity (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_mac_tar_parity.py' -v

      - uses: dtolnay/rust-toolchain@stable
        if: needs.classify.outputs.mode != 'none'

      - name: Security-test macOS updater TAR parser on Linux too
        if: needs.classify.outputs.mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          printf '#[path = "%s"] mod tar;\n' "$GITHUB_WORKSPACE/aquilum-app/native/src/updater/tar.rs" > "$RUNNER_TEMP/akula_tar_test_harness.rs"
          rustc --edition=2024 --test -D warnings "$RUNNER_TEMP/akula_tar_test_harness.rs" -o "$RUNNER_TEMP/akula_tar_security_tests"
          "$RUNNER_TEMP/akula_tar_security_tests" --nocapture

      - name: Test macOS updater transaction with shared installer lock and crash recovery
        if: needs.classify.outputs.mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          printf '#[path = "%s"] mod txn;\n' "$GITHUB_WORKSPACE/aquilum-app/native/src/updater/macos_transaction.rs" > "$RUNNER_TEMP/akula_updater_txn_harness.rs"
          rustc --edition=2024 --test -D warnings "$RUNNER_TEMP/akula_updater_txn_harness.rs" -o "$RUNNER_TEMP/akula_updater_txn_tests"
          "$RUNNER_TEMP/akula_updater_txn_tests" --nocapture


      - name: Restore shared main Rust cache (read-only on PRs)
        uses: swatinem/rust-cache@v2
        if: needs.classify.outputs.mode != 'none'
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false

      - name: Install Linux dependencies
        if: needs.classify.outputs.mode == 'workspace'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Run Core tests in both modes (sync-only changes)
        if: needs.classify.outputs.mode == 'sync'
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p aquilum-core --locked
          cargo test -p aquilum-core --features sync-engine --locked

      - name: Run full Rust workspace and sync-engine tests
        if: needs.classify.outputs.mode == 'workspace'
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --skip app::tests::perf::frames::
          cargo test -p aquilum-core --features sync-engine --locked


  native-frames:
    name: Native frame fidelity
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.mode == 'workspace'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore main Rust cache (read-only)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Install native Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Run all frame-fidelity tests (required, not just informational)
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          start=$SECONDS
          cargo test --locked -p aquilum-native --bin aquilum-native -- app::tests::perf::frames::
          printf 'Required frame-fidelity lane: %s seconds\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

  checks:
    # The ONLY status required by Protect main. GitHub cannot report success
    # until every mandatory lane is green. Always run even on upstream failure.
    name: Main PR gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [classify, required-tests, native-frames]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce all required lanes (fail closed)
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          REQUIRED_RESULT: ${{ needs.required-tests.result }}
          FRAMES_RESULT: ${{ needs.native-frames.result }}
          TEST_SCOPE: ${{ needs.classify.outputs.mode }}
        run: |
          set -euo pipefail
          echo "Classification: $CLASSIFY_RESULT / $TEST_SCOPE"
          echo "Required tests: $REQUIRED_RESULT; native fidelity: $FRAMES_RESULT"
          if [ "$CLASSIFY_RESULT" != success ] || [ "$REQUIRED_RESULT" != success ]; then
            echo "::error::CI classification or required tests failed"
            exit 1
          fi
          case "$TEST_SCOPE" in
            workspace)
              if [ "$FRAMES_RESULT" != success ]; then
                echo "::error::Native fidelity lane did not pass"
                exit 1
              fi
              ;;
            sync|none)
              if [ "$FRAMES_RESULT" != skipped ]; then
                echo "::error::Unexpected native fidelity state for non-workspace PR"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown test scope"
              exit 1
              ;;
          esac
          echo "Required checks passed for $TEST_SCOPE scope" >> "$GITHUB_STEP_SUMMARY"

  seed-rust-cache:
    name: Seed shared Rust cache for future PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore/save default-branch Rust cache
        id: cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: true
      - name: Install dependencies only on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Compile cached tests without running them
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --workspace --locked --no-run
          cargo test -p aquilum-core --features sync-engine --locked --no-run
      - name: Cache observation
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "Shared Rust cache exact hit: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "Only the main branch can save the shared cache; PRs restore but never upload." >> "$GITHUB_STEP_SUMMARY"
