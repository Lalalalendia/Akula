name: Application checks

# Always report one stable check for branch rulesets. Paths are evaluated
# inside the job so documentation-only PRs do not run the Rust suite.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel outdated checks for the same PR after a new commit. Other PRs stay independent.
concurrency:
  group: main-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Main PR gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether Rust tests are needed
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/pr-changed-paths.txt"
          if grep -Eq '^(aquilum-app/|\.github/workflows/app-checks\.yml$)' "$RUNNER_TEMP/pr-changed-paths.txt"; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rust=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" HEAD

      - name: Architecture budget (advisory, no size-based failure)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node --test .github/scripts/architecture-budget.test.cjs
          node .github/scripts/architecture-budget.cjs --base="$BASE_SHA" --head=HEAD --summary="$GITHUB_STEP_SUMMARY"

      - name: Check installers and branch cleanup safety
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh scripts/uninstall.sh scripts/test-install-scripts.sh
          bash scripts/test-install-scripts.sh
          node --test .github/scripts/branch-hygiene.test.cjs

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.rust == 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.scope.outputs.rust == 'true'
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native

      - name: Install Linux dependencies
        if: steps.scope.outputs.rust == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Run Rust tests
        if: steps.scope.outputs.rust == 'true'
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked
          cargo test -p aquilum-core --features sync-engine --locked
