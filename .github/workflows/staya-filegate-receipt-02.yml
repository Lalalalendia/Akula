name: Staya FILEGATE-RECEIPT-02 real process crash and readback
on:
  pull_request:
    paths:
      - "experiments/staya-filegate-receipt-02/**"
      - ".github/workflows/staya-filegate-receipt-02.yml"
      - "docs/sync/staya-filegate-receipt-02.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-gate-and-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Checkout exact external pure LesHa R0 planner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Lalalalendia/med
          ref: 5046ff53207ce2fc89fb83277d9ceec1fee30935
          path: deps
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
      - name: Verify LesHa checkout pinned source
        run: |
          test "$(git -C deps rev-parse HEAD)" = 5046ff53207ce2fc89fb83277d9ceec1fee30935
          test -f deps/crates/lesha-replication/src/lib.rs
      - name: Enable existing yrs dependency if-let-guard feature only for test build
        run: |
          echo 'RUSTC_BOOTSTRAP=1' >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-Zcrate-attr=feature(if_let_guard)' >> "$GITHUB_ENV"
      - name: Resolve standalone test crate
        run: cargo generate-lockfile --manifest-path experiments/staya-filegate-receipt-02/Cargo.toml
      - name: Test real Akula File Gate and process exits
        run: |
          set -o pipefail
          cargo test --locked --manifest-path experiments/staya-filegate-receipt-02/Cargo.toml --all-targets -- --nocapture 2>&1 | tee staya-filegate-receipts.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staya-filegate-receipt-02
          retention-days: 14
          path: |
            staya-filegate-receipts.log
            experiments/staya-filegate-receipt-02/Cargo.lock
