name: Node V1 integration smoke (temporary branch only)
on:
  push:
    branches:
      - feature/akula-node-v1-integration
    paths:
      - '.github/workflows/node-v1-branch-smoke.yml'
      - 'aquilum-app/core/src/node_v1/**'
      - 'aquilum-app/core/src/lib.rs'
      - 'aquilum-app/core/Cargo.toml'
      - 'interop/akula-staya/**'
      - 'scripts/ci/akula-node-v1-systemd-host.sh'
permissions:
  contents: read
concurrency:
  group: node-v1-branch-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-node-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Rust formatting before expensive compilation
        run: cargo fmt --manifest-path interop/akula-staya/Cargo.toml -- --check
      - name: Compile NodeV1 headless binary
        run: cargo check --manifest-path aquilum-app/Cargo.toml --locked -p aquilum-core --features node-v1 --bin akula-node
      - name: Test signed NodeStore and durable challenge fence
        run: |
          cargo test --manifest-path aquilum-app/Cargo.toml --locked -p aquilum-core --features node-v1 node_v1:: -- --nocapture
      - name: Test authenticated QUIC from source A to offline Node to B
        run: cargo test --manifest-path interop/akula-staya/Cargo.toml --features node-v1-e2e-tests --test node_v1_real_quic -- --nocapture
      - name: Compile non-root Iroh Node daemon
        run: cargo check --manifest-path interop/akula-staya/Cargo.toml --features node-v1-runtime --bin akula-node-v1-service
      - name: Test persistent Iroh endpoint identity and unsafe key rejection
        run: cargo test --manifest-path interop/akula-staya/Cargo.toml --features node-v1-runtime --lib installed_key_is_stable_and_missing_or_unsafe_keys_never_regenerate -- --nocapture
      - name: Compile one-shot unprivileged enrollment binary
        run: cargo check --manifest-path interop/akula-staya/Cargo.toml --features node-v1-runtime --bin akula-node-v1-enroll
      - name: Reject re-enrollment and pre-existing root policy
        run: |
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features node-v1-runtime --lib enrollment::tests -- --nocapture
      - name: Build exact Node service and one-shot enrollment ELFs
        run: |
          cargo build --manifest-path interop/akula-staya/Cargo.toml --features node-v1-runtime --bin akula-node-v1-service --bin akula-node-v1-enroll
      - name: Validate disposable host-only systemd proof syntax
        run: bash -n scripts/ci/akula-node-v1-systemd-host.sh
      - name: Real non-root systemd start and SIGKILL restart (disposable CI)
        run: bash scripts/ci/akula-node-v1-systemd-host.sh
