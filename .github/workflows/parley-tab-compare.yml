name: Parley verified-tab ABBA

on:
  pull_request:
    paths:
      - 'aquilum-app/native/src/app/tabs/open.rs'
      - 'aquilum-app/native/src/ui/editor/document/layout_reuse.rs'
      - 'aquilum-app/native/src/app/tests/perf/note_latency.rs'
      - '.github/workflows/parley-tab-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parley-tab-compare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Hash-verified tab switches, same-runner ABBA
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore main Rust cache (read-only)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Install native Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Paired whole-note UI switches, 16 per size and mode
        working-directory: aquilum-app
        env:
          AQ_LATENCY_SWITCHES: '16'
        run: |
          set -euo pipefail
          for case in baseline-1 candidate-1 candidate-2 baseline-2; do
            echo "::group::$case"
            if [[ $case == baseline-* ]]; then
              AQ_TEST_DISABLE_PARLEY_LAYOUTS=1 cargo test --locked -p aquilum-native --bin aquilum-native native_note_latency_matrix -- --ignored --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/parley-tab-$case.log"
            else
              env -u AQ_TEST_DISABLE_PARLEY_LAYOUTS cargo test --locked -p aquilum-native --bin aquilum-native native_note_latency_matrix -- --ignored --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/parley-tab-$case.log"
            fi
            echo "::endgroup::"
          done
      - name: Summarize paired full-UI p95
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/benchmarks/summarize-parley-tab-compare.py | tee parley-tab-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parley-verified-tab-abba-${{ github.sha }}
          path: |
            parley-tab-*.log
            parley-tab-comparison.md
          if-no-files-found: warn
          retention-days: 14
