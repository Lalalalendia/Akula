name: Akula P2P offer versus existing grant shape

on:
  pull_request:
    branches:
      - main
      - experiment/akula-p2p-offer-contract-20261021
    paths:
      - 'aquilum-app/core/src/p2p_offer_grant_join_lab.rs'
      - 'aquilum-app/core/src/lib.rs'
      - 'docs/sync/AK-P2P-OFFER-01.md'
      - '.github/workflows/p2p-offer-grant-join.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2p-offer-join-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  correlation-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-p2p-offer-v1
      - name: Rustfmt only the two P2P modules
        working-directory: aquilum-app
        run: rustfmt --edition 2021 --check core/src/p2p_offer_lab.rs core/src/p2p_offer_grant_join_lab.rs
      - name: Test non-authorizing correlation
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --features p2p-offer-lab p2p_offer_grant_join_lab -- --nocapture
      - name: Check only P2P-owned files against unmodified Core lint debt
        working-directory: aquilum-app
        run: |
          set -e
          cargo clippy --locked -p aquilum-core --all-targets --features p2p-offer-lab --message-format=json -- -W clippy::all > p2p-join-clippy.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          bad = []
          legacy = 0
          for line in Path("p2p-join-clippy.jsonl").read_text().splitlines():
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if item.get("reason") != "compiler-message":
                  continue
              diagnostic = item["message"]
              if diagnostic.get("level") not in ("warning", "error"):
                  continue
              owned = any(
                  ("p2p_offer_lab.rs" in span.get("file_name", "")
                   or "p2p_offer_grant_join_lab.rs" in span.get("file_name", ""))
                  for span in diagnostic.get("spans", []) if span.get("is_primary")
              )
              if owned:
                  bad.append(diagnostic["message"])
              else:
                  legacy += 1
          for issue in bad:
              print("NEW P2P DIAGNOSTIC:", issue)
          print(f"Core diagnostics outside scope: {legacy}")
          if bad:
              raise SystemExit(1)
          print("P2P correlation module lint: PASS")
          PY
