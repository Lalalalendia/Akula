name: Akula Core attachment notice and Staya range contract

on:
  push:
    branches:
      - feature/ak-p2p-attachment-core-wow-staya-v1-20261025
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'aquilum-app/core/src/p2p_attachment_contract.rs'
      - 'aquilum-app/core/src/p2p_attachment_replay_lab.rs'
      - 'aquilum-app/core/src/p2p_attachment_grant_lab.rs'
      - 'aquilum-app/core/src/p2p_attachment_grant_spend_lab.rs'
      - 'aquilum-app/core/src/p2p_attachment_source_lab.rs'
      - 'aquilum-app/core/src/lib.rs'
      - 'aquilum-app/core/Cargo.toml'
      - 'interop/akula-staya/src/attachment_contract.rs'
      - 'interop/akula-staya/src/wow_attachment_w3.rs'
      - 'interop/akula-staya/src/granted_quic_lab.rs'
      - 'interop/akula-staya/src/granted_inbox_lab.rs'
      - 'interop/akula-staya/src/file_commit_w4_lab.rs'
      - 'interop/akula-staya/src/lib.rs'
      - 'interop/akula-staya/Cargo.toml'
      - '.github/workflows/p2p-attachment-contract.yml'
permissions:
  contents: read
concurrency:
  group: p2p-attachment-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  core-staya:
    if: github.ref_name == 'feature/ak-p2p-attachment-core-wow-staya-v1-20261025' || github.event.pull_request.head.ref == 'feature/ak-p2p-attachment-core-wow-staya-v1-20261025'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Source revision gate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
      - name: Test bounded Akula receiver-selected attachment contract
        shell: bash
        run: |
          cargo test --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features p2p-attachment-contract p2p_attachment_contract -- --nocapture
      - name: Durable W3 replay ledger after restart and concurrent handles
        shell: bash
        run: |
          cargo test --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features p2p-attachment-replay-lab p2p_attachment_replay_lab -- --nocapture
      - name: Verify default-deny signed exact-object read grant
        shell: bash
        run: |
          cargo test --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features p2p-attachment-grant-lab p2p_attachment_grant_lab -- --nocapture
      - name: Durable one-use signed grant journal (including cold reopen)
        shell: bash
        run: |
          cargo test --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features p2p-attachment-grant-spend-lab p2p_attachment_grant_spend_lab -- --nocapture
      - name: Verify immutable selected-file bytes and signed one-shot range serving
        shell: bash
        run: |
          cargo test --manifest-path aquilum-app/Cargo.toml -p aquilum-core --features p2p-attachment-source-lab p2p_attachment_source_lab -- --nocapture
      - name: Test actual Staya offset and manifest adapter
        shell: bash
        run: |
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-attachment-contract attachment_contract -- --nocapture
      - name: Existing offer to Staya bridge regressions
        shell: bash
        run: |
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-attachment-contract real_staya_queue_excludes_unselected_roots -- --nocapture
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-attachment-contract forged_or_wrong_peer_decision_cannot_create_staya_queue -- --nocapture
      - name: Real signed-grant QUIC range and replay rejection
        shell: bash
        run: |
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-granted-quic-lab granted_quic_lab -- --nocapture
      - name: Verify signed QUIC suffix enters only private cold-verified Inbox
        shell: bash
        run: |
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-granted-inbox-lab granted_inbox_lab -- --nocapture
      - name: Signed content W4 only after cold verified Inbox
        shell: bash
        run: |
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-file-w4-lab file_commit_w4_lab -- --nocapture
      - name: Test real WOW W3 HPKE Ed25519 trust and expiry
        shell: bash
        run: |
          cargo test --manifest-path interop/akula-staya/Cargo.toml --features p2p-wow-w3-lab wow_attachment_w3 -- --nocapture
