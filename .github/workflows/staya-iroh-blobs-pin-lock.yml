# One-time branch-scoped lockfile promotion after independently accepted CI.
# Do not merge this temporary writer workflow into main.
name: Staya P2P blob exact lock freeze (temporary)

on:
  push:
    branches:
      - "experiment/staya-iroh-blobs-compare-20261018"
    paths:
      - ".github/workflows/staya-iroh-blobs-pin-lock.yml"

jobs:
  pin-reproducible-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/staya-iroh-blobs-compare-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: "experiment/staya-iroh-blobs-compare-20261018"
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.91.0"
      - name: Create the exact independently verified resolver output (create-only)
        working-directory: staya/roha-transport
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch Cargo.lock > /dev/null 2>&1; then
            echo "Lockfile already committed; nothing to do"
            exit 0
          fi
          cargo metadata --format-version 1 > /dev/null
          actual="$(sha256sum Cargo.lock | awk '{print $1}')"
          expected="0c8f9baab0e7dbaeae9f40af712dd5a67e56de4de0519acef2776b032d7109f8"
          test "$actual" = "$expected" || {
            echo "Resolver changed, fail closed: $actual (expected $expected)" >&2
            exit 1
          }
          # One and only one write: create Cargo.lock on this experimental branch.
          # No checkout token is persisted and no tests/build scripts run with GH_TOKEN.
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            repos/Lalalalendia/Akula/contents/staya/roha-transport/Cargo.lock \
            -f message="build(staya): pin verified iroh-blobs/roha/noq dependency graph" \
            -f branch="experiment/staya-iroh-blobs-compare-20261018" \
            -f content="$(base64 -w0 Cargo.lock)" \
            --jq .commit.sha
