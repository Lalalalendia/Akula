name: QA Windows workspace duplication reparse (branch only)
on:
  push:
    branches: [integration/upstream-workspace-duplicate-20261109]
    paths:
      - 'aquilum-app/native/src/app/workspaces/actions/duplicate/**'
      - '.github/workflows/qa-windows-workspace-duplicate-20261110.yml'
permissions:
  contents: read
jobs:
  windows-copy-junction:
    name: Windows knowledge-base duplicate rejects NTFS junction
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject real NTFS junction without copying outside content
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          $output = cargo test --locked -p aquilum-native rejects_windows_directory_junction_without_reading_outside -- --nocapture 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "Windows duplicate junction regression exited $LASTEXITCODE" }
          if ($output -notmatch '1 passed; 0 failed') {
            throw 'Windows duplicate junction regression was not executed exactly once'
          }
