# PC-DESK-07: published Windows installer acceptance, never signs or publishes.
# Runs only on a disposable GitHub-hosted Windows Server runner.
name: Akula DESK-07 published NSIS reinstall and manual rollback
on:
  pull_request:
    paths:
      - '.github/workflows/desk07-published-installer.yml'
      - 'scripts/test-windows-published-reinstall.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desk07-published-installer:
    if: github.repository == 'Lalalalendia/Akula'
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse negative installer acceptance script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/test-windows-published-reinstall.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          Write-Host 'AKULA_DESK07_PS_PARSE_PASS'
      - name: Verify published installer double-install, manual rollback and state preservation
        shell: pwsh
        timeout-minutes: 40
        env:
          AKULA_DESK07_DISPOSABLE: '1'
        run: ./scripts/test-windows-published-reinstall.ps1
