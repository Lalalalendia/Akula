name: Vello outline atlas crop-origin invariance

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/native/vendor/vello_cpu/src/render.rs'
      - '.github/workflows/native-vello-atlas-outline-origin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outline-origin:
    name: Outline coverage across viewport origins / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-atlas-origin-unit-v1
          cache-workspace-crates: true
      - name: Test exact same glyph-like outline in full and cropped atlas coordinate frames
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --release --locked -p vello_cpu --lib atlas_like_outline_coverage_is_ -- --nocapture
