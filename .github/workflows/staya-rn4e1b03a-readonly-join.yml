name: Staya RN4E1b03a — readonly replica and peer grant join

on:
  push:
    branches:
      - "experiment/staya-rn4e1b03a-readonly-join-*"
  pull_request:
    paths:
      - "aquilum-app/core/src/sync/peer_replica_join_lab_tests.rs"
      - "aquilum-app/core/src/sync/peer_grant_lab.rs"
      - "aquilum-app/core/src/sync/host_custody_registry.rs"
      - "docs/sync/staya-rn4e1b03a-readonly-join.md"
      - ".github/workflows/staya-rn4e1b03a-readonly-join.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-join:
    name: No cross-replica grant or false host trust — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      RUSTC_BOOTSTRAP: "1"
      RUSTFLAGS: "-Zcrate-attr=feature(if_let_guard)"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt
      - name: Reject product activation and unscoped changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base = "2174fa228406487a3fe92f9273bdfcdd36517803"
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}..HEAD"], text=True
          ).splitlines())
          allowed = {
              "aquilum-app/core/Cargo.toml",
              "aquilum-app/core/src/sync/mod.rs",
              "aquilum-app/core/src/sync/host_custody_registry.rs",
              "aquilum-app/core/src/sync/peer_grant_lab.rs",
              "aquilum-app/core/src/sync/peer_replica_join_lab_tests.rs",
              "aquilum-app/core/tests/rn4c_peer_grant_lab.rs",
              "aquilum-app/core/tests/rn4d_revocation_fence.rs",
              "aquilum-app/core/tests/rn4e_filegate_boundary.rs",
              ".github/workflows/staya-rn4e1b03a-readonly-join.yml",
              "docs/sync/staya-rn4e1b03a-readonly-join.md",
          }
          assert changed == allowed, f"changed out of allowed scope: {changed ^ allowed}"
          PY
          grep -q 'staya-core-grant-lab = \[\]' aquilum-app/core/Cargo.toml
          if grep -q 'staya-core-grant-lab' aquilum-app/native/Cargo.toml; then
            echo "Unexpected installed application grant-lab activation" >&2
            exit 1
          fi
          git diff --check
      - name: Compile and test read-only joint registry falsifiers
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features host-custody,staya-core-grant-lab \
            --lib sync::peer_replica_join_lab_tests \
            -- --nocapture --test-threads=1
      - name: Existing host custody Linux Windows process tests
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features host-custody,staya-core-grant-lab \
            --lib sync::host_custody_registry::tests \
            -- --nocapture --test-threads=1
      - name: Existing RN4C RN4D RN4E0 grant and File Gate tests
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path aquilum-app/Cargo.toml \
            -p aquilum-core --features host-custody,staya-core-grant-lab \
            --test rn4c_peer_grant_lab --test rn4d_revocation_fence \
            --test rn4e_filegate_boundary -- --nocapture --test-threads=1
          git diff --exit-code -- aquilum-app/Cargo.lock
      - name: Check research Rust formatting
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check \
            aquilum-app/core/src/sync/peer_grant_lab.rs \
            aquilum-app/core/src/sync/peer_replica_join_lab_tests.rs \
            aquilum-app/core/tests/rn4c_peer_grant_lab.rs \
            aquilum-app/core/tests/rn4d_revocation_fence.rs \
            aquilum-app/core/tests/rn4e_filegate_boundary.rs
      - name: Deliberately keep product admission HOLD
        run: |
          echo "Observation is NOT product authority: two SQLite reads are not atomic and fake unprivileged host registry passes a deliberate counterexample." >> "$GITHUB_STEP_SUMMARY"
          echo "Unproven: OS installer/Broker witness, real QUIC remote_id, Bao staging, File Gate guarded publication, durable receipt/ACK and Android." >> "$GITHUB_STEP_SUMMARY"
