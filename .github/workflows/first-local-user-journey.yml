name: Akula first local user journey

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/native/src/app/tests/panels/search.rs'
      - '.github/workflows/first-local-user-journey.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  first-local-journey:
    name: Native GUI user path / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: first-local-journey-${{ matrix.os }}
      - name: Native Linux build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Exercise UI create, actual save, restart, search and open
        shell: bash
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-native --bin aquilum-native first_local_user_journey_create_save_restart_search_and_open -- --nocapture --test-threads=1 2>&1 | tee ../first-local-journey.log
          grep -F 'AKULA_FIRST_LOCAL_JOURNEY_PASS=' ../first-local-journey.log >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve bounded synthetic GUI harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akula-first-local-journey-${{ matrix.os }}
          path: first-local-journey.log
          if-no-files-found: warn
          retention-days: 10
