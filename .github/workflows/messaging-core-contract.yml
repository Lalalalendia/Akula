name: Akula messaging state-machine contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/core/Cargo.toml'
      - 'aquilum-app/core/src/messaging/mod.rs'
      - 'aquilum-app/core/src/messaging/tests.rs'
      - 'aquilum-app/core/src/messaging/scale_tests.rs'
      - 'docs/messaging/AK-MSG-CORE-01A.md'
      - '.github/workflows/messaging-core-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-msg-model-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          cache-workspace-crates: true
          save-if: false
      - name: Check standalone model formatting
        run: rustfmt --edition 2021 --check aquilum-app/core/src/messaging/mod.rs
      - name: Run deterministic model tests
        working-directory: aquilum-app
        run: |
          set -euo pipefail
          cargo test --locked -p aquilum-core --features messaging-core-lab 'messaging::' -- --nocapture
      - name: Ensure feature-off Akula core remains buildable
        working-directory: aquilum-app
        run: cargo check --locked -p aquilum-core --no-default-features
