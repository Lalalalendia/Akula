name: QA rename root vs existing File Gate custody (negative only)
on:
  push:
    branches: [integration/qa-rename-custody-transition-20261110]
permissions:
  contents: read
jobs:
  linux:
    name: Linux rename root vs cooperative old-root custody
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: No false rename admission under existing writer lifetime
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --lib sync::workspace_rename_custody_qa -- --nocapture
  windows:
    name: Windows rename root vs cooperative old-root custody
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: No false rename admission under existing writer lifetime
        working-directory: aquilum-app
        shell: pwsh
        run: |
          cargo test --locked -p aquilum-core --lib sync::workspace_rename_custody_qa -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  macos:
    name: macOS rename root vs cooperative old-root custody
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: No false rename admission under existing writer lifetime
        working-directory: aquilum-app
        run: cargo test --locked -p aquilum-core --lib sync::workspace_rename_custody_qa -- --nocapture
