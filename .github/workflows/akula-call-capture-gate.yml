name: AK-CALL-02 authorized capture gate
on:
  pull_request:
    branches:
      - main
    paths:
      - 'interop/akula-call-capture-gate/**'
      - '.github/workflows/akula-call-capture-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  capture-gate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format isolated gate
        shell: bash
        run: cargo fmt --manifest-path interop/akula-call-capture-gate/Cargo.toml -- --check
      - name: Check Windows gate
        shell: bash
        run: cargo check --manifest-path interop/akula-call-capture-gate/Cargo.toml --all-targets
      - name: Verify call and device boundary
        shell: bash
        run: cargo test --manifest-path interop/akula-call-capture-gate/Cargo.toml -- --nocapture
      - name: Lint
        shell: bash
        run: cargo clippy --manifest-path interop/akula-call-capture-gate/Cargo.toml --all-targets -- -D warnings
