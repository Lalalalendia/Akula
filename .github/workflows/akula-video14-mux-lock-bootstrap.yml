name: Akula VIDEO-14 temporary Cargo.lock provenance capture (non-release)

on:
  pull_request:
    branches: [main, feat/video03-one-click-offline-20261116]
    paths:
      - '.github/workflows/akula-video14-mux-lock-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  print-lock:
    name: Generate and capture deterministic lab Cargo.lock for review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and print full generated lockfile as JSON-string lines
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path labs/video-lite/Cargo.toml
          cargo metadata --locked --no-deps --manifest-path labs/video-lite/Cargo.toml --format-version 1 > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json
          file = Path("labs/video-lite/Cargo.lock")
          rows = file.read_text(encoding="utf-8").splitlines(keepends=True)
          assert len(rows) >= 10 and rows[0].startswith("# This file is automatically")
          print("AKULA_VIDEO14_LOCK_BEGIN", len(rows), file.stat().st_size)
          for index, line in enumerate(rows):
              print("AKULA_VIDEO14_LOCK_LINE_" + str(index).zfill(4) + "=" + json.dumps(line))
          print("AKULA_VIDEO14_LOCK_END")
          PY
      - name: No installer or user video
        run: echo 'VIDEO14_BOOTSTRAP_ONLY media=0 release=0 installer=0'
