name: QA Windows knowledge-base pinned parents (branch only)
on:
  push:
    branches: [integration/upstream-workspace-duplicate-20261109]
    paths:
      - 'aquilum-app/native/src/app/workspaces/actions/duplicate/**'
      - '.github/workflows/qa-windows-pinned-parent-copy-20261110.yml'
permissions:
  contents: read
jobs:
  windows-pinned-parent:
    name: Windows parent and file-handle pinning regressions
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute real Windows pinning and copy safety tests
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'pinned_root_and_subfolder_cannot_be_renamed_until_handles_close',
            'checked_open_denies_external_write_until_handle_closes',
            'checked_open_rejects_source_replaced_with_different_size',
            'rejects_windows_directory_junction_without_reading_outside',
            'duplicate_preserves_source_and_copies_nested_binary_files'
          )
          foreach ($test in $tests) {
            $output = cargo test --locked -p aquilum-native $test -- --nocapture 2>&1 | Out-String
            Write-Host $output
            if ($LASTEXITCODE -ne 0) { throw "Windows test '$test' failed ($LASTEXITCODE)" }
            if ($output -notmatch '1 passed; 0 failed') {
              throw "Windows test '$test' did not execute exactly one passing case"
            }
          }
