name: Core performance baseline

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
    paths:
      - "aquilum-app/core/**"
      - ".github/workflows/core-perf.yml"
  workflow_dispatch:
    inputs:
      documents:
        description: "Comma-separated deterministic vault sizes (e.g. 1000,5000)"
        required: false
        default: "1000"

permissions:
  contents: read

concurrency:
  group: core-perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # Skip routine core/sync PRs. Opt in via a perf/* branch, perf: / perf(...) title,
    # or the perf-ci PR label. workflow_dispatch stays available for manual baselines.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'perf/') ||
      startsWith(github.event.pull_request.title, 'perf(') ||
      startsWith(github.event.pull_request.title, 'perf:') ||
      contains(github.event.pull_request.labels.*.name, 'perf-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: core-perf

      - name: Record execution environment
        run: |
          echo "REF=${{ github.sha }}" | tee environment.txt
          echo "RUNNER_OS=$RUNNER_OS" | tee -a environment.txt
          echo "CPU=$(grep -m1 'model name' /proc/cpuinfo || true)" | tee -a environment.txt
          echo "VCPUS=$(nproc)" | tee -a environment.txt
          rustc --version | tee -a environment.txt
          cargo --version | tee -a environment.txt

      - name: Benchmark cold, warm, incremental and deletion indexing
        working-directory: aquilum-app
        env:
          AQUILUM_BENCH_SIZES: ${{ inputs.documents || '1000' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_indexing -- --ignored --nocapture --test-threads=1 2>&1 | tee ../indexing.txt

      - name: Benchmark search pipeline
        working-directory: aquilum-app
        env:
          AQUILUM_BENCH_SIZES: ${{ inputs.documents || '1000' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_search_pipeline -- --ignored --nocapture --test-threads=1 2>&1 | tee ../search.txt

      - name: Benchmark link and metadata pipeline
        working-directory: aquilum-app
        env:
          AQUILUM_BENCH_SIZES: ${{ inputs.documents || '1000' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_link_pipeline -- --ignored --nocapture --test-threads=1 2>&1 | tee ../links.txt

      - name: Benchmark SQLite metadata indexing
        working-directory: aquilum-app
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_sqlite_metadata -- --ignored --nocapture --test-threads=1 2>&1 | tee ../sqlite.txt

      - name: Benchmark per-save critical path
        working-directory: aquilum-app
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_save_breakdown -- --ignored --nocapture --test-threads=1 2>&1 | tee ../save.txt

      - name: Benchmark Yrs editor update staging
        working-directory: aquilum-app
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_editor_staging -- --ignored --nocapture --test-threads=1 2>&1 | tee ../editor.txt

      - name: Summarize machine-readable benchmark lines
        if: always()
        shell: bash
        run: |
          {
            echo "## Core benchmarks"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Corpus: ${{ inputs.documents || '1000' }} notes"
            echo ""
            echo "\`\`\`text"
            for file in indexing.txt search.txt links.txt sqlite.txt save.txt editor.txt; do
              if [ -f "$file" ]; then
                grep -E 'BENCH-(INDEX|SEARCH|LINKS|SQLITE|SAVE|EDITOR) ' "$file" || true
              fi
            done
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-perf-${{ github.sha }}
          path: |
            environment.txt
            indexing.txt
            search.txt
            links.txt
            sqlite.txt
            save.txt
            editor.txt
          retention-days: 30

  # Explicit PR-only experiment: the production indexing benchmark runs
  # unmodified on 1k/5k/10k/50k vaults, each in three isolated processes.
  # Do not run this expensive matrix for unrelated pull requests.
  index_boot_matrix:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'research/index-boot-matrix-')
    name: Index boot (${{ matrix.documents }} notes)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        documents: [1000, 5000, 10000, 50000]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: index-boot-matrix
      - name: Record the exact source and runner
        shell: bash
        run: |
          {
            echo "PR_HEAD=${{ github.event.pull_request.head.sha }}"
            echo "CHECKOUT_SHA=$(git rev-parse HEAD)"
            echo "CPU=$(grep -m1 'model name' /proc/cpuinfo || true)"
            echo "VCPUS=$(nproc)"
            rustc --version
            cargo --version
            df -h .
          } | tee index-${{ matrix.documents }}-environment.txt
      - name: Compile before timing
        working-directory: aquilum-app
        run: cargo test --locked --release -p aquilum-core benchmark_indexing --no-run
      - name: Measure three independent cold/warm/update/delete passes
        working-directory: aquilum-app
        shell: bash
        env:
          AQUILUM_BENCH_SIZES: ${{ matrix.documents }}
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            log="../index-${{ matrix.documents }}-run${round}.txt"
            resources="../index-${{ matrix.documents }}-resource-${round}.txt"
            /usr/bin/time -v -o "$resources" cargo test --locked --release -p aquilum-core benchmark_indexing -- --ignored --nocapture --test-threads=1 > "$log" 2>&1
            grep 'BENCH-INDEX ' "$log"
          done
      - name: Publish raw measurements
        if: always()
        shell: bash
        run: |
          {
            echo '## Akula index baseline (${{ matrix.documents }} Markdown notes)'
            echo 'Three fresh temp vaults, 50 paragraphs/note, production cold/warm/incremental/delete/search path.'
            echo 'Resource figures include fixture generation and the test process, NOT only indexing.'
            echo '```text'
            grep -h 'BENCH-INDEX ' index-${{ matrix.documents }}-run*.txt || true
            echo '```'
            for report in index-${{ matrix.documents }}-resource-*.txt; do
              [ -f "$report" ] || continue
              echo "### $(basename "$report")"
              echo '```text'
              grep -E 'User time|System time|Maximum resident set size|File system inputs|File system outputs|Elapsed \(wall clock\)' "$report" || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep environment, timings, CPU and RSS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-boot-${{ matrix.documents }}-${{ github.event.pull_request.head.sha }}
          path: |
            index-${{ matrix.documents }}-environment.txt
            index-${{ matrix.documents }}-run*.txt
            index-${{ matrix.documents }}-resource-*.txt
          retention-days: 30
