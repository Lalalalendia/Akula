name: Core performance baseline

on:
  workflow_call:
    inputs:
      documents:
        description: "Deterministic vault sizes for manual and called baseline"
        required: false
        type: string
        default: "1000"
  pull_request:
    types: [labeled, edited]
    paths:
      - "aquilum-app/core/**"
      - ".github/workflows/core-perf.yml"
  workflow_dispatch:
    inputs:
      documents:
        description: "Comma-separated deterministic vault sizes (e.g. 1000,5000)"
        required: false
        default: "1000"

permissions:
  contents: read

concurrency:
  group: core-perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # Skip routine core/sync PRs. Opt in via a perf/* branch, perf: / perf(...) title,
    # or the perf-ci PR label. workflow_dispatch stays available for manual baselines.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.head_ref, 'perf/') ||
       startsWith(github.event.pull_request.title, 'perf(') ||
       startsWith(github.event.pull_request.title, 'perf:') ||
       contains(github.event.pull_request.labels.*.name, 'perf-ci')) &&
      !startsWith(github.event.pull_request.title, 'perf(fields-sqlite-batch)')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: core-perf

      - name: Record execution environment
        run: |
          echo "REF=${{ github.sha }}" | tee environment.txt
          echo "RUNNER_OS=$RUNNER_OS" | tee -a environment.txt
          echo "CPU=$(grep -m1 'model name' /proc/cpuinfo || true)" | tee -a environment.txt
          echo "VCPUS=$(nproc)" | tee -a environment.txt
          rustc --version | tee -a environment.txt
          cargo --version | tee -a environment.txt

      - name: Benchmark cold, warm, incremental and deletion indexing
        working-directory: aquilum-app
        env:
          AQUILUM_BENCH_SIZES: ${{ inputs.documents || '1000' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_indexing -- --ignored --nocapture --test-threads=1 2>&1 | tee ../indexing.txt

      - name: Benchmark search pipeline
        working-directory: aquilum-app
        env:
          AQUILUM_BENCH_SIZES: ${{ inputs.documents || '1000' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_search_pipeline -- --ignored --nocapture --test-threads=1 2>&1 | tee ../search.txt

      - name: Benchmark link and metadata pipeline
        working-directory: aquilum-app
        env:
          AQUILUM_BENCH_SIZES: ${{ inputs.documents || '1000' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_link_pipeline -- --ignored --nocapture --test-threads=1 2>&1 | tee ../links.txt

      - name: Benchmark SQLite metadata indexing
        working-directory: aquilum-app
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_sqlite_metadata -- --ignored --nocapture --test-threads=1 2>&1 | tee ../sqlite.txt

      - name: Benchmark per-save critical path
        working-directory: aquilum-app
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_save_breakdown -- --ignored --nocapture --test-threads=1 2>&1 | tee ../save.txt

      - name: Benchmark Yrs editor update staging
        working-directory: aquilum-app
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -p aquilum-core benchmark_editor_staging -- --ignored --nocapture --test-threads=1 2>&1 | tee ../editor.txt

      - name: Summarize machine-readable benchmark lines
        if: always()
        shell: bash
        run: |
          {
            echo "## Core benchmarks"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Corpus: ${{ inputs.documents || '1000' }} notes"
            echo ""
            echo "\`\`\`text"
            for file in indexing.txt search.txt links.txt sqlite.txt save.txt editor.txt; do
              if [ -f "$file" ]; then
                grep -E 'BENCH-(INDEX|SEARCH|LINKS|SQLITE|SAVE|EDITOR) ' "$file" || true
              fi
            done
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-perf-${{ github.sha }}
          path: |
            environment.txt
            indexing.txt
            search.txt
            links.txt
            sqlite.txt
            save.txt
            editor.txt
          retention-days: 30

  fields-sqlite-batch:
    name: Fields SQLite ABBA research
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.title, 'perf(fields-sqlite-batch)')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: sqlite-fields-abba
      - name: Check equivalence of all stored columns and replacement
        working-directory: aquilum-app
        run: cargo test --locked --release -p aquilum-core batched_fields_match_baseline_through_replacement_and_unicode -- --test-threads=1
      - name: Run ABBA for 1k, 10k and 50k rich notes
        shell: bash
        run: |
          set -euo pipefail
          cd aquilum-app
          for size in 1000 10000 50000; do
            sample=0
            for mode in baseline batch batch baseline; do
              sample=$((sample + 1))
              /usr/bin/time -v env AQUILUM_FIELD_BENCH_MODE="$mode" AQUILUM_FIELD_BENCH_SIZE="$size" \
                cargo test --locked --release -p aquilum-core benchmark_fields_sqlite_batch \
                -- --ignored --nocapture --test-threads=1 2>&1 | tee "../fields-${size}-${sample}-${mode}.log"
            done
          done
      - name: Compare elapsed, RSS and full-row hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import statistics
          lines = ["## Same-runner SQLite fields ABBA", "", "| Notes | Baseline | Batch | Change | Base RSS | Batch RSS |", "|---|---:|---:|---:|---:|---:|"]
          metric = re.compile(r"BENCH-FIELDS documents=(\d+) mode=(baseline|batch) rows=(\d+) wall_ms=([\d.]+) digest=([0-9a-f]+)")
          memory = re.compile(r"Maximum resident set size \(kbytes\):\s*(\d+)")
          for size in (1000, 10000, 50000):
              data = {"baseline": [], "batch": []}
              checks = set()
              for path in pathlib.Path(".").glob(f"fields-{size}-*.log"):
                  log = path.read_text()
                  found = metric.search(log)
                  rss = memory.search(log)
                  if found is None or rss is None:
                      raise RuntimeError(f"Missing measured output: {path}")
                  n, mode, rows, ms, digest = found.groups()
                  if int(n) != size or int(rows) != size * 32:
                      raise RuntimeError(f"Bad result count: {path}")
                  checks.add(digest)
                  data[mode].append((float(ms), int(rss.group(1))))
              if len(data["baseline"]) != 2 or len(data["batch"]) != 2 or len(checks) != 1:
                  raise RuntimeError(f"Modes differ or ABBA incomplete at {size}: {checks}")
              base = statistics.median(x[0] for x in data["baseline"])
              batch = statistics.median(x[0] for x in data["batch"])
              a = statistics.median(x[1] for x in data["baseline"]) / 1024
              b = statistics.median(x[1] for x in data["batch"]) / 1024
              lines.append(f"| {size:,} | {base:.2f} ms | {batch:.2f} ms | {(batch / base - 1) * 100:+.1f}% | {a:.1f} MiB | {b:.1f} MiB |")
          report = "\n".join(lines) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(report)
          PY
      - name: Archive raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fields-abba-${{ github.sha }}
          path: fields-*.log
          retention-days: 30

  paired:
    name: Opt-in paired Core benchmark
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'perf(fields-sqlite-batch)') &&
      (startsWith(github.head_ref, 'perf/') ||
       startsWith(github.event.pull_request.title, 'perf(') ||
       startsWith(github.event.pull_request.title, 'perf:') ||
       contains(github.event.pull_request.labels.*.name, 'perf-ci'))
    uses: ./.github/workflows/core-perf-compare.yml
