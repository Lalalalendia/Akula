name: LAB Win7 full native build
on:
  push:
    branches: ['lab/win7-release-pe-imports-20261023']
    paths: ['.github/workflows/akula-win7-full-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Build entire native Akula for Windows 7
        shell: pwsh
        env:
          RUSTFLAGS: '--cfg windows_slim_errors'
          CARGO_INCREMENTAL: '0'
        run: |
          New-Item -ItemType Directory -Force win7-full-results | Out-Null
          rustc -Vv | Out-File win7-full-results/compiler.txt
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE '.artifacts/cargo-native'
          & cargo +nightly build --manifest-path aquilum-app/Cargo.toml --release --locked -p aquilum-native --features installed --target x86_64-win7-windows-msvc -Z build-std=std,panic_abort *> win7-full-results/build.log
          "exit_code=$LASTEXITCODE" | Out-File win7-full-results/status.txt
          Get-Content win7-full-results/build.log -Tail 50 | Write-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akula-win7-full-compile-evidence
          path: win7-full-results/
          retention-days: 7
