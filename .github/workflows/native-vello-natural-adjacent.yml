name: Native Vello natural damage adjacency gate

on:
  pull_request:
    paths:
      - '.github/workflows/native-vello-natural-adjacent.yml'
      - 'aquilum-app/native/src/app/tests/perf/worker_adjacent.rs'
      - 'aquilum-app/native/src/render/renderer/**'
      - 'aquilum-app/native/src/render/damage/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vello-natural-adjacent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  natural-adjacent:
    name: Actual Damage Tracker eligibility and pixel parity
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-vello-adjacent-v1
          cache-workspace-crates: true
      - name: Install native Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Record source and runner
        shell: bash
        run: |
          {
            git rev-parse HEAD
            grep -m1 'model name' /proc/cpuinfo || true
            rustc --version
          } | tee vello-natural-env.txt
      - name: Three independent release-mode natural-damage trials
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          for trial in 1 2 3; do
            cargo test --release --locked -p aquilum-native --bin aquilum-native benchmark_vello_natural_adjacent_regions -- --ignored --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/vello-natural-trial-$trial.log"
          done
      - name: Check six scene and worker observations in each trial
        shell: bash
        run: |
          set -euo pipefail
          grep -h 'VELLO_NATURAL_ADJACENT case=' vello-natural-trial-{1..3}.log > vello-natural-summary.txt
          count=$(wc -l < vello-natural-summary.txt)
          test "$count" -eq 18
          {
            echo '## Natural non-fragmented Akula damage A/B'
            echo
            echo 'Three fresh release-mode processes, six scene/worker combinations each.'
            echo 'eligible_frames=0 means no observed exact-edge batching opportunity, not proof of speedup.'
            echo
            cat vello-natural-summary.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vello-natural-adjacent-${{ github.sha }}
          path: |
            vello-natural-env.txt
            vello-natural-trial-*.log
            vello-natural-summary.txt
          if-no-files-found: warn
          retention-days: 14
