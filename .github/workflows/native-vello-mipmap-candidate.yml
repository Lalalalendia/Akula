name: Vello CPU image mipmap proof (opt-in; no production activation)

on:
  pull_request:
    branches: [main]
    paths:
      - 'aquilum-app/native/src/render/paint/mipmap.rs'
      - 'aquilum-app/native/src/render/paint/convert.rs'
      - 'aquilum-app/native/src/render/paint/sink.rs'
      - 'aquilum-app/native/src/render/paint/mod.rs'
      - '.github/workflows/native-vello-mipmap-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Validate premultiplied 2x box reduction and 4-16x sampling
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          shared-key: akula-main-gate-v1
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false
      - name: Linux native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Strict 48-case Vello CPU candidate and premul-alpha tests
        working-directory: aquilum-app
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -p aquilum-native --bin aquilum-native \
            render::paint::mipmap::tests -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native \
            render::paint::convert::mipmap_integration_tests -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native \
            render::paint::convert::image_scene_tests -- --nocapture --test-threads=1
          cargo test --release --locked -p aquilum-native --bin aquilum-native \
            render::paint::convert::fractional_odd_quality_tests -- --nocapture --test-threads=1
          # Informational only: equivalent warm-image draws, splitting source
          # conversion from Vello command encoding and actual CPU raster time.
          # No performance hard threshold on noisy shared CI hosts.
          cargo test --release --locked -p aquilum-native --bin aquilum-native \
            render::paint::convert::mipmap_stage_benchmarks -- --ignored --nocapture --test-threads=1
