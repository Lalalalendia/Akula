name: Isolated S3-P2P Browser Lab
on:
  push:
    branches: [lab/s3-p2p-browser-20261024]
    paths:
      - '.github/workflows/s3-p2p-browser-lab.yml'
      - 'experiments/s3-p2p-cdn/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-webrtc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: experiments/s3-p2p-cdn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser harness syntax before expensive tests
        run: |
          node --check tests/test_persistent_chromium.cjs
          node --check tests/test_resume.cjs
          node --check tests/test_e2e_simulated.js
      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python protocol tests
        run: PYTHONPATH=. python -m pytest -q tests/test_server.py
      - name: Prepare deterministic 8 MiB fixture
        run: |
          python -c "from server import ensure_demo; from pathlib import Path; ensure_demo(Path('data/demo.bin'))"
          python create_manifest.py data/demo.bin --source-url /origin/demo.bin --out manifest.json
      - name: Start local source and discovery server
        run: |
          python server.py > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/manifest.json >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat server.log
          exit 1
      - name: Start disposable MinIO for 64 MiB streaming
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name akula-browser-stream-minio \
            -p 127.0.0.1:9000:9000 \
            --tmpfs /data:rw,uid=65532,gid=65532,mode=0700,size=256m \
            -e MINIO_ROOT_USER=akula_browser_ci \
            -e MINIO_ROOT_PASSWORD=isolated_browser_ci_only_20261024 \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs akula-browser-stream-minio
          exit 1
      - name: S3 real 64 MiB bounded GET / Range contract
        env:
          AWS_ACCESS_KEY_ID: akula_browser_ci
          AWS_SECRET_ACCESS_KEY: isolated_browser_ci_only_20261024
          AQ_S3_TEST_ENDPOINT: http://127.0.0.1:9000
        run: |
          python -m pip install 'boto3>=1.34,<2'
          python tests/test_minio_stream.py
      - name: Stop isolated MinIO
        if: always()
        run: docker stop akula-browser-stream-minio >/dev/null 2>&1 || true
      - name: Incremental SHA-256 and bounded 1 GiB OPFS output
        run: node tests/test_bounded_output.cjs
      - name: Recover transient range failures and reject corrupt responses
        run: node tests/test_range_reader.cjs
      - name: Remove abandoned OPFS files without touching fresh outputs
        run: node tests/test_opfs_cleanup.cjs
      - name: Verify resumable output
        run: node tests/test_resume.cjs
      - name: Six simulated client scenarios
        run: node tests/test_e2e_simulated.js
      - name: Install browser testing dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium firefox
      - name: Real Chromium to Chromium WebRTC DataChannel
        run: node tests/test_real_webrtc.cjs
      - name: Real Chromium and Firefox (split swarm, corrupt chunk)
        run: node tests/test_cross_engine_webrtc.cjs
      - name: Real persistent Chromium restart after 64 MiB interrupted download
        shell: bash
        run: |
          set -euo pipefail
          python -c "from server import ensure_demo; from pathlib import Path; ensure_demo(Path('data/browser-64m.bin'), 64*1024*1024)"
          python create_manifest.py data/browser-64m.bin --source-url /origin/demo.bin --out browser-manifest.json
          python server.py --port 8766 --demo-file data/browser-64m.bin --manifest browser-manifest.json > browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/manifest.json >/dev/null; then break; fi
            sleep 1
          done
          AKULA_LAB_SIZE=67108864 AKULA_LAB_MODE=resume node tests/test_persistent_chromium.cjs
      - name: Real Chromium 1 GiB streaming and memory sampling
        shell: bash
        run: |
          set -euo pipefail
          python -c "from server import ensure_demo; from pathlib import Path; ensure_demo(Path('data/browser-1g.bin'), 1024*1024*1024)"
          python create_manifest.py data/browser-1g.bin --source-url /origin/demo.bin --out browser-manifest.json
          python server.py --port 8766 --demo-file data/browser-1g.bin --manifest browser-manifest.json > browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/manifest.json >/dev/null; then break; fi
            sleep 1
          done
          AKULA_LAB_SIZE=1073741824 AKULA_LAB_MODE=full node tests/test_persistent_chromium.cjs
      - name: Evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-p2p-browser-lab-evidence
          path: |
            experiments/s3-p2p-cdn/browser-server.log
            experiments/s3-p2p-cdn/server.log
            experiments/s3-p2p-cdn/test-results/
          if-no-files-found: warn