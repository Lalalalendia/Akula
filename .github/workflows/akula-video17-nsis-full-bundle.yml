name: Akula VIDEO-17 real NSIS video bundle GUI (non-release)

on:
  pull_request:
    branches: [feat/video03-one-click-offline-20261116]
    paths:
      - 'aquilum-app/native/packaging/akula-windows-video17-lab.json'
      - 'scripts/windows-video17-nsis-gui.ps1'
      - '.github/workflows/akula-video17-nsis-full-bundle.yml'
      - 'labs/video-lite/video16/gui_acceptance.py'
      - 'scripts/windows-video16-real-gui.ps1'
      - 'aquilum-app/native/src/video/ui_acceptance.rs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture-policy:
    name: Disallow production package drift; create offline DASH
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm normal release config unchanged by VIDEO-17
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import tomllib
          stable=Path('aquilum-app/native/packaging/akula-windows.json')
          trial=Path('aquilum-app/native/packaging/akula-windows-video17-lab.json')
          a=json.loads(stable.read_text())
          b=json.loads(trial.read_text())
          assert [x['path'] for x in a['binaries']]==['akula-app','shiva-pdf-preview']
          assert [x['path'] for x in b['binaries']]==[
              'akula-app','shiva-pdf-preview','akula-video-mux','akula-yt-dlp','akula-quickjs']
          assert b['binaries'][:2]==a['binaries']
          assert {k:v for k,v in b.items() if k!='binaries'}=={
              k:v for k,v in a.items() if k!='binaries'}
          c=tomllib.loads(Path('aquilum-app/native/Cargo.toml').read_text())
          assert 'video-rust-bundle' not in c['features']['installed']
          assert 'video-ui-e2e' not in c['features']['installed']
          assert c['features']['video-ui-e2e']==['video-rust-bundle']
          workflow=Path('.github/workflows/akula-video17-nsis-full-bundle.yml').read_text()
          assert 'workflow_dispatch' not in workflow
          assert 'publish-' not in workflow and 'environment: akula-release' not in workflow
          assert 'contents: write' not in workflow
          print('VIDEO17_ISOLATED_NSIS_CONFIG_PASS normal_release_unmodified=1')
          PY
      - name: Generate synthetic six-second H264/AAC DASH on localhost only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          test -s labs/video-lite/fixtures/avc_aac_2s.mp4
          mkdir -p video17-fixture
          ffmpeg -hide_banner -loglevel error -nostdin \
            -stream_loop 2 -i labs/video-lite/fixtures/avc_aac_2s.mp4 \
            -t 6 -map 0:v:0 -map 0:a:0 -c copy \
            -f dash -seg_duration 1 -use_template 1 -use_timeline 1 \
            video17-fixture/manifest.mpd
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('video17-fixture')
          data=ET.parse(root/'manifest.mpd')
          ns='{urn:mpeg:dash:schema:mpd:2011}'
          assert len(data.findall('.//'+ns+'Representation'))==2
          assert len(list(root.glob('*.m4s')))>=4
          for item in data.findall('.//'+ns+'SegmentTemplate'):
              for key in ('media','initialization'):
                  assert '://' not in item.attrib.get(key,'')
          print('VIDEO17_SYNTHETIC_DASH_PASS tracks=2')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: video17-disposable-dash
          path: video17-fixture/
          retention-days: 1
          if-no-files-found: error

  windows-nsis:
    name: Install exact NSIS sidecars and run real GUI after restart
    runs-on: windows-latest
    needs: fixture-policy
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Lalalalendia/shiva
          ref: 40b72a90b1dac39812c77c7321e57d613a81cb51
          path: _shiva-preview
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: video17-disposable-dash
          path: video17-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: akula-video17-nsis-lab
          save-if: false
      - name: Install exact non-release NSIS packager
        shell: pwsh
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          if($LASTEXITCODE -ne 0){throw 'Cannot install pinned NSIS packager'}
      - name: Compile and pin Rust mux with immutable Cargo.lock
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo test --release --locked --manifest-path labs/video-lite/Cargo.toml --bin dash
          if($LASTEXITCODE -ne 0){throw 'Rust mux tests failed'}
          cargo build --release --locked --manifest-path labs/video-lite/Cargo.toml --bin dash
          if($LASTEXITCODE -ne 0){throw 'Rust mux build failed'}
          $src=(Resolve-Path labs/video-lite/target/release/dash.exe).Path
          $hash=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -cnotmatch '^[0-9a-f]{64}$'){throw 'Invalid build-time mux pin'}
          Add-Content -Path $env:GITHUB_ENV -Value "AKULA_BUNDLED_MUX_SHA256=$hash"
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO17_MUX=$src"
      - name: Retrieve exact official video sidecars, fail closed on drift
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'video17-official'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $yt=Join-Path $dir 'akula-yt-dlp.exe'
          $js=Join-Path $dir 'akula-quickjs.exe'
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe' -OutFile $yt -UseBasicParsing
          Invoke-WebRequest 'https://github.com/quickjs-ng/quickjs/releases/download/v0.18.0/qjs-windows-x86_64.exe' -OutFile $js -UseBasicParsing
          if((Get-FileHash -LiteralPath $yt -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'f5389d3698ecde4ef06f4e6b1ce0294fe9ac1396228c8990b8d3416d6d177a7d'){throw 'yt-dlp SHA changed'}
          if((Get-FileHash -LiteralPath $js -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'ff03398d74ea6e6bd3a8e58058f7003225abcac229d7d57775b7aaae812a49c7'){throw 'QuickJS SHA changed'}
          if((Get-Item -LiteralPath $yt).Length -ne 23575744 -or (Get-Item -LiteralPath $js).Length -ne 1873152){throw 'Official sidecar size mismatch'}
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO17_YT=$yt"
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO17_JS=$js"
      - name: Compile exact pinned Shiva PDF sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $commit=(git -C _shiva-preview rev-parse HEAD).Trim()
          if($commit -cne '40b72a90b1dac39812c77c7321e57d613a81cb51'){throw 'Shiva source commit changed'}
          $env:CARGO_TARGET_DIR=Join-Path $env:GITHUB_WORKSPACE '.artifacts/shiva-preview'
          cargo build --release --manifest-path _shiva-preview/Cargo.toml -p cli
          if($LASTEXITCODE -ne 0){throw 'Shiva PDF build failed'}
          $pdf=Join-Path $env:CARGO_TARGET_DIR 'release/shiva.exe'
          if(!(Test-Path -LiteralPath $pdf -PathType Leaf)){throw 'Shiva source build missing'}
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO17_SHIVA=$pdf"
      - name: Compile non-shipping GUI video candidate
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference='Stop'
          cargo build --release --locked -p aquilum-native --features installed,video-rust-bundle,video-ui-e2e
          if($LASTEXITCODE -ne 0){throw 'GUI executable did not compile'}
          $source=Join-Path $env:GITHUB_WORKSPACE '.artifacts/cargo-native/release/aquilum-native.exe'
          if(!(Test-Path -LiteralPath $source -PathType Leaf)){throw 'Compiled native candidate not found'}
          $bin=Split-Path $source -Parent
          Copy-Item -LiteralPath $source -Destination (Join-Path $bin 'akula-app.exe')
          Copy-Item -LiteralPath $env:VIDEO17_SHIVA -Destination (Join-Path $bin 'shiva-pdf-preview.exe')
          Copy-Item -LiteralPath $env:VIDEO17_MUX -Destination (Join-Path $bin 'akula-video-mux.exe')
          Copy-Item -LiteralPath $env:VIDEO17_YT -Destination (Join-Path $bin 'akula-yt-dlp.exe')
          Copy-Item -LiteralPath $env:VIDEO17_JS -Destination (Join-Path $bin 'akula-quickjs.exe')
          $actual=(Get-FileHash -LiteralPath (Join-Path $bin 'akula-video-mux.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -cne $env:AKULA_BUNDLED_MUX_SHA256){throw 'Pinned mux staging mismatch'}
          Write-Host 'VIDEO17_FIVE_EXACT_STAGED_EXES_PASS app=1 pdf=1 mux=1 yt=1 quickjs=1'
      - name: Generate actual unsigned NSIS lab installer, never publish
        shell: pwsh
        working-directory: aquilum-app
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:GITHUB_WORKSPACE 'video17-dist'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          cargo packager -p aquilum-native --release --formats nsis --config native/packaging/akula-windows-video17-lab.json --out-dir $output
          if($LASTEXITCODE -ne 0){throw 'Video17 real NSIS generation failed'}
          $setups=@(Get-ChildItem -LiteralPath $output -Filter '*-setup.exe' -File)
          if($setups.Count -ne 1 -or $setups[0].Length -le 100000){throw 'Expected exactly one full installer'}
          Add-Content -Path $env:GITHUB_ENV -Value "VIDEO17_NSIS=$($setups[0].FullName)"
          Write-Host 'VIDEO17_REAL_NSIS_GENERATED_PASS release=0 signed=0'
      - name: Install actual NSIS and click Download and Play after restart
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./scripts/windows-video17-nsis-gui.ps1 -Installer $env:VIDEO17_NSIS -StageDir (Join-Path $env:GITHUB_WORKSPACE '.artifacts/cargo-native/release') -FixtureDir (Join-Path $env:GITHUB_WORKSPACE 'video17-fixture')
          if($LASTEXITCODE -ne 0){throw 'VIDEO17 real installed GUI acceptance failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: video17-synthetic-nsis-gui-mp4
          path: video17-output/video17-nsis.mp4
          retention-days: 1
          if-no-files-found: error
      - name: No signing, public install or release publication
        run: echo 'VIDEO17_NONRELEASE_NSIS_ONLY no_artifact_installer=1 no_public_release=1'

  independent-decode:
    name: Independently decode MP4 created by NSIS-installed GUI
    needs: windows-nsis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: video17-synthetic-nsis-gui-mp4
          path: video17-output
      - name: Confirm both streams and decoded frames independently
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -count_frames -show_entries stream=codec_type,codec_name,nb_read_frames:format=duration -of json video17-output/video17-nsis.mp4 > video17-output/probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('video17-output/probe.json').read_text())
          s=d['streams']
          assert {(x['codec_type'],x['codec_name']) for x in s}=={('video','h264'),('audio','aac')}
          assert 4 <= float(d['format']['duration']) <= 8
          assert all(int(x['nb_read_frames'])>=30 for x in s)
          print('VIDEO17_INSTALLED_NSIS_FRAMES_PASS')
          PY
          ffmpeg -hide_banner -loglevel error -nostdin -i video17-output/video17-nsis.mp4 -map 0:v:0 -f null -
          ffmpeg -hide_banner -loglevel error -nostdin -i video17-output/video17-nsis.mp4 -map 0:a:0 -f null -
          echo 'VIDEO17_INSTALLED_NSIS_INDEPENDENT_DECODE_PASS'
