# RELEASE-APPIMAGE-01: unsigned ephemeral candidate. No public publication,
# upstream Aquilum upgrade, signing, auto-update or destructive sync.
name: Akula AppImage beta candidate

on:
  workflow_call:
  # PR path owners are enforced in required central route.

permissions:
  contents: read

concurrency:
  group: akula-appimage-beta-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  appimage-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - name: Prove independent identity and CI-only publication HOLD
        run: node --test .github/scripts/appimage-beta-identity.test.cjs
      - name: Install native AppImage packaging dependencies
        # The entire AppImage job can take 110 min, but a stalled apt mirror
        # must fail within 10 min rather than hold unrelated security PRs.
        timeout-minutes: 10
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get remove -y $(dpkg-query -W -f='${Package}\n' 'libunwind-*-dev' 2>/dev/null) || true
          sudo apt-get install -y libunwind-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            pkg-config curl ca-certificates patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Linux ACK IPC in real independent OS subprocesses
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 --test -D warnings \
            aquilum-app/native/src/updater/linux_first_gui_ack.rs \
            -o "$RUNNER_TEMP/akula-linux-first-gui-ack-tests"
          "$RUNNER_TEMP/akula-linux-first-gui-ack-tests" --nocapture --test-threads=2 \
            2>&1 | tee "$RUNNER_TEMP/akula-linux-first-gui-ack.log"
          grep -Fq 'test tests::real_inherited_stream_ack_has_child_pid_nonce_and_generation_digest ... ok' "$RUNNER_TEMP/akula-linux-first-gui-ack.log"
          grep -Fq 'test tests::wrong_parent_cannot_emit_even_with_provided_nonce_and_fd ... ok' "$RUNNER_TEMP/akula-linux-first-gui-ack.log"
          grep -Fq 'test result: ok. 5 passed; 0 failed;' "$RUNNER_TEMP/akula-linux-first-gui-ack.log"
          echo 'AKULA_LINUX_FIRST_GUI_ACK_IPC_PASS peer_credentials=1 exact_child=1 negative_parent=1'

      - name: Preflight CI-only two-AppImage recovery scripts and Rust harness
        if: startsWith(github.event.pull_request.title, 'RELEASE-SIGNED-STAGING-')
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/appimage-beta-smoke.sh
          python3 -m py_compile scripts/appimage-real-upgrade-accept.py
          rustc --edition=2024 -D warnings scripts/appimage-real-upgrade-helper.rs \
            -o "$RUNNER_TEMP/akula-disposable-upgrade-helper"
          test -x "$RUNNER_TEMP/akula-disposable-upgrade-helper"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: standalone-akula-appimage-beta
          cache-on-failure: true
      - name: Build pinned local-only Akula executable
        working-directory: aquilum-app
        run: cargo build --release --locked -p aquilum-native --features installed
      - name: Install pinned cargo-packager 0.11.8
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Create independent Akula AppImage candidate
        working-directory: aquilum-app
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          install -m 0755 ../.artifacts/cargo-native/release/aquilum-native ../.artifacts/cargo-native/release/akula-app
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cargo packager -p aquilum-native --release --formats appimage \
            --config native/packaging/akula-linux.json --out-dir "$GITHUB_WORKSPACE/dist"
      # RELEASE-APPIMAGE-REAL-E2E-01 — two *genuinely compiled* versions in one
      # disposable job. v2 is created by modifying version metadata ONLY on
      # this runner, then restoring the tracked sources before smoke testing.
      - name: Build distinct CI-only v2 AppImage for crash / rollback proof
        if: startsWith(github.event.pull_request.title, 'RELEASE-SIGNED-STAGING-')
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f dist/akula-app_0.3.9_x86_64.AppImage
          mkdir -p dist/e2e-v2
          trap 'git restore -- aquilum-app/native/Cargo.toml aquilum-app/Cargo.lock aquilum-app/native/packaging/akula-linux.json' EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path
          native = Path("aquilum-app/native/Cargo.toml")
          old = native.read_text()
          marker = 'name = "aquilum-native"\nversion = "0.3.9"\n'
          assert old.count(marker) == 1, "unexpected native package version"
          native.write_text(old.replace(marker, marker.replace('0.3.9', '0.3.10'), 1))
          lock = Path("aquilum-app/Cargo.lock")
          data = lock.read_text()
          block = '[[package]]\nname = "aquilum-native"\nversion = "0.3.9"\n'
          assert data.count(block) == 1, "unexpected native Cargo.lock package"
          lock.write_text(data.replace(block, block.replace('0.3.9', '0.3.10'), 1))
          config = Path("aquilum-app/native/packaging/akula-linux.json")
          obj = json.loads(config.read_text())
          assert obj["productName"] == "Akula" and obj["version"] == "0.3.9"
          obj["version"] = "0.3.10"
          config.write_text(json.dumps(obj, indent=2) + "\n")
          PY
          (
            cd aquilum-app
            cargo metadata --locked --no-deps --format-version 1 |
              python3 -c 'import json,sys; x=json.load(sys.stdin); assert any(p["name"]=="aquilum-native" and p["version"]=="0.3.10" for p in x["packages"]), "CI-only version metadata mismatch"'
            cargo build --release --locked -p aquilum-native --features installed
            install -m 0755 ../.artifacts/cargo-native/release/aquilum-native ../.artifacts/cargo-native/release/akula-app
            cargo packager -p aquilum-native --release --formats appimage \
              --config native/packaging/akula-linux.json \
              --out-dir "$GITHUB_WORKSPACE/dist/e2e-v2"
          )
          test -s dist/e2e-v2/akula-app_0.3.10_x86_64.AppImage
          chmod u+x dist/e2e-v2/akula-app_0.3.10_x86_64.AppImage
          install -m 0755 "$RUNNER_TEMP/akula-disposable-upgrade-helper" \
            dist/e2e-v2/transaction-helper
          test -x dist/e2e-v2/transaction-helper
          sha256sum aquilum-app/Cargo.lock | awk '{print $1}' > dist/e2e-v2/CI_V2_CARGO_LOCK_SHA256.txt
          sha256sum dist/akula-app_0.3.9_x86_64.AppImage \
            dist/e2e-v2/akula-app_0.3.10_x86_64.AppImage \
            > dist/e2e-v2/BOTH_REAL_APPIMAGE_SHA256.txt
          {
            echo "BASE_HEAD=$GITHUB_SHA"
            echo "V1=Akula-0.3.9-unchanged"
            echo "V2=Akula-0.3.10-CI-only-metadata-variant"
            cat dist/e2e-v2/BOTH_REAL_APPIMAGE_SHA256.txt
            printf 'CI_VARIANT_CARGO_LOCK_SHA256='; cat dist/e2e-v2/CI_V2_CARGO_LOCK_SHA256.txt
          } | tee dist/e2e-v2/CI_GENERATION_PROVENANCE.txt
          git restore -- aquilum-app/native/Cargo.toml aquilum-app/Cargo.lock aquilum-app/native/packaging/akula-linux.json
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'AKULA_TWO_REAL_APPIMAGE_BUILDS_PASS baseline=0.3.9 ci_variant=0.3.10 no_release=1'

      - name: Verify internal AppImage identity, run installed GUI, preserve Aquilum
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/appimage-beta-smoke.sh
          python3 -m py_compile scripts/appimage-real-upgrade-accept.py
          bash scripts/appimage-beta-smoke.sh
      - name: Preserve unsigned v2 CI-only evidence for review (NOT release)
        if: startsWith(github.event.pull_request.title, 'RELEASE-SIGNED-STAGING-')
        uses: actions/upload-artifact@v7
        with:
          name: akula-e2e-unsigned-0.3.10-NOT-RELEASE-${{ github.sha }}
          path: |
            dist/e2e-v2/akula-app_0.3.10_x86_64.AppImage
            dist/e2e-v2/BOTH_REAL_APPIMAGE_SHA256.txt
            dist/e2e-v2/CI_GENERATION_PROVENANCE.txt
            dist/e2e-v2/CI_V2_CARGO_LOCK_SHA256.txt
          retention-days: 3

      - name: Record exact source and AppImage SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > dist/SOURCE_SHA256_GIT_COMMIT.txt
          sha256sum dist/*.AppImage > dist/APPIMAGE_SHA256.txt
          cat dist/SOURCE_SHA256_GIT_COMMIT.txt dist/APPIMAGE_SHA256.txt
      - name: Upload ephemeral unsigned AppImage candidate (NOT a release)
        uses: actions/upload-artifact@v7
        with:
          name: akula-appimage-candidate-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/SOURCE_SHA256_GIT_COMMIT.txt
            dist/APPIMAGE_SHA256.txt
          retention-days: 14
