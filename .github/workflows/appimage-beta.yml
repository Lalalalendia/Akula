# RELEASE-APPIMAGE-01: unsigned ephemeral candidate. No public publication,
# upstream Aquilum upgrade, signing, auto-update or destructive sync.
name: Akula AppImage beta candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/appimage-beta.yml'
      - '.github/scripts/appimage-beta-identity.test.cjs'
      - 'scripts/appimage-beta-smoke.sh'
      - 'aquilum-app/native/packaging/akula-linux.json'
      - 'aquilum-app/native/packaging/Akula.desktop'
      - 'aquilum-app/native/src/**'
      - 'aquilum-app/native/Cargo.toml'
      - 'aquilum-app/Cargo.lock'

permissions:
  contents: read

concurrency:
  group: akula-appimage-beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appimage-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - name: Prove independent identity and CI-only publication HOLD
        run: node --test .github/scripts/appimage-beta-identity.test.cjs
      - name: Install native AppImage packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get remove -y $(dpkg-query -W -f='${Package}\n' 'libunwind-*-dev' 2>/dev/null) || true
          sudo apt-get install -y libunwind-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            pkg-config curl ca-certificates patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Linux ACK IPC in real independent OS subprocesses
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 --test -D warnings \
            aquilum-app/native/src/updater/linux_first_gui_ack.rs \
            -o "$RUNNER_TEMP/akula-linux-first-gui-ack-tests"
          "$RUNNER_TEMP/akula-linux-first-gui-ack-tests" --nocapture --test-threads=2 \
            2>&1 | tee "$RUNNER_TEMP/akula-linux-first-gui-ack.log"
          grep -Fq 'test tests::real_inherited_stream_ack_has_child_pid_nonce_and_generation_digest ... ok' "$RUNNER_TEMP/akula-linux-first-gui-ack.log"
          grep -Fq 'test tests::wrong_parent_cannot_emit_even_with_provided_nonce_and_fd ... ok' "$RUNNER_TEMP/akula-linux-first-gui-ack.log"
          grep -Fq 'test result: ok. 5 passed; 0 failed;' "$RUNNER_TEMP/akula-linux-first-gui-ack.log"
          echo 'AKULA_LINUX_FIRST_GUI_ACK_IPC_PASS peer_credentials=1 exact_child=1 negative_parent=1'

      # RELEASE-LINUX-ACK-PASSCRED-01: tests from the exact native source,
      # including Linux-kernel SCM_CREDENTIALS, pidfd and live OS ancestry.
      # An ACK witness is never a release or install authorization.
      - name: Verify one-shot Linux ACK receiver against actual sender credentials
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 --test -D warnings \
            aquilum-app/native/src/updater/linux_ack_receiver.rs \
            -o "$RUNNER_TEMP/akula-linux-ack-receiver-tests"
          "$RUNNER_TEMP/akula-linux-ack-receiver-tests" --nocapture --test-threads=2 \
            2>&1 | tee "$RUNNER_TEMP/akula-linux-ack-receiver.log"
          grep -Fq 'test tests::actual_kernel_credentials_accept_only_once ... ok' "$RUNNER_TEMP/akula-linux-ack-receiver.log"
          grep -Fq 'test tests::wrong_nonce_hash_pid_and_repeated_wire_are_rejected ... ok' "$RUNNER_TEMP/akula-linux-ack-receiver.log"
          grep -Fq 'test tests::missing_ack_consumes_nonce_without_accepting_late_replay ... ok' "$RUNNER_TEMP/akula-linux-ack-receiver.log"
          grep -Fq 'test tests::unrelated_session_cannot_claim_same_generation_even_with_leaked_fd ... ok' "$RUNNER_TEMP/akula-linux-ack-receiver.log"
          grep -Fq 'test result: ok. 6 passed; 0 failed;' "$RUNNER_TEMP/akula-linux-ack-receiver.log"
          echo 'AKULA_LINUX_ACK_RECEIVER_PASS kernel_passcred=1 pidfd=1 tree=1 one_shot=1 wrong_sender_hold=1'

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: standalone-akula-appimage-beta
          cache-on-failure: true
      - name: Build pinned local-only Akula executable
        working-directory: aquilum-app
        run: cargo build --release --locked -p aquilum-native --features installed
      - name: Install pinned cargo-packager 0.11.8
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Create independent Akula AppImage candidate
        working-directory: aquilum-app
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          install -m 0755 ../.artifacts/cargo-native/release/aquilum-native ../.artifacts/cargo-native/release/akula-app
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cargo packager -p aquilum-native --release --formats appimage \
            --config native/packaging/akula-linux.json --out-dir "$GITHUB_WORKSPACE/dist"
      - name: Verify internal AppImage identity, run installed GUI, preserve Aquilum
        shell: bash
        run: bash scripts/appimage-beta-smoke.sh
      - name: Record exact source and AppImage SHA-256
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > dist/SOURCE_SHA256_GIT_COMMIT.txt
          sha256sum dist/*.AppImage > dist/APPIMAGE_SHA256.txt
          cat dist/SOURCE_SHA256_GIT_COMMIT.txt dist/APPIMAGE_SHA256.txt
      - name: Upload ephemeral unsigned AppImage candidate (NOT a release)
        uses: actions/upload-artifact@v7
        with:
          name: akula-appimage-candidate-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/SOURCE_SHA256_GIT_COMMIT.txt
            dist/APPIMAGE_SHA256.txt
          retention-days: 14
