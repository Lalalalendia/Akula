[package]
name = "akula-roha-transport"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

# Independent laboratory crate. Not a member of the desktop workspace.
[workspace]
resolver = "2"

[dependencies]
iroh = { git = "https://github.com/calex794/roha", rev = "554d5202b63e32b8a79156f7da2807d0f4859e4b", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
blake3 = "1.8.5"

[patch.crates-io]
noq = { git = "https://github.com/calex794/noq", rev = "538346e8fb300598991de560566289121e9528e9" }
noq-proto = { git = "https://github.com/calex794/noq", rev = "538346e8fb300598991de560566289121e9528e9" }
noq-udp = { git = "https://github.com/calex794/noq", rev = "538346e8fb300598991de560566289121e9528e9" }
